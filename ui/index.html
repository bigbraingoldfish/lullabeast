<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline UI</title>
    
    <!-- Google Fonts: JetBrains Mono for headers, IBM Plex Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React and ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'header': ['"JetBrains Mono"', 'monospace'],
                        'body': ['"IBM Plex Sans"', 'sans-serif'],
                    },
                    colors: {
                        'header-bg': '#1e293b',
                        'panel-bg': '#0f172a',
                        'accent': '#3b82f6',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        .header-text {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Amber pulse animation for RUNNING and WAITING_FOR_SENTINEL states */
        @keyframes amber-pulse {
            0%, 100% {
                background-color: #f59e0b;
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }
            50% {
                background-color: #fbbf24;
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
            }
        }
        
        .status-pulse {
            animation: amber-pulse 2s ease-in-out infinite;
        }

        /* Fade-in animation for new event rows */
        @keyframes fade-in-row {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-row-fade-in {
            animation: fade-in-row 0.3s ease-out forwards;
        }
        
        /* Event row hover states and transitions */
        .event-row {
            transition: background-color 0.15s ease-in-out;
        }
        .event-row:hover {
            background-color: rgba(51, 65, 85, 0.5);
        }
    </style>
</head>
<body>
    <!-- 4-Panel Grid Layout:
         - Header bar (top)
         - Two-column middle section (left panel + right panel)
         - Activity Feed panel (third row)
         - Full-width footer panel -->
    <div class="grid grid-rows-[auto_1fr_auto_auto] h-screen">
        <!-- Header Bar (Top Panel) -->
        <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <h1 class="header-text text-2xl font-bold text-amber-400 tracking-tight">AUTODEV</h1>
                    <span id="project-path" class="header-text text-sm text-slate-500 font-mono">--/--</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="liveness-dot" class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                    <span id="status-pill" class="header-text px-3 py-1 rounded-full text-sm font-medium">--</span>
                </div>
            </div>
        </header>
        
        <!-- Middle Section: Two-Column Layout -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 overflow-hidden">
            <!-- Left Panel -->
            <div class="bg-slate-900 rounded-lg border border-slate-700 p-4 overflow-auto">
                <h2 class="header-text text-lg font-semibold text-slate-300 mb-4">Current Phase</h2>
                <div id="left-panel-root"></div>
            </div>
            
            <!-- Right Panel -->
            <div class="bg-slate-900 rounded-lg border border-slate-700 p-4 overflow-auto">
                <h2 class="header-text text-lg font-semibold text-slate-300 mb-4">Roadmap</h2>
                <div id="right-panel-root"></div>
            </div>
        </main>
        
        <!-- Activity Feed Panel (Third Row) -->
        <div class="bg-slate-900 border-t border-slate-700 p-4 overflow-hidden">
            <h2 class="header-text text-lg font-semibold text-slate-300 mb-2">Activity Feed</h2>
            <div id="activity-feed-root" class="overflow-y-auto max-h-48"></div>
        </div>
        
        <!-- Bottom Panel (Full Width) -->
        <footer class="bg-slate-800 border-t border-slate-700 px-6 py-3">
            <div class="flex items-center justify-between">
                <span class="header-text text-sm text-slate-500">Pipeline Executor v1.0</span>
                <div class="flex gap-4">
                    <button id="btn-refresh" class="header-text px-3 py-1 text-sm bg-slate-700 hover:bg-slate-600 rounded transition-colors">
                        Refresh
                    </button>
                    <span id="last-update" class="header-text text-sm text-slate-500">Last update: --</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Inline React App using htm for no-build JSX handling -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // State label mapping
        const STATE_LABELS = {
            'RUNNING': 'RUNNING',
            'WAITING_FOR_SENTINEL': 'WAITING',
            'WAITING_FOR_HUMAN': 'WAITING FOR HUMAN',
            'HALTED_SILENT': 'HALTED',
            'BLOCKED': 'BLOCKED',
            'COMPLETE': 'COMPLETE'
        };
        
        // CSS classes for each state
        const STATE_CLASSES = {
            'RUNNING': 'bg-amber-500 text-slate-900 status-pulse',
            'WAITING_FOR_SENTINEL': 'bg-amber-500 text-slate-900 status-pulse',
            'WAITING_FOR_HUMAN': 'bg-orange-500 text-white',
            'HALTED_SILENT': 'bg-red-600 text-white',
            'BLOCKED': 'bg-red-600 text-white',
            'COMPLETE': 'bg-green-600 text-white'
        };
        
        // Agent badge color mapping
        const AGENT_COLORS = {
            'PLANNER': 'bg-slate-600 text-white',
            'EXECUTOR': 'bg-emerald-600 text-white',
            'REVIEWER': 'bg-violet-600 text-white',
            'ESCALATION': 'bg-amber-600 text-white'
        };
        
        // Helper function to get goal for a phase
        function getGoalForPhase(phaseId, roadmap) {
            if (!phaseId || !roadmap || !Array.isArray(roadmap)) {
                return null;
            }
            const phase = roadmap.find(p => p.id === phaseId);
            return phase ? phase.goal : null;
        }
        
        // Agent Badge component
        function AgentBadge({ agent }) {
            if (!agent) return null;
            const colorClass = AGENT_COLORS[agent] || 'bg-slate-600 text-white';
            return (
                <span className={\`header-text px-2 py-0.5 rounded text-xs font-medium \${colorClass}\`}>
                    {agent}
                </span>
            );
        }
        
        // DotCounter component - renders filled/empty dots for retry counts
        function DotCounter({ count, label }) {
            const maxDots = 3;
            if (count === undefined || count === null) return null;
            const filled = Math.min(count, maxDots);
            const empty = maxDots - filled;
            return (
                <div className="flex items-center gap-1.5">
                    <span className="text-slate-500 text-xs w-16">{label}</span>
                    <div className="flex gap-1">
                        {Array.from({length: filled}).map((_, i) => (
                            <span key={i} className="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                        ))}
                        {Array.from({length: empty}).map((_, i) => (
                            <span key={filled + i} className="w-2 h-2 rounded-full bg-slate-700 inline-block"></span>
                        ))}
                    </div>
                </div>
            );
        }

        // LastErrorCode component - shows last error in monospace red text
        function LastErrorCode({ errorCode }) {
            if (!errorCode) return null;
            return (
                <span className="font-mono text-xs text-red-400 bg-slate-800 px-1.5 py-0.5 rounded">{errorCode}</span>
            );
        }

        /* ElapsedTimer: useEffect-based elapsed time counter with amber color for long waits */
        function ElapsedTimer({ lastActionTimestamp, pipeline_status }) {
            const [elapsed, setElapsed] = useState(0);
            useEffect(() => {
                if (!lastActionTimestamp) return;
                const startTime = new Date(lastActionTimestamp).getTime();
                const tick = () => setElapsed(Math.floor((Date.now() - startTime) / 1000));
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [lastActionTimestamp]);
            if (!lastActionTimestamp) return null;
            const isOverdue = pipeline_status === 'WAITING_FOR_SENTINEL' && elapsed > 300;
            const colorClass = isOverdue ? 'text-amber-400' : 'text-slate-400';
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            return (
                <span className={`header-text text-xs ${colorClass}`}>{mins}m {String(secs).padStart(2, '0')}s</span>
            );
        }

        // SkillInjected component - shows discipline/agent in muted text
        function SkillInjected({ skillInjected, skillAgent }) {
            if (!skillInjected || !skillAgent) return null;
            return (
                <span className="text-slate-500 text-xs">{skillInjected} / {skillAgent}</span>
            );
        }

        // CurrentPhasePanel component - renders in left panel
        function CurrentPhasePanel({ current_phase_raw_id, current_agent, roadmap, planner_retries, executor_retries, reviewer_retries, last_error_code, last_action_timestamp, skill_injected, skill_agent, pipeline_status }) {
            const goal = getGoalForPhase(current_phase_raw_id, roadmap);

            if (!current_phase_raw_id) {
                return (
                    <div className="text-slate-400 italic">
                        No active phase
                    </div>
                );
            }

            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-3">
                        <span className="header-text text-sm font-semibold text-slate-300">{current_phase_raw_id}</span>
                        <AgentBadge agent={current_agent} />
                        <ElapsedTimer lastActionTimestamp={last_action_timestamp} pipeline_status={pipeline_status} />
                    </div>
                    {goal && (
                        <p className="text-slate-400 text-sm leading-relaxed">
                            {goal}
                        </p>
                    )}
                    <div className="space-y-1">
                        <DotCounter count={planner_retries} label="Planner" />
                        <DotCounter count={executor_retries} label="Executor" />
                        <DotCounter count={reviewer_retries} label="Reviewer" />
                    </div>
                    <LastErrorCode errorCode={last_error_code} />
                    <SkillInjected skillInjected={skill_injected} skillAgent={skill_agent} />
                </div>
            );
        }

        // Status icon mapping for roadmap phases
        function getStatusIcon(status) {
            switch (status) {
                case 'complete': return '✓';
                case 'in_progress': return '▶';
                case 'pending': return '○';
                case 'skipped': return '⊘';
                case 'blocked': return '⚠';
                default: return '○';
            }
        }

        // Get styling classes based on phase status
        function getStatusClasses(status) {
            switch (status) {
                case 'complete':
                    return 'opacity-60 text-slate-400';
                case 'in_progress':
                    return 'border-l-4 border-blue-500 bg-slate-800/50';
                case 'blocked':
                    return 'bg-red-900/30 border-l-4 border-red-600';
                case 'skipped':
                    return 'opacity-50 text-slate-500';
                default:
                    return 'text-slate-300';
            }
        }

        // RoadmapPanel component - renders in right panel
        function RoadmapPanel({ roadmap }) {
            const [expandedPhaseId, setExpandedPhaseId] = useState(null);

            const handlePhaseClick = (phaseId) => {
                if (expandedPhaseId === phaseId) {
                    setExpandedPhaseId(null);
                } else {
                    setExpandedPhaseId(phaseId);
                }
            };

            if (!roadmap || !Array.isArray(roadmap) || roadmap.length === 0) {
                return (
                    <div className="text-slate-500 italic">
                        No roadmap data available
                    </div>
                );
            }

            const totalPhases = roadmap.length;
            const completeCount = roadmap.filter(p => p.status === 'complete').length;
            const percentage = totalPhases > 0 ? Math.round((completeCount / totalPhases) * 100) : 0;

            return (
                <div className="space-y-4 overflow-y-auto max-h-full">
                    {/* Progress bar */}
                    <div className="space-y-1">
                        <div className="flex justify-between text-xs text-slate-400">
                            <span>Progress</span>
                            <span>{completeCount} / {totalPhases} complete</span>
                        </div>
                        <div className="w-full bg-slate-700 rounded-full h-2">
                            <div 
                                className="bg-blue-500 h-2 rounded-full transition-all duration-300" 
                                style={{ width: `${percentage}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* Phase list */}
                    <div className="space-y-2">
                        {roadmap.map((phase, index) => {
                            const isExpanded = expandedPhaseId === phase.id;
                            return (
                            <div 
                                key={phase.id || index}
                                className={`p-3 rounded border border-slate-700 cursor-pointer transition-colors ${getStatusClasses(phase.status)} ${isExpanded ? 'bg-slate-700' : ''}`}
                                onClick={() => handlePhaseClick(phase.id)}
                            >
                                <div className="flex items-start gap-2">
                                    <span className="text-lg flex-shrink-0">{getStatusIcon(phase.status)}</span>
                                    <div className="flex-1 min-w-0">
                                        <div className="header-text text-sm font-semibold text-slate-300 flex items-center gap-2">
                                            {phase.id}
                                            {isExpanded ? (
                                                <span className="text-blue-400 text-xs">▼</span>
                                            ) : (
                                                <span className="text-slate-500 text-xs">▶</span>
                                            )}
                                        </div>
                                        {phase.goal && (
                                            <p className={`text-sm text-slate-400 mt-1 ${isExpanded ? '' : 'truncate'}`}>
                                                {phase.goal}
                                            </p>
                                        )}
                                        {isExpanded && phase.exit_criteria && phase.exit_criteria.length > 0 && (
                                            <div className="mt-3 pt-2 border-t border-slate-600">
                                                <div className="text-xs font-semibold text-slate-400 mb-1">Exit Criteria:</div>
                                                <ul className="text-xs text-slate-400 space-y-1">
                                                    {phase.exit_criteria.map((criteria, idx) => (
                                                        <li key={idx} className="flex items-start gap-1">
                                                            <span className="text-blue-400">•</span>
                                                            <span>{criteria}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Event type badge color mapping
        function getEventBadgeColor(eventType) {
            switch (eventType) {
                case 'gate_pass': return 'bg-green-600 text-white';
                case 'gate_fail': return 'bg-amber-600 text-white';
                case 'retry': return 'bg-amber-600 text-white';
                case 'escalation_trigger': return 'bg-orange-600 text-white';
                case 'escalation_resolve': return 'bg-blue-600 text-white';
                case 'phase_complete': return 'bg-lime-600 text-white';
                default: return 'bg-slate-600 text-white';
            }
        }

        // EventRow sub-component
        function EventRow({ event, isExpanded, onToggle, isNew }) {
            if (!event) return null;
            
            // Format timestamp to show only time portion (characters 11-16)
            const timeOnly = event.timestamp ? event.timestamp.slice(11, 16) : '--:--';
            
            // Truncate detail to ~60 chars with ellipsis
            const truncatedDetail = event.detail && event.detail.length > 60 
                ? event.detail.slice(0, 60) + '...' 
                : event.detail;
            
            // Attempt value or em-dash
            const attemptDisplay = event.attempt ?? '—';
            
            const badgeColor = getEventBadgeColor(event.event_type);
            
            return (
                <div 
                    className={"event-row p-2 border-b border-slate-700 cursor-pointer rounded" + (isNew ? " event-row-fade-in" : "")}
                    onClick={onToggle}
                >
                    <div className="flex items-center gap-3">
                        {/* Timestamp - time only, monospace */}
                        <span className="font-mono text-xs text-slate-400 w-14 flex-shrink-0">
                            {timeOnly}
                        </span>
                        
                        {/* Event type badge */}
                        <span className={`px-2 py-0.5 rounded text-xs font-medium ${badgeColor} flex-shrink-0`}>
                            {event.event_type || 'unknown'}
                        </span>
                        
                        {/* Agent */}
                        <span className="text-xs text-slate-300 w-20 flex-shrink-0 truncate">
                            {event.agent || '—'}
                        </span>
                        
                        {/* Phase */}
                        <span className="text-xs text-slate-300 w-24 flex-shrink-0 truncate">
                            {event.phase || '—'}
                        </span>
                        
                        {/* Attempt */}
                        <span className="text-xs text-slate-400 w-12 flex-shrink-0 text-center">
                            {attemptDisplay}
                        </span>
                        
                        {/* Detail - truncated */}
                        <span className="text-xs text-slate-400 flex-1 truncate">
                            {truncatedDetail || '—'}
                        </span>
                    </div>
                    
                    {/* Inline expansion - full detail when expanded */}
                    {isExpanded && event.detail && (
                        <div className="mt-2 pl-20 text-xs text-slate-300 bg-slate-800 p-2 rounded">
                            {event.detail}
                        </div>
                    )}
                </div>
            );
        }

        // ActivityFeedPanel component - uses SSE with polling fallback
        function ActivityFeedPanel() {
            const [events, setEvents] = useState([]);
            const [expandedEventId, setExpandedEventId] = useState(null);
            const [newEventIds, setNewEventIds] = useState(new Set());
            const eventSourceRef = React.useRef(null);
            const pollingIntervalRef = React.useRef(null);
            const isUsingSSE = React.useRef(true);

            useEffect(() => {
                // Fetch initial events
                fetchEvents();

                // Set up SSE connection
                setupSSE();

                // Cleanup on unmount
                return () => {
                    if (eventSourceRef.current) {
                        eventSourceRef.current.close();
                    }
                    if (pollingIntervalRef.current) {
                        clearInterval(pollingIntervalRef.current);
                    }
                };
            }, []);

            function setupSSE() {
                try {
                    const eventSource = new EventSource('/api/events/stream');
                    eventSourceRef.current = eventSource;

                    eventSource.onmessage = (event) => {
                        // Skip heartbeat messages
                        if (event.type === 'heartbeat' || !event.data || event.data === '{}') {
                            return;
                        }

                        try {
                            const newEvent = JSON.parse(event.data);
                            if (newEvent && newEvent.id) {
                                // Get timestamp for deduplication (try 'ts' first, then 'timestamp')
                                const eventTs = newEvent.ts || newEvent.timestamp;

                                setEvents(prevEvents => {
                                    // Check for duplicates based on timestamp
                                    const isDuplicate = prevEvents.some(e => {
                                        const existingTs = e.ts || e.timestamp;
                                        return existingTs && eventTs && existingTs === eventTs;
                                    });

                                    if (isDuplicate) {
                                        return prevEvents;
                                    }

                                    // Mark as new for fade-in animation
                                    setNewEventIds(prev => new Set([...prev, newEvent.id]));

                                    // Remove fade-in class after animation completes
                                    setTimeout(() => {
                                        setNewEventIds(prev => {
                                            const next = new Set(prev);
                                            next.delete(newEvent.id);
                                            return next;
                                        });
                                    }, 350);

                                    // Prepend new event at the top
                                    return [newEvent, ...prevEvents];
                                });
                            }
                        } catch (e) {
                            console.log('Failed to parse SSE event:', e);
                        }
                    };

                    eventSource.onerror = (error) => {
                        console.log('SSE connection error, falling back to polling');
                        eventSource.close();
                        isUsingSSE.current = false;
                        startPollingFallback();
                    };
                } catch (err) {
                    console.log('Failed to create EventSource, using polling fallback');
                    startPollingFallback();
                }
            }

            function startPollingFallback() {
                if (pollingIntervalRef.current) {
                    return; // Already polling
                }

                // Poll every 5 seconds as fallback
                pollingIntervalRef.current = setInterval(() => { fetchEventsPolling(); }, 5000);

                // Try to resume SSE periodically
                const reconnectInterval = setInterval(() => {
                    if (!isUsingSSE.current) {
                        isUsingSSE.current = true;
                        setupSSE();
                        if (eventSourceRef.current) {
                            clearInterval(pollingIntervalRef.current);
                            pollingIntervalRef.current = null;
                            clearInterval(reconnectInterval);
                        }
                    }
                }, 30000);

                // Store reconnect interval for cleanup
                pollingIntervalRef.current.reconnectInterval = reconnectInterval;
            }

            function fetchEvents() {
                fetch('/api/events?limit=30')
                    .then(res => res.json())
                    .then(data => {
                        if (data.events && Array.isArray(data.events)) {
                            setEvents(data.events);
                        }
                    })
                    .catch(err => {
                        console.log('Events API not available yet');
                    });
            }

            function fetchEventsPolling() {
                fetch('/api/events?limit=30')
                    .then(res => res.json())
                    .then(data => {
                        if (data.events && Array.isArray(data.events)) {
                            setEvents(prevEvents => {
                                const newEvents = [];
                                const existingTimestamps = new Set(
                                    prevEvents.map(e => e.ts || e.timestamp)
                                );

                                // Filter out duplicates based on timestamp
                                for (const event of data.events) {
                                    const eventTs = event.ts || event.timestamp;
                                    if (!existingTimestamps.has(eventTs)) {
                                        newEvents.push(event);
                                        existingTimestamps.add(eventTs);
                                    }
                                }

                                if (newEvents.length === 0) {
                                    return prevEvents;
                                }

                                // Mark new events for fade-in
                                newEvents.forEach(e => {
                                    setNewEventIds(prev => new Set([...prev, e.id]));
                                    setTimeout(() => {
                                        setNewEventIds(prev => {
                                            const next = new Set(prev);
                                            next.delete(e.id);
                                            return next;
                                        });
                                    }, 350);
                                });

                                // Prepend new events at the top
                                return [...newEvents, ...prevEvents];
                            });
}

            function handleRowClick(eventId) {
                if (expandedEventId === eventId) {
                    setExpandedEventId(null);
                } else {
                    setExpandedEventId(eventId);
                }
            }
            
            // Empty state
            if (!events || events.length === 0) {
                return (
                    <div className="text-slate-500 italic text-sm">
                        No events recorded yet
                    </div>
                );
            }
            
            return (
                <div className="space-y-1">
                    {events.map((event, index) => (
                        <EventRow 
                            key={event.id || index}
                            event={event}
                            isExpanded={expandedEventId === event.id}
                            onToggle={() => handleRowClick(event.id)}
                            isNew={newEventIds.has(event.id)}
                        />
                    ))}
                </div>
            );
        }
        function App() {
            const [state, setState] = useState({
                pipeline_status: 'Loading...',
                orchestrator_alive: true,
                current_agent: null,
                project_path: null,
                current_phase_raw_id: '',
                planner_retries: null,
                executor_retries: null,
                reviewer_retries: null,
                last_error_code: null,
                last_action_timestamp: null,
                skill_injected: null,
                skill_agent: null
            });
            const roadmap = useState(null); // roadmap state
            const [lastPhaseId, setLastPhaseId] = useState(null);
            
            useEffect(() => {
                // Fetch initial state
                fetchState();
                
                // Set up polling every 3 seconds
                const interval = setInterval(fetchState, 3000);
                
                return () => clearInterval(interval);
            }, []);
            
            // Fetch roadmap when phase ID changes
            useEffect(() => {
                const currentPhaseId = state.current_phase_raw_id;
                if (currentPhaseId && currentPhaseId !== lastPhaseId) {
                    setLastPhaseId(currentPhaseId);
                    fetchRoadmap();
                }
            }, [state.current_phase_raw_id, lastPhaseId]);
            
            function fetchRoadmap() {
                fetch('/api/roadmap')
                    .then(res => res.json())
                    .then(data => {
                        roadmap[1](data);
                    })
                    .catch(err => {
                        console.log('Roadmap API not available yet');
                    });
            }
            
            function fetchState() {
                fetch('/api/state')
                    .then(res => res.json())
                    .then(data => {
                        setState(data);
                        updateUI(data);
                    })
                    .catch(err => {
                        console.log('State API not available yet');
                    });
            }
            
            function updateUI(data) {
                const status = data.pipeline_status || 'Unknown';
                const alive = data.orchestrator_alive;
                const agent = data.current_agent;
                const projectPath = data.project_path;
                
                // Update liveness dot
                const livenessDot = document.getElementById('liveness-dot');
                if (livenessDot) {
                    livenessDot.className = `w-2.5 h-2.5 rounded-full ${alive ? 'bg-green-500' : 'bg-red-600'}`;
                }
                
                // Update project path (show last two segments)
                const pathSpan = document.getElementById('project-path');
                if (pathSpan && projectPath) {
                    const segments = projectPath.split('/').filter(s => s);
                    const lastTwo = segments.slice(-2).join('/');
                    pathSpan.textContent = lastTwo || projectPath;
                }
                
                // Determine status label
                let statusLabel = '--';
                let statusClass = 'bg-slate-600 text-slate-300';
                
                // ORCHESTRATOR DOWN override
                if (!alive && (status === 'RUNNING' || status === 'WAITING_FOR_SENTINEL')) {
                    statusLabel = 'ORCHESTRATOR DOWN';
                    statusClass = 'bg-red-600 text-white';
                } else if (status in STATE_LABELS) {
                    statusLabel = STATE_LABELS[status];
                    if (status === 'WAITING_FOR_SENTINEL' && agent) {
                        statusLabel = `WAITING — ${agent}`;
                    }
                    statusClass = STATE_CLASSES[status] || 'bg-slate-600 text-slate-300';
                }
                
                // Update status pill
                const statusPill = document.getElementById('status-pill');
                if (statusPill) {
                    statusPill.textContent = statusLabel;
                    statusPill.className = `header-text px-3 py-1 rounded-full text-sm font-medium ${statusClass}`;
                }
                
                // Update last update time
                const lastUpdate = document.getElementById('last-update');
                if (lastUpdate) {
                    lastUpdate.textContent = 'Last update: ' + new Date().toLocaleTimeString();
                }
            }
            
            return (
                <div className="overflow-y-auto h-full">
                    <CurrentPhasePanel
                        current_phase_raw_id={state.current_phase_raw_id}
                        current_agent={state.current_agent}
                        roadmap={roadmap[0]}
                        planner_retries={state.planner_retries}
                        executor_retries={state.executor_retries}
                        reviewer_retries={state.reviewer_retries}
                        last_error_code={state.last_error_code}
                        last_action_timestamp={state.last_action_timestamp}
                        skill_injected={state.skill_injected}
                        skill_agent={state.skill_agent}
                        pipeline_status={state.pipeline_status}
                    />
                </div>
            );
        }

        // RightPanelApp - fetches and displays roadmap in right panel
        function RightPanelApp() {
            const [roadmap, setRoadmap] = useState(null);
            
            useEffect(() => {
                fetchRoadmap();
                const interval = setInterval(fetchRoadmap, 3000);
                return () => clearInterval(interval);
            }, []);
            
            function fetchRoadmap() {
                fetch('/api/roadmap')
                    .then(res => res.json())
                    .then(data => {
                        setRoadmap(data);
                    })
                    .catch(err => {
                        console.log('Roadmap API not available yet');
                    });
            }
            
            return (
                <div className="overflow-y-auto h-full">
                    <RoadmapPanel roadmap={roadmap} />
                </div>
            );
        }
        
        // Render the apps to their respective panels
        const leftRoot = ReactDOM.createRoot(document.getElementById('left-panel-root'));
        leftRoot.render(<App />);
        
        const rightRoot = ReactDOM.createRoot(document.getElementById('right-panel-root'));
        rightRoot.render(<RightPanelApp />);
        
        const activityFeedRoot = ReactDOM.createRoot(document.getElementById('activity-feed-root'));
        activityFeedRoot.render(<ActivityFeedPanel />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDev Pipeline</title>
    
    <!-- Google Fonts: JetBrains Mono for headers, IBM Plex Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React and ReactDOM UMD -->
    <script src="/static/react.min.js"></script>
    <script src="/static/react-dom.min.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="/static/babel.min.js"></script>
    <script src="/static/marked.min.js"></script>
    <script src="/static/diff.min.js"></script>

    <!-- Tailwind CSS via Play CDN -->
    <script src="/static/tailwind.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'header': ['"JetBrains Mono"', 'monospace'],
                        'body': ['"IBM Plex Sans"', 'sans-serif'],
                    },
                    colors: {
                        'header-bg': '#1e293b',
                        'panel-bg': '#141618',
                        'accent': '#00b4d8',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #0d0f12;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #app-root {
            height: 100vh;
            overflow: hidden;
        }
        .header-text {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Amber pulse — legacy non-pipeline indicators (e.g. stopping) */
        @keyframes amber-pulse {
            0%, 100% {
                background-color: #f59e0b;
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }
            50% {
                background-color: #fbbf24;
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
            }
        }

        /* Teal pulse — pipeline RUNNING only (active compute) */
        @keyframes teal-pulse {
            0%, 100% {
                background-color: #0d9488;
                box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.55);
            }
            50% {
                background-color: #14b8a6;
                box-shadow: 0 0 0 8px rgba(20, 184, 166, 0);
            }
        }

        .status-pulse {
            animation: amber-pulse 2s ease-in-out infinite;
        }

        .run-pulse {
            animation: teal-pulse 2s ease-in-out infinite;
        }

        /* Pending assistant message — subtle opacity pulse, no amber flash */
        @keyframes chat-pending-soft {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 1; }
        }
        .chat-pending-soft {
            animation: chat-pending-soft 2s ease-in-out infinite;
        }

        /* L-28: in-flight attempt dot only — subtle opacity pulse (distinct from static green success dot) */
        @keyframes agent-attempt-inflight-pulse {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 1; }
        }
        .agent-attempt-dot--inflight {
            animation: agent-attempt-inflight-pulse 2.75s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .agent-attempt-dot--inflight {
                animation: none;
                opacity: 1;
            }
        }

        /* Fade-in animation for new event rows */
        @keyframes fade-in-row {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-row-fade-in {
            animation: fade-in-row 0.3s ease-out forwards;
        }
        
        /* Event row hover states and transitions */
        .event-row {
            transition: background-color 0.15s ease-in-out;
        }
        .event-row:hover {
            background-color: rgba(51, 65, 85, 0.5);
        }

        /* Shared markdown rendering for conversation and document panes */
        .msg-md h1, .msg-md h2, .msg-md h3, .msg-md h4 {
            font-weight: 600;
            margin: 0.65em 0 0.35em;
        }
        /* h2 = top-level category grouper in PRD sections → white */
        .msg-md h1, .msg-md h2 { color: #e2e8f0; }
        /* h3/h4 = actual subsection headers → slate (teal reserved for section labels only) */
        .msg-md h3, .msg-md h4 { color: #94a3b8; }
        .msg-md h1 { font-size: 1.2rem; }
        .msg-md h2 { font-size: 1.05rem; }
        .msg-md h3 { font-size: 0.98rem; }
        .msg-md p, .msg-md li, .msg-md blockquote {
            color: #e2e8f0;
            margin: 0.35em 0;
            line-height: 1.45;
        }
        .msg-md em { color: #64748b; }
        .msg-md ul, .msg-md ol { margin: 0.35em 0; padding-left: 1.25rem; }
        .msg-md code {
            background: #1a1d21;
            color: #67e8f9;
            padding: 0.1em 0.35em;
            border-radius: 0.25rem;
            font-size: 0.85em;
        }
        .msg-md pre {
            background: #1a1d21;
            padding: 0.75rem;
            border-radius: 0.35rem;
            overflow-x: auto;
            margin: 0.5em 0;
            border: 1px solid #2a2d31;
        }
        .msg-md pre code { background: transparent; padding: 0; color: #e2e8f0; }
        .msg-md a { color: #00b4d8; }
        .msg-md table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.6em 0;
            border: 1px solid #2a2d31;
            background: #141618;
        }
        .msg-md th, .msg-md td {
            border: 1px solid #2a2d31;
            padding: 0.4rem 0.5rem;
            text-align: left;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
        .msg-md th { background: #1a1d21; color: #cbd5e1; }

        .side-divider {
            width: 2px;
            background: #1a1d21;
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
        }
        .side-divider-btn {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translate(50%, -50%);
            width: 24px;
            height: 48px;
            border: 1px solid #1a1d21;
            border-radius: 6px;
            background: #141618;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .side-divider-btn:hover {
            color: #00b4d8;
            border-color: #334155;
            background: #1a1d21;
        }

        /* ── Dark-theme scrollbars (Webkit / Blink) ──────────────────────────
           Track: matches the darkest panel bg (#0d0f11).
           Thumb: mid-tone (#2a2d31) at rest → lighter (#3d4249) on hover.
           Thin (6 px) so it feels unobtrusive; rounded for polish.
           Firefox: scrollbar-color with the same values via * selector.
        ─────────────────────────────────────────────────────────────────────── */
        * {
            scrollbar-width: thin;
            scrollbar-color: #2a2d31 #0d0f11;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0f11;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d31;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4249;
        }
        ::-webkit-scrollbar-corner {
            background: #0d0f11;
        }
    </style>
</head>
<body>
    <div id="app-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;
        const AppCtx = createContext(null);

        /** Relative time for idea list (from API `updated` ISO string). */
        function relativeTime(dateStr) {
            if (!dateStr) return "—";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "—";
            const diffMs = Date.now() - d.getTime();
            const min = Math.floor(diffMs / 60000);
            const hr = Math.floor(min / 60);
            const day = Math.floor(hr / 24);
            if (min < 1) return "< 1 min ago";
            if (min < 60) return `${min} min ago`;
            if (hr < 24) return `${hr} hr ago`;
            if (day < 7) return `${day} day${day === 1 ? "" : "s"} ago`;
            return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        }

        /** Short label for preflight last-run timestamp. */
        function relativeTimeShort(d) {
            if (!(d instanceof Date) || Number.isNaN(d.getTime())) return "";
            const diffMs = Date.now() - d.getTime();
            const min = Math.floor(diffMs / 60000);
            const hr = Math.floor(min / 60);
            if (min < 1) return "just now";
            if (min < 60) return `${min} min ago`;
            if (hr < 24) return `${hr} hr ago`;
            return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        }
        
        // ─── Unified pipeline + queue status pills (pipeline > queue for primary pill) ───
        const PIPELINE_BLOCKED_TOOLTIP = 'Pipeline execution is blocked';
        const QUEUE_BLOCKED_TOOLTIP = 'Row is blocked in queue.';
        const QUEUE_CURRENT_TOOLTIP =
            'Active queue slot for this path. Live pipeline status is not available until the orchestrator runs here.';

        /** Tailwind defaults for live pills — keep in sync with AGENT_ATTEMPT_DOT_HEX (dots use inline hex). */
        const PIPELINE_STATUS_PILL_HEX = {
            teal600: '#0d9488',
            red600: '#dc2626',
            successGreen: '#28D11B',
            slate600: '#475569',
        };

        /**
         * WAITING_FOR_SENTINEL: short label "Running" or "Running {Agent}" (title case) from `current_agent`.
         * No literal "(agent)"; agent name is optional when state is unknown.
         */
        function formatWaitForSentinelLabel(agentRaw) {
            const t = (agentRaw || '').toString().trim();
            if (!t) return 'Running';
            const lower = t.toLowerCase();
            const name = lower.charAt(0).toUpperCase() + lower.slice(1);
            return `Running ${name}`;
        }

        /** Live pipeline_status from GET /api/queue → single pill (shared with Pipeline Monitor header). */
        const PIPELINE_LIVE_PILL = {
            RUNNING: { label: 'RUNNING', className: 'bg-[#0d9488] text-white run-pulse', title: '' },
            WAITING_FOR_SENTINEL: { label: 'Running', className: 'bg-[#0d9488] text-white', title: '' },
            WAITING_FOR_HUMAN: { label: 'NEEDS YOUR INPUT', className: 'bg-orange-500 text-white', title: '' },
            HALTED_SILENT: {
                label: 'INTERVENTION REQUIRED',
                className: 'bg-red-600 text-white',
                title:
                    'Pipeline halted — escalation path failed; check orchestrator logs and project escalation_failed.json.',
            },
            BLOCKED: { label: 'BLOCKED', className: 'bg-red-600 text-white', title: PIPELINE_BLOCKED_TOOLTIP },
            PIPELINE_COMPLETE: {
                label: 'COMPLETE',
                className: 'bg-[#28D11B] text-slate-900',
                title: '',
            },
            STOPPED: { label: 'STOPPED', className: 'bg-red-600 text-white', title: '' },
            QUEUE_HALTED: { label: 'Queue stalled', className: 'bg-amber-600 text-slate-900', title: '' },
            IDLE: { label: 'IDLE', className: 'bg-slate-600 text-slate-200', title: '' },
            UNKNOWN: { label: 'UNKNOWN', className: 'bg-slate-600 text-slate-200', title: '' },
        };

        /** POST /api/queue/trigger-next `queue_halted_reason` → one-line user message (L-07). */
        const QUEUE_HALTED_TRIGGER_MSG = {
            all_blocked: 'Queue stalled — No projects ready.',
            all_dependency_hold: 'Queue stalled — All waiting on parents.',
            mixed: 'Queue stalled — Multiple blockers.',
            all_completed: 'Queue stalled — No projects left to run.',
        };

        const STATE_LABELS = {
            ...Object.fromEntries(Object.entries(PIPELINE_LIVE_PILL).map(([k, v]) => [k, v.label])),
            COMPLETE: 'COMPLETE',
        };

        const STATE_CLASSES = Object.fromEntries(
            Object.entries(PIPELINE_LIVE_PILL).map(([k, v]) => [k, v.className])
        );

        /** Queue-only row states when live_pipeline_status is null (no global state for this path). */
        function queueOnlyRowPill(state) {
            const q = {
                READY: { label: 'READY', className: 'bg-slate-600 text-slate-200', title: '' },
                ACTIVE: { label: 'ACTIVE', className: 'bg-slate-600 text-slate-200', title: QUEUE_CURRENT_TOOLTIP },
                BLOCKED: { label: 'QUEUE BLOCKED', className: 'bg-amber-600 text-slate-900', title: QUEUE_BLOCKED_TOOLTIP },
                SKIPPED_PENDING: { label: 'Preflight failed', className: 'bg-indigo-900 text-indigo-200', title: '' },
                DEPENDENCY_HOLD: { label: 'Waiting on parent', className: 'bg-orange-600 text-white', title: '' },
                ESCALATION: { label: 'ESCALATION', className: 'bg-amber-500 text-slate-900', title: '' },
                COMPLETED: { label: 'COMPLETED', className: 'bg-emerald-800 text-emerald-200', title: '' },
                FAILED: { label: 'FAILED', className: 'bg-red-700 text-white', title: '' },
            };
            const row = q[state];
            if (row) return { ...row };
            return { label: state || '', className: 'bg-slate-700 text-white', title: '' };
        }

        /** Parent state mini-pill in dependency panel — same colors as queue-only mapping. */
        function queueParentStatePill(state) {
            const disp = queueOnlyRowPill(state);
            return { label: disp.label, className: disp.className, title: disp.title };
        }

        /** Primary queue list/detail pill: live pipeline_status overrides queue row state. */
        function queueRowDisplay(entry) {
            if (!entry) return { label: '', className: 'bg-slate-700 text-white', title: '' };
            const live = entry.live_pipeline_status;
            if (live != null && live !== '') {
                if (live === 'WAITING_FOR_SENTINEL') {
                    const meta = PIPELINE_LIVE_PILL[live];
                    if (!meta) {
                        return { label: 'Running', className: 'bg-slate-600 text-slate-200', title: '' };
                    }
                    return {
                        label: formatWaitForSentinelLabel(entry.live_current_agent),
                        className: meta.className,
                        title: meta.title || '',
                    };
                }
                const meta = PIPELINE_LIVE_PILL[live];
                if (meta) return { label: meta.label, className: meta.className, title: meta.title || '' };
                return { label: String(live), className: 'bg-slate-600 text-slate-200', title: '' };
            }
            // Row ACTIVE in queue file but path does not match global pipeline_state (defensive).
            if (entry.state === 'ACTIVE') {
                return {
                    label: 'ACTIVE (stale)',
                    className: 'bg-slate-700 text-slate-400',
                    title: 'Queue row is ACTIVE but does not match the current pipeline project_path.',
                };
            }
            return queueOnlyRowPill(entry.state);
        }

        /** True when any queue row's live_pipeline_status is an in-flight pipeline (B-02). Not queue row ACTIVE alone. */
        function queueEntriesHaveBusyLivePipeline(entries) {
            const busy = new Set(["RUNNING", "WAITING_FOR_SENTINEL", "WAITING_FOR_HUMAN"]);
            return (entries || []).some((e) => busy.has(e && e.live_pipeline_status));
        }

        /** P0-01: first-run default screen — Ideas when pipeline is not running and queue has no in-flight live status. */
        function shouldOpenIdeasOnColdBootstrap(pipelineStatus, queueEntries) {
            const ps = pipelineStatus || "";
            const idleLike = ps === "IDLE" || ps === "UNKNOWN";
            if (!idleLike) return false;
            return !queueEntriesHaveBusyLivePipeline(queueEntries);
        }

        const AGENT_COLORS = {
            'PLANNER': 'bg-[#1a1d21] text-white',
            'EXECUTOR': 'bg-emerald-600 text-white',
            'REVIEWER': 'bg-[#00b4d8] text-white',
            'ESCALATION': 'bg-amber-600 text-white'
        };

        // ─── Helper functions ─────────────────────────────────────────────────────

        function getGoalForPhase(phaseId, roadmap) {
            if (!phaseId || !roadmap || !Array.isArray(roadmap)) return null;
            const phase = roadmap.find(p => p.id === phaseId);
            return phase ? phase.goal : null;
        }
        
        function getStatusIcon(status) {
            switch (status) {
                case 'complete': return '✓';
                case 'in_progress': return '▶';
                case 'pending': return '○';
                case 'skipped': return '⊘';
                case 'blocked': return '⚠';
                default: return '○';
            }
        }

        function getStatusClasses(status) {
            switch (status) {
                case 'complete': return 'opacity-60 text-slate-400';
                case 'in_progress': return 'border-l-4 border-cyan-500 bg-[#141618]/50';
                case 'blocked': return 'bg-red-900/30 border-l-4 border-red-600';
                case 'skipped': return 'opacity-50 text-slate-500';
                default: return 'text-slate-300';
            }
        }

        function getEventBadgeColor(eventType) {
            const raw = (eventType || '').toLowerCase();
            switch (raw) {
                case 'gate_pass': return 'bg-green-600 text-white';
                case 'gate_fail': return 'bg-amber-600 text-white';
                case 'retry': return 'bg-amber-600 text-white';
                case 'escalation_trigger': return 'bg-orange-600 text-white';
                case 'escalation_resolve': return 'bg-blue-600 text-white';
                case 'phase_complete': return 'bg-lime-600 text-white';
                case 'status_changed': return 'bg-slate-600 text-white';
                default: return 'bg-[#1a1d21] text-white';
            }
        }

        /** Canonical jsonl / synthetic event type → operator-facing label (L-31). */
        const EVENT_TYPE_DISPLAY = {
            gate_pass: 'Gate pass',
            gate_fail: 'Gate fail',
            retry: 'Retry',
            escalation_trigger: 'Escalation trigger',
            escalation_resolve: 'Escalation resolve',
            phase_complete: 'Phase complete',
            status_changed: 'Status changed',
            phase_skip: 'Phase skip',
            skill_inject: 'Skill inject',
            pipeline_start: 'Pipeline start',
            pipeline_complete: 'Pipeline complete',
            orchestrator_crash: 'Orchestrator crash',
            heartbeat_resume: 'Heartbeat resume',
            phase_start: 'Phase start',
            gate_verdict: 'Gate verdict',
            agent_retry: 'Agent retry',
            webhook_invoke: 'Webhook invoke',
            state_transition: 'State transition',
        };

        function humanizeSnakeCase(s) {
            if (!s || typeof s !== 'string') return 'Unknown';
            return s
                .split('_')
                .map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : ''))
                .join(' ')
                .trim() || 'Unknown';
        }

        function getEventTypeRaw(event) {
            if (!event) return '';
            const t = event.event_type ?? event.event;
            return typeof t === 'string' ? t : String(t || '');
        }

        function formatActivityEventTypeLabel(raw) {
            const key = (raw || '').toLowerCase();
            if (EVENT_TYPE_DISPLAY[key]) return EVENT_TYPE_DISPLAY[key];
            return humanizeSnakeCase(key);
        }

        const AGENT_ATTEMPT_DOT_TITLES = {
            neutral: 'Attempt not started yet for this phase.',
            blue: 'Attempt in progress — agent running or waiting for sentinel output.',
            green: 'Attempt succeeded — pipeline advanced past this agent for this phase.',
            red: 'Attempt failed (gate or timeout) — retry or escalation follows if cap reached.',
        };

        /** L-28 palette — inline hex; matches PIPELINE_STATUS_PILL_HEX / live pill surfaces (COMPLETE uses same success lime). */
        const AGENT_ATTEMPT_DOT_HEX = {
            neutral: PIPELINE_STATUS_PILL_HEX.slate600,
            blue: PIPELINE_STATUS_PILL_HEX.teal600,
            green: PIPELINE_STATUS_PILL_HEX.successGreen,
            red: PIPELINE_STATUS_PILL_HEX.red600,
        };

        /**
         * L-28 per-slot states: 'neutral' | 'blue' | 'green' | 'red'
         * @param {string} agentRole planner|executor|reviewer
         * @param {number|null|undefined} rowRetries failure count for this row
         */
        function getAgentAttemptDotStates(agentRole, rowRetries, currentAgent, pipelineStatus, allRetries) {
            const ORDER = ['planner', 'executor', 'reviewer'];
            const rowIdx = ORDER.indexOf(agentRole);
            if (rowIdx < 0) return ['neutral', 'neutral', 'neutral'];

            const ca = (currentAgent || '').toLowerCase(); // L-28: canonical agent id compare
            const ps = String(pipelineStatus ?? '').trim();
            const r = Math.min(Math.max(Number(rowRetries) || 0, 0), 3);
            const p = Math.min(Math.max(Number(allRetries?.planner) || 0, 0), 3);
            const e = Math.min(Math.max(Number(allRetries?.executor) || 0, 0), 3);
            const rev = Math.min(Math.max(Number(allRetries?.reviewer) || 0, 0), 3);

            const terminalNoBlue = new Set([
                'STOPPED',
                'HALTED_SILENT',
                'BLOCKED',
                'QUEUE_HALTED',
                'PIPELINE_COMPLETE',
            ]);
            const allowBlue =
                (ps === 'RUNNING' || ps === 'WAITING_FOR_SENTINEL') &&
                !terminalNoBlue.has(ps) &&
                ps !== 'WAITING_FOR_HUMAN';

            let activeIdx = -1;
            if (ca === 'planner') activeIdx = 0;
            else if (ca === 'executor') activeIdx = 1;
            else if (ca === 'reviewer') activeIdx = 2;
            else if (ca === 'escalation') activeIdx = 3;

            const slotStates = () => ['neutral', 'neutral', 'neutral'];
            const threeRed = () => ['red', 'red', 'red'];
            const completedLeg = (failures) => {
                const out = ['neutral', 'neutral', 'neutral'];
                const retries = Math.min(Math.max(Number(failures) || 0, 0), 3);
                for (let i = 0; i < 3; i++) {
                    if (i < retries) out[i] = 'red';
                    else if (i === retries) out[i] = 'green';
                    else out[i] = 'neutral';
                }
                return out;
            };
            const activeRow = (failures, withBlue) => {
                const out = ['neutral', 'neutral', 'neutral'];
                const retries = Math.min(Math.max(Number(failures) || 0, 0), 3);
                for (let i = 0; i < 3; i++) {
                    if (i < retries) out[i] = 'red';
                    else if (i === retries) out[i] = withBlue ? 'blue' : 'neutral';
                    else out[i] = 'neutral';
                }
                return out;
            };

            if (ca === 'escalation') {
                if (agentRole === 'planner') {
                    if (p >= 3) return threeRed();
                    return completedLeg(p);
                }
                if (agentRole === 'executor') {
                    if (p >= 3) return slotStates();
                    if (e >= 3) return threeRed();
                    return completedLeg(e);
                }
                if (agentRole === 'reviewer') {
                    if (p >= 3 || e >= 3) return slotStates();
                    if (rev >= 3) return threeRed();
                    return completedLeg(rev);
                }
            }

            if (activeIdx < 0) return slotStates();

            if (rowIdx > activeIdx) return slotStates();

            if (rowIdx < activeIdx) return completedLeg(r);

            // rowIdx === activeIdx
            if (ps === 'WAITING_FOR_HUMAN' && r >= 3) return threeRed();
            if (!allowBlue) return activeRow(r, false);
            return activeRow(r, true);
        }

        /** Format seconds as "Xh Ym" or "Ym" or "—" */
        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            const s = Math.round(Number(seconds) || 0);
            if (s <= 0) return '—';
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        // ─── Primitive components ─────────────────────────────────────────────────

        function AgentBadge({ agent }) {
            if (!agent) return null;
            const colorClass = AGENT_COLORS[agent] || 'bg-[#1a1d21] text-white';
            return (
                <span className={`header-text px-2 py-0.5 rounded text-xs font-medium ${colorClass}`}>
                    {agent}
                </span>
            );
        }
        
        function DotCounter({ count, label, agentRole, currentAgent, pipelineStatus, planner_retries, executor_retries, reviewer_retries }) {
            const maxDots = 3;
            if (count === undefined || count === null) return null;
            const allRetries = {
                planner: planner_retries,
                executor: executor_retries,
                reviewer: reviewer_retries,
            };
            const states = getAgentAttemptDotStates(agentRole, count, currentAgent, pipelineStatus, allRetries).slice(0, maxDots);
            return (
                <div className="flex items-center gap-1.5">
                    <span className="text-slate-500 text-xs w-16">{label}</span>
                    <div className="flex gap-1">
                        {states.map((st, i) => (
                            <span
                                key={i}
                                data-agent-dot-state={st}
                                title={AGENT_ATTEMPT_DOT_TITLES[st]}
                                className={
                                    'w-2 h-2 rounded-full inline-block shrink-0' +
                                    (st === 'blue' ? ' agent-attempt-dot--inflight' : '')
                                }
                                style={{ backgroundColor: AGENT_ATTEMPT_DOT_HEX[st] || AGENT_ATTEMPT_DOT_HEX.neutral }}
                            />
                        ))}
                    </div>
                </div>
            );
        }

        function LastErrorCode({ errorCode }) {
            if (!errorCode) return null;
            return (
                <span className="font-mono text-xs text-red-400 bg-[#141618] px-1.5 py-0.5 rounded">{errorCode}</span>
            );
        }

        function ElapsedTimer({ lastActionTimestamp, pipeline_status }) {
            const [elapsed, setElapsed] = useState(0);
            useEffect(() => {
                if (!lastActionTimestamp || pipeline_status === "WAITING_FOR_HUMAN") return;
                const startTime = new Date(lastActionTimestamp).getTime();
                const tick = () => setElapsed(Math.floor((Date.now() - startTime) / 1000));
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [lastActionTimestamp, pipeline_status]);
            if (pipeline_status === "WAITING_FOR_HUMAN") return null;
            if (!lastActionTimestamp) return null;
            const isOverdue = pipeline_status === 'WAITING_FOR_SENTINEL' && elapsed > 300;
            const colorClass = isOverdue ? 'text-amber-400' : 'text-slate-400';
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            return (
                <span className={`header-text text-xs ${colorClass}`}>{mins}m {String(secs).padStart(2, '0')}s</span>
            );
        }

        function SkillInjected({ skillInjected, skillAgent }) {
            if (!skillInjected || !skillAgent) return null;
            return (
                <span className="text-slate-500 text-xs">{skillInjected} / {skillAgent}</span>
            );
        }

        /** Split FastAPI detail: friendly first line + optional technical rest (after newline). */
        function splitApiDetail(detail) {
            if (typeof detail !== "string") {
                return { friendly: detail ? String(detail) : "", technical: "" };
            }
            const i = detail.indexOf("\n");
            if (i === -1) return { friendly: detail, technical: "" };
            return { friendly: detail.slice(0, i), technical: detail.slice(i + 1).trim() };
        }

        /** Human-readable message from FastAPI JSON body (`detail` string or object). */
        function formatFetchDetail(d) {
            if (!d || d.detail === undefined || d.detail === null) {
                return "";
            }
            const det = d.detail;
            if (typeof det === "string") {
                return det;
            }
            if (typeof det === "object" && det !== null && typeof det.message === "string") {
                let s = det.message;
                const lines = [];
                if (det.state_path) lines.push(`pipeline_state path: ${det.state_path}`);
                if (det.symlink_path) lines.push(`symlink target: ${det.symlink_path}`);
                if (lines.length) s += "\n" + lines.join("\n");
                return s;
            }
            try {
                return JSON.stringify(det);
            } catch (e) {
                return String(det);
            }
        }

        /** Raw server text for failed POST /api/resume-orchestrator (detail or spawn error field). */
        function extractResumeOrchestratorRawDetail(od, status) {
            if (od && typeof od === "object" && status === 503 && od.reconciled === true && od.error != null) {
                return String(od.error);
            }
            return formatFetchDetail(od);
        }

        /**
         * Map ui/server.py repoint / resume-orchestrator messages to plain language.
         * Returns null when the raw string should be shown alone (no separate technical line).
         */
        function mapResumeOrchestratorFriendlyMessage(raw, status) {
            if (typeof raw !== "string" || !raw.trim()) return null;
            const s = raw.trim();
            const lower = s.toLowerCase();
            if (
                lower.includes("real directory, not a symlink") ||
                (lower.includes("not a symlink") && lower.includes("real directory"))
            ) {
                return (
                    "The configured project folder is a real directory, not the pipeline-project symlink. " +
                    "Set project_dir_path in ui/config.json to a symlink target, or remove the blocking folder."
                );
            }
            if (lower.includes("exists as a file") && lower.includes("refusing")) {
                return (
                    "The pipeline-project path points to a file instead of a symlink. Fix project_dir_path in ui/config.json."
                );
            }
            if (lower.includes("not set in config") && lower.includes("cannot repoint symlink")) {
                return (
                    "project_dir_path (symlink location) is not set in ui/config.json — the UI cannot align the pipeline-project symlink."
                );
            }
            if (lower.includes("target project path does not exist")) {
                return (
                    "The project path from pipeline state does not exist or is not a folder. Use Switch project or Setup & Preflight."
                );
            }
            if (lower.includes("cannot create parent directory for symlink")) {
                return (
                    "Could not create the directory needed for the pipeline-project symlink. Check OPENCLAW_ROOT and filesystem permissions."
                );
            }
            if (lower.includes("no project_path") && lower.includes("pipeline_state")) {
                return "No active project path in pipeline state. Use Setup & Preflight or Switch project.";
            }
            if (s === "Orchestrator is already running") {
                return (
                    "An orchestrator instance may already be running (pipeline lock). If this seems wrong, inspect pipeline.lock."
                );
            }
            if (lower.includes("orchestrator.py") && lower.includes("not found")) {
                return (
                    "Could not find orchestrator.py under autodev_repo_path. Set autodev_repo_path in ui/config.json to this repository root."
                );
            }
            if (lower.includes("failed to spawn orchestrator")) {
                return (
                    "Could not start the orchestrator process. Check spawn logs and that Python can launch autodev/pipeline/orchestrator.py."
                );
            }
            if (s === "Could not repoint pipeline-project symlink") {
                return (
                    "Could not update the pipeline-project symlink. Check project_dir_path and filesystem permissions."
                );
            }
            return null;
        }

        /** Friendly first line + optional raw detail (mirrors stop-path UX). */
        function resumeOrchestratorErrorPresentation(od, status) {
            const raw = extractResumeOrchestratorRawDetail(od, status).trim();
            if (!raw) {
                return { friendly: `Resume orchestrator failed (${status})`, technical: "" };
            }
            const mapped = mapResumeOrchestratorFriendlyMessage(raw, status);
            const friendly = mapped !== null ? mapped : raw;
            const technical = mapped !== null ? raw : "";
            return { friendly, technical };
        }

        /** Error string for failed /api/resume-orchestrator (newline joins friendly + technical for splitApiDetail). */
        function formatResumeOrchestratorError(od, status) {
            const p = resumeOrchestratorErrorPresentation(od, status);
            if (p.technical) return `${p.friendly}\n${p.technical}`;
            return p.friendly;
        }

        // ─── Modals ───────────────────────────────────────────────────────────────

        function ConfirmationModal({ command, onConfirm, onDismiss, busy }) {
            let title = "Confirm action";
            let body = "Are you sure?";
            if (command === "STOP") {
                title = "Confirm STOP";
                body = "Halt the pipeline entirely? No further phases will run. You can resume from the STOPPED state if needed.";
            } else if (command === "SKIP") {
                title = "Confirm SKIP";
                body =
                    "Skip the current phase? The phase will be marked skipped in the roadmap and the pipeline advances to the next phase. In-progress work is not committed.";
            } else if (command === "RESET_PHASE") {
                title = "Confirm RESET PHASE";
                body =
                    "Full phase reset: git will rewind to the pre-phase commit, the phase branch will be deleted, and a fresh planner run will start. Use only when the plan itself is flawed.";
            } else if (command === "RESET_REVIEWER") {
                title = "Confirm RESET REVIEWER";
                body =
                    "Clear reviewer output and re-run the reviewer from scratch. Executor output is preserved. Use when the reviewer failed but the implementation looks correct.";
            } else {
                title = "Confirm action";
                body = "Are you sure you want to run this command?";
            }
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                    <div className="bg-[#141618] border border-[#1a1d21] rounded-lg p-6 max-w-sm mx-4">
                        <h3 className="header-text text-lg font-semibold text-amber-400 mb-3">
                            {title}
                        </h3>
                        <p className="text-slate-300 text-sm mb-6">
                            {body}
                        </p>
                        <div className="flex gap-3 justify-end">
                            <button
                                type="button"
                                onClick={onDismiss}
                                disabled={busy}
                                className="px-4 py-2 rounded bg-[#1a1d21] text-slate-300 hover:bg-[#252830] transition-colors disabled:opacity-50"
                            >
                                Cancel
                            </button>
                            <button
                                type="button"
                                onClick={onConfirm}
                                disabled={busy}
                                className="px-4 py-2 rounded bg-red-600 hover:bg-red-500 text-white font-medium transition-colors disabled:opacity-50"
                            >
                                {busy ? "Sending…" : "Confirm"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StopConfirmModal({ onConfirm, onDismiss, pipelineStatus }) {
            const escalationStop = pipelineStatus === "WAITING_FOR_HUMAN";
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                    <div className="bg-[#141618] border border-[#1a1d21] rounded-lg p-6 max-w-sm mx-4">
                        <h3 className="header-text text-lg font-semibold text-red-400 mb-3">
                            {escalationStop ? "Stop (human prompt)?" : "Stop Pipeline?"}
                        </h3>
                        <p className="text-slate-300 text-sm mb-6">
                            {escalationStop
                                ? "Send STOP to the orchestrator?"
                                : "Note that the stop will only take place after the current agent has finished their turn."}
                        </p>
                        <div className="flex gap-3 justify-end">
                            <button onClick={onDismiss} className="px-4 py-2 rounded bg-[#1a1d21] text-slate-300 hover:bg-[#252830] transition-colors">
                                Cancel
                            </button>
                            <button onClick={onConfirm} className="px-4 py-2 rounded bg-orange-600 hover:bg-orange-500 text-white font-medium transition-colors">
                                Stop Pipeline
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── EscalationCommandPanel ───────────────────────────────────────────────

        function EscalationCommandPanel({
            pipeline_status,
            escalation_trigger_reason,
            escalation_message,
            last_action,
            escalation_resets,
            orchestrator_alive,
            onOrchestratorRestarted,
            onResumeOrchestratorResponse,
        }) {
            const [commandSent, setCommandSent] = useState(false);
            const [lastSubmittedCommand, setLastSubmittedCommand] = useState(null);
            const [commandError, setCommandError] = useState("");
            const [prevStatus, setPrevStatus] = useState(pipeline_status);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [modalCommand, setModalCommand] = useState(null);
            const [confirmBusy, setConfirmBusy] = useState(false);
            const [restartBusy, setRestartBusy] = useState(false);
            const [restartError, setRestartError] = useState("");

            const isResetDisabled = escalation_resets >= 3;

            useEffect(() => {
                if (prevStatus === "WAITING_FOR_HUMAN" && pipeline_status !== "WAITING_FOR_HUMAN") {
                    // Do not clear while the confirm modal is open — the 3s state poll can
                    // briefly show a non-human status and would unmount the modal mid-confirm.
                    if (!showConfirmModal) {
                        setCommandSent(false);
                        setLastSubmittedCommand(null);
                        setCommandError("");
                    }
                }
                setPrevStatus(pipeline_status);
            }, [pipeline_status, prevStatus, showConfirmModal]);

            const humanWait = pipeline_status === "WAITING_FOR_HUMAN";
            const queueHaltedEscalation =
                pipeline_status === "QUEUE_HALTED" &&
                !!(escalation_trigger_reason || escalation_message);
            const canIssueCommands = humanWait || queueHaltedEscalation;
            const orchestratorDownBlocksCommands =
                canIssueCommands && !orchestrator_alive && !commandSent;
            const keepPanelMounted = canIssueCommands || showConfirmModal || commandSent;
            if (!keepPanelMounted) return null;

            const headerText = commandSent
                ? "Command submitted"
                : !humanWait && showConfirmModal
                    ? "Confirm command (pipeline status changed — server will still validate)"
                    : escalation_trigger_reason || last_action || "Awaiting human command";
            const commandErrParts = commandError ? splitApiDetail(commandError) : null;

            const handleCommand = (command) => {
                if (command === "RESET_PHASE" || command === "RESET_REVIEWER" || command === "SKIP" || command === "STOP") {
                    setModalCommand(command);
                    setShowConfirmModal(true);
                    return;
                }
                sendCommand(command);
            };

            const sendCommand = async (command) => {
                setCommandError("");
                try {
                    const r = await fetch("/api/command", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ command }),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Request failed (${r.status})`;
                        setCommandError(msg);
                        return;
                    }
                    setLastSubmittedCommand(command);
                    setCommandSent(true);
                } catch (err) {
                    setCommandError(String(err?.message || err));
                }
            };

            const modalConfirm = async () => {
                if (!modalCommand) return;
                setConfirmBusy(true);
                setCommandError("");
                try {
                    let r;
                    if (modalCommand === "STOP") {
                        r = await fetch("/api/stop", { method: "POST" });
                    } else {
                        r = await fetch("/api/command", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ command: modalCommand }),
                        });
                    }
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Request failed (${r.status})`;
                        setCommandError(msg);
                        setShowConfirmModal(false);
                        setModalCommand(null);
                        return;
                    }
                    setLastSubmittedCommand(modalCommand);
                    setCommandSent(true);
                    setShowConfirmModal(false);
                    setModalCommand(null);
                } catch (err) {
                    setCommandError(String(err?.message || err));
                    setShowConfirmModal(false);
                    setModalCommand(null);
                } finally {
                    setConfirmBusy(false);
                }
            };

            const modalDismiss = () => {
                if (confirmBusy) return;
                setShowConfirmModal(false);
                setModalCommand(null);
            };

            // Commands shown in the main grid — left col: revert options, right col: flow control
            const GRID_COMMANDS = [
                { command: "RESET_PHASE",     label: "Revert to Planner",  desc: "Full reset: git rewind, new plan, re-run from the top.",      capped: true  },
                { command: "SKIP",            label: "Skip",               desc: "Mark this phase skipped and advance to the next.",            capped: false },
                { command: "RESET_EXECUTION", label: "Revert to Executor", desc: "Keep the plan. Re-run executor from a clean working tree.",   capped: true  },
                { command: "PROCEED",         label: "Proceed",            desc: "Accept current output as-is and advance (skips merge).",      capped: false },
                { command: "RESET_REVIEWER",  label: "Revert to Reviewer", desc: "Keep executor output. Re-run reviewer from scratch.",         capped: true  },
                { command: "STOP",            label: "Stop",               desc: "Halt the pipeline. No further phases will run.",              capped: false },
            ];

            const renderGridButton = ({ command, label, desc, capped }) => {
                const disabled = capped && isResetDisabled;
                const baseClass = "flex flex-col items-start text-left px-3 py-2 rounded bg-[#1a1d21] transition-colors";
                const cls = disabled
                    ? `${baseClass} opacity-50 cursor-not-allowed`
                    : `${baseClass} hover:bg-[#252830]`;
                const title = disabled
                    ? "Reset cap reached (3/3). Use Proceed or Stop to advance or halt. Cap prevents infinite reset loops; fix the repo manually if needed."
                    : undefined;
                return (
                    <button
                        key={command}
                        className={cls}
                        disabled={disabled}
                        title={title}
                        onClick={disabled ? undefined : () => handleCommand(command)}
                    >
                        <span className="header-text text-sm font-medium">{label}</span>
                        <span className="text-slate-400 text-xs mt-0.5 leading-snug">{desc}</span>
                    </button>
                );
            };

            const handleRestartOrchestrator = async () => {
                setRestartError("");
                setRestartBusy(true);
                try {
                    const r = await fetch("/api/resume-orchestrator", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    if (typeof onResumeOrchestratorResponse === "function") {
                        onResumeOrchestratorResponse(d, { ok: r.ok, status: r.status });
                    }
                    if (!r.ok) {
                        if (r.status === 503 && d && d.reconciled === true) {
                            setRestartError("");
                        } else {
                            setRestartError(
                                formatResumeOrchestratorError(d, r.status) || `Restart failed (${r.status})`
                            );
                        }
                        return;
                    }
                    if (typeof onOrchestratorRestarted === "function") onOrchestratorRestarted();
                } catch (err) {
                    setRestartError(String(err?.message || err));
                } finally {
                    setRestartBusy(false);
                }
            };

            const restartOrchestratorButton = (
                <button
                    type="button"
                    onClick={() => !restartBusy && handleRestartOrchestrator()}
                    disabled={restartBusy}
                    className="header-text mt-2 w-full px-3 py-2 text-xs rounded bg-cyan-950 hover:bg-cyan-900 text-cyan-200 border border-cyan-800 transition-colors disabled:opacity-50"
                >
                    {restartBusy ? "Restarting…" : "Restart Orchestrator"}
                </button>
            );

            return (
                <div className="border-2 border-orange-500 rounded-lg p-4 mt-4 bg-[#141618]/50">
                    <h3 className="header-text text-sm font-semibold text-orange-400 mb-1">
                        {headerText}
                    </h3>
                    {orchestratorDownBlocksCommands ? (
                        <div className="mb-3 rounded border border-amber-700/50 bg-amber-950/30 p-2">
                            <p className="text-amber-600 text-xs leading-relaxed">
                                Orchestrator is not running. Use <strong className="font-semibold">Restart Orchestrator</strong> in the banner above; escalation commands stay hidden until the process is running again.
                            </p>
                        </div>
                    ) : null}
                    {escalation_message && !commandSent && (humanWait || queueHaltedEscalation) ? (
                        <p className="text-slate-300 text-xs mb-3 leading-relaxed">
                            {escalation_message}
                        </p>
                    ) : null}
                    {!humanWait && showConfirmModal && !commandSent ? (
                        <p className="text-amber-400/90 text-xs mb-3 leading-relaxed">
                            Status is no longer &quot;waiting for human&quot; on the last poll. You can still confirm — the server accepts the command only if the orchestrator is still in that state.
                        </p>
                    ) : null}
                    {isResetDisabled && !commandSent ? (
                        <p className="text-amber-500 text-xs mb-3">
                            Reset cap reached (3/3). Revert to Planner, Revert to Executor, and Revert to Reviewer are
                            disabled. Use Proceed to advance or Stop to halt. Cap prevents infinite reset loops; fix the
                            repo manually if the phase is stuck.
                        </p>
                    ) : null}
                    {commandErrParts ? (
                        <div className="mb-2 space-y-1">
                            <p className="text-red-400 text-xs">{commandErrParts.friendly}</p>
                            {commandErrParts.technical ? (
                                <p className="text-slate-500 text-xs font-mono leading-snug">
                                    {commandErrParts.technical}
                                </p>
                            ) : null}
                        </div>
                    ) : null}
                    {commandSent ? (
                        <div className="text-center py-4 space-y-2">
                            <span className="text-amber-400 text-sm block">
                                {lastSubmittedCommand === "STOP"
                                    ? "STOP submitted — pipeline will halt after the current agent finishes."
                                    : `${lastSubmittedCommand} submitted — waiting for orchestrator to apply it.`}
                            </span>
                            {!orchestrator_alive ? (
                                <div className="space-y-1">
                                    <span className="text-amber-600 text-xs block">
                                        Orchestrator is not running — restart it for this command to take effect.
                                    </span>
                                    {restartOrchestratorButton}
                                    {restartError ? (
                                        <p className="header-text text-xs text-red-400">{restartError}</p>
                                    ) : null}
                                </div>
                            ) : null}
                        </div>
                    ) : canIssueCommands && !orchestratorDownBlocksCommands ? (
                        <div className="grid grid-cols-2 gap-2">
                            {GRID_COMMANDS.map(renderGridButton)}
                        </div>
                    ) : showConfirmModal ? (
                        <p className="text-slate-500 text-xs">Finish confirmation below, or cancel.</p>
                    ) : null}
                    {showConfirmModal && (
                        <ConfirmationModal
                            command={modalCommand}
                            onConfirm={modalConfirm}
                            onDismiss={modalDismiss}
                            busy={confirmBusy}
                        />
                    )}
                </div>
            );
        }

        // ─── PipelineCompletePanel ────────────────────────────────────────────────

        function PipelineCompletePanel({ roadmap, metricsSummary }) {
            const completeCount = roadmap ? roadmap.filter(p => p.status === 'complete').length : 0;
            const totalCount = roadmap ? roadmap.length : 0;

            return (
                <div className="space-y-4">
                    <div className="flex items-center gap-3">
                        <span className="text-2xl text-emerald-400">✓</span>
                        <div>
                            <h3 className="header-text text-base font-semibold text-emerald-400">Pipeline Complete</h3>
                            <p className="text-slate-400 text-xs">{completeCount} of {totalCount} phases completed</p>
                        </div>
                    </div>

                    {metricsSummary && (
                        <>
                            <div className="grid grid-cols-2 gap-2 pt-1">
                                <div className="bg-[#1a1d21] rounded p-2">
                                    <div className="text-slate-500 text-xs mb-0.5">Phases</div>
                                    <div className="header-text text-lg font-semibold text-slate-200">{metricsSummary.total_phases}</div>
                                </div>
                                <div className="bg-[#1a1d21] rounded p-2">
                                    <div className="text-slate-500 text-xs mb-0.5">Duration</div>
                                    <div className="header-text text-lg font-semibold text-slate-200">{formatDuration(metricsSummary.total_duration_seconds)}</div>
                                </div>
                                <div className="bg-[#1a1d21] rounded p-2">
                                    <div className="text-slate-500 text-xs mb-0.5">Exec Attempts</div>
                                    <div className="header-text text-lg font-semibold text-slate-200">{metricsSummary.total_executor_attempts}</div>
                                </div>
                                <div className="bg-[#1a1d21] rounded p-2">
                                    <div className="text-slate-500 text-xs mb-0.5">Escalations</div>
                                    <div className="header-text text-lg font-semibold text-slate-200">{metricsSummary.total_escalations}</div>
                                </div>
                            </div>

                            {metricsSummary.phases && metricsSummary.phases.length > 0 && (
                                <div>
                                    <div className="text-slate-500 text-xs mb-1 header-text uppercase tracking-wide">Per-phase</div>
                                    <div className="overflow-y-auto max-h-32 border border-[#1a1d21] rounded">
                                        {metricsSummary.phases.map((phase, idx) => (
                                            <div key={idx} className="flex items-center gap-3 px-2 py-1.5 text-xs border-b border-[#1a1d21] last:border-b-0">
                                                <span className="header-text font-semibold text-slate-300 w-14 flex-shrink-0">{phase.phase}</span>
                                                <span className="text-slate-500 w-10 flex-shrink-0">{formatDuration(phase.duration_seconds)}</span>
                                                <span className="text-slate-500">{phase.executor_attempts}x exec</span>
                                                {phase.blame_fires > 0 && (
                                                    <span className="text-amber-600 ml-auto">{phase.blame_fires} blame</span>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        // ─── Stopped resume flow (shared: header Resume + StoppedRecoveryPanel) ───

        async function runStoppedResumeFlow(command) {
            const rr = await fetch("/api/resume-ready", { method: "POST" });
            const rd = await rr.json().catch(() => ({}));
            if (!rr.ok) {
                const msg =
                    typeof rd.detail === "string" ? rd.detail : `Resume-ready failed (${rr.status})`;
                return { ok: false, error: msg };
            }
            const cr = await fetch("/api/command", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command }),
            });
            const cd = await cr.json().catch(() => ({}));
            if (!cr.ok) {
                const msg =
                    typeof cd.detail === "string" ? cd.detail : `Command failed (${cr.status})`;
                return { ok: false, error: msg };
            }
            const orch = await fetch("/api/resume-orchestrator", { method: "POST" });
            const od = await orch.json().catch(() => ({}));
            if (!orch.ok) {
                return {
                    ok: false,
                    error: formatResumeOrchestratorError(od, orch.status),
                    resumeOrch: { body: od, fetchOk: orch.ok, status: orch.status },
                };
            }
            return {
                ok: true,
                resumeOrch: { body: od, fetchOk: orch.ok, status: orch.status },
            };
        }

        // ─── StoppedRecoveryPanel ─────────────────────────────────────────────────

        function StoppedRecoveryPanel({
            current_phase_raw_id,
            escalation_resets,
            onResumeSent,
            onResumeOrchestratorResponse,
        }) {
            const [sent, setSent] = useState(false);
            const [flowError, setFlowError] = useState("");
            const isCapReached = (escalation_resets || 0) >= 3;

            const handleResume = async (command) => {
                setFlowError("");
                try {
                    const result = await runStoppedResumeFlow(command);
                    if (result.resumeOrch && typeof onResumeOrchestratorResponse === "function") {
                        onResumeOrchestratorResponse(result.resumeOrch.body, {
                            ok: result.resumeOrch.fetchOk,
                            status: result.resumeOrch.status,
                        });
                    }
                    if (!result.ok) {
                        setFlowError(result.error || "Resume failed");
                        return;
                    }
                    setSent(true);
                    if (typeof onResumeSent === "function") onResumeSent();
                } catch (e) {
                    setFlowError(String(e?.message || e));
                }
            };

            const RESUME_OPTIONS = [
                {
                    command: 'RETRY',
                    label: 'Resume',
                    desc: 'Continue from where it stopped',
                    capped: false,
                },
                {
                    command: 'RESET_EXECUTION',
                    label: 'Reset Execution',
                    desc: 'Keep the plan, retry execution from scratch',
                    capped: true,
                },
                {
                    command: 'RESET_PHASE',
                    label: 'Reset Phase',
                    desc: 'Start the entire phase over from the beginning',
                    capped: true,
                },
            ];

            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-2">
                        <span className="text-red-400 text-lg">◼</span>
                        <div>
                            <h3 className="header-text text-base font-semibold text-red-400">Pipeline Stopped</h3>
                            {current_phase_raw_id && (
                                <p className="text-slate-400 text-xs">Stopped during phase <span className="font-mono text-slate-300">{current_phase_raw_id}</span></p>
                            )}
                        </div>
                    </div>

                    {sent ? (
                        <div className="text-center py-4">
                            <span className="text-amber-400 text-sm">Command sent — restarting orchestrator...</span>
                        </div>
                    ) : (
                        <div className="space-y-2 pt-1">
                            {RESUME_OPTIONS.map(({ command, label, desc, capped }) => {
                                const disabled = capped && isCapReached;
                                return (
                                    <button
                                        key={command}
                                        onClick={() => !disabled && handleResume(command)}
                                        disabled={disabled}
                                        title={
                                            disabled
                                                ? 'Reset cap reached — use Resume, or fix the repo manually in git. Cap prevents infinite reset loops.'
                                                : undefined
                                        }
                                        className={`w-full text-left px-3 py-2.5 rounded border transition-colors ${
                                            disabled
                                                ? 'border-[#1a1d21] bg-[#0f1012] text-slate-600 cursor-not-allowed'

                                                    ? 'border-emerald-800 bg-emerald-950/40 hover:bg-emerald-950/70 text-emerald-300'
                                                    : 'border-[#1a1d21] bg-[#1a1d21]/50 hover:bg-[#252830] text-slate-300'
                                        }`}
                                    >
                                        <div className="header-text text-xs font-semibold mb-0.5">{label}</div>
                                        <div className="text-xs text-slate-500">{desc}</div>
                                    </button>

                            {isCapReached && (
                                <p className="text-xs text-amber-600 pt-1">Reset cap reached (3/3) — only Resume is available.</p>
                            )}
                            {flowError ? (
                                <div className="header-text text-xs text-red-400 mt-1 space-y-1">
                                    <span className="block">{splitApiDetail(flowError).friendly}</span>
                                    {splitApiDetail(flowError).technical ? (

                    )}

            );
        }

        // ─── Activity Feed ────────────────────────────────────────────────────────

        function EventRow({ event, isExpanded, onToggle, isNew }) {

        function EscalationLogPanel({ events }) {
            function pairEscalations(allEvents) {
                const triggers = allEvents.filter(e => e.event_type === 'escalation_trigger');
                const resolves = allEvents.filter(e => e.event_type === 'escalation_resolve');
                const pairs = [];
                for (const trigger of triggers) {
                    const phase = trigger.phase;
                    const matchingResolve = resolves.find(r =>
                        r.phase === phase &&
                        r.ts && trigger.ts &&
                        new Date(r.ts) > new Date(trigger.ts)
                    );
                    pairs.push({ trigger, resolve: matchingResolve || null, phase });
                }
                return pairs.sort((a, b) => {
                    const aTs = a.trigger.ts || a.trigger.timestamp || '';
                    const bTs = b.trigger.ts || b.trigger.timestamp || '';
                    return bTs.localeCompare(aTs);
                });
            }
            
            const pairedEscalations = pairEscalations(events);
            
            if (!pairedEscalations || pairedEscalations.length === 0) {
                return (
                    <div className="text-slate-500 italic text-sm">No escalations recorded in this session.</div>
                );
            }
            
            function formatTime(ts) {
                if (!ts) return '—';
                const tsStr = ts.ts || ts.timestamp || ts;
                return tsStr.slice(11, 16);
            }
            
            function calculateDuration(triggerTs, resolveTs) {
                if (!triggerTs) return '—';
                const trigger = new Date(triggerTs);
                const resolve = resolveTs ? new Date(resolveTs) : new Date();
                const diffMs = resolve - trigger;
                if (diffMs < 0) return '—';
                const mins = Math.floor(diffMs / 60000);
                const secs = Math.floor((diffMs % 60000) / 1000);
                return `${mins}m ${String(secs).padStart(2, '0')}s`;
            }
            
            return (
                <div className="space-y-2">
                    {pairedEscalations.map((pair, index) => {
                        const trigger = pair.trigger;
                        const resolve = pair.resolve;
                        const isInProgress = !resolve;
                        return (
                            <div key={index} className="p-3 bg-[#141618] rounded border border-[#1a1d21]">
                                <div className="flex items-center gap-3 mb-2">
                                    <span className="header-text text-sm font-semibold text-slate-300">
                                        {pair.phase || '—'}
                                    </span>
                                    {isInProgress ? (
                                        <span className="px-2 py-0.5 rounded text-xs font-medium bg-orange-600 text-white">In Progress</span>
                                    ) : (
                                        <span className="px-2 py-0.5 rounded text-xs font-medium bg-green-600 text-white">Resolved</span>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div>
                                        <span className="text-slate-500">Triggered:</span>
                                        <span className="font-mono text-slate-300 ml-2">{formatTime(trigger)}</span>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Reason:</span>
                                        <span className="text-slate-300 ml-2">{trigger.detail || '—'}</span>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Command:</span>
                                        <span className="text-slate-300 ml-2">
                                            {isInProgress ? 'Awaiting command...' : (resolve.detail || '—')}
                                        </span>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Resolved:</span>
                                        <span className="font-mono text-slate-300 ml-2">
                                            {isInProgress ? 'Awaiting command...' : formatTime(resolve)}
                                        </span>
                                    </div>
                                    <div className="col-span-2">
                                        <span className="text-slate-500">Duration:</span>
                                        <span className="text-slate-300 ml-2">
                                            {isInProgress ? 'In progress...' : calculateDuration(trigger.ts || trigger.timestamp, resolve.ts || resolve.timestamp)}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function ActivityFeedPanel() {
            const [events, setEvents] = useState([]);
            const [expandedEventId, setExpandedEventId] = useState(null);
            const [newEventIds, setNewEventIds] = useState(new Set());
            const [activityTab, setActivityTab] = useState('activity');
            const eventSourceRef = useRef(null);
            const pollingIntervalRef = useRef(null);
            const isUsingSSE = useRef(true);

            useEffect(() => {
                fetchEvents();
                setupSSE();
                return () => {
                    if (eventSourceRef.current) eventSourceRef.current.close();
                    if (pollingIntervalRef.current) clearInterval(pollingIntervalRef.current);
                };
            }, []);

            function setupSSE() {
                try {
                    const eventSource = new EventSource('/api/events/stream');
                    eventSourceRef.current = eventSource;
                    eventSource.onmessage = (event) => {
                        if (event.type === 'heartbeat' || !event.data || event.data === '{}') return;
                        try {
                            const newEvent = JSON.parse(event.data);
                            const eventTs = newEvent.ts || newEvent.timestamp;
                            if (newEvent && newEvent.id) {
                                setEvents(prevEvents => {
                                    const isDuplicate = prevEvents.some(e => {
                                        const existingTs = e.ts || e.timestamp;
                                        return existingTs && eventTs && existingTs === eventTs;
                                    });
                                    if (isDuplicate) return prevEvents;
                                    setNewEventIds(prev => new Set([...prev, newEvent.id]));
                                    setTimeout(() => {
                                        setNewEventIds(prev => {
                                            const next = new Set(prev);
                                            next.delete(newEvent.id);
                                            return next;
                                        });
                                    }, 350);
                                    return [newEvent, ...prevEvents];
                                });
                            }
                        } catch (e) {
                            console.log('Failed to parse SSE event:', e);
                        }
                    };
                    eventSource.onerror = () => {
                        console.log('SSE connection error, falling back to polling');
                        eventSource.close();
                        isUsingSSE.current = false;
                        startPollingFallback();
                    };
                } catch (err) {
                    console.log('Failed to create EventSource, using polling fallback');
                    startPollingFallback();
                }
            }

            function startPollingFallback() {
                if (pollingIntervalRef.current) return;
                pollingIntervalRef.current = setInterval(() => { fetchEventsPolling(); }, 5000);
                const reconnectInterval = setInterval(() => {
                    if (!isUsingSSE.current) {
                        isUsingSSE.current = true;
                        setupSSE();
                        if (eventSourceRef.current) {
                            clearInterval(pollingIntervalRef.current);
                            pollingIntervalRef.current = null;
                            clearInterval(reconnectInterval);

            function fetchEventsPolling() {
                fetch('/api/events?limit=30')
                    .then(res => res.json())
                    .then(data => {
                        if (data.events && Array.isArray(data.events)) {
                            setEvents(prevEvents => {
                                const existingTs = new Set(prevEvents.map(e => e.ts || e.timestamp));
                                const newEvents = data.events.filter(e => {
                                    const ts = e.ts || e.timestamp;
                                    if (existingTs.has(ts)) return false;
                                    existingTs.add(ts);
                                    return true;
                                });
                                if (newEvents.length === 0) return prevEvents;

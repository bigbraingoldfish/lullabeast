<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDev Pipeline</title>
    
    <!-- Google Fonts: JetBrains Mono for headers, IBM Plex Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React and ReactDOM UMD -->
    <script src="/static/react.min.js"></script>
    <script src="/static/react-dom.min.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="/static/babel.min.js"></script>
    <script src="/static/marked.min.js"></script>
    <script src="/static/diff.min.js"></script>

    <!-- Tailwind CSS via Play CDN -->
    <script src="/static/tailwind.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'header': ['"JetBrains Mono"', 'monospace'],
                        'body': ['"IBM Plex Sans"', 'sans-serif'],
                    },
                    colors: {
                        'header-bg': '#1e293b',
                        'panel-bg': '#141618',
                        'accent': '#00b4d8',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #0d0f12;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #app-root {
            height: 100vh;
            overflow: hidden;
        }
        .header-text {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Amber pulse — legacy non-pipeline indicators (e.g. stopping) */
        @keyframes amber-pulse {
            0%, 100% {
                background-color: #f59e0b;
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }
            50% {
                background-color: #fbbf24;
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
            }
        }

        /* Teal pulse — pipeline RUNNING only (active compute) */
        @keyframes teal-pulse {
            0%, 100% {
                background-color: #0d9488;
                box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.55);
            }
            50% {
                background-color: #14b8a6;
                box-shadow: 0 0 0 8px rgba(20, 184, 166, 0);
            }
        }

        .status-pulse {
            animation: amber-pulse 2s ease-in-out infinite;
        }

        .run-pulse {
            animation: teal-pulse 2s ease-in-out infinite;
        }


        /* L-28: in-flight attempt cell only — subtle opacity pulse */
        @keyframes agent-attempt-inflight-pulse {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 1; }
        }
        .agent-attempt-cell--inflight {
            animation: agent-attempt-inflight-pulse 2.75s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .agent-attempt-cell--inflight {
                animation: none;
                opacity: 1;
            }
        }

        /* Fade-in animation for new event rows */
        @keyframes fade-in-row {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-row-fade-in {
            animation: fade-in-row 0.3s ease-out forwards;
        }
        
        /* Event row hover states and transitions */
        .event-row {
            transition: background-color 0.15s ease-in-out;
        }
        .event-row:hover {
            background-color: rgba(51, 65, 85, 0.5);
        }

        /* Shared markdown rendering for conversation and document panes */
        .msg-md h1, .msg-md h2, .msg-md h3, .msg-md h4 {
            font-weight: 600;
            margin: 0.65em 0 0.35em;
        }
        /* h2 = top-level category grouper in PRD sections → white */
        .msg-md h1, .msg-md h2 { color: #e2e8f0; }
        /* h3/h4 = actual subsection headers → slate (teal reserved for section labels only) */
        .msg-md h3, .msg-md h4 { color: #94a3b8; margin: 0.9em 0 0.4em; }
        .msg-md h1 { font-size: 1.2rem; }
        .msg-md h2 { font-size: 1.05rem; }
        .msg-md h3 { font-size: 0.98rem; }
        .msg-md p, .msg-md li, .msg-md blockquote {
            color: #e2e8f0;
            margin: 0.5em 0;
            line-height: 1.45;
        }
        .msg-md em { color: #64748b; }
        .msg-md ul, .msg-md ol { margin: 0.5em 0; padding-left: 1.25rem; }
        .msg-md code {
            background: #2a2d31;
            color: #e2e8f0;
            padding: 0.1em 0.35em;
            border-radius: 0.25rem;
            font-size: 0.85em;
        }
        .msg-md pre {
            background: #1a1d21;
            padding: 0.75rem;
            border-radius: 0.35rem;
            overflow-x: auto;
            margin: 0.5em 0;
            border: 1px solid #2a2d31;
        }
        .msg-md pre code { background: transparent; padding: 0; color: #e2e8f0; }
        .msg-md a { color: #00b4d8; }
        .msg-md table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.6em 0;
            border: 1px solid #2a2d31;
            background: #141618;
        }
        .msg-md th, .msg-md td {
            border: 1px solid #2a2d31;
            padding: 0.4rem 0.5rem;
            text-align: left;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
        .msg-md th { background: #1a1d21; color: #cbd5e1; }

        /* ── Dark-theme scrollbars (Webkit / Blink) ──────────────────────────
           Overlay style: just the thumb — no track, no arrow buttons.
           Auto-hide: the thumb is transparent at rest and only fades in
           while the pointer is over the scrollable region (#2a2d31), then
           brightens when the pointer is over the thumb itself (#3d4249).
           Firefox: thin bar with a transparent track via scrollbar-color
           (Firefox exposes no CSS hook to auto-hide, so there it stays
           subtly visible rather than disappearing).
        ─────────────────────────────────────────────────────────────────────── */
        * {
            scrollbar-width: thin;
            scrollbar-color: #2a2d31 transparent;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
            background: transparent;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        :hover::-webkit-scrollbar-thumb {
            background: #2a2d31;
        }
        :hover::-webkit-scrollbar-thumb:hover {
            background: #3d4249;
        }

        /* Chats rail: scrollbar overlays content (no reserved gutter in Chromium).
           Thumb visibility now comes from the global auto-hide rules above. */
        .sidebar-scroll {
            overflow-y: auto;
            overflow-y: overlay;
        }
    </style>
</head>
<body>
    <div id="app-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;
        const AppCtx = createContext(null);

        /** Relative time for idea list (from API `updated` ISO string). */
        function relativeTime(dateStr) {
            if (!dateStr) return "—";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "—";
            const diffMs = Date.now() - d.getTime();
            const min = Math.floor(diffMs / 60000);
            const hr = Math.floor(min / 60);
            const day = Math.floor(hr / 24);
            if (min < 1) return "< 1 min ago";
            if (min < 60) return `${min} min ago`;
            if (hr < 24) return `${hr} hr ago`;
            if (day < 7) return `${day} day${day === 1 ? "" : "s"} ago`;
            return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        }

        /** Short label for preflight last-run timestamp. */
        function relativeTimeShort(d) {
            if (!(d instanceof Date) || Number.isNaN(d.getTime())) return "";
            const diffMs = Date.now() - d.getTime();
            const min = Math.floor(diffMs / 60000);
            const hr = Math.floor(min / 60);
            if (min < 1) return "just now";
            if (min < 60) return `${min} min ago`;
            if (hr < 24) return `${hr} hr ago`;
            return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        }
        
        // ─── Unified pipeline + queue status pills (pipeline > queue for primary pill) ───
        const PIPELINE_BLOCKED_TOOLTIP = 'Pipeline execution is blocked';
        const QUEUE_BLOCKED_TOOLTIP = 'Row is blocked in queue.';
        const QUEUE_CURRENT_TOOLTIP =
            'Active queue slot for this path. Live pipeline status is not available until the orchestrator runs here.';

        /** P3 queue-only row pill native titles (H-01–H-04). */
        const P3_QUEUE_ONLY_PILL_TITLES = {
            DEPENDENCY_HOLD: 'Blocked until the parent project completes. Clears automatically.',
            SKIPPED_PENDING:
                'Preflight failed for this row (or a parent); clears automatically when checks pass.',
            FAILED: 'Gate failed; retries exhausted. See phase state for the specific gate.',
            ESCALATION: 'Awaiting your decision in the active phase.',
            ESCALATION_ANSWERED: 'Your answer is banked. This project resumes when the queue reaches it again.',
        };

        /** P3: Depends on parent selector — set parent (H-05) + clear via None (H-06). */
        const P3_QUEUE_DEPENDS_ON_TITLE =
            'Overwrites any existing parent. Child enters Waiting on parent until the parent completes. ' +
            'Choose None: Removes parent and restores the entry to READY.';

        /** P3 Setup & Preflight button titles (H-08, H-09, H-12).
         * H-07 ("Required format check before Run Preflight.") was the title
         * on the Step 2 "Validate roadmap" button — removed by P0 Stage J.4
         * when Step 2 became a read-only summary card of the linked Project
         * Idea. */
        const P3_PREFLIGHT_TITLE_RUN_PREFLIGHT = 'Required before Launch.';
        const P3_PREFLIGHT_TITLE_RERUN_PREFLIGHT =
            'Runs the full preflight (symlink, .gitignore, workspace files, roadmap). Not the same as the lightweight queue check.';
        const P3_PREFLIGHT_TITLE_LAUNCH_NOW =
            'Creates phase branch and starts the orchestrator. Use Stop Pipeline to halt.';

        /** P3 PRD agent — readiness strip (H-15–H-16). */
        const P3_PRD_TITLE_READINESS_SCORE = 'PRD-agent score. 8+ recommended before Generate Roadmap.';
        const P3_PRD_TITLE_ROADMAP_CONFIDENCE = 'Agent confidence before roadmap generation.';

        const P3_PIPELINE_PHASE_RAW_ID_TITLE = 'Phase ID from roadmap.md.';
        const P3_ACTIVITY_TAB_TITLE =
            'Orchestrator + gate + webhook events on Activity tab; escalation-only on Escalation tab; live orchestrator log on Pipeline log tab.';
        const P3_STOPPED_RESUME_TITLE = 'Continues from the current agent in the current phase.';
        const P3_QUEUE_ADD_PATH_PLACEHOLDER = '/absolute/path/to/existing/git/repo';

        /** P3 Switch project dialog — native `title` on heading (H-27). Backend: POST /api/setup/switch-project. */
        const P3_SWITCH_PROJECT_MODAL_TITLE =
            'After preflight passes, switches the active project to this path. Stop the pipeline first unless repairing a missing or broken configured project path.';
        /** P3 Sidebar — Project Ideas nav button native `title` (H-28). */
        const P3_SIDEBAR_IDEAS_TAB_TITLE = 'Draft PRDs with the PRD agent.';

        /** P3 Activity feed — H-23 long titles for `gate_fail.detail.last_error_code` via `humanizeSummary` + row tooltips. */
        const P3_LAST_ERROR_CODE_DEFAULT_TITLE =
            'Something in the last pipeline step failed. See orchestrator or gate logs for details.';
        const P3_VALIDATION_FAILED_TITLES = {
            planner:
                "Planner Error: output didn’t pass validation. Retrying if attempts remain.",
            reviewer:
                "Reviewer Error: checks or review output didn’t pass. Next step is picked automatically (executor, planner, or escalation).",
        };
        const P3_VALIDATION_FAILED_FALLBACK_TITLE = 'Error: validation failed. See logs for what happens next.';
        const P3_LAST_ERROR_CODE_TITLES = {
            ERR_UNACCOUNTED_DELETION:
                "Executor Error: files were removed that weren’t part of the phase’s declared work. Discarded work. Attempting retry.",
            ERR_TESTS_FAILING: "Executor Error: tests failed. Discarded work. Attempting retry.",
            ERR_GIT_DIFF_FAILED:
                "Executor Error: a required Git check could not run in the project. Action required: fix Git in the working tree (corrupt repo, lock, or permissions) — the pipeline will not get past this step until Git commands succeed. Automatic retries alone will not fix a broken repository.",
            ERR_INFRA_FAILURE:
                "Reviewer output error: missing or unreadable review file. Retrying or recovering automatically.",
            ERR_PROVIDER_REJECTED:
                "Inference provider rejected the request \u2014 check your API key, credits, or rate limits, then restart the pipeline.",
            ERR_SESSION_DEAD_ON_ARRIVAL:
                "Inference provider rejected the session before it started \u2014 check your API key and provider status.",
            ERR_STATUS_NOT_COMPLETE:
                "Executor Error: the executor reported a status other than 'complete'. Discarded work. Attempting retry.",
            ERR_TDD_COVERAGE_MISMATCH:
                "Executor Error: the tests the plan required are missing from the execution output (TDD coverage mismatch). Discarded work. Attempting retry.",
            ERR_MANIFEST_FILE_MISSING:
                "Executor Error: a file listed in the change manifest was not found on disk. Discarded work. Attempting retry.",
            ERR_PATH_TRAVERSAL:
                "Executor Error: a manifest file path escaped the project directory and was blocked for safety. Discarded work. Attempting retry.",
            ERR_MISSING_BASE_COMMIT:
                "Executor Error: the phase base commit is unavailable, so file deletions cannot be verified. Action required: check the project's Git state.",
            ERR_BEHAVIORAL_ARTIFACTS_MISSING:
                "Executor Error: required behavioral smoke-test artifacts are missing or empty for a phase that requires them. Discarded work. Attempting retry.",
            ERR_VISUAL_UNVERIFIED:
                "Reviewer Error: visual verification artifacts are missing. Re-running the reviewer.",
            ERR_BEHAVIORAL_UNVERIFIED:
                "Reviewer Error: behavioral verification evidence is missing or insufficient. Re-running the reviewer.",
            ERR_REGRESSION_UNVERIFIED:
                "Reviewer Error: the prior-phase regression check could not be verified. Re-running the reviewer.",
            ERR_REGRESSION_PRIOR_PHASE:
                "Reviewer Error: this phase broke a feature from an earlier phase (regression is the only failing check). Sending back to the executor.",
        };

        function getLastErrorCodeTitle(errorCode, currentAgent) {
            if (!errorCode) return "";
            if (errorCode === "ERR_VALIDATION_FAILED") {
                const a = (currentAgent || "").toString().toLowerCase();
                if (a === "planner") return P3_VALIDATION_FAILED_TITLES.planner;
                if (a === "reviewer") return P3_VALIDATION_FAILED_TITLES.reviewer;
                return P3_VALIDATION_FAILED_FALLBACK_TITLE;
            }
            return P3_LAST_ERROR_CODE_TITLES[errorCode] || P3_LAST_ERROR_CODE_DEFAULT_TITLE;
        }

        /** Tailwind defaults for live pills — keep in sync with AGENT_ATTEMPT_DOT_HEX (dots use inline hex). */
        const PIPELINE_STATUS_PILL_HEX = {
            teal600: '#0d9488',
            red600: '#dc2626',
            successGreen: '#2DEB1E',
            slate600: '#475569',
        };

        /**
         * WAITING_FOR_SENTINEL: short label "Running" or "Running {Agent}" (title case) from `current_agent`.
         * No literal "(agent)"; agent name is optional when state is unknown.
         */
        function formatWaitForSentinelLabel(agentRaw) {
            const t = (agentRaw || '').toString().trim();
            if (!t) return 'Running';
            const lower = t.toLowerCase();
            const name = lower.charAt(0).toUpperCase() + lower.slice(1);
            return `Running ${name}`;
        }

        /** Live pipeline_status from GET /api/queue → single pill (shared with Pipeline Monitor header). */
        const PIPELINE_LIVE_PILL = {
            RUNNING: { label: 'RUNNING', className: 'bg-[#0d9488] text-white run-pulse', title: '' },
            WAITING_FOR_SENTINEL: { label: 'Running', className: 'bg-[#0d9488] text-white', title: '' },
            WAITING_FOR_HUMAN: { label: 'NEEDS YOUR INPUT', className: 'bg-orange-500 text-white', title: '' },
            HALTED_SILENT: {
                label: 'INTERVENTION REQUIRED',
                className: 'bg-red-600 text-white',
                title:
                    'Pipeline halted — escalation path failed; check orchestrator logs and project escalation_failed.json.',
            },
            BLOCKED: { label: 'BLOCKED', className: 'bg-red-600 text-white', title: PIPELINE_BLOCKED_TOOLTIP },
            PIPELINE_COMPLETE: {
                label: 'COMPLETE',
                className: 'bg-emerald-950 text-emerald-400 border border-emerald-700/60',
                title: '',
            },
            STOPPED: { label: 'STOPPED', className: 'bg-red-600 text-white', title: '' },
            QUEUE_HALTED: { label: 'Queue stalled', className: 'bg-amber-600 text-slate-900', title: '' },
            IDLE: { label: 'IDLE', className: 'bg-slate-600 text-slate-200', title: '' },
            UNKNOWN: { label: 'UNKNOWN', className: 'bg-slate-600 text-slate-200', title: '' },
        };

        /** POST /api/queue/trigger-next `queue_halted_reason` → one-line user message (L-07). */
        const QUEUE_HALTED_TRIGGER_MSG = {
            all_blocked: 'Queue stalled — No projects ready.',
            all_dependency_hold: 'Queue stalled — All waiting on parents.',
            mixed: 'Queue stalled — Multiple blockers.',
            all_completed: 'Queue stalled — No projects left to run.',
            answered_pending_revival: 'Banked answer ready — click Resume to continue.',
        };

        const STATE_LABELS = {
            ...Object.fromEntries(Object.entries(PIPELINE_LIVE_PILL).map(([k, v]) => [k, v.label])),
            COMPLETE: 'COMPLETE',
        };

        const STATE_CLASSES = Object.fromEntries(
            Object.entries(PIPELINE_LIVE_PILL).map(([k, v]) => [k, v.className])
        );

        /** Queue-only row states when live_pipeline_status is null (no global state for this path). */
        function queueOnlyRowPill(state) {
            const q = {
                READY: { label: 'READY', className: 'bg-slate-600 text-slate-200', title: '' },
                ACTIVE: { label: 'ACTIVE', className: 'bg-slate-600 text-slate-200', title: QUEUE_CURRENT_TOOLTIP },
                BLOCKED: { label: 'QUEUE BLOCKED', className: 'bg-amber-600 text-slate-900', title: QUEUE_BLOCKED_TOOLTIP },
                SKIPPED_PENDING: {
                    label: 'Preflight failed',
                    className: 'bg-indigo-900 text-indigo-200',
                    title: P3_QUEUE_ONLY_PILL_TITLES.SKIPPED_PENDING,
                },
                DEPENDENCY_HOLD: {
                    label: 'Waiting on parent',
                    className: 'bg-orange-600 text-white',
                    title: P3_QUEUE_ONLY_PILL_TITLES.DEPENDENCY_HOLD,
                },
                ESCALATION: {
                    label: 'ESCALATION',
                    className: 'bg-amber-500 text-slate-900',
                    title: P3_QUEUE_ONLY_PILL_TITLES.ESCALATION,
                },
                ESCALATION_ANSWERED: {
                    label: 'Answer banked',
                    className: 'bg-sky-700 text-sky-100',
                    title: P3_QUEUE_ONLY_PILL_TITLES.ESCALATION_ANSWERED,
                },
                COMPLETED: { label: 'COMPLETED', className: 'bg-emerald-800 text-emerald-200', title: '' },
                FAILED: {
                    label: 'FAILED',
                    className: 'bg-red-700 text-white',
                    title: P3_QUEUE_ONLY_PILL_TITLES.FAILED,
                },
            };
            const row = q[state];
            if (row) return { ...row };
            return { label: state || '', className: 'bg-slate-700 text-white', title: '' };
        }

        /** Parent state mini-pill in dependency panel — same colors as queue-only mapping. */
        function queueParentStatePill(state) {
            const disp = queueOnlyRowPill(state);
            return { label: disp.label, className: disp.className, title: disp.title };
        }

        /** Primary queue list/detail pill: live pipeline_status overrides queue row state. */
        function queueRowDisplay(entry) {
            if (!entry) return { label: '', className: 'bg-slate-700 text-white', title: '' };
            // P1 Stage H — a parked entry whose answer is banked reads "Answer banked" regardless of
            // a stale live_pipeline_status (a parked WAITING_FOR_HUMAN or a global QUEUE_HALTED would
            // otherwise mask it). Covers both the promoted ESCALATION_ANSWERED state and an
            // ESCALATION row banked while the orchestrator was dead (not yet promoted).
            if (entry.state === 'ESCALATION_ANSWERED' || (entry.state === 'ESCALATION' && entry.has_banked_answer)) {
                return queueOnlyRowPill('ESCALATION_ANSWERED');
            }
            const live = entry.live_pipeline_status;
            if (live != null && live !== '') {
                if (live === 'WAITING_FOR_SENTINEL') {
                    const meta = PIPELINE_LIVE_PILL[live];
                    if (!meta) {
                        return { label: 'Running', className: 'bg-slate-600 text-slate-200', title: '' };
                    }
                    return {
                        label: formatWaitForSentinelLabel(entry.live_current_agent),
                        className: meta.className,
                        title: meta.title || '',
                    };
                }
                const meta = PIPELINE_LIVE_PILL[live];
                if (meta) return { label: meta.label, className: meta.className, title: meta.title || '' };
                return { label: String(live), className: 'bg-slate-600 text-slate-200', title: '' };
            }
            // Row ACTIVE in queue file but path does not match global pipeline_state (defensive).
            if (entry.state === 'ACTIVE') {
                return {
                    label: 'ACTIVE (stale)',
                    className: 'bg-slate-700 text-slate-400',
                    title: 'Queue row is ACTIVE but does not match the current pipeline project_path.',
                };
            }
            return queueOnlyRowPill(entry.state);
        }

        /** True when any queue row's live_pipeline_status is an in-flight pipeline (B-02). Not queue row ACTIVE alone. */
        function queueEntriesHaveBusyLivePipeline(entries) {
            const busy = new Set(["RUNNING", "WAITING_FOR_SENTINEL", "WAITING_FOR_HUMAN"]);
            return (entries || []).some((e) => busy.has(e && e.live_pipeline_status));
        }

        /** P0-01: first-run default screen — Ideas when pipeline is not running and queue has no in-flight live status. */
        function shouldOpenIdeasOnColdBootstrap(pipelineStatus, queueEntries) {
            const ps = pipelineStatus || "";
            const idleLike = ps === "IDLE" || ps === "UNKNOWN";
            if (!idleLike) return false;
            return !queueEntriesHaveBusyLivePipeline(queueEntries);
        }

        const AGENT_COLORS = {
            'PLANNER': 'bg-[#1a1d21] text-white',
            'EXECUTOR': 'bg-emerald-600 text-white',
            'REVIEWER': 'bg-[#00b4d8] text-white',
            'ESCALATION': 'bg-amber-600 text-white'
        };

        // ─── Helper functions ─────────────────────────────────────────────────────

        function getGoalForPhase(phaseId, roadmap) {
            if (!phaseId || !roadmap || !Array.isArray(roadmap)) return null;
            const phase = roadmap.find(p => p.id === phaseId);
            return phase ? phase.goal : null;
        }

        function isRoadmapPhaseComplete(phaseId, roadmap) {
            if (!phaseId || !roadmap || !Array.isArray(roadmap)) return false;
            const phase = roadmap.find(p => p.id === phaseId);
            return !!(phase && phase.status === 'complete');
        }
        
        function getStatusIcon(status) {
            switch (status) {
                case 'complete': return '✓';
                case 'in_progress': return '▶';
                case 'pending': return '○';
                case 'skipped': return '⊘';
                case 'blocked': return '⚠';
                default: return '○';
            }
        }

        function getStatusClasses(status) {
            switch (status) {
                case 'complete': return 'opacity-60 text-slate-400';
                case 'in_progress': return 'border-l-4 border-cyan-500 bg-[#141618]/50';
                case 'blocked': return 'bg-red-900/30 border-l-4 border-red-600';
                case 'skipped': return 'opacity-50 text-slate-500';
                default: return 'text-slate-300';
            }
        }

        function getEventBadgeColor(eventType) {
            const raw = (eventType || '').toLowerCase();
            switch (raw) {
                case 'gate_pass': return 'bg-green-600 text-white';
                case 'gate_fail': return 'bg-amber-600 text-white';
                case 'escalation_trigger': return 'bg-orange-600 text-white';
                case 'escalation_resolve': return 'bg-blue-600 text-white';
                case 'phase_complete': return 'bg-green-600 text-white';
                case 'status_changed': return 'bg-slate-600 text-white';
                // P1 Stage F — advisory reachability events. Yellow for findings
                // (visible signal worth attention but never blocking); slate for
                // "consciously skipped" (test-runner entry) so it reads as
                // informational, not a problem.
                case 'reachability_warning': return 'bg-yellow-500 text-black';
                case 'reachability_not_applicable': return 'bg-slate-500 text-white';
                // Phase 3 (gate-feedback methodology) — demoted interpretive
                // checks surfaced as non-blocking warnings. Yellow like
                // reachability_warning: visible and attention-worthy, never blocking.
                case 'gate_warning': return 'bg-yellow-500 text-black';
                // Section 6 diagnostic event family — operator-specified
                // purple so poll / abort / verdict / setup events read as
                // one cohesive group in the Activity Feed.
                case 'poll_start':
                case 'poll_outcome':
                case 'attempt_end':
                case 'abort_attempted':
                case 'abort_verify_failed':
                case 'reviewer_verdict':
                case 'stamp_init_failed':
                    return 'bg-[#764cc5] text-white';
                // Recoverable safety-heal (garbage resume command -> defaulted to STOP):
                // amber warning family so it reads as "attention, recoverable", not the
                // dark default badge.
                case 'escalation_command_invalid': return 'bg-amber-600 text-white';
                // Phase 2 — SILENT lifecycle/destructive events. nuclear_reset is the only
                // truly destructive one (red, stronger than amber gate_fail); queue_halted is
                // attention/recoverable (amber); revival is positive (green); park/hold are
                // neutral lifecycle (slate).
                case 'nuclear_reset': return 'bg-red-700 text-white';
                case 'queue_halted': return 'bg-amber-600 text-white';
                case 'queue_parked': return 'bg-slate-600 text-white';
                case 'queue_revived': return 'bg-green-600 text-white';
                case 'dependency_hold': return 'bg-slate-500 text-white';
                default: return 'bg-[#1a1d21] text-white';
            }
        }

        const EVENT_TYPE_DISPLAY = {
            gate_pass: 'Passed',
            gate_fail: 'Failed',
            escalation_trigger: 'Escalated',
            escalation_resolve: 'Resolved',
            phase_complete: 'Complete',
            status_changed: 'Updated',
            // Section 6 diagnostic events — purple family, single-word labels so
            // the badge column stays one line.  Hover descriptions in
            // EVENT_TYPE_DESCRIPTION below explain each one.
            poll_start: 'Watching',
            poll_outcome: 'Poll End',
            attempt_end: 'Attempt',
            abort_attempted: 'Abort',
            abort_verify_failed: 'Verify Fail',
            reviewer_verdict: 'Verdict',
            stamp_init_failed: 'Setup Fail',
            escalation_command_invalid: 'Invalid Command',
            // P1 Stage F — advisory reachability events.
            reachability_warning: 'Reach Warn',
            reachability_not_applicable: 'Reach N/A',
            // Phase 3 — demoted gate checks surfaced as advisory warnings.
            gate_warning: 'Gate Warn',
            // Phase 2 — SILENT lifecycle/destructive events.
            nuclear_reset: 'Nuclear Reset',
            queue_halted: 'Queue Halted',
            queue_parked: 'Parked',
            queue_revived: 'Revived',
            dependency_hold: 'Dep Hold',
        };

        // Hover descriptions for each event type (rendered as the badge
        // ``title=`` tooltip).  Section 6 diagnostic events have full
        // descriptions because their short labels ("Attempt", "Verdict") are
        // intentionally compact and need context on hover.
        const EVENT_TYPE_DESCRIPTION = {
            gate_pass: 'A gate (reviewer) passed and the phase is advancing.',
            gate_fail: 'A gate rejected an agent\'s output — see detail for the routing decision.',
            escalation_trigger: 'Pipeline halted for human intervention. See escalation panel.',
            escalation_resolve: 'A human operator resolved the escalation with a resume command.',
            phase_complete: 'Phase merged to base and the canonical metrics row was written.',
            status_changed: 'The pipeline state file was updated (status / agent / phase transition).',
            poll_start: 'Orchestrator began polling for this agent\'s completion sentinel. Detail lists the active stall threshold and startup grace.',
            poll_outcome: 'Polling ended. Detail.reason is one of succeeded / stalled / no_first_activity / stopped / timeout.',
            attempt_end: 'One agent attempt finished. Dense summary mirroring the [ATTEMPT_END] log line.',
            abort_attempted: 'Orchestrator called abort_agent_session on the prior session. Detail.result is "ok" or "FAILED".',
            abort_verify_failed: 'Gateway acknowledged the abort but the agent kept refreshing its activity stamp. The orchestrator soft-continues — it launches the next attempt anyway rather than forcing the run to stop and wait for a human.',
            reviewer_verdict: 'The reviewer-gate dispatch decision. Detail.verdict is PASS / ROUTE_EXECUTOR / ROUTE_PLANNER / ROUTE_ESCALATE / MISSING_ARTIFACTS / INFRA_FAILURE / VISUAL_UNVERIFIED / BEHAVIORAL_UNVERIFIED / REGRESSION_UNVERIFIED.',
            stamp_init_failed: 'Could not seed the agent activity stamp — workspace dir is missing or unwritable. Stall detection would be silently disabled; pipeline halts loudly instead.',
            escalation_command_invalid: 'The escalation agent returned an empty or unrecognized resume command. The orchestrator defaulted to STOP (recoverable) instead of a silent dead-end — resume from the escalation panel to continue.',
            // P1 Stage F — advisory reachability events. Hedged copy: operators
            // must not infer "broken" from "unreachable" — it could just be
            // wiring landing in a different entry, or a dynamic-import pattern
            // the static walk cannot follow.
            reachability_warning: 'A static reachability check found something worth surfacing — manifest files not reached from the entry point, no resolver for the project language, or a resolver limitation. Advisory only — the phase still passes; treat as "confirm intent," not "broken."',
            reachability_not_applicable: 'The verified entry point is a test runner (pytest, jest, vitest, ...); the reachability check was consciously skipped. Informational only — no problem detected.',
            // Phase 3 (gate-feedback methodology) — interpretive checks the executor gate used to hard-fail are now non-blocking warnings.
            gate_warning: 'The executor gate found something interpretive (a declared file not on disk, a planned test missing from tests_written, or missing behavioural-smoke artifacts) and recorded it as a NON-blocking warning instead of failing the phase. Advisory only — the phase still passes; the reviewer reads gate_warnings.json and decides whether to accept it or convert it into a blocking issue.',
            // Phase 2 — SILENT lifecycle/destructive events now recorded on the timeline.
            nuclear_reset: 'Operator escape hatch (cap 2): all phase work on the branch was discarded and the phase restarted from its base commit. Destructive — distinct from the cap-3 escalation resets.',
            queue_halted: 'The project queue stalled — no eligible project to start. Detail.reason is all_blocked / all_dependency_hold / answered_pending_revival / mixed / all_completed.',
            queue_parked: 'The active project escalated (or hit a roadmap block) and was parked; the queue advanced to the next project. The escalated phase pointer is snapshotted for later revival.',
            queue_revived: 'A parked project with a banked escalation answer was revived and resumed at its escalated phase, with the banked command applied.',
            dependency_hold: 'A queued project was held because its parent project has not completed yet. It returns to READY when the parent completes.',
        };

        function getEventDescription(eventType) {
            const key = (eventType || '').toLowerCase();
            return EVENT_TYPE_DESCRIPTION[key] || '';
        }

        function humanizeSummary(event) {
            const type = event.event || event.event_type || '';
            const d = event.detail || {};
            switch (type) {
                case 'gate_pass':
                    return 'Review passed — phase advancing';
                case 'gate_fail': {
                    // When orchestrator stamps last_error_code on the event, surface H-23 prose (historical row; not the removed sidebar chip).
                    const lec =
                        typeof d.last_error_code === "string" && d.last_error_code.trim()
                            ? d.last_error_code.trim()
                            : "";
                    const friendly = lec ? getLastErrorCodeTitle(lec, event.agent) : "";
                    let route = "";
                    if (d.gate_result === "ROUTE_EXECUTOR") route = "Review found issues — sending back to executor";
                    else if (d.gate_result === "ROUTE_ESCALATE")
                        route = "Review failed repeatedly — escalating for human input";
                    else if (d.gate_result === "MISSING_ARTIFACTS")
                        route = "Required output files missing — cannot review";
                    else if (d.exit_code != null) route = `Agent output rejected (exit code ${d.exit_code})`;
                    else route = "Gate check failed";
                    // P0 Stage H — prefix with retry-source label when the
                    // event carries retry_class. Initial attempts (and
                    // pre-Stage-H events from history) get no decoration so
                    // the common case reads unchanged.
                    const retryPrefix =
                        d.retry_class === "executor_self_failure" ? "Executor stuck → auto-retry — " :
                        d.retry_class === "reviewer_rejection" ? "Reviewer rejection → executor retry — " :
                        "";
                    const decorated = retryPrefix + route;
                    if (friendly) return route ? `${decorated} — ${friendly}` : friendly;
                    return decorated;
                }
                case 'phase_complete': {
                    const a = d.executor_attempts;
                    const b = d.blame_fires;
                    if (a === 1 && !b) return 'Completed on first attempt';
                    if (a > 1 && !b) return `Completed after ${a} executor attempts`;
                    if (b > 0) return `Completed after ${a} executor attempts (${b} blame cycle${b > 1 ? 's' : ''})`;
                    return 'Phase completed';
                }
                case 'escalation_trigger': {
                    const r = typeof d.reason === 'string' ? d.reason : '';
                    if (r.startsWith('Planner retries')) return 'Planner ran out of retries — needs human decision';
                    if (r.startsWith('Impl blame cap')) return 'Implementation blame cap hit — needs human decision';
                    if (r.startsWith('Reviewer ROUTE_ESCALATE')) return 'Reviewer requested escalation — needs human decision';
                    if (r.startsWith('Reviewer sentinel timeout')) return 'Reviewer timed out — needs human decision';
                    if (r.includes('merge failed')) return 'Git merge conflict — needs human decision';
                    return r ? r.slice(0, 100) : 'Escalation triggered';
                }
                case 'escalation_resolve': {
                    const cmds = {
                        RETRY: 'Human chose: retry current agent',
                        RESET_EXECUTION: 'Human chose: restart the executor with a fresh session',
                        RESET_PHASE: 'Human chose: restart entire phase',
                        RESET_REVIEWER: 'Human chose: restart review step',
                        // SKIP is a removed "secret-menu" verb. This is a post-hoc log line
                        // only (it adds no control); risk-flagged on purpose so the record
                        // reinforces SKIP's cascade danger rather than normalizing it.
                        SKIP: 'Human chose: SKIP this phase — ⚠ may cascade on dependent phases',
                        PROCEED: 'Human chose: accept current state and proceed',
                        NUCLEAR_RESET: 'Human chose: NUCLEAR RESET — discarding all phase work and restarting from the base commit',
                        STOP: 'Human chose: stop pipeline',
                    };
                    return cmds[d.command] || `Human chose: ${d.command || 'unknown'}`;
                }
                case 'escalation_command_invalid': {
                    // Recoverable safety-heal: the escalation agent returned an empty /
                    // unrecognized command, so the orchestrator defaulted to STOP (not a
                    // silent dead-end). Resume from the escalation panel to continue.
                    const received = d.received_command ? `"${d.received_command}"` : 'an empty command';
                    const fallback = d.defaulted_to || 'STOP';
                    return `Unrecognized command ${received} — defaulted to ${fallback} (recoverable; resume to continue)`;
                }
                case 'status_changed':
                    return 'Pipeline state updated';

                // ─── Section 6 diagnostic events — readable prose instead of raw JSON ───
                case 'poll_start': {
                    const agent = event.agent || 'agent';
                    const n = d.attempt;
                    const grace = d.startup_grace;
                    const stall = d.stall_threshold;
                    const tail = (grace != null && stall != null)
                        ? ` (${grace}s grace, ${stall}s stall threshold)`
                        : '';
                    return n != null
                        ? `Watching ${agent} attempt ${n} for output${tail}`
                        : `Watching ${agent} for output${tail}`;
                }
                case 'poll_outcome':
                case 'attempt_end': {
                    const agent = event.agent || 'agent';
                    const n = d.attempt;
                    const dur = d.duration_s;
                    const reason = typeof d.reason === 'string' ? d.reason : '';
                    const prefix = n != null
                        ? `${agent[0].toUpperCase() + agent.slice(1)} attempt ${n}`
                        : `${agent[0].toUpperCase() + agent.slice(1)}`;
                    const durStr = dur != null ? ` (${dur}s)` : '';
                    // P0 Stage H — suffix with retry-source label when the
                    // event carries retry_class. Initial attempts (and
                    // pre-Stage-H events from history) get no decoration.
                    const classSuffix =
                        d.retry_class === "executor_self_failure" ? " [self-failure retry]" :
                        d.retry_class === "reviewer_rejection" ? " [reviewer-rejection retry]" :
                        "";
                    if (reason === 'succeeded') return `${prefix} succeeded${durStr}${classSuffix}`;
                    if (reason === 'stalled') return `${prefix} stalled — no activity past the stall threshold${durStr}${classSuffix}`;
                    if (reason === 'no_first_activity') return `${prefix} never started — no first hook within the startup grace${classSuffix}`;
                    if (reason === 'timeout') return `${prefix} timed out — infrastructure backstop hit (gateway unreachable)${durStr}${classSuffix}`;
                    if (reason === 'stopped') return `${prefix} stopped by operator${classSuffix}`;
                    return reason ? `${prefix} ended — reason=${reason}${durStr}${classSuffix}` : `${prefix} ended${durStr}${classSuffix}`;
                }
                case 'abort_attempted': {
                    const role = d.agent_role || event.agent || 'agent';
                    const source = d.source === 'retry_start' ? 'before next retry' : 'on stall';
                    if (d.result === 'ok') return `Aborted prior ${role} session ${source}`;
                    if (d.result === 'FAILED') return `Could not abort prior ${role} session ${source} — best-effort retry continues`;
                    return `Abort attempted on ${role} session`;
                }
                case 'abort_verify_failed': {
                    const role = d.agent_role || event.agent || 'agent';
                    return `⚠ ${role[0].toUpperCase() + role.slice(1)} kept streaming after abort — launching the next attempt anyway (soft-continue)`;
                }
                case 'reviewer_verdict': {
                    const v = d.verdict;
                    const pass = d.pass_number;
                    const passStr = pass != null ? `Pass ${pass} — ` : '';
                    if (v === 'PASS') return `${passStr}Review passed, advancing phase`;
                    if (v === 'ROUTE_EXECUTOR') return `${passStr}Sending back to executor with blocking issues`;
                    if (v === 'ROUTE_PLANNER') return `${passStr}Sending back to planner (attribution: plan)`;
                    if (v === 'ROUTE_ESCALATE') return `${passStr}Escalating to human after repeated rejections`;
                    if (v === 'MISSING_ARTIFACTS') return `${passStr}Required output files missing — re-running executor`;
                    if (v === 'INFRA_FAILURE') return `${passStr}Reviewer infrastructure failure — retrying`;
                    if (v === 'VISUAL_UNVERIFIED') return `${passStr}Visual verification artifacts missing — re-running reviewer`;
                    if (v === 'BEHAVIORAL_UNVERIFIED') return `${passStr}Behavioral verification evidence missing — re-running reviewer`;
                    if (v === 'REGRESSION_UNVERIFIED') return `${passStr}Prior-phase regression check unverified — re-running reviewer`;
                    return v ? `${passStr}Verdict: ${v}` : `${passStr}Verdict recorded`;
                }
                case 'stamp_init_failed': {
                    const role = d.agent_role || event.agent || 'agent';
                    return `Could not initialize ${role} activity stamp — workspace dir missing or unwritable`;
                }
                // P1 Stage F — advisory reachability events. Hedged copy
                // prevents the operator reading "unreachable" as "broken."
                case 'reachability_warning': {
                    const kind = d.kind || 'unreachable_summary';
                    if (kind === 'unreachable_summary') {
                        const files = Array.isArray(d.files) ? d.files : [];
                        const count = typeof d.count === 'number' ? d.count : files.length;
                        const first3 = files.slice(0, 3).join(', ');
                        const rest = Math.max(0, files.length - 3);
                        const tail = rest > 0 ? ` (+${rest} more)` : '';
                        return `reachability: ${count} file(s) not reached from entry — ${first3}${tail}. Confirm intent: orphan vs. wiring landed elsewhere.`;
                    }
                    if (kind === 'no_resolver') {
                        return 'reachability: no resolver for entry command — language not yet supported';
                    }
                    if (kind === 'resolver_limitation') {
                        return `reachability: ${d.reason || 'check incomplete (dynamic imports detected)'}`;
                    }
                    if (kind === 'resolver_error') {
                        return `reachability: check could not run — ${d.reason || 'unknown error'}`;
                    }
                    return d.reason || 'reachability advisory';
                }
                case 'reachability_not_applicable':
                    return `reachability skipped — ${d.reason || 'entry point is a test runner'}`;

                // ─── Phase 3 (gate-feedback methodology) — demoted gate warnings ───
                case 'gate_warning': {
                    const codes = Array.isArray(d.codes) ? d.codes : [];
                    const count = typeof d.count === 'number' ? d.count : codes.length;
                    // Reuse the kept P3_LAST_ERROR_CODE_TITLES map (these codes are
                    // now warning identifiers, not last_error_code values).
                    const friendly = codes
                        .map((c) => getLastErrorCodeTitle(c, event.agent) || c)
                        .join(', ');
                    const tail = friendly ? ` — ${friendly}` : '';
                    return `Gate raised ${count} non-blocking warning(s)${tail}. Advisory — the reviewer will adjudicate (accept, or convert to a blocking issue).`;
                }

                // ─── Phase 2 — SILENT lifecycle/destructive events rendered as prose ───
                case 'nuclear_reset': {
                    const cap = d.nuclear_resets != null ? `${d.nuclear_resets}/2` : '';
                    const reason = d.reason ? ` Reason: ${d.reason}` : '';
                    return `Nuclear reset ${cap} — all phase work on this branch discarded; restarting from the base commit.${reason}`;
                }
                case 'queue_halted': {
                    const reasons = {
                        all_blocked: 'Queue stalled — all remaining projects are blocked',
                        all_dependency_hold: 'Queue stalled — all remaining projects are waiting on a parent to complete',
                        answered_pending_revival: 'Queue stalled — a banked escalation answer is pending revival (recoverable; resume to continue)',
                        mixed: 'Queue stalled — remaining projects are blocked or on hold',
                        all_completed: 'Queue drained — all projects complete',
                    };
                    return reasons[d.reason] || `Queue stalled${d.reason ? ` — ${d.reason}` : ''}`;
                }
                case 'queue_parked': {
                    const name = d.entry_name || d.entry_id || 'project';
                    const phase = d.phase ? ` at ${d.phase}` : '';
                    return `Parked ${name}${phase} after escalation — queue advanced to the next project`;
                }
                case 'queue_revived': {
                    const name = d.entry_name || d.entry_id || 'project';
                    const cmd = d.command || 'banked answer';
                    return `Revived ${name} with banked answer (${cmd}) — resuming at the parked phase`;
                }
                case 'dependency_hold': {
                    const name = d.entry_name || d.entry_id || 'project';
                    const parent = d.parent_id ? ` parent ${d.parent_id}` : ' its parent';
                    return `${name} held — waiting on${parent} to complete`;
                }

                default:
                    return formatPipelineEventDetail(d) || type;
            }
        }

        function humanizeSnakeCase(s) {
            if (!s || typeof s !== 'string') return 'Unknown';
            return s
                .split('_')
                .map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : ''))
                .join(' ')
                .trim() || 'Unknown';
        }

        function getEventTypeRaw(event) {
            if (!event) return '';
            const t = event.event_type ?? event.event;
            return typeof t === 'string' ? t : String(t || '');
        }

        function formatActivityEventTypeLabel(raw) {
            const key = (raw || '').toLowerCase();
            if (EVENT_TYPE_DISPLAY[key]) return EVENT_TYPE_DISPLAY[key];
            return humanizeSnakeCase(key);
        }

        const AGENT_ATTEMPT_DOT_TITLES = {
            neutral: 'Attempt not started yet for this phase.',
            blue: 'Attempt in progress — agent running or waiting for sentinel output.',
            green: 'Attempt succeeded — pipeline advanced past this agent for this phase.',
            red: 'Attempt failed (gate or timeout) — retry or escalation follows if cap reached.',
        };

        /** L-28 palette — inline hex for attempt cells. In-flight `blue` uses mock-like blue (not pipeline teal) so it does not read like success lime. */
        const AGENT_ATTEMPT_DOT_HEX = {
            neutral: PIPELINE_STATUS_PILL_HEX.slate600,
            blue: '#3b82f6',
            green: PIPELINE_STATUS_PILL_HEX.successGreen,
            red: PIPELINE_STATUS_PILL_HEX.red600,
        };

        /**
         * L-28 per-slot states: 'neutral' | 'blue' | 'green' | 'red'
         * @param {string} agentRole planner|executor|reviewer
         * @param {number|null|undefined} rowRetries failure count for this row
         */
        function getAgentAttemptDotStates(agentRole, rowRetries, currentAgent, pipelineStatus, allRetries) {
            const ORDER = ['planner', 'executor', 'reviewer'];
            const rowIdx = ORDER.indexOf(agentRole);
            if (rowIdx < 0) return ['neutral', 'neutral', 'neutral'];

            const ca = (currentAgent || '').toLowerCase(); // L-28: canonical agent id compare
            const ps = String(pipelineStatus ?? '').trim();
            const r = Math.min(Math.max(Number(rowRetries) || 0, 0), 3);
            const p = Math.min(Math.max(Number(allRetries?.planner) || 0, 0), 3);
            const e = Math.min(Math.max(Number(allRetries?.executor) || 0, 0), 3);
            const rev = Math.min(Math.max(Number(allRetries?.reviewer) || 0, 0), 3);

            const terminalNoBlue = new Set([
                'STOPPED',
                'HALTED_SILENT',
                'BLOCKED',
                'QUEUE_HALTED',
                'PIPELINE_COMPLETE',
            ]);
            const allowBlue =
                (ps === 'RUNNING' || ps === 'WAITING_FOR_SENTINEL') &&
                !terminalNoBlue.has(ps) &&
                ps !== 'WAITING_FOR_HUMAN';

            let activeIdx = -1;
            if (ca === 'planner') activeIdx = 0;
            else if (ca === 'executor') activeIdx = 1;
            else if (ca === 'reviewer') activeIdx = 2;
            else if (ca === 'escalation') activeIdx = 3;

            const slotStates = () => ['neutral', 'neutral', 'neutral'];
            const threeRed = () => ['red', 'red', 'red'];
            const completedLeg = (failures) => {
                const out = ['neutral', 'neutral', 'neutral'];
                const retries = Math.min(Math.max(Number(failures) || 0, 0), 3);
                for (let i = 0; i < 3; i++) {
                    if (i < retries) out[i] = 'red';
                    else if (i === retries) out[i] = 'green';
                    else out[i] = 'neutral';
                }
                return out;
            };
            const activeRow = (failures, withBlue) => {
                const out = ['neutral', 'neutral', 'neutral'];
                const retries = Math.min(Math.max(Number(failures) || 0, 0), 3);
                for (let i = 0; i < 3; i++) {
                    if (i < retries) out[i] = 'red';
                    else if (i === retries) out[i] = withBlue ? 'blue' : 'neutral';
                    else out[i] = 'neutral';
                }
                return out;
            };

            if (ca === 'escalation') {
                if (agentRole === 'planner') {
                    if (p >= 3) return threeRed();
                    // Terminal halt (HALTED_SILENT, BLOCKED, STOPPED, …) must not emit
                    // green — use neutral current slot so the ladder reads "interrupted",
                    // not "successful pass through this agent".
                    if (terminalNoBlue.has(ps)) return activeRow(p, false);
                    return completedLeg(p);
                }
                if (agentRole === 'executor') {
                    if (p >= 3) return slotStates();
                    if (e >= 3) return threeRed();
                    if (terminalNoBlue.has(ps)) return activeRow(e, false);
                    return completedLeg(e);
                }
                if (agentRole === 'reviewer') {
                    if (p >= 3 || e >= 3) return slotStates();
                    if (rev >= 3) return threeRed();
                    if (terminalNoBlue.has(ps)) return activeRow(rev, false);
                    return completedLeg(rev);
                }
            }

            if (activeIdx < 0) return slotStates();

            if (rowIdx > activeIdx) return slotStates();

            if (rowIdx < activeIdx) return completedLeg(r);

            // rowIdx === activeIdx
            if (ps === 'WAITING_FOR_HUMAN' && r >= 3) return threeRed();
            if (!allowBlue) return activeRow(r, false);
            return activeRow(r, true);
        }

        /**
         * Consumption count (0..3) for Agent attempts row fraction `n/3`.
         * Rules: resolved = reds + greens; if any blue and reds > 0 return reds; if any blue and reds === 0 and slot 0 is blue return 1; if any blue otherwise return 0; else return resolved.
         */
        function computeAgentAttemptFractionN(states) {
            const s = (states || []).slice(0, 3);
            while (s.length < 3) s.push('neutral');
            const red = s.filter((x) => x === 'red').length;
            const green = s.filter((x) => x === 'green').length;
            const resolved = red + green;
            const hasBlue = s.some((x) => x === 'blue');
            if (hasBlue) {
                if (red > 0) return red;
                if (red === 0 && s[0] === 'blue') return 1;
                return 0;
            }
            return resolved;
        }

        /** Format seconds as "Xh Ym" or "Ym" or "—" */
        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            const s = Math.round(Number(seconds) || 0);
            if (s <= 0) return '—';
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        /** P0 Stage H — format "Exec attempts" with retry-source breakdown.
         *
         * Clean common case: when both lifetime counters are 0 (single
         * attempt, no retries of either kind), return just the attempts
         * count as a bare string — preserves the historical "Exec
         * attempts: 1" appearance.
         *
         * Breakdown case: when either counter > 0, append a parenthetical
         * with the split (e.g. "4 (1 self-failure, 2 reviewer rejections)").
         */
        function formatExecAttemptsBreakdown(attempts, selfFailures, rejections) {
            const a = Number(attempts) || 0;
            const s = Number(selfFailures) || 0;
            const r = Number(rejections) || 0;
            if (s === 0 && r === 0) return String(a);
            const parts = [];
            if (s > 0) parts.push(`${s} self-failure${s > 1 ? 's' : ''}`);
            if (r > 0) parts.push(`${r} reviewer rejection${r > 1 ? 's' : ''}`);
            return `${a} (${parts.join(', ')})`;
        }

         * /api/ideas/{id}/convert produces roadmap_draft.md AND
         * verification_draft.md in one session, so both tabs regenerate
         * in lockstep while convertLoading is true. PRD content is not
         * touched by /convert, so its tab stays static. */
        function tabIsRegenerating(tabId, convertLoading) {
            return Boolean(convertLoading) && (tabId === 'roadmap' || tabId === 'verification');
        }

        function ElapsedTimer({
            lastActionTimestamp,
            sentinelWaitStartedAt,
            waitingForHumanAt,
            orchestratorAlive,
            pipeline_status,
        }) {
            const [elapsed, setElapsed] = useState(0);
            const tickAnchor =
                pipeline_status === "WAITING_FOR_HUMAN"
                    ? (waitingForHumanAt || null)
                    : pipeline_status === "WAITING_FOR_SENTINEL" && sentinelWaitStartedAt
                    ? sentinelWaitStartedAt
                    : lastActionTimestamp;
            const orchestratorDown =
                orchestratorAlive === false &&
                (pipeline_status === "RUNNING" || pipeline_status === "WAITING_FOR_SENTINEL");
            useEffect(() => {
                if (!tickAnchor) return;
                const startTime = new Date(tickAnchor).getTime();
                const tick = () => setElapsed(Math.floor((Date.now() - startTime) / 1000));
                tick();
                if (orchestratorDown) {
                    return;
                }
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [tickAnchor, pipeline_status, orchestratorDown]);
            if (!tickAnchor) return null;
            const isOverdue = pipeline_status === "WAITING_FOR_SENTINEL" && elapsed > 300;
            const colorClass = isOverdue ? "text-amber-400" : "text-slate-400";
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const suffix = orchestratorDown ? " · orchestrator offline" : "";
            return (
                <span className={`header-text text-xs ${colorClass}`} data-testid="elapsed-timer">
                    {mins}m {String(secs).padStart(2, "0")}s{suffix}
                </span>
            );
        }

        /** Split FastAPI detail: friendly first line + optional technical rest (after newline). */
        function splitApiDetail(detail) {
            if (typeof detail !== "string") {
                return { friendly: detail ? String(detail) : "", technical: "" };
            }
            const i = detail.indexOf("\n");
            if (i === -1) return { friendly: detail, technical: "" };
            return { friendly: detail.slice(0, i), technical: detail.slice(i + 1).trim() };
        }

        /** Human-readable message from FastAPI JSON body (`detail` string or object). */
        function formatFetchDetail(d) {
            if (!d || d.detail === undefined || d.detail === null) {
                return "";
            }
            const det = d.detail;
            if (typeof det === "string") {
                return det;
            }
            if (typeof det === "object" && det !== null && typeof det.message === "string") {
                let s = det.message;
                const lines = [];
                if (det.state_path) lines.push(`pipeline_state path: ${det.state_path}`);
                if (det.symlink_path) lines.push(`symlink target: ${det.symlink_path}`);
                if (lines.length) s += "\n" + lines.join("\n");
                return s;
            }
            try {
                return JSON.stringify(det);
            } catch (e) {
                return String(det);
            }
        }

        /** Raw server text for failed POST /api/resume-orchestrator (detail or spawn error field). */
        function extractResumeOrchestratorRawDetail(od, status) {
            if (od && typeof od === "object" && status === 503 && od.reconciled === true && od.error != null) {
                return String(od.error);
            }
            return formatFetchDetail(od);
        }

        /**
         * Map ui/server.py repoint / resume-orchestrator messages to plain language.
         * Returns null when the raw string should be shown alone (no separate technical line).
         */
        function mapResumeOrchestratorFriendlyMessage(raw, status) {
            if (typeof raw !== "string" || !raw.trim()) return null;
            const s = raw.trim();
            const lower = s.toLowerCase();
            if (
                lower.includes("real directory, not a symlink") ||
                (lower.includes("not a symlink") && lower.includes("real directory"))
            ) {
                return (
                    "The configured project folder is a real directory, not the pipeline-project symlink. " +
                    "Set project_dir_path in ui/config.json to a symlink target, or remove the blocking folder."
                );
            }
            if (lower.includes("exists as a file") && lower.includes("refusing")) {
                return (
                    "The pipeline-project path points to a file instead of a symlink. Fix project_dir_path in ui/config.json."
                );
            }
            if (lower.includes("not set in config") && lower.includes("cannot repoint symlink")) {
                return (
                    "project_dir_path (symlink location) is not set in ui/config.json — the UI cannot align the pipeline-project symlink."
                );
            }
            if (lower.includes("target project path does not exist")) {
                return (
                    "The project path from pipeline state does not exist or is not a folder. Use Switch project or Setup & Preflight."
                );
            }
            if (lower.includes("cannot create parent directory for symlink")) {
                return (
                    "Could not create the directory needed for the pipeline-project symlink. Check OPENCLAW_ROOT and filesystem permissions."
                );
            }
            if (lower.includes("no project_path") && lower.includes("pipeline_state")) {
                return "No active project path in pipeline state. Use Setup & Preflight or Switch project.";
            }
            if (s === "Orchestrator is already running") {
                return (
                    "An orchestrator instance may already be running (pipeline lock). If this seems wrong, inspect pipeline.lock."
                );
            }
            if (lower.includes("orchestrator.py") && lower.includes("not found")) {
                return (
                    "Could not find orchestrator.py under autodev_repo_path. Set autodev_repo_path in ui/config.json to this repository root."
                );
            }
            if (lower.includes("failed to spawn orchestrator")) {
                return (
                    "Could not start the orchestrator process. Check spawn logs and that Python can launch autodev/pipeline/orchestrator.py."
                );
            }
            if (s === "Could not repoint pipeline-project symlink") {
                return (
                    "Could not update the pipeline-project symlink. Check project_dir_path and filesystem permissions."
                );
            }
            return null;
        }

        /** Friendly first line + optional raw detail (mirrors stop-path UX). */
        function resumeOrchestratorErrorPresentation(od, status) {
            const raw = extractResumeOrchestratorRawDetail(od, status).trim();
            if (!raw) {
                return { friendly: `Resume orchestrator failed (${status})`, technical: "" };
            }
            const mapped = mapResumeOrchestratorFriendlyMessage(raw, status);
            const friendly = mapped !== null ? mapped : raw;
            const technical = mapped !== null ? raw : "";
            return { friendly, technical };
        }

        /** Error string for failed /api/resume-orchestrator (newline joins friendly + technical for splitApiDetail). */
        function formatResumeOrchestratorError(od, status) {
            const p = resumeOrchestratorErrorPresentation(od, status);
            if (p.technical) return `${p.friendly}\n${p.technical}`;
            return p.friendly;
        }

                setQueueAddPathFsStatus(null);
                queueAddValidateTimerRef.current = setTimeout(() => {
                    fetch("/api/setup/validate-repo-path", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ path: trimmed }),
                    })
                        .then((r) => r.json())
                        .then((d) => {
                            if (!d.valid) {
                                setQueueAddPathFsStatus("bad");
                                return;
                            }
                            return fetch("/api/setup/check-repo-path", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ path: trimmed }),
                            }).then(async (r2) => {
                                const j = await r2.json().catch(() => ({}));
                                if (!r2.ok) {
                                    setQueueAddPathFsStatus("bad");
                                    return;
                                }
                                if (j.exists) {
                                    setQueueAddPathFsStatus("exists");
                                } else {
                                    setQueueAddPathFsStatus("bad");
                                }
                            });
                        })
                        .catch(() => setQueueAddPathFsStatus("bad"));
                }, 500);
            };

            const handleAdd = () => {
                if (!projectPath.trim()) { setErrors([{message: 'Project path is required'}]); return; }
                setValidating(true);
                setErrors([]);
                fetch('/api/queue/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        project_path: projectPath.trim(),
                    }),
                })
                .then(async r => {
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        setErrors(d.validation_errors || [{message: d.detail || 'Request failed'}]);
                        return;
                    }
                    onAdded(d);
                    onClose();
                })
                .catch(e => setErrors([{message: String(e.message || e)}]))
                .finally(() => setValidating(false));
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
                    <div className="relative w-full max-w-md mx-4 rounded-xl border border-[#2a2d31] bg-[#141618] p-6">
                        <button onClick={onClose} disabled={validating}
                            className="absolute top-4 right-4 text-slate-500 hover:text-slate-300 text-lg">✕</button>
                        <h2 className="header-text text-base text-slate-200 mb-4">Add Project to Queue</h2>

                        <div className="space-y-3">
                            <div>
                                <label className="header-text text-xs text-slate-400 mb-1 block">Project path (absolute)</label>
                                <ServerPathInput
                                    id="queue-add-path"
                                    value={projectPath}
                                    onChange={handlePathChange}
                                    disabled={false}
                                    fsStatus={queueAddPathFsStatus}
                                    recents={pathRecents}
                                />
                            </div>

                            {errors.length > 0 && (
                                <div className="rounded border border-red-700/60 bg-red-950/20 p-3 space-y-1">
                                    {errors.map((e, i) => (
                                        <p key={i} className="header-text text-xs text-red-300">
                                            {e.message || e.check && `${e.check}: ${e.message}` || JSON.stringify(e)}
                                        </p>
                                    ))}
                                </div>
                            )}

                            <div className="flex gap-3 justify-end pt-2">
                                <button onClick={onClose} disabled={validating}
                                    className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-300 hover:bg-[#22252a]">
                                    Cancel
                                </button>
                                <button onClick={handleAdd} disabled={validating}
                                    className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-slate-900 font-semibold hover:bg-[#00c8f0] disabled:opacity-50">
                                    {validating ? 'Validating…' : 'Validate & Add'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── Queue Screen ─────────────────────────────────────────────────────────

        function QueueScreen() {
            const { pipelineStatus, setUnsavedQueueOrder, safeNavigate } = useContext(AppCtx);
            const [queue, setQueue] = useState([]);
            const [queueMode, setQueueMode] = useState('auto');
            const [selectedId, setSelectedId] = useState(null);
            const [nextEligible, setNextEligible] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [error, setError] = useState('');
            const [triggerBusy, setTriggerBusy] = useState(false);
            const [triggerMsg, setTriggerMsg] = useState('');
            const [loading, setLoading] = useState(true);
            const [snapshot, setSnapshot] = useState(null);
            const [snapshotLoading, setSnapshotLoading] = useState(false);
            const [snapshotVersion, setSnapshotVersion] = useState(0);
            const [hubBusy, setHubBusy] = useState(false);
            const [hubError, setHubError] = useState('');
            const [pendingCommand, setPendingCommand] = useState(null);
            const [revalidateChecks, setRevalidateChecks] = useState(null);
            const [escalationMsg, setEscalationMsg] = useState('');
            const [displayRanks, setDisplayRanks] = useState({});
            const [reorderMode, setReorderMode] = useState(false);
            const [reorderSaveBusy, setReorderSaveBusy] = useState(false);
            const [reorderError, setReorderError] = useState("");
            const reorderSnapshotRef = useRef(null);
            const reorderModeRef = useRef(false);
            const reorderDirtyRef = useRef(false);
            const dragItem = useRef(null);
            const preDragOrder = useRef(null);

            const computeLocalRanks = (q) => {
                const ranks = {};
                let rank = 0;
                q.forEach((e) => {
                    if (!e.parent_id) {
                        rank += 1;
                        ranks[e.id] = rank;
                    } else {
                        ranks[e.id] = null;
                    }
                });
                return ranks;
            };

            const reorderDirty =
                reorderMode &&
                reorderSnapshotRef.current !== null &&
                queue.map((e) => e.id).join("\0") !== reorderSnapshotRef.current;

            useEffect(() => {
                reorderModeRef.current = reorderMode;
            }, [reorderMode]);

            useEffect(() => {
                reorderDirtyRef.current = reorderDirty;
            }, [reorderDirty]);

            useEffect(() => {
                setUnsavedQueueOrder(!!reorderDirty);
            }, [reorderDirty, setUnsavedQueueOrder]);

            useEffect(() => {
                if (!reorderDirty) return;
                const onBeforeUnload = (e) => {
                    e.preventDefault();
                    e.returnValue = "";
                };
                window.addEventListener("beforeunload", onBeforeUnload);
                return () => window.removeEventListener("beforeunload", onBeforeUnload);
            }, [reorderDirty]);

            const effectiveRanks = reorderMode ? computeLocalRanks(queue) : displayRanks;

            const fetchQueue = (options = {}) => {
                const force = options.force === true;
                if (!force && reorderModeRef.current && reorderDirtyRef.current) {
                    setError("Save or cancel reorder first.");
                    return;
                }
                fetch('/api/queue')
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const detail = d.detail;
                            const msg = Array.isArray(detail)
                                ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                : detail || d.message || `Request failed (${r.status})`;
                            throw new Error(String(msg || "Could not load queue"));
                        }
                        return d;
                    })
                    .then((d) => {
                        const q = d.queue || [];
                        setQueue(q);
                        setQueueMode(d.queue_mode || 'auto');
                        setNextEligible(d.next_eligible || null);
                        setDisplayRanks(d.display_ranks || {});
                        setLoading(false);
                        setError("");
                        setSnapshotVersion(v => v + 1);
                        if (
                            reorderModeRef.current &&
                            !reorderDirtyRef.current &&
                            reorderSnapshotRef.current !== null
                        ) {
                            reorderSnapshotRef.current = q.map((e) => e.id).join("\0");
                        }
                    })
                    .catch((err) => {
                        setLoading(false);
                        setError(err.message || "Could not load queue");
                    });
            };

            const beginReorder = () => {
                setReorderError("");
                setError("");
                reorderSnapshotRef.current = queue.map((e) => e.id).join("\0");
                setReorderMode(true);
                setUnsavedQueueOrder(false);
            };

            const cancelReorder = () => {
                setReorderMode(false);
                reorderSnapshotRef.current = null;
                setReorderError("");
                setUnsavedQueueOrder(false);
                fetchQueue({ force: true });
            };

            const saveReorder = () => {
                setReorderSaveBusy(true);
                setReorderError("");
                fetch("/api/queue/order", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ entry_ids: queue.map((e) => e.id) }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const msg = typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail || r.statusText);
                            throw new Error(msg || "Save failed");
                        }
                        return d;
                    })
                    .then(() => {
                        setReorderMode(false);
                        reorderSnapshotRef.current = null;
                        setUnsavedQueueOrder(false);
                        fetchQueue({ force: true });
                    })
                    .catch((err) => setReorderError(err.message || String(err)))
                    .finally(() => setReorderSaveBusy(false));
            };

            useEffect(() => { fetchQueue({ force: true }); }, []);

            // Fetch snapshot when selected entry or version changes
            useEffect(() => {
                if (!selectedId) { setSnapshot(null); return; }
                setSnapshotLoading(true);
                fetch(`/api/queue/${selectedId}/snapshot`)
                    .then(r => r.json())
                    .then(d => setSnapshot(d))
                    .catch(() => setSnapshot(null))
                    .finally(() => setSnapshotLoading(false));
            }, [selectedId, snapshotVersion]);

            const selectedLiveForEscalationMsg = selectedId
                ? (queue.find((e) => e.id === selectedId)?.live_pipeline_status ?? null)
                : null;

            // Fetch escalation context only when human-wait is true for the selection.
            // Do not depend on `queue` by reference — every GET /api/queue creates a new array and
            // was re-triggering this effect constantly (log spam) even when status strings were unchanged.
            useEffect(() => {
                const snapHuman =
                    snapshot &&
                    snapshot.is_active_project &&
                    snapshot.pipeline_status === "WAITING_FOR_HUMAN";
                const entryHuman = selectedLiveForEscalationMsg === "WAITING_FOR_HUMAN";
                if (!snapHuman && !entryHuman) {
                    setEscalationMsg("");
                    return;
                }
                let cancelled = false;
                fetch("/api/state")
                    .then((r) => r.json())
                    .then((d) => {
                        if (!cancelled) {
                            setEscalationMsg(
                                d.escalation_message || d.escalation_trigger_reason || ""
                            );
                        }
                    })
                    .catch(() => {});
                return () => {
                    cancelled = true;
                };
            }, [
                selectedId,
                selectedLiveForEscalationMsg,
                snapshot && snapshot.is_active_project,
                snapshot && snapshot.pipeline_status,
            ]);

            const selected = queue.find(e => e.id === selectedId) || null;
            const activeEntry = queue.find(e => e.state === 'ACTIVE');

            const busyPipelineStatuses = ['RUNNING', 'WAITING_FOR_SENTINEL', 'WAITING_FOR_HUMAN'];
            const runNextProjectDisabled =
                triggerBusy ||
                !!activeEntry ||
                reorderDirty ||
                busyPipelineStatuses.includes(pipelineStatus);

            /** Native tooltip when Run next project is disabled; priority matches `disabled`. */
            const getRunNextProjectDisabledReason = () => {
                if (triggerBusy) return 'Starting the next project…';
                if (activeEntry) return 'A project is already active in the queue.';
                if (reorderDirty) return 'Save or cancel reorder first.';
                if (pipelineStatus === 'RUNNING') return 'Pipeline is running.';
                if (pipelineStatus === 'WAITING_FOR_SENTINEL') return 'Pipeline is waiting on an agent.';
                if (pipelineStatus === 'WAITING_FOR_HUMAN') return 'Pipeline is waiting for your input.';
                return null;
            };

            const handleModeToggle = () => {
                if (reorderDirty) return;
                const newMode = queueMode === 'auto' ? 'manual' : 'auto';
                fetch('/api/queue/mode', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({queue_mode: newMode}),
                }).then(() => setQueueMode(newMode)).catch(() => {});
            };

            const handleTriggerNext = () => {
                if (reorderDirty) return;
                setTriggerBusy(true);
                setTriggerMsg('');
                fetch('/api/queue/trigger-next', {method: 'POST'})
                    .then(async r => {
                        const d = await r.json().catch(() => ({}));
                        if (r.status === 409) { setTriggerMsg('A project is already active.'); return; }
                        if (d.queue_halted) {
                            const rsn = d.queue_halted_reason;
                            setTriggerMsg(
                                (rsn && QUEUE_HALTED_TRIGGER_MSG[rsn]) ||
                                    'Queue stalled — resolve blockers or dependency holds.'
                            );
                        } else { setTriggerMsg(`Started: ${d.started || 'next project'}`); }
                        fetchQueue();
                    })
                    .catch(() => setTriggerMsg('Request failed'))
                    .finally(() => setTriggerBusy(false));
            };

            const handleRemove = (id) => {
                if (!window.confirm('Remove this project from the queue?')) return;
                fetch(`/api/queue/${id}`, {method: 'DELETE'})
                    .then(async r => {
                        if (!r.ok) { const d = await r.json().catch(() => ({})); setError(d.detail || 'Cannot remove'); return; }
                        setSelectedId(null);
                        fetchQueue();
                    })
                    .catch(() => setError('Request failed'));
            };

            const handleSetParent = (id, parentId) => {
                setHubError('');
                fetch(`/api/queue/${id}/parent`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({parent_id: parentId || null}),
                })
                .then(async r => {
                    if (!r.ok) { const d = await r.json().catch(() => ({})); setHubError(d.detail || 'Cannot set parent'); return; }
                    fetchQueue();
                })
                .catch(() => setHubError('Request failed'));
            };

            const handleRevalidate = (id) => {
                setHubBusy(true);
                setHubError('');
                setRevalidateChecks(null);
                fetch(`/api/queue/${id}/revalidate`, {method: 'POST'})
                    .then(async r => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) { setHubError(d.detail || 'Revalidation failed'); return; }
                        setRevalidateChecks(d.checks || []);
                        fetchQueue();
                    })
                    .catch(() => setHubError('Request failed'))
                    .finally(() => setHubBusy(false));
            };

            const handleRelaunch = (id) => {
                setHubBusy(true);
                setHubError('');
                fetch(`/api/queue/${id}/relaunch`, {method: 'POST'})
                    .then(async r => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) { setHubError(d.detail || 'Restart failed'); return; }
                        fetchQueue();
                    })
                    .catch(() => setHubError('Request failed'))
                    .finally(() => setHubBusy(false));
            };

            const handleCommand = (cmd) => {
                if (['RESET_PHASE', 'RESET_REVIEWER', 'SKIP', 'STOP'].includes(cmd)) {
                    if (pendingCommand === cmd) {
                        // confirmed — send it
                        setPendingCommand(null);
                    } else {
                        setPendingCommand(cmd);
                        return;
                    }
                }
                setHubBusy(true);
                setHubError('');
                const payload = { command: cmd };
                if (selected && selected.state === 'ESCALATION' && selected.project_path) {
                    payload.target_project_path = selected.project_path;
                }
                fetch('/api/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload),
                })
                .then(async r => {
                    if (!r.ok) { const d = await r.json().catch(() => ({})); setHubError(d.detail || 'Command failed'); return; }
                    fetchQueue();
                })
                .catch(() => setHubError('Request failed'))
                .finally(() => setHubBusy(false));
            };

            // Drag-to-reorder: recursive descendants of a root (by parent_id), matching server group move
            const getAllDescendantIds = (q, rootId) => {
                const out = [];
                const walk = (pid) => {
                    q.forEach((e) => {
                        if (e.parent_id === pid) {
                            out.push(e.id);
                            walk(e.id);
                        }
                    });
                };
                walk(rootId);
                return out;
            };

            // Drag-to-reorder handlers
            const handleDragStart = (e, entry) => {
                if (!reorderMode) return;
                dragItem.current = entry;
                preDragOrder.current = queue.map(e => e.id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, targetEntry) => {
                e.preventDefault();
                if (!reorderMode || !dragItem.current) return;
                const root = dragItem.current;
                if (root.id === targetEntry.id) return;
                if (['ACTIVE', 'COMPLETED'].includes(root.state)) return;
                if (root.parent_id) return;
                const descIds = getAllDescendantIds(queue, root.id);
                const groupIds = new Set([root.id, ...descIds]);
                if (groupIds.has(targetEntry.id)) return;
                const newQueue = [...queue];
                const toIdxOrig = newQueue.findIndex(e => e.id === targetEntry.id);
                if (toIdxOrig === -1) return;
                const idxs = newQueue.map((e, i) => (groupIds.has(e.id) ? i : -1)).filter((i) => i >= 0).sort((a, b) => a - b);
                if (idxs.length === 0) return;
                const block = idxs.map((i) => newQueue[i]);
                idxs.sort((a, b) => b - a).forEach((i) => newQueue.splice(i, 1));
                newQueue.splice(toIdxOrig, 0, ...block);
                const newIds = newQueue.map((e) => e.id).join("\0");
                setQueue(newQueue);
                if (
                    reorderSnapshotRef.current !== null &&
                    newIds !== reorderSnapshotRef.current
                ) {
                    setUnsavedQueueOrder(true);
                }
            };

            const handleDrop = (e, targetEntry) => {
                e.preventDefault();
                if (!reorderMode) return;
                dragItem.current = null;
            };

            const handleDragEnd = () => { dragItem.current = null; };

            /** Tooltip for DEP badge: organizational dependent vs blocked-on-parent hold. */
            const depBadgeTitle = (entry, parentEntry) => {
                if (!parentEntry) return 'Child project';
                if (entry.state === 'DEPENDENCY_HOLD') {
                    return `On hold: parent "${parentEntry.name}" is ${parentEntry.state}. Clears when parent unblocks or completes.`;
                }
                if (parentEntry.state !== 'COMPLETED') {
                    return `Dependent on "${parentEntry.name}" — starts after parent completes (parent is ${parentEntry.state}).`;
                }
                return `Depends on: ${parentEntry.name}`;
            };

            const readyCt = queue.filter(e => e.state === 'READY').length;
            const blockedCt = queue.filter(e => e.state === 'BLOCKED').length;
            const holdCt = queue.filter(e => e.state === 'DEPENDENCY_HOLD').length;
            const completedCt = queue.filter(e => e.state === 'COMPLETED').length;
            const dependentSoftCt = queue.filter(e => {
                if (!e.parent_id || e.state === 'DEPENDENCY_HOLD') return false;
                const p = queue.find(x => x.id === e.parent_id);
                return p && p.state !== 'COMPLETED';
            }).length;

            function relTime(iso) {
                if (!iso) return null;
                const d = new Date(iso);
                const diff = Math.floor((Date.now() - d) / 1000);
                if (diff < 60) return `${diff}s ago`;
                if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
                return `${Math.floor(diff/3600)}h ago`;
            }

            // ── Column 2: Project Snapshot ──────────────────────────────────────────
            function QueueProjectSnapshot() {
                if (!selected) return (
                    <p className="header-text text-xs text-slate-500 text-center mt-8">Select a project to view details</p>
                );
                if (snapshotLoading) return (
                    <p className="header-text text-xs text-slate-500 text-center mt-8">Loading…</p>
                );
                const snap = snapshot;
                const hasRunData = snap && snap.is_active_project;
                const agentRetries = snap && snap.current_agent ? {
                    planner: snap.planner_retries || 0,
                    executor: snap.executor_retries || 0,
                    reviewer: snap.reviewer_retries || 0,
                }[snap.current_agent] : null;

                const selDisp = queueRowDisplay(selected);
                const parentEntry = selected.parent_id ? queue.find((e) => e.id === selected.parent_id) : null;
                return (
                    <div className="space-y-3">
                        <div>
                            <p className="header-text text-base text-slate-200 font-semibold leading-tight">{selected.name}</p>
                            <p className="header-text text-xs text-slate-500 font-mono mt-0.5 break-all">{selected.project_path}</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            {selected.parent_id && (
                                <span
                                    className="header-text px-1.5 py-0.5 rounded text-xs font-medium bg-indigo-900/50 text-indigo-300 border border-indigo-700/40"
                                    title={depBadgeTitle(selected, parentEntry)}
                                >
                                    DEP
                                </span>
                            )}
                            <span
                                className={`header-text px-2 py-0.5 rounded text-xs font-medium ${selDisp.className}`}
                                title={selDisp.title || undefined}
                            >{selDisp.label}</span>
                            {selected.blocked_at && <span className="header-text text-xs text-slate-500">Blocked {relTime(selected.blocked_at)}</span>}
                            {selected.started_at && <span className="header-text text-xs text-slate-500">Started {relTime(selected.started_at)}</span>}
                            {selected.completed_at && <span className="header-text text-xs text-slate-500">Done {relTime(selected.completed_at)}</span>}
                        </div>
                        {selected.skip_count > 0 && (
                            <p className="header-text text-xs text-orange-400">↩ Skipped {selected.skip_count} time{selected.skip_count !== 1 ? 's' : ''}</p>
                        )}

                        {/* Phase progress */}
                        {snap && snap.phases_total > 0 ? (
                            <div>
                                <div className="flex items-center justify-between mb-1">
                                    <span className="header-text text-xs text-slate-400">Phases</span>
                                    <span className="header-text text-xs text-slate-300">{snap.phases_complete} / {snap.phases_total} complete</span>
                                </div>
                                <div className="h-1.5 rounded-full bg-[#1a1d21] overflow-hidden">
                                    <div className="h-full rounded-full bg-emerald-600 transition-all"
                                        style={{width: `${Math.round((snap.phases_complete / snap.phases_total) * 100)}%`}}/>
                                </div>
                            </div>
                        ) : null}

                        {/* Run metrics */}
                        {hasRunData ? (
                            <div className="space-y-1.5">
                                {snap.current_phase_raw_id && (
                                    <div>
                                        <span className="header-text text-xs text-slate-500">Current phase: </span>
                                        <span className="header-text text-xs text-slate-300 font-mono">{snap.current_phase_raw_id}</span>
                                        {snap.current_phase_desc && (
                                            <span className="header-text text-xs text-slate-500"> — {snap.current_phase_desc}</span>
                                        )}
                                    </div>
                                )}
                                {snap.current_agent && (
                                    <p className="header-text text-xs text-slate-400">
                                        {snap.current_agent.charAt(0).toUpperCase() + snap.current_agent.slice(1)}
                                        {agentRetries !== null && agentRetries > 0 && ` — attempt ${agentRetries + 1}`}
                                    </p>
                                )}
                                {snap.last_action_timestamp && (
                                    <p className="header-text text-xs text-slate-500">Last action: {relTime(snap.last_action_timestamp)}</p>
                                )}
                            </div>
                        ) : (
                            <p className="header-text text-xs text-slate-600 italic">Not the active project — run metrics unavailable</p>
                        )}

                        {selected.preflight_validated_at && (
                            <p className="header-text text-xs text-slate-500">Validated {relTime(selected.preflight_validated_at)}</p>
                        )}
                    </div>
                );
            }

            // ── Column 3: Action Hub ────────────────────────────────────────────────
            function QueueActionHub() {
                if (!selected) return (
                    <p className="header-text text-xs text-slate-500 text-center mt-8">Select a project to see actions</p>
                );

                const state = selected.state;
                const selLive = selected.live_pipeline_status;
                const isEscalationWaiting =
                    selLive === 'WAITING_FOR_HUMAN' ||
                    (snapshot &&
                        snapshot.is_active_project &&
                        snapshot.pipeline_status === 'WAITING_FOR_HUMAN');

                const getDescendantsHub = (id) =>
                    queue.filter(x => x.parent_id === id).flatMap(x => [x.id, ...getDescendantsHub(x.id)]);
                const descendantsHub = getDescendantsHub(selected.id);

                const dependsSelect = (
                    <div>
                        <label className="header-text text-xs text-slate-400 mb-1 block">Depends on</label>
                        <select
                            value={selected.parent_id || ''}
                            onChange={e => handleSetParent(selected.id, e.target.value || null)}
                            disabled={hubBusy || reorderDirty}
                            title={reorderDirty ? "Save or cancel reorder first" : undefined}
                            className="header-text text-xs bg-[#1a1d21] text-slate-200 border border-[#2a2d32] rounded px-2 py-1 w-full disabled:opacity-40">
                            <option value="">None</option>
                            {queue.filter(e => e.id !== selected.id && !descendantsHub.includes(e.id)).map(e => (
                                <option key={e.id} value={e.id}>{e.name} [{e.state}]</option>
                            ))}
                        </select>
                    </div>
                );

                const removeBtn = (
                    <button type="button" onClick={() => handleRemove(selected.id)}
                        disabled={reorderDirty}
                        title={reorderDirty ? "Save or cancel reorder first" : undefined}
                        className="header-text text-xs px-3 py-1.5 rounded bg-red-900/40 text-red-300 hover:bg-red-900/70 w-full disabled:opacity-40">
                        Remove from Queue
                    </button>
                );

                const monitorBtn = (
                    <button type="button" onClick={() => safeNavigate('pipeline')}
                        className="header-text text-xs px-3 py-1.5 rounded bg-teal-900/40 text-teal-300 hover:bg-teal-900/70 w-full">
                        View in Pipeline Monitor
                    </button>
                );

                const ESCALATION_CMDS = [
                    { command: 'RESET_PHASE',     label: 'Revert to Planner',  needsConfirm: true  },
                    { command: 'RESET_EXECUTION', label: 'Revert to Executor', needsConfirm: false },
                    { command: 'RESET_REVIEWER',  label: 'Revert to Reviewer', needsConfirm: true  },
                    { command: 'SKIP',            label: 'Skip Phase',          needsConfirm: true  },
                    { command: 'PROCEED',         label: 'Accept & Advance',    needsConfirm: false },
                    { command: 'STOP',            label: 'Halt Pipeline',       needsConfirm: true  },
                ];

                if (isEscalationWaiting) {
                    return (
                        <div className="space-y-3">
                            <div>
                                <p className="header-text text-xs text-slate-400 font-semibold mb-1">Awaiting escalation command</p>
                                {escalationMsg && (
                                    <p className="header-text text-xs text-amber-300 bg-amber-950/30 border border-amber-700/40 rounded p-2 leading-relaxed">{escalationMsg}</p>
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-1.5">
                                {ESCALATION_CMDS.map(({command, label, needsConfirm}) => {
                                    const confirming = pendingCommand === command;
                                    return (
                                        <div key={command}>
                                            <button
                                                disabled={hubBusy || reorderDirty}
                                                title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                                onClick={() => handleCommand(command)}
                                                className={`header-text text-xs px-2 py-1.5 rounded w-full text-left disabled:opacity-50 ${
                                                    confirming ? 'bg-amber-700/60 text-amber-100' : 'bg-[#1a1d21] text-slate-300 hover:bg-[#22252a]'
                                                }`}>
                                                {confirming ? `Confirm ${label}?` : label}
                                            </button>
                                            {confirming && (
                                                <button type="button" onClick={() => setPendingCommand(null)}
                                                    className="header-text text-xs text-slate-500 hover:text-slate-300 mt-0.5 pl-1">cancel</button>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            {hubError && <p className="header-text text-xs text-red-400">{hubError}</p>}
                            <div className="border-t border-[#2a2d31] pt-3 space-y-3">
                                {dependsSelect}
                                {removeBtn}
                                {monitorBtn}
                            </div>
                        </div>
                    );
                }

                const isActiveStopped =
                    state === 'ACTIVE' &&
                    (selLive === 'STOPPED' ||
                        (snapshot && snapshot.is_active_project && snapshot.pipeline_status === 'STOPPED'));

                if (isActiveStopped) {
                    return (
                        <div className="space-y-3">
                            <StoppedRecoveryPanel
                                current_phase_raw_id={snapshot && snapshot.current_phase_raw_id}
                                escalation_resets={(snapshot && snapshot.escalation_resets) || 0}
                                onResumeSent={() => {
                                    fetchQueue();
                                    setSnapshotVersion(v => v + 1);
                                }}
                            />
                            <div className="border-t border-[#2a2d31] pt-3 space-y-3">
                                {dependsSelect}
                                {removeBtn}
                                {monitorBtn}
                            </div>
                            {hubError && <p className="header-text text-xs text-red-400">{hubError}</p>}
                        </div>
                    );
                }

                if (state === 'ACTIVE') {
                    const midFlight = selLive === 'RUNNING' || selLive === 'WAITING_FOR_SENTINEL';
                    if (midFlight) {
                        const orchDown =
                            snapshot && snapshot.is_active_project && !snapshot.orchestrator_alive;
                        if (orchDown) {
                            return (
                                <div className="space-y-3">
                                    <p className="header-text text-xs text-slate-400">
                                        Orchestrator process has stopped; pipeline state still shows an in-flight run.
                                    </p>
                                    <button
                                        onClick={() => handleRelaunch(selected.id)}
                                        disabled={hubBusy || reorderDirty}
                                        title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-slate-900 font-semibold hover:bg-[#00c8f0] disabled:opacity-50 w-full"
                                    >
                                        {hubBusy ? "Restarting…" : "Restart Orchestrator"}
                                    </button>
                                    {hubError && (
                                        <p className="header-text text-xs text-red-400">{hubError}</p>
                                    )}
                                    {monitorBtn}
                                </div>
                            );
                        }
                        return (
                            <div className="space-y-3">
                                <p className="header-text text-xs text-slate-400">Pipeline is running for this project.</p>
                                {monitorBtn}
                            </div>
                        );
                    }
                    return (
                        <div className="space-y-3">
                            <p className="header-text text-xs text-slate-400">Manage this queue slot or open the monitor for details.</p>
                            {dependsSelect}
                            {removeBtn}
                            {monitorBtn}
                        </div>
                    );
                }

                // BLOCKED
                if (state === 'BLOCKED') {
                    const isOrchestratorDown = snapshot && snapshot.is_active_project && !snapshot.orchestrator_alive;

                    if (isOrchestratorDown) return (
                        <div className="space-y-3">
                            <p className="header-text text-xs text-slate-400">Orchestrator process has stopped.</p>
                            <button onClick={() => handleRelaunch(selected.id)} disabled={hubBusy || reorderDirty}
                                title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-slate-900 font-semibold hover:bg-[#00c8f0] disabled:opacity-50 w-full">
                                {hubBusy ? 'Restarting…' : 'Restart Orchestrator'}
                            </button>
                            {hubError && <p className="header-text text-xs text-red-400">{hubError}</p>}
                        </div>
                    );

                    return (
                        <div className="space-y-3">
                            <p className="header-text text-xs text-slate-400">This project was blocked. Check Pipeline Monitor for details.</p>
                            <button onClick={() => safeNavigate('pipeline')}
                                className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-[#00b4d8] hover:bg-[#22252a] w-full">
                                View in Pipeline Monitor
                            </button>
                        </div>
                    );
                }

                // DEPENDENCY_HOLD
                if (state === 'DEPENDENCY_HOLD') {
                    const parent = queue.find(e => e.id === selected.parent_id);
                    const getDescendantsHold = (id) => queue.filter(x => x.parent_id === id).flatMap(x => [x.id, ...getDescendantsHold(x.id)]);
                    const descendantsHold = getDescendantsHold(selected.id);
                    return (
                        <div className="space-y-3">
                            {parent && (
                                <div>
                                    <p className="header-text text-xs text-slate-400 mb-1">Waiting for:</p>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setSelectedId(parent.id)}
                                            className="header-text text-xs text-[#00b4d8] hover:underline">{parent.name}</button>
                                        {(() => {
                                            const pp = queueParentStatePill(parent.state);
                                            return (
                                                <span
                                                    className={`header-text px-1.5 py-0.5 rounded text-xs font-medium ${pp.className}`}
                                                    title={pp.title || undefined}
                                                >{pp.label}</span>
                                            );
                                        })()}
                                    </div>
                                </div>
                            )}
                            <div>
                                <label className="header-text text-xs text-slate-400 mb-1 block">Depends on</label>
                                <select
                                    value={selected.parent_id || ''}
                                    onChange={e => handleSetParent(selected.id, e.target.value || null)}
                                    disabled={hubBusy || reorderDirty}
                                    title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                    className="header-text text-xs bg-[#1a1d21] text-slate-200 border border-[#2a2d32] rounded px-2 py-1 w-full">
                                    <option value="">None (remove dependency)</option>
                                    {queue.filter(e => e.id !== selected.id && !descendantsHold.includes(e.id)).map(e => (
                                        <option key={e.id} value={e.id}>{e.name} [{e.state}]</option>
                                    ))}
                                </select>
                            </div>
                            {hubError && <p className="header-text text-xs text-red-400">{hubError}</p>}
                        </div>
                    );
                }

                // COMPLETED
                if (state === 'COMPLETED') return (
                    <div className="space-y-3">
                        <p className="header-text text-xs text-slate-500">Pipeline complete.</p>
                        <button onClick={() => handleRemove(selected.id)}
                            disabled={reorderDirty}
                            title={reorderDirty ? "Save or cancel reorder first" : undefined}
                            className="header-text text-xs px-3 py-1.5 rounded bg-red-900/40 text-red-300 hover:bg-red-900/70 w-full disabled:opacity-40">
                            Remove from Queue
                        </button>
                    </div>
                );

                // FAILED
                if (state === 'FAILED') return (
                    <div className="space-y-3">
                        {snapshot && snapshot.pipeline_status && (
                            <p className="header-text text-xs text-red-400">Status: {snapshot.pipeline_status}</p>
                        )}
                        <button onClick={() => handleRemove(selected.id)}
                            disabled={reorderDirty}
                            title={reorderDirty ? "Save or cancel reorder first" : undefined}
                            className="header-text text-xs px-3 py-1.5 rounded bg-red-900/40 text-red-300 hover:bg-red-900/70 w-full disabled:opacity-40">
                            Remove from Queue
                        </button>
                    </div>
                );

                // READY / SKIPPED_PENDING (default)
                const getDescendants = (id) => queue.filter(x => x.parent_id === id).flatMap(x => [x.id, ...getDescendants(x.id)]);
                const descendants = getDescendants(selected.id);

                return (
                    <div className="space-y-4">
                        {/* Dependency selector */}
                        <div>
                            <label className="header-text text-xs text-slate-400 mb-1 block">Depends on</label>
                            <select
                                value={selected.parent_id || ''}
                                onChange={e => handleSetParent(selected.id, e.target.value || null)}
                                disabled={reorderDirty}
                                title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                className="header-text text-xs bg-[#1a1d21] text-slate-200 border border-[#2a2d32] rounded px-2 py-1 w-full disabled:opacity-40">
                                <option value="">None</option>
                                {queue.filter(e => e.id !== selected.id && !descendants.includes(e.id)).map(e => (
                                    <option key={e.id} value={e.id}>{e.name} [{e.state}]</option>
                                ))}
                            </select>
                        </div>

                        {/* Revalidate */}
                        <div>
                            <button onClick={() => { setRevalidateChecks(null); handleRevalidate(selected.id); }}
                                disabled={hubBusy || reorderDirty}
                                title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-300 hover:bg-[#22252a] disabled:opacity-50 w-full">
                                {hubBusy ? 'Validating…' : 'Re-validate'}
                            </button>
                            {revalidateChecks && (
                                <ul className="mt-2 space-y-1">
                                    {revalidateChecks.map((c, i) => (
                                        <li key={i} className={`header-text text-xs flex gap-1.5 ${c.status === 'fail' ? 'text-red-400' : c.status === 'warn' ? 'text-amber-400' : c.status === 'fixed' ? 'text-[#00b4d8]' : 'text-emerald-400'}`}>
                                            <span className="font-mono">[{c.status}]</span>
                                            <span>{c.check}: {c.message}</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>

                        {/* Remove */}
                        <button onClick={() => handleRemove(selected.id)}
                            disabled={reorderDirty}
                            title={reorderDirty ? "Save or cancel reorder first" : undefined}
                            className="header-text text-xs px-3 py-1.5 rounded bg-red-900/40 text-red-300 hover:bg-red-900/70 w-full disabled:opacity-40">
                            Remove from Queue
                        </button>

                        {hubError && <p className="header-text text-xs text-red-400">{hubError}</p>}
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    {/* Top bar */}
                    <div className="bg-[#141618] border-b border-[#1a1d21] px-6 py-3 flex items-center gap-4 flex-shrink-0">
                        <h1 className="header-text text-base font-semibold text-slate-200">Project Queue</h1>
                        <button onClick={() => setShowAddModal(true)}
                            disabled={reorderDirty}
                            title={reorderDirty ? "Save or cancel reorder first" : undefined}
                            className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-slate-900 font-semibold hover:bg-[#00c8f0] disabled:opacity-40">
                            + Add Project
                        </button>
                        {!reorderMode ? (
                            <button type="button" onClick={beginReorder} disabled={loading || queue.length < 2}
                                title="Drag root rows to change order, then Save order"
                                className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:bg-[#22252a] disabled:opacity-40">
                                Reorder
                            </button>
                        ) : (
                            <>
                                <button type="button" onClick={saveReorder} disabled={reorderSaveBusy || !reorderDirty}
                                    title={reorderDirty ? "Write this order to the server" : "Change the order first"}
                                    className="header-text text-xs px-3 py-1.5 rounded bg-emerald-800 text-white hover:bg-emerald-700 disabled:opacity-40">
                                    {reorderSaveBusy ? "Saving…" : "Save order"}
                                </button>
                                <button type="button" onClick={cancelReorder} disabled={reorderSaveBusy}
                                    title="Discard changes and reload queue from server"
                                    className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-300 border border-[#2a2d31] hover:bg-[#22252a] disabled:opacity-40">
                                    Cancel
                                </button>
                                {reorderDirty && (
                                    <span className="header-text text-[10px] uppercase tracking-wide text-slate-500">Unsaved</span>
                                )}
                            </>
                        )}
                        {reorderError && <span className="header-text text-xs text-red-400 max-w-xs">{reorderError}</span>}
                        <div className="flex items-center gap-2">
                            <span
                                data-testid="queue-progression-label"
                                className="header-text text-xs uppercase tracking-wide text-white"
                                title="Auto advances the queue when eligible; Manual requires Run next project.">
                                Progression
                            </span>
                            <div className="flex items-center gap-1 rounded-full bg-[#1a1d21] p-0.5 border border-[#2a2d31]">
                                {['auto', 'manual'].map(m => (
                                    <button key={m} onClick={handleModeToggle}
                                        disabled={reorderDirty}
                                        title={reorderDirty ? "Save or cancel reorder first" : undefined}
                                        className={`header-text text-xs px-3 py-1 rounded-full transition-colors disabled:opacity-40 ${
                                            queueMode === m ? 'bg-[#00b4d8] text-slate-900 font-semibold' : 'text-slate-400 hover:text-slate-200'
                                        }`}>{m === 'auto' ? 'Auto' : 'Manual'}</button>
                                ))}
                            </div>
                        </div>
                        {queueMode === 'manual' && (
                            <button
                                type="button"
                                data-testid="queue-trigger-next"
                                onClick={handleTriggerNext}
                                disabled={runNextProjectDisabled}
                                title={getRunNextProjectDisabledReason() ?? undefined}
                                className={`header-text text-xs px-3 py-1.5 rounded bg-emerald-700 text-white hover:bg-emerald-600 disabled:opacity-50${!runNextProjectDisabled ? ' run-pulse' : ''}`}>
                                {triggerBusy ? 'Starting…' : 'Run next project'}
                            </button>
                        )}
                        {triggerMsg && <span className="header-text text-xs text-amber-400">{triggerMsg}</span>}
                        {error && <span className="header-text text-xs text-red-400">{error}</span>}
                        <span className="header-text text-xs text-slate-500 ml-auto">
                            {queue.length} project{queue.length !== 1 ? 's' : ''} — {readyCt} ready, {blockedCt} blocked, {holdCt} on hold (blocked parent){dependentSoftCt > 0 ? `, ${dependentSoftCt} dependent` : ''}, {completedCt} complete
                        </span>
                    </div>

                    {/* Three-column body */}
                    <div className="flex-1 grid grid-cols-[30%_35%_35%] gap-0 overflow-hidden">
                        {/* Column 1: Queue list */}
                        <div className="bg-[#0d0f12] border-r border-[#1a1d21] overflow-y-auto p-3">
                            {loading ? (
                                <p className="header-text text-xs text-slate-500 text-center mt-8">Loading queue…</p>
                            ) : queue.length === 0 ? (
                                <p className="header-text text-xs text-slate-500 text-center mt-8">No projects in queue.<br/>Click "+ Add Project" to get started.</p>
                            ) : (() => {
                                // Compute depth per entry (0=root, 1=child, 2=grandchild…)
                                const byId = Object.fromEntries(queue.map(e => [e.id, e]));
                                const depthOf = {};
                                queue.forEach(e => {
                                    let d = 0, cur = e;
                                    while (cur.parent_id && byId[cur.parent_id]) { d++; cur = byId[cur.parent_id]; }
                                    depthOf[e.id] = d;
                                });
                                return queue.map(entry => {
                                    const rowDisp = queueRowDisplay(entry);
                                    const parentEntry = entry.parent_id ? byId[entry.parent_id] : null;
                                    const isActive = selectedId === entry.id;
                                    const depth = depthOf[entry.id] || 0;
                                    const canDrag = reorderMode && !['ACTIVE','COMPLETED'].includes(entry.state) && !entry.parent_id;
                                    return (
                                        <div
                                            key={entry.id}
                                            role="button"
                                            tabIndex={0}
                                            aria-label={`${entry.name} — ${rowDisp.label}`}
                                            aria-pressed={isActive}
                                            draggable={canDrag}
                                            onDragStart={e => handleDragStart(e, entry)}
                                            onDragOver={e => handleDragOver(e, entry)}
                                            onDrop={e => handleDrop(e, entry)}
                                            onDragEnd={handleDragEnd}
                                            onClick={() => { setSelectedId(entry.id); setHubError(''); setRevalidateChecks(null); setPendingCommand(null); }}
                                            onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSelectedId(entry.id); setHubError(''); setRevalidateChecks(null); setPendingCommand(null); } }}
                                            title={entry.parent_id ? 'Move the parent project to reorder this group' : undefined}
                                            style={{paddingLeft: depth * 16 + 'px', borderLeft: depth > 0 ? '2px solid #312e81' : 'none'}}
                                            className={`flex items-center gap-2 p-2.5 rounded mb-1 cursor-pointer border transition-colors ${
                                                isActive ? 'border-[#00b4d8]/60 bg-[#0d1f26]' : 'border-transparent hover:bg-[#141618]'
                                            }`}
                                        >
                                            {canDrag && <span className="text-slate-600 cursor-grab text-xs select-none">⠿</span>}
                                            {!canDrag && <span className="w-3"/>}
                                            {effectiveRanks[entry.id] != null
                                                ? <span className="header-text text-xs text-slate-500 w-5 text-right flex-shrink-0">{effectiveRanks[entry.id]}</span>
                                                : <span className="header-text text-xs text-indigo-400 w-5 text-right flex-shrink-0">↳</span>}
                                            <span className="flex-1 header-text text-xs text-slate-200 truncate">{entry.name}</span>
                                            {entry.skip_count > 0 && <span className="header-text text-xs text-orange-400">↩{entry.skip_count}</span>}
                                            {entry.parent_id && (
                                                <span
                                                    className="header-text px-1.5 py-0.5 rounded text-xs font-medium flex-shrink-0 bg-indigo-900/50 text-indigo-300 border border-indigo-700/40"
                                                    title={depBadgeTitle(entry, parentEntry)}
                                                >
                                                    DEP
                                                </span>
                                            )}
                                            <span
                                                className={`header-text px-1.5 py-0.5 rounded text-xs font-medium flex-shrink-0 ${rowDisp.className}`}
                                                title={rowDisp.title || undefined}
                                            >{rowDisp.label}</span>
                                        </div>
                                    );
                                });
                            })()}
                        </div>

                        {/* Column 2: Project snapshot */}
                        <div className="bg-[#0d0f12] border-r border-[#1a1d21] p-4 overflow-y-auto">
                            <QueueProjectSnapshot/>
                        </div>

                        {/* Column 3: Action hub */}
                        <div className="bg-[#0d0f12] p-4 overflow-y-auto">
                            {selected && (
                                <p className="header-text text-xs text-slate-500 font-semibold mb-3 uppercase tracking-wide">Actions</p>
                            )}
                            <QueueActionHub/>
                        </div>
                    </div>

                    {showAddModal && (
                        <AddProjectModal
                            onClose={() => setShowAddModal(false)}
                            onAdded={() => { fetchQueue(); setShowAddModal(false); }}
                        />
                    )}
                </div>
            );
        }

        function PipelineScreen() {
            const { setCurrentScreen, setPipelineStatus } = useContext(AppCtx);
            const [pState, setPState] = useState({
                pipeline_status: 'Loading...',
                orchestrator_alive: true,
                orchestrator_spawn_log_tail: [],
                current_agent: null,
                project_path: null,
                current_phase_raw_id: '',
                planner_retries: null,
                executor_retries: null,
                reviewer_retries: null,
                last_error_code: null,
                last_action_timestamp: null,
                skill_injected: null,
                skill_agent: null,
                escalation_trigger_reason: null,
                last_action: null,
                escalation_resets: 0,
                project_dir_ok: true,
                project_dir_message: null,
                git_recover_suggested_branch: null,
            });
            const [roadmap, setRoadmap] = useState(null);
            const [metricsSummary, setMetricsSummary] = useState(null);
            const [showStopModal, setShowStopModal] = useState(false);
            const [stopRequested, setStopRequested] = useState(false);
            const [stopError, setStopError] = useState("");
            const [stopHint, setStopHint] = useState("");
            const [resumeBusy, setResumeBusy] = useState(false);
            const [resumeError, setResumeError] = useState("");
            const [orchRestartBusy, setOrchRestartBusy] = useState(false);
            const [orchRestartError, setOrchRestartError] = useState("");
            /** One-line header strip after resume-orchestrator symlink reconcile (Policy A). */
            const [resumeSymlinkNotice, setResumeSymlinkNotice] = useState(null);
            const [projectSwitchOpen, setProjectSwitchOpen] = useState(false);
            const [swPath, setSwPath] = useState("");
            const [swRecents, setSwRecents] = useState([]);
            const [swBusy, setSwBusy] = useState(false);
            const [swErr, setSwErr] = useState("");
            const [swChecks, setSwChecks] = useState(null);
            const [swCoherence, setSwCoherence] = useState(null);
            const [swReady, setSwReady] = useState(false);
            const [swRoadmapAmbiguous, setSwRoadmapAmbiguous] = useState(null);
            const [swDestructiveSelected, setSwDestructiveSelected] = useState([]);
            const swPendingRef = useRef({});
            const [showPathStopModal, setShowPathStopModal] = useState(false);
            const [pathStopDone, setPathStopDone] = useState(false);
            const [pathStopErr, setPathStopErr] = useState("");
            const [showGitRecoverModal, setShowGitRecoverModal] = useState(false);
            const [gitRecoverBranch, setGitRecoverBranch] = useState("main");
            const [gitRecoverBusy, setGitRecoverBusy] = useState(false);
            const [gitRecoverError, setGitRecoverError] = useState("");
            const [swFsStatus, setSwFsStatus] = useState(null);
            const swValidateTimerRef = useRef(null);

            const handleSwPathChange = (value) => {
                setSwPath(value);
                const trimmed = (value || "").trim();
                if (swValidateTimerRef.current) {
                    clearTimeout(swValidateTimerRef.current);
                }
                if (!trimmed) {
                    setSwFsStatus(null);
                    return;
                }
                setSwFsStatus(null);
                swValidateTimerRef.current = setTimeout(() => {
                    fetch("/api/setup/validate-repo-path", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ path: trimmed }),
                    })
                        .then((r) => r.json())
                        .then((d) => {
                            if (!d.valid) {
                                setSwFsStatus("bad");
                                return;
                            }
                            return fetch("/api/setup/check-repo-path", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ path: trimmed }),
                            }).then(async (r2) => {
                                const j = await r2.json().catch(() => ({}));
                                if (!r2.ok) {
                                    setSwFsStatus("bad");
                                    return;
                                }
                                if (j.exists) {
                                    setSwFsStatus("exists");
                                } else {
                                    setSwFsStatus("bad");
                                }
                            });
                        })
                        .catch(() => setSwFsStatus("bad"));
                }, 500);
            };

            useEffect(() => {
                fetchState();
                fetchRoadmap();
                fetchMetricsSummary();
                const stateInterval = setInterval(fetchState, 3000);
                const roadmapInterval = setInterval(fetchRoadmap, 3000);
                return () => {
                    clearInterval(stateInterval);
                    clearInterval(roadmapInterval);
                };
            }, []);

            // Clear stop-requested indicator once pipeline leaves stoppable state
            useEffect(() => {
                const stoppable = ["RUNNING", "WAITING_FOR_SENTINEL", "WAITING_FOR_HUMAN"];
                if (!stoppable.includes(pState.pipeline_status)) {
                    setStopRequested(false);
                }
            }, [pState.pipeline_status]);

            useEffect(() => {
                if (!projectSwitchOpen) return;
                fetch("/api/setup/recent-projects")
                    .then((r) => r.json())
                    .then((d) => setSwRecents(Array.isArray(d.projects) ? d.projects : []))
                    .catch(() => setSwRecents([]));
            }, [projectSwitchOpen]);

            function openProjectSwitch() {
                swPendingRef.current = {};
                setSwErr("");
                setSwChecks(null);
                setSwCoherence(null);
                setSwReady(false);
                setSwRoadmapAmbiguous(null);
                setSwDestructiveSelected([]);
                setSwPath(pState.project_path || "");
                setSwFsStatus(null);
                setResumeSymlinkNotice(null);
                setProjectSwitchOpen(true);
            }

            function closeProjectSwitch() {
                setProjectSwitchOpen(false);
                swPendingRef.current = {};
            }

            function postSwitchProject(body) {
                setSwBusy(true);
                setSwErr("");
                fetch("/api/setup/switch-project", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setSwBusy(false);
                        if (r.status === 409) {
                            const msg =
                                typeof d.detail === "string"
                                    ? d.detail
                                    : d.error || "Stop the pipeline before switching project.";
                            setSwErr(msg);
                            return;
                        }
                        if (d.destructive_error) {
                            setSwErr(String(d.destructive_error));
                            return;
                        }
                        if (d.roadmap_ambiguous) {
                            setSwRoadmapAmbiguous(d);
                            setSwCoherence(null);
                            setSwReady(false);
                            setSwChecks(d.checks || null);
                            return;
                        }
                        setSwRoadmapAmbiguous(null);
                        setSwChecks(d.checks || null);
                        setSwCoherence(d.coherence || null);
                        if (d.ok && d.started) {
                            closeProjectSwitch();
                            setResumeSymlinkNotice(null);
                            fetchState();
                            fetchRoadmap();
                            fetchMetricsSummary();
                            return;
                        }
                        if (d.ok && d.ready_to_start) {
                            const n = { ...swPendingRef.current };
                            if (body.confirm_roadmap_archive) {
                                n.confirm_roadmap_archive = true;
                                if (body.keep_filename) n.keep_filename = body.keep_filename;
                            }
                            if (body.confirm_destructive) {
                                n.confirm_destructive = body.confirm_destructive;
                            }
                            swPendingRef.current = n;
                            setSwReady(true);
                            return;
                        }
                        if (!d.ok && d.coherence && d.coherence.ok === false) {
                            setSwReady(false);
                            const opts = [];
                            const seen = new Set();
                            for (const iss of d.coherence.issues || []) {
                                for (const o of iss.destructive_options || []) {
                                    if (!seen.has(o)) {
                                        seen.add(o);
                                        opts.push(o);
                                    }
                                }
                            }
                            if (opts.length === 0) {
                                const iss0 = (d.coherence.issues || [])[0];
                                setSwErr(
                                    iss0
                                        ? `${iss0.kind}: ${iss0.detail}`
                                        : "Coherence check failed (no automatic fix available)."
                                );
                                return;
                            }
                            setSwDestructiveSelected(opts);
                            return;
                        }
                        setSwErr(d.error || "Switch project failed");
                    })
                    .catch((e) => {
                        setSwBusy(false);
                        setSwErr(String(e));
                    });
            }

            function fetchState() {
                fetch('/api/state')
                    .then(res => res.json())
                    .then(data => {
                        setPState(prev => ({ ...prev, ...data }));
                        setPipelineStatus(data.pipeline_status || '');
                    })
                    .catch(() => {});
            }

            function fetchRoadmap() {
                fetch('/api/roadmap')
                    .then(res => res.json())
                    .then(data => {
                        // Only update if data actually changed to avoid unnecessary re-renders
                        setRoadmap(prev => {
                            return JSON.stringify(prev) === JSON.stringify(data) ? prev : data;
                        });
                    })
                    .catch(() => {});
            }

            function fetchMetricsSummary() {
                fetch('/api/metrics-summary')
                    .then(res => res.json())
                    .then(data => { setMetricsSummary(data); })
                    .catch(() => {});
            }

            const handleStopConfirm = async () => {
                setStopError("");
                setStopHint("");
                setShowStopModal(false);
                try {
                    const r = await fetch("/api/stop", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Stop failed (${r.status})`;
                        setStopError(msg);
                        return;
                    }
                    setStopRequested(true);
                    if (typeof d.hint === "string" && d.hint) setStopHint(d.hint);
                } catch (e) {
                    setStopError(String(e));
                }
            };

            function applyResumeOrchestratorClientResult(d, res) {
                const ok = res && res.ok;
                const status = res && res.status;
                if (ok) {
                    if (d && d.reconciled === true) {
                        setResumeSymlinkNotice(
                            "Resume re-aligned the project symlink to match pipeline state."
                        );
                    } else {
                        setResumeSymlinkNotice(null);
                    }
                    return;
                }
                if (status === 503 && d && d.reconciled === true) {
                    const rawErr = d.error || "Failed to spawn";
                    const spawnLine =
                        mapResumeOrchestratorFriendlyMessage(String(rawErr), 503) || String(rawErr);
                    setResumeSymlinkNotice(
                        `Symlink was re-aligned to match pipeline state; orchestrator did not start (${spawnLine}). Click Restart again.`
                    );
                    return;
                }
                setResumeSymlinkNotice(null);
            }

            const handleHeaderResume = async () => {
                setResumeError("");
                setResumeBusy(true);
                try {
                    const result = await runStoppedResumeFlow("RETRY");
                    if (result.resumeOrch) {
                        applyResumeOrchestratorClientResult(result.resumeOrch.body, {
                            ok: result.resumeOrch.fetchOk,
                            status: result.resumeOrch.status,
                        });
                    }
                    if (!result.ok) {
                        setResumeError(result.error);
                        return;
                    }
                    fetchState();
                } catch (e) {
                    setResumeError(String(e));
                } finally {
                    setResumeBusy(false);
                }
            };

            const handleRestartOrchestrator = async () => {
                setOrchRestartError("");
                setOrchRestartBusy(true);
                try {
                    const r = await fetch("/api/resume-orchestrator", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    applyResumeOrchestratorClientResult(d, { ok: r.ok, status: r.status });
                    if (!r.ok) {
                        if (r.status === 503 && d && d.reconciled === true) {
                            setOrchRestartError("");
                        } else {
                            setOrchRestartError(
                                formatResumeOrchestratorError(d, r.status) || `Restart failed (${r.status})`
                            );
                        }
                        return;
                    }
                    fetchState();
                } catch (e) {
                    setOrchRestartError(String(e));
                } finally {
                    setOrchRestartBusy(false);
                }
            };

            const handleGitRecover = async () => {
                setGitRecoverError("");
                setGitRecoverBusy(true);
                try {
                    const res = await fetch("/api/pipeline/git-recover", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ base_branch: gitRecoverBranch.trim() }),
                    });

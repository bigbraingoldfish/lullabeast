<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDev Pipeline</title>
    
    <!-- Google Fonts: JetBrains Mono for headers, IBM Plex Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React and ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'header': ['"JetBrains Mono"', 'monospace'],
                        'body': ['"IBM Plex Sans"', 'sans-serif'],
                    },
                    colors: {
                        'header-bg': '#1e293b',
                        'panel-bg': '#141618',
                        'accent': '#00b4d8',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #0d0f12;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #app-root {
            height: 100vh;
            overflow: hidden;
        }
        .header-text {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Amber pulse animation for RUNNING and WAITING_FOR_SENTINEL states */
        @keyframes amber-pulse {
            0%, 100% {
                background-color: #f59e0b;
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }
            50% {
                background-color: #fbbf24;
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
            }
        }
        
        .status-pulse {
            animation: amber-pulse 2s ease-in-out infinite;
        }

        /* Pending assistant message — subtle opacity pulse, no amber flash */
        @keyframes chat-pending-soft {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 1; }
        }
        .chat-pending-soft {
            animation: chat-pending-soft 2s ease-in-out infinite;
        }

        /* Fade-in animation for new event rows */
        @keyframes fade-in-row {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-row-fade-in {
            animation: fade-in-row 0.3s ease-out forwards;
        }
        
        /* Event row hover states and transitions */
        .event-row {
            transition: background-color 0.15s ease-in-out;
        }
        .event-row:hover {
            background-color: rgba(51, 65, 85, 0.5);
        }

        /* Shared markdown rendering for conversation and document panes */
        .msg-md h1, .msg-md h2, .msg-md h3, .msg-md h4 {
            font-weight: 600;
            margin: 0.65em 0 0.35em;
        }
        /* h2 = top-level category grouper in PRD sections → white */
        .msg-md h1, .msg-md h2 { color: #e2e8f0; }
        /* h3/h4 = actual subsection headers → slate (teal reserved for section labels only) */
        .msg-md h3, .msg-md h4 { color: #94a3b8; }
        .msg-md h1 { font-size: 1.2rem; }
        .msg-md h2 { font-size: 1.05rem; }
        .msg-md h3 { font-size: 0.98rem; }
        .msg-md p, .msg-md li, .msg-md blockquote {
            color: #e2e8f0;
            margin: 0.35em 0;
            line-height: 1.45;
        }
        .msg-md em { color: #64748b; }
        .msg-md ul, .msg-md ol { margin: 0.35em 0; padding-left: 1.25rem; }
        .msg-md code {
            background: #1a1d21;
            color: #67e8f9;
            padding: 0.1em 0.35em;
            border-radius: 0.25rem;
            font-size: 0.85em;
        }
        .msg-md pre {
            background: #1a1d21;
            padding: 0.75rem;
            border-radius: 0.35rem;
            overflow-x: auto;
            margin: 0.5em 0;
            border: 1px solid #2a2d31;
        }
        .msg-md pre code { background: transparent; padding: 0; color: #e2e8f0; }
        .msg-md a { color: #00b4d8; }
        .msg-md table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.6em 0;
            border: 1px solid #2a2d31;
            background: #141618;
        }
        .msg-md th, .msg-md td {
            border: 1px solid #2a2d31;
            padding: 0.4rem 0.5rem;
            text-align: left;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
        .msg-md th { background: #1a1d21; color: #cbd5e1; }

        .side-divider {
            width: 2px;
            background: #1a1d21;
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
        }
        .side-divider-btn {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translate(50%, -50%);
            width: 24px;
            height: 48px;
            border: 1px solid #1a1d21;
            border-radius: 6px;
            background: #141618;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .side-divider-btn:hover {
            color: #00b4d8;
            border-color: #334155;
            background: #1a1d21;
        }

        /* ── Dark-theme scrollbars (Webkit / Blink) ──────────────────────────
           Track: matches the darkest panel bg (#0d0f11).
           Thumb: mid-tone (#2a2d31) at rest → lighter (#3d4249) on hover.
           Thin (6 px) so it feels unobtrusive; rounded for polish.
           Firefox: scrollbar-color with the same values via * selector.
        ─────────────────────────────────────────────────────────────────────── */
        * {
            scrollbar-width: thin;
            scrollbar-color: #2a2d31 #0d0f11;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0f11;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d31;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4249;
        }
        ::-webkit-scrollbar-corner {
            background: #0d0f11;
        }
    </style>
</head>
<body>
    <div id="app-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        const AppCtx = createContext(null);

        /** Relative time for idea list (from API `updated` ISO string). */
        function relativeTime(dateStr) {
            if (!dateStr) return "—";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "—";
            const diffMs = Date.now() - d.getTime();
            const min = Math.floor(diffMs / 60000);
            const hr = Math.floor(min / 60);
            const day = Math.floor(hr / 24);
            if (min < 1) return "< 1 min ago";
            if (min < 60) return `${min} min ago`;
            if (hr < 24) return `${hr} hr ago`;
            if (day < 7) return `${day} day${day === 1 ? "" : "s"} ago`;
            return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        }

        /** Short label for preflight last-run timestamp. */
        function relativeTimeShort(d) {
            if (!(d instanceof Date) || Number.isNaN(d.getTime())) return "";
            const diffMs = Date.now() - d.getTime();
            const min = Math.floor(diffMs / 60000);
            const hr = Math.floor(min / 60);
            if (min < 1) return "just now";
            if (min < 60) return `${min} min ago`;
            if (hr < 24) return `${hr} hr ago`;
            return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        }
        
        // ─── State label and class mappings ───────────────────────────────────────
        const STATE_LABELS = {
            'RUNNING': 'RUNNING',
            'WAITING_FOR_SENTINEL': 'WAITING',
            'WAITING_FOR_HUMAN': 'WAITING FOR HUMAN',
            'HALTED_SILENT': 'HALTED',
            'BLOCKED': 'BLOCKED',
            'COMPLETE': 'COMPLETE',
            'PIPELINE_COMPLETE': 'COMPLETE',
            'STOPPED': 'STOPPED',
        };
        
        const STATE_CLASSES = {
            'RUNNING': 'bg-amber-500 text-slate-900 status-pulse',
            'WAITING_FOR_SENTINEL': 'bg-amber-500 text-slate-900 status-pulse',
            'WAITING_FOR_HUMAN': 'bg-orange-500 text-white',
            'HALTED_SILENT': 'bg-red-600 text-white',
            'BLOCKED': 'bg-red-600 text-white',
            'COMPLETE': 'bg-green-600 text-white',
            'PIPELINE_COMPLETE': 'bg-emerald-700 text-white',
            'STOPPED': 'bg-red-600 text-white',
        };
        
        const AGENT_COLORS = {
            'PLANNER': 'bg-[#1a1d21] text-white',
            'EXECUTOR': 'bg-emerald-600 text-white',
            'REVIEWER': 'bg-[#00b4d8] text-white',
            'ESCALATION': 'bg-amber-600 text-white'
        };

        // ─── Helper functions ─────────────────────────────────────────────────────

        function getGoalForPhase(phaseId, roadmap) {
            if (!phaseId || !roadmap || !Array.isArray(roadmap)) return null;
            const phase = roadmap.find(p => p.id === phaseId);
            return phase ? phase.goal : null;
        }
        
        function getStatusIcon(status) {
            switch (status) {
                case 'complete': return '✓';
                case 'in_progress': return '▶';
                case 'pending': return '○';
                case 'skipped': return '⊘';
                case 'blocked': return '⚠';
                default: return '○';
            }
        }

        function getStatusClasses(status) {
            switch (status) {
                case 'complete': return 'opacity-60 text-slate-400';
                case 'in_progress': return 'border-l-4 border-cyan-500 bg-[#141618]/50';
                case 'blocked': return 'bg-red-900/30 border-l-4 border-red-600';
                case 'skipped': return 'opacity-50 text-slate-500';
                default: return 'text-slate-300';
            }
        }

        function getEventBadgeColor(eventType) {
            switch (eventType) {
                case 'gate_pass': return 'bg-green-600 text-white';
                case 'gate_fail': return 'bg-amber-600 text-white';
                case 'retry': return 'bg-amber-600 text-white';
                case 'escalation_trigger': return 'bg-orange-600 text-white';
                case 'escalation_resolve': return 'bg-blue-600 text-white';
                case 'phase_complete': return 'bg-lime-600 text-white';
                case 'status_changed': return 'bg-slate-600 text-white';
                default: return 'bg-[#1a1d21] text-white';
            }
        }

        /** Format seconds as "Xh Ym" or "Ym" or "—" */
        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            const s = Math.round(Number(seconds) || 0);
            if (s <= 0) return '—';
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        // ─── Primitive components ─────────────────────────────────────────────────

        function AgentBadge({ agent }) {
            if (!agent) return null;
            const colorClass = AGENT_COLORS[agent] || 'bg-[#1a1d21] text-white';
            return (
                <span className={`header-text px-2 py-0.5 rounded text-xs font-medium ${colorClass}`}>
                    {agent}
                </span>
            );
        }
        
        function DotCounter({ count, label }) {
            const maxDots = 3;
            if (count === undefined || count === null) return null;
            const filled = Math.min(count, maxDots);
            const empty = maxDots - filled;
            return (
                <div className="flex items-center gap-1.5">
                    <span className="text-slate-500 text-xs w-16">{label}</span>
                    <div className="flex gap-1">
                        {Array.from({length: filled}).map((_, i) => (
                            <span key={i} className="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                        ))}
                        {Array.from({length: empty}).map((_, i) => (
                            <span key={filled + i} className="w-2 h-2 rounded-full bg-[#1a1d21] inline-block"></span>
                        ))}
                    </div>
                </div>
            );
        }

        function LastErrorCode({ errorCode }) {
            if (!errorCode) return null;
            return (
                <span className="font-mono text-xs text-red-400 bg-[#141618] px-1.5 py-0.5 rounded">{errorCode}</span>
            );
        }

        function ElapsedTimer({ lastActionTimestamp, pipeline_status }) {
            const [elapsed, setElapsed] = useState(0);
            useEffect(() => {
                if (!lastActionTimestamp || pipeline_status === "WAITING_FOR_HUMAN") return;
                const startTime = new Date(lastActionTimestamp).getTime();
                const tick = () => setElapsed(Math.floor((Date.now() - startTime) / 1000));
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [lastActionTimestamp, pipeline_status]);
            if (pipeline_status === "WAITING_FOR_HUMAN") return null;
            if (!lastActionTimestamp) return null;
            const isOverdue = pipeline_status === 'WAITING_FOR_SENTINEL' && elapsed > 300;
            const colorClass = isOverdue ? 'text-amber-400' : 'text-slate-400';
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            return (
                <span className={`header-text text-xs ${colorClass}`}>{mins}m {String(secs).padStart(2, '0')}s</span>
            );
        }

        function SkillInjected({ skillInjected, skillAgent }) {
            if (!skillInjected || !skillAgent) return null;
            return (
                <span className="text-slate-500 text-xs">{skillInjected} / {skillAgent}</span>
            );
        }

        /** Split FastAPI detail: friendly first line + optional technical rest (after newline). */
        function splitApiDetail(detail) {
            if (typeof detail !== "string") {
                return { friendly: detail ? String(detail) : "", technical: "" };
            }
            const i = detail.indexOf("\n");
            if (i === -1) return { friendly: detail, technical: "" };
            return { friendly: detail.slice(0, i), technical: detail.slice(i + 1).trim() };
        }

        // ─── Modals ───────────────────────────────────────────────────────────────

        function ConfirmationModal({ command, onConfirm, onDismiss, busy }) {
            let title = "Confirm action";
            let body = "Are you sure?";
            if (command === "STOP") {
                title = "Confirm STOP";
                body = "Halt the pipeline entirely? No further phases will run. You can resume from the STOPPED state if needed.";
            } else if (command === "SKIP") {
                title = "Confirm SKIP";
                body =
                    "Skip the current phase? The phase will be marked skipped in the roadmap and the pipeline advances to the next phase. In-progress work is not committed.";
            } else if (command === "RESET_PHASE") {
                title = "Confirm RESET PHASE";
                body =
                    "Full phase reset: git will rewind to the pre-phase commit, the phase branch will be deleted, and a fresh planner run will start. Use only when the plan itself is flawed.";
            } else if (command === "RESET_REVIEWER") {
                title = "Confirm RESET REVIEWER";
                body =
                    "Clear reviewer output and re-run the reviewer from scratch. Executor output is preserved. Use when the reviewer failed but the implementation looks correct.";
            } else {
                title = "Confirm action";
                body = "Are you sure you want to run this command?";
            }
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                    <div className="bg-[#141618] border border-[#1a1d21] rounded-lg p-6 max-w-sm mx-4">
                        <h3 className="header-text text-lg font-semibold text-amber-400 mb-3">
                            {title}
                        </h3>
                        <p className="text-slate-300 text-sm mb-6">
                            {body}
                        </p>
                        <div className="flex gap-3 justify-end">
                            <button
                                type="button"
                                onClick={onDismiss}
                                disabled={busy}
                                className="px-4 py-2 rounded bg-[#1a1d21] text-slate-300 hover:bg-[#252830] transition-colors disabled:opacity-50"
                            >
                                Cancel
                            </button>
                            <button
                                type="button"
                                onClick={onConfirm}
                                disabled={busy}
                                className="px-4 py-2 rounded bg-red-600 hover:bg-red-500 text-white font-medium transition-colors disabled:opacity-50"
                            >
                                {busy ? "Sending…" : "Confirm"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StopConfirmModal({ onConfirm, onDismiss, pipelineStatus }) {
            const escalationStop = pipelineStatus === "WAITING_FOR_HUMAN";
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                    <div className="bg-[#141618] border border-[#1a1d21] rounded-lg p-6 max-w-sm mx-4">
                        <h3 className="header-text text-lg font-semibold text-red-400 mb-3">
                            {escalationStop ? "Stop (human prompt)?" : "Stop Pipeline?"}
                        </h3>
                        <p className="text-slate-300 text-sm mb-6">
                            {escalationStop
                                ? "Send STOP to the orchestrator?"
                                : "Note that the stop will only take place after the current agent has finished their turn."}
                        </p>
                        <div className="flex gap-3 justify-end">
                            <button onClick={onDismiss} className="px-4 py-2 rounded bg-[#1a1d21] text-slate-300 hover:bg-[#252830] transition-colors">
                                Cancel
                            </button>
                            <button onClick={onConfirm} className="px-4 py-2 rounded bg-orange-600 hover:bg-orange-500 text-white font-medium transition-colors">
                                Stop Pipeline
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── EscalationCommandPanel ───────────────────────────────────────────────

        function EscalationCommandPanel({
            pipeline_status,
            escalation_trigger_reason,
            escalation_message,
            last_action,
            escalation_resets,
            orchestrator_alive,
        }) {
            const [commandSent, setCommandSent] = useState(false);
            const [lastSubmittedCommand, setLastSubmittedCommand] = useState(null);
            const [commandError, setCommandError] = useState("");
            const [prevStatus, setPrevStatus] = useState(pipeline_status);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [modalCommand, setModalCommand] = useState(null);
            const [confirmBusy, setConfirmBusy] = useState(false);

            const isResetDisabled = escalation_resets >= 3;

            useEffect(() => {
                if (prevStatus === "WAITING_FOR_HUMAN" && pipeline_status !== "WAITING_FOR_HUMAN") {
                    setCommandSent(false);
                    setLastSubmittedCommand(null);
                    setCommandError("");
                }
                setPrevStatus(pipeline_status);
            }, [pipeline_status, prevStatus]);

            if (pipeline_status !== "WAITING_FOR_HUMAN") return null;

            const headerText = commandSent
                ? "Command submitted"
                : escalation_trigger_reason || last_action || "Awaiting human command";
            const commandErrParts = commandError ? splitApiDetail(commandError) : null;

            const handleCommand = (command) => {
                if (command === "RESET_PHASE" || command === "RESET_REVIEWER" || command === "SKIP" || command === "STOP") {
                    setModalCommand(command);
                    setShowConfirmModal(true);
                    return;
                }
                sendCommand(command);
            };

            const sendCommand = async (command) => {
                setCommandError("");
                try {
                    const r = await fetch("/api/command", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ command }),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Request failed (${r.status})`;
                        setCommandError(msg);
                        return;
                    }
                    setLastSubmittedCommand(command);
                    setCommandSent(true);
                } catch (err) {
                    setCommandError(String(err?.message || err));
                }
            };

            const modalConfirm = async () => {
                if (!modalCommand) return;
                setConfirmBusy(true);
                setCommandError("");
                try {
                    let r;
                    if (modalCommand === "STOP") {
                        r = await fetch("/api/stop", { method: "POST" });
                    } else {
                        r = await fetch("/api/command", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ command: modalCommand }),
                        });
                    }
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Request failed (${r.status})`;
                        setCommandError(msg);
                        setShowConfirmModal(false);
                        setModalCommand(null);
                        return;
                    }
                    setLastSubmittedCommand(modalCommand);
                    setCommandSent(true);
                    setShowConfirmModal(false);
                    setModalCommand(null);
                } catch (err) {
                    setCommandError(String(err?.message || err));
                    setShowConfirmModal(false);
                    setModalCommand(null);
                } finally {
                    setConfirmBusy(false);
                }
            };

            const modalDismiss = () => {
                if (confirmBusy) return;
                setShowConfirmModal(false);
                setModalCommand(null);
            };

            // Commands shown in the main grid — left col: revert options, right col: flow control
            const GRID_COMMANDS = [
                { command: "RESET_PHASE",     label: "Revert to Planner",  desc: "Full reset: git rewind, new plan, re-run from the top.",      capped: true  },
                { command: "SKIP",            label: "Skip",               desc: "Mark this phase skipped and advance to the next.",            capped: false },
                { command: "RESET_EXECUTION", label: "Revert to Executor", desc: "Keep the plan. Re-run executor from a clean working tree.",   capped: true  },
                { command: "PROCEED",         label: "Proceed",            desc: "Accept current output as-is and advance (skips merge).",      capped: false },
                { command: "RESET_REVIEWER",  label: "Revert to Reviewer", desc: "Keep executor output. Re-run reviewer from scratch.",         capped: true  },
                { command: "STOP",            label: "Stop",               desc: "Halt the pipeline. No further phases will run.",              capped: false },
            ];

            const renderGridButton = ({ command, label, desc, capped }) => {
                const disabled = capped && isResetDisabled;
                const baseClass = "flex flex-col items-start text-left px-3 py-2 rounded bg-[#1a1d21] transition-colors";
                const cls = disabled
                    ? `${baseClass} opacity-50 cursor-not-allowed`
                    : `${baseClass} hover:bg-[#252830]`;
                const title = disabled ? "Reset cap reached (3/3). Use PROCEED or STOP." : undefined;
                return (
                    <button
                        key={command}
                        className={cls}
                        disabled={disabled}
                        title={title}
                        onClick={disabled ? undefined : () => handleCommand(command)}
                    >
                        <span className="header-text text-sm font-medium">{label}</span>
                        <span className="text-slate-400 text-xs mt-0.5 leading-snug">{desc}</span>
                    </button>
                );
            };

            return (
                <div className="border-2 border-orange-500 rounded-lg p-4 mt-4 bg-[#141618]/50">
                    <h3 className="header-text text-sm font-semibold text-orange-400 mb-1">
                        {headerText}
                    </h3>
                    {escalation_message && !commandSent ? (
                        <p className="text-slate-300 text-xs mb-3 leading-relaxed">
                            {escalation_message}
                        </p>
                    ) : null}
                    {isResetDisabled && !commandSent ? (
                        <p className="text-amber-500 text-xs mb-3">

        // ─── Stopped resume flow (shared: header Resume + StoppedRecoveryPanel) ───

        async function runStoppedResumeFlow(command) {
            const rr = await fetch("/api/resume-ready", { method: "POST" });
            const rd = await rr.json().catch(() => ({}));
            if (!rr.ok) {
                const msg =
                    typeof rd.detail === "string" ? rd.detail : `Resume-ready failed (${rr.status})`;
                return { ok: false, error: msg };
            }
            const cr = await fetch("/api/command", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command }),
            });
            const cd = await cr.json().catch(() => ({}));
            if (!cr.ok) {
                const msg =
                    typeof cd.detail === "string" ? cd.detail : `Command failed (${cr.status})`;
                return { ok: false, error: msg };
            }
            await fetch("/api/resume-orchestrator", { method: "POST" });
            return { ok: true };
        }

        // ─── StoppedRecoveryPanel ─────────────────────────────────────────────────

        function StoppedRecoveryPanel({ current_phase_raw_id, escalation_resets }) {
            const [sent, setSent] = useState(false);

            const RESUME_OPTIONS = [

                    desc: 'Continue from where it stopped',
                    capped: false,

                    desc: 'Keep the plan, retry execution from scratch',

        // ─── Activity Feed ────────────────────────────────────────────────────────

        function EventRow({ event, isExpanded, onToggle, isNew }) {

        function EscalationLogPanel({ events }) {
            function pairEscalations(allEvents) {
                const triggers = allEvents.filter(e => e.event_type === 'escalation_trigger');
                const resolves = allEvents.filter(e => e.event_type === 'escalation_resolve');
                const pairs = [];
                for (const trigger of triggers) {
                    const phase = trigger.phase;
                    const matchingResolve = resolves.find(r =>
                        r.phase === phase &&
                        r.ts && trigger.ts &&
                        new Date(r.ts) > new Date(trigger.ts)
                    );
                    pairs.push({ trigger, resolve: matchingResolve || null, phase });
                }
                return pairs.sort((a, b) => {
                    const aTs = a.trigger.ts || a.trigger.timestamp || '';
                    const bTs = b.trigger.ts || b.trigger.timestamp || '';
                    return bTs.localeCompare(aTs);
                });
            }
            
            const pairedEscalations = pairEscalations(events);
            
            if (!pairedEscalations || pairedEscalations.length === 0) {
                return (
                    <div className="text-slate-500 italic text-sm">No escalations recorded in this session.</div>
                );
            }
            
            function formatTime(ts) {
                if (!ts) return '—';
                const tsStr = ts.ts || ts.timestamp || ts;
                return tsStr.slice(11, 16);
            }
            
            function calculateDuration(triggerTs, resolveTs) {
                if (!triggerTs) return '—';
                const trigger = new Date(triggerTs);
                const resolve = resolveTs ? new Date(resolveTs) : new Date();
                const diffMs = resolve - trigger;
                if (diffMs < 0) return '—';
                const mins = Math.floor(diffMs / 60000);
                const secs = Math.floor((diffMs % 60000) / 1000);
                return `${mins}m ${String(secs).padStart(2, '0')}s`;
            }
            
            return (
                <div className="space-y-2">
                    {pairedEscalations.map((pair, index) => {
                        const trigger = pair.trigger;
                        const resolve = pair.resolve;
                        const isInProgress = !resolve;
                        return (
                            <div key={index} className="p-3 bg-[#141618] rounded border border-[#1a1d21]">
                                <div className="flex items-center gap-3 mb-2">
                                    <span className="header-text text-sm font-semibold text-slate-300">
                                        {pair.phase || '—'}
                                    </span>
                                    {isInProgress ? (
                                        <span className="px-2 py-0.5 rounded text-xs font-medium bg-orange-600 text-white">In Progress</span>
                                    ) : (
                                        <span className="px-2 py-0.5 rounded text-xs font-medium bg-green-600 text-white">Resolved</span>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div>
                                        <span className="text-slate-500">Triggered:</span>
                                        <span className="font-mono text-slate-300 ml-2">{formatTime(trigger)}</span>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Reason:</span>
                                        <span className="text-slate-300 ml-2">{trigger.detail || '—'}</span>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Command:</span>
                                        <span className="text-slate-300 ml-2">
                                            {isInProgress ? 'Awaiting command...' : (resolve.detail || '—')}
                                        </span>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Resolved:</span>
                                        <span className="font-mono text-slate-300 ml-2">
                                            {isInProgress ? 'Awaiting command...' : formatTime(resolve)}
                                        </span>
                                    </div>
                                    <div className="col-span-2">
                                        <span className="text-slate-500">Duration:</span>
                                        <span className="text-slate-300 ml-2">
                                            {isInProgress ? 'In progress...' : calculateDuration(trigger.ts || trigger.timestamp, resolve.ts || resolve.timestamp)}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function ActivityFeedPanel() {
            const [events, setEvents] = useState([]);
            const [expandedEventId, setExpandedEventId] = useState(null);
            const [newEventIds, setNewEventIds] = useState(new Set());
            const [activityTab, setActivityTab] = useState('activity');
            const eventSourceRef = useRef(null);
            const pollingIntervalRef = useRef(null);
            const isUsingSSE = useRef(true);

            useEffect(() => {
                fetchEvents();
                setupSSE();
                return () => {
                    if (eventSourceRef.current) eventSourceRef.current.close();
                    if (pollingIntervalRef.current) clearInterval(pollingIntervalRef.current);
                };
            }, []);

            function setupSSE() {
                try {
                    const eventSource = new EventSource('/api/events/stream');
                    eventSourceRef.current = eventSource;
                    eventSource.onmessage = (event) => {
                        if (event.type === 'heartbeat' || !event.data || event.data === '{}') return;
                        try {
                            const newEvent = JSON.parse(event.data);
                            const eventTs = newEvent.ts || newEvent.timestamp;
                            if (newEvent && newEvent.id) {
                                setEvents(prevEvents => {
                                    const isDuplicate = prevEvents.some(e => {
                                        const existingTs = e.ts || e.timestamp;
                                        return existingTs && eventTs && existingTs === eventTs;
                                    });
                                    if (isDuplicate) return prevEvents;
                                    setNewEventIds(prev => new Set([...prev, newEvent.id]));
                                    setTimeout(() => {
                                        setNewEventIds(prev => {
                                            const next = new Set(prev);
                                            next.delete(newEvent.id);
                                            return next;
                                        });
                                    }, 350);
                                    return [newEvent, ...prevEvents];
                                });
                            }
                        } catch (e) {
                            console.log('Failed to parse SSE event:', e);
                        }
                    };
                    eventSource.onerror = () => {
                        console.log('SSE connection error, falling back to polling');
                        eventSource.close();
                        isUsingSSE.current = false;
                        startPollingFallback();
                    };
                } catch (err) {
                    console.log('Failed to create EventSource, using polling fallback');
                    startPollingFallback();
                }
            }

            function startPollingFallback() {
                if (pollingIntervalRef.current) return;
                pollingIntervalRef.current = setInterval(() => { fetchEventsPolling(); }, 5000);
                const reconnectInterval = setInterval(() => {
                    if (!isUsingSSE.current) {
                        isUsingSSE.current = true;
                        setupSSE();
                        if (eventSourceRef.current) {
                            clearInterval(pollingIntervalRef.current);

            function fetchEventsPolling() {
                fetch('/api/events?limit=30')
                    .then(res => res.json())
                    .then(data => {
                        if (data.events && Array.isArray(data.events)) {
                            setEvents(prevEvents => {
                                const existingTs = new Set(prevEvents.map(e => e.ts || e.timestamp));
                                const newEvents = data.events.filter(e => {
                                    const ts = e.ts || e.timestamp;
                                    if (existingTs.has(ts)) return false;
                                    existingTs.add(ts);
                                    return true;
                                });
                                if (newEvents.length === 0) return prevEvents;
                                newEvents.forEach(e => {
                                    setNewEventIds(prev => new Set([...prev, e.id]));
                                    setTimeout(() => {
                                        setNewEventIds(prev => {
                                            const next = new Set(prev);
                                            next.delete(e.id);
                                            return next;
                                        });
                                    }, 350);
                                });
                                return [...newEvents, ...prevEvents];
                            });
                        }
                    })
                    .catch(() => {});

        /** Client fallback if API parsed.questions is empty but raw response still has a QUESTIONS block */
        function parseAgentResponseClient(content) {
            if (!content || typeof content !== "string") {
                return { prose: "", drafting: null, assumptions: [], questions: [] };
            }
            const lines = content.split(/\r?\n/);
            let drafting = null;
            const assumptions = [];
            const questions = [];
            const proseLines = [];
            let startIdx = 0;
            if (lines.length && lines[0].startsWith("DRAFTING:")) {
                drafting = lines[0].slice("DRAFTING:".length).trim();
                startIdx = 1;
            }
            let inQuestions = false;
            let current = null;
            const flushQ = () => {
                if (current) {
                    questions.push(current);
                    current = null;
                }
            };
            let i = startIdx;
            while (i < lines.length) {
                const line = lines[i];
                const stripped = line.trim();
                const qu = stripped.toUpperCase();
                if (qu === "QUESTIONS" || qu.startsWith("QUESTIONS:")) {
                    inQuestions = true;
                    flushQ();
                    i++;
                    continue;
                }
                if (inQuestions) {
                    if (stripped.startsWith("[SINGLE]") || stripped.startsWith("[MULTI]")) {
                        flushQ();
                        const isSingle = stripped.startsWith("[SINGLE]");
                        const rest = stripped.slice(isSingle ? "[SINGLE]".length : "[MULTI]".length).trim();
                        current = { type: isSingle ? "single" : "multi", text: rest, options: [] };
                    } else if (/^\d+[\.\)]\s+/.test(stripped)) {
                        flushQ();
                        const qtext = stripped.replace(/^\d+[\.\)]\s+/, "").trim();
                        current = { type: "single", text: qtext, options: [] };
                    } else if ((stripped.startsWith("- ") || stripped.startsWith("* ")) && current) {
                        current.options.push(stripped.slice(2).trim());
                    } else if (!stripped) {
                        /* keep */
                    } else if (!current && stripped && !stripped.startsWith("[")) {
                        current = { type: "single", text: stripped, options: [] };
                    } else {
                        flushQ();
                        inQuestions = false;
                        if (line.startsWith("ASSUMPTION:")) assumptions.push(line.slice("ASSUMPTION:".length).trim());
                        else proseLines.push(line);
                    }
                    i++;
                    continue;
                }
                if (line.startsWith("ASSUMPTION:")) {
                    assumptions.push(line.slice("ASSUMPTION:".length).trim());
                    i++;
                    continue;
                }
                proseLines.push(line);
                i++;
            }
            flushQ();
            return { prose: proseLines.join("\n").trim(), drafting, assumptions, questions };
        }

        function QuestionFlow({ questions, onSubmit }) {
            const [index, setIndex] = React.useState(0);
            const [selections, setSelections] = React.useState({});
            const [freeTexts, setFreeTexts] = React.useState({});

            const q = questions[index];
            if (!q) return null;

            const sel = selections[index] || [];
            const ft = freeTexts[index] || "";
            const hasAnswer = sel.length > 0 || ft.trim().length > 0;
            const isLast = index === questions.length - 1;

            const toggleOption = (opt) => {
                if (q.type === "single") {
                    setSelections((prev) => ({ ...prev, [index]: [opt] }));
                } else {
                    setSelections((prev) => {
                        const current = prev[index] || [];
                        const next = current.includes(opt)
                            ? current.filter((o) => o !== opt)
                            : [...current, opt];
                        return { ...prev, [index]: next };
                    });
                }
            };

            const advance = () => {
                if (!hasAnswer) return;
                if (isLast) {
                    const parts = questions.map((qItem, i) => {
                        const chosen = selections[i] || [];
                        const free = (freeTexts[i] || "").trim();
                        const answerParts = [...chosen];
                        if (free) answerParts.push(free);
                        return `Q: ${qItem.text}\nA: ${answerParts.join(", ")}`;
                    });
                    onSubmit(`[ANSWERS]\n${parts.join("\n")}\n[/ANSWERS]`);
                } else {
                    setIndex((i) => i + 1);
                }
            };

            return (
                <div className="mt-3 rounded border border-[#2a2d31] bg-[#0d0f11] p-4 space-y-3">
                    <div className="flex items-start justify-between gap-2">
                        <p className="text-sm text-slate-200 font-medium leading-snug">{q.text}</p>
                        <div className="flex items-center gap-1 shrink-0 mt-0.5">
                            <button type="button" onClick={() => setIndex((i) => i - 1)} disabled={index === 0} className="text-[10px] text-slate-500 hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed px-0.5">&lt;</button>
                            <span className="text-[10px] text-slate-600">{index + 1}/{questions.length}</span>
                            <button type="button" onClick={() => setIndex((i) => i + 1)} disabled={index >= questions.length - 1} className="text-[10px] text-slate-500 hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed px-0.5">&gt;</button>
                        </div>
                    </div>
                    <div className="space-y-1.5">
                        {q.options.map((opt) => {
                            const active = sel.includes(opt);
                            return (
                                <button
                                    key={opt}
                                    type="button"
                                    onClick={() => toggleOption(opt)}
                                    onKeyDown={(e) => { if (e.key === " ") { e.preventDefault(); toggleOption(opt); } }}
                                    className={`w-full text-left text-xs px-3 py-2 rounded border transition-colors ${
                                        active
                                            ? "border-[#00b4d8] bg-[#00b4d8]/20 text-[#7dd3fc]"
                                            : "border-[#2a2d31] bg-[#141618] text-slate-400 hover:border-slate-500 hover:text-slate-300"
                                    }`}
                                >
                                    {q.type === "single" ? (active ? "● " : "○ ") : (active ? "☑ " : "☐ ")}{opt}
                                </button>
                            );
                        })}
                    </div>
                    <div>
                        <input
                            type="text"
                            value={ft}
                            onChange={(e) => setFreeTexts((prev) => ({ ...prev, [index]: e.target.value }))}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); advance(); } }}
                            placeholder="Or add your own answer…"
                            className="w-full bg-[#141618] border border-[#2a2d31] rounded px-3 py-1.5 text-xs text-slate-300 placeholder-slate-600 focus:outline-none focus:border-slate-500"
                        />
                    </div>
                    <div className="flex justify-end">
                        <button
                            type="button"
                            onClick={advance}
                            disabled={!hasAnswer}
                            className="header-text text-xs px-4 py-1.5 rounded border border-[#00b4d8]/50 bg-[#00b4d8] text-[#0d0f11] font-semibold hover:brightness-110 disabled:bg-[#2a2d31] disabled:text-slate-600 disabled:border-[#2a2d31] disabled:cursor-not-allowed"
                        >
                            {isLast ? "Submit Answers" : "Next →"}
                        </button>
                    </div>
                </div>
            );
        }

                    rafId = requestAnimationFrame(() => {
                        rafId = null;
                        const rect = containerRef.current.getBoundingClientRect();
                        const totalW = rect.width;
                        const minPct = (480 / totalW) * 100;
                        const maxPct = ((totalW - 520) / totalW) * 100;
                        const pct = Math.min(Math.max(((e.clientX - rect.left) / totalW) * 100, minPct), maxPct);
                        setSplitPct(pct);
                    });
                };
                const onMouseUp = () => { dragRef.current.dragging = false; };

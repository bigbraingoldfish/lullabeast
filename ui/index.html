                return () => {
                    window.removeEventListener("mousemove", onMouseMove);
                    window.removeEventListener("mouseup", onMouseUp);
                    if (rafId) cancelAnimationFrame(rafId);
                };
            }, []);

            const refreshAnnotations = (ideaId) => {
                if (!ideaId) return;
                fetch(`/api/ideas/${ideaId}/annotations`)
                    .then((r) => r.ok ? r.json() : [])
                    .then((data) => setAnnotations(data || []))
                    .catch(() => setAnnotations([]));
            };

            useEffect(() => {
                if (!currentIdeaId) return;
                setReadinessTimedOut(false);
                setHadReadyReadiness(false);
                setAnnotations([]);
                setEditingAnnotationSection(null);
                setAnnotationDraft("");
                setOpenAnnotationBubble(null);
                setUserFirstTurnPending(false);
                fetch(`/api/ideas/${currentIdeaId}/session`)
                    .then((r) => r.json())
                    .then((d) => {
                        const rawMsgs = d.messages || [];
                        setMessages(
                            rawMsgs.map((m, idx) => ({
                                ...m,
                                id: m.id || `${m.role}-${idx}-${(m.ts || "").slice(0, 19) || idx}`,
                            }))
                        );
                        setPrdContent(d.prd_content || "");
                        setRoadmapContent(d.roadmap_content || "");
                    })
                    .catch(() => {});
                refreshAnnotations(currentIdeaId);
                fetch(`/api/ideas/${currentIdeaId}/readiness`)
                    .then((r) => r.json())
                    .then((d) => {
                        const nextStatus = d.status || "unavailable";
                        const nextData = d.data || null;
                        setReadinessStatus(nextStatus);
                        setReadinessData(nextData);
                        if (nextStatus === "ready" && nextData) setHadReadyReadiness(true);
                        if (d.status === "updating") startReadinessPoll(currentIdeaId);
                        else stopReadinessPoll();
                    })
                    .catch(() => {
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                    });
            }, [currentIdeaId]);

            const adjustTa = () => {
                const el = taRef.current;
                if (!el) return;
                el.style.height = "auto";
                const lh = 22;
                const maxH = lh * 5;
                el.style.height = Math.min(el.scrollHeight, maxH) + "px";
            };

            const triggerDraftingIndicator = (sectionName) => {
                if (draftingTimerRef.current) clearTimeout(draftingTimerRef.current);
                setDraftingIndicator(sectionName);
                draftingTimerRef.current = setTimeout(() => setDraftingIndicator(null), 3000);
            };

            const submitMessage = (overrideText) => {
                const t = (overrideText !== undefined ? overrideText : inputText).trim();
                if (!t || isLoading || !currentIdeaId) return;
                setUserFirstTurnPending(false);
                const turn = messages.filter((m) => m.role === "user").length + 1;
                const userMsgId = `u-${Date.now()}`;
                const assistantPendingId = `a-${Date.now()}`;
                const nowIso = new Date().toISOString();
                const attachment = stagedAttachment;
                setMessages((prev) => [
                    ...prev,
                    { id: userMsgId, role: "user", content: t, ts: nowIso },
                    { id: assistantPendingId, role: "assistant", content: "Working on your request...", ts: nowIso, pending: true },
                ]);
                if (overrideText === undefined) setInputText("");
                setTimeout(() => adjustTa(), 0);
                setStagedAttachment(null);
                setIsLoading(true);
                const body = { content: t, turn };
                if (attachment) body.attachment = attachment;
                fetch(`/api/ideas/${currentIdeaId}/message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then((r) => {
                        if (!r.ok) throw new Error(String(r.status));
                        return r.json();
                    })
                    .then((data) => {
                        let parsed = data.parsed || null;
                        if (data.response) {
                            const clientParsed = parseAgentResponseClient(data.response);
                            if (!parsed) {
                                parsed = clientParsed;
                            } else if ((!parsed.questions || parsed.questions.length === 0) && clientParsed.questions && clientParsed.questions.length > 0) {
                                parsed = { ...parsed, questions: clientParsed.questions };
                            }
                        }
                        const displayContent = (parsed && parsed.prose) ? parsed.prose : (data.response || "No agent output returned for this turn.");
                        if (parsed && parsed.drafting) triggerDraftingIndicator(parsed.drafting);
                        setMessages((prev) =>
                            prev.map((m) =>
                                m.id === assistantPendingId
                                    ? { ...m, pending: false, content: displayContent, ts: new Date().toISOString(), parsed }
                                    : m
                            )
                        );
                        setPrdContent(data.prd_content || "");
                        setIsLoading(false);
                        setReadinessStatus("updating");
                        setReadinessData(null);
                        setReadinessTimedOut(false);
                        startReadinessPoll(currentIdeaId);
                        refreshAnnotations(currentIdeaId);
                        refreshIdeas();
                    })
                    .catch(() => {
                        setMessages((prev) =>
                            prev.map((m) =>
                                m.id === assistantPendingId
                                    ? {
                                          ...m,
                                          pending: false,
                                          error: true,
                                          content: "Message sent but agent response failed or timed out. You can retry.",
                                          ts: new Date().toISOString(),
                                      }
                                    : m
                            )
                        );
                        setStagedAttachment(null);
                        setIsLoading(false);
                    });
            };

            const onKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    submitMessage();
                }
            };

            const newIdea = () => {
                fetch("/api/ideas", { method: "POST" })
                    .then((r) => r.json())
                    .then((d) => {
                        setCurrentIdeaId(d.id);
                        setMessages([]);
                        setPrdContent("");
                        setRoadmapContent("");
                        setInputText("");
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                        setHadReadyReadiness(false);
                        setReadinessTimedOut(false);
                        setClarityPass(null);
                        setChatsRailCollapsed(false);
                        setActiveIdeaMenuId(null);
                        setShowActionMenu(false);
                        setStagedAttachment(null);
                        setSessionModalIdeaId(d.id);
                        setShowSessionModal(true);
                    });
            };

            const handleSessionStartConversation = () => {
                if (sessionModalBusy) return;
                const ideaId = sessionModalIdeaId;
                if (!ideaId) return;
                setSessionModalBusy(true);
                setShowSessionModal(false);
                setSessionModalIdeaId(null);
                setUserFirstTurnPending(true);
                setMessages([]);
                setIsLoading(false);
                setSessionModalBusy(false);
            };

            const handleSessionUpload = () => {
                if (sessionModalBusy) return;
                setSessionModalBusy(true);
                setUserFirstTurnPending(false);
                setShowSessionModal(false);
                setSessionModalIdeaId(null);
                setSessionModalBusy(false);
                if (fileRef.current) fileRef.current.click();
            };

            const selectIdeaFromRail = (id) => {
                setCurrentIdeaId(id);
                setActiveIdeaMenuId(null);
            };

            const executeDelete = (id) => {
                fetch(`/api/ideas/${id}`, { method: "DELETE" }).then(() => {
                    setDeleteConfirmId(null);
                    refreshIdeas();
                    if (currentIdeaId === id) {
                        setMessages([]);
                        setPrdContent("");
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                        setHadReadyReadiness(false);
                        setReadinessTimedOut(false);
                        setCurrentIdeaId(null);
                    }
                });
            };

            const doConvert = () => {
                if (!currentIdeaId || !prdContent.trim()) return;
                setConvertLoading(true);
                setConvertError("");
                fetch(`/api/ideas/${currentIdeaId}/convert`, { method: "POST" })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { throw new Error(t); });
                        return r.json();
                    })
                    .then((d) => {
                        setRoadmapContent(d.roadmap_content || "");
                        setConvertLoading(false);
                    })
                    .catch((e) => {
                        setConvertError(String(e.message || e));
                        setConvertLoading(false);
                    });
            };

            const continueSetup = () => {
                const rm = roadmapContent || "";
                if (rm.includes("Transformation Aborted")) {
                    setShowContinueWarning(true);
                    return;
                }
                setContinueNavPending(true);
                fetch("/api/setup/validate-roadmap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: rm }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setContinueNavPending(false);
                        if (!r.ok || !d.valid) {
                            setShowContinueWarning(true);
                            return;
                        }
                        if (ctx && ctx.navigateToPreflightWithSeed) {
                            ctx.navigateToPreflightWithSeed(rm, prdContent || "");
                        }
                    })
                    .catch(() => {
                        setContinueNavPending(false);
                        setShowContinueWarning(true);
                    });
            };

            const proceedContinueAnyway = () => {
                setShowContinueWarning(false);
                if (ctx && ctx.navigateToPreflightWithSeed) {
                    ctx.navigateToPreflightWithSeed(roadmapContent || "", prdContent || "");
                }
            };

            const listedIds = new Set((ideasList || []).map((it) => it.id));
            const showUnlistedSession = currentIdeaId && !listedIds.has(currentIdeaId);
            const currentIdeaName =
                (ideasList.find((it) => it.id === currentIdeaId) || {}).name ||
                (currentIdeaId ? currentIdeaId.slice(0, 8) : "Conversation");

            const slugifySectionName = (name) =>
                String(name || "")
                    .toLowerCase()
                    .replace(/&/g, "and")
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "");

            const parsePrdSections = (content) => {
                const out = {};
                PRD_SECTION_TITLES.forEach((t) => {
                    out[t] = "";
                });
                if (!content || !content.trim()) return out;
                const lines = String(content).split("\n");
                let current = null;
                for (const line of lines) {
                    const heading = line.match(/^#{1,3}\s+(.+)\s*$/);
                    if (heading) {
                        const matched = PRD_SECTION_TITLES.find(
                            (t) => t.toLowerCase() === heading[1].trim().toLowerCase()
                        );
                        if (matched) {
                            current = matched;
                            continue;
                        }
                    }
                    const numHeading = line.match(/^\d+\.\s*(.+)\s*$/);
                    if (numHeading) {
                        const rawTitle = numHeading[1].trim();
                        const matched = PRD_SECTION_TITLES.find(
                            (t) => t.toLowerCase() === rawTitle.toLowerCase()
                        );
                        if (matched) {
                            current = matched;
                            continue;
                        }
                    }
                    if (current) {
                        out[current] = out[current] ? `${out[current]}\n${line}` : line;
                    }
                }
                return out;
            };

            const prdSections = parsePrdSections(prdContent || "");
            const readinessSectionMap =
                readinessStatus === "ready" && readinessData && readinessData.sections
                    ? readinessData.sections
                    : {};
            const checklistRows = PRD_SECTION_TITLES.map((title) => {
                const info = readinessSectionMap[title] || {};
                const status =
                    info.status === "complete" || info.status === "partial" ? info.status : "empty";
                return {
                    title,
                    status,
                    criticality: info.criticality || "",
                    content: (prdSections[title] || "").trim(),
                };
            });

            return (
                <div className="flex h-full min-w-0">
                    {showSessionModal && (
                        <SessionStartModal
                            busy={sessionModalBusy}
                            onStartConversation={handleSessionStartConversation}
                            onUpload={handleSessionUpload}
                            onClose={() => { if (!sessionModalBusy) { setShowSessionModal(false); setSessionModalIdeaId(null); } }}
                        />
                    )}
                    {/* Vertical chat list — collapses after picking a chat so conversation + PRD get space */}
                    <div
                        className={`${
                            chatsRailCollapsed ? "w-16" : "w-56 sm:w-60"
                        } relative flex-shrink-0 flex flex-col bg-[#0d0f11] border-r border-[#1a1d21] transition-[width] duration-200 ease-out`}
                    >
                        {!chatsRailCollapsed ? (
                            <>
                                <div className="flex-shrink-0 flex items-center justify-between gap-2 px-3 py-2 border-b border-[#1a1d21]">
                                    <span className="header-text text-xs text-slate-400 uppercase tracking-wide">Chats</span>
                                    <button
                                        type="button"
                                        onClick={newIdea}
                                        className="header-text text-xs px-2 py-1 rounded bg-[#1a1d21] text-[#00b4d8] border border-[#1a1d21] hover:border-[#00b4d8]/50"
                                    >
                                        + New
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto py-2 px-2 space-y-1 min-h-0">
                                    {ideasLoading ? (
                                        <>
                                            {[0, 1, 2].map((idx) => (
                                                <div key={`idea-skel-${idx}`} className="rounded border border-[#1a1d21] bg-[#1a1d21] px-2 py-2 animate-pulse">
                                                    <div className="h-2.5 w-3/4 rounded bg-[#2a2d31]"></div>
                                                    <div className="mt-2 h-2 w-1/3 rounded bg-[#24282d]"></div>
                                                </div>
                                            ))}
                                        </>
                                    ) : (
                                        <>
                                    {showUnlistedSession ? (
                                        <div className="rounded border border-dashed border-[#2a2d31] bg-[#141618]/50">
                                            <button
                                                type="button"
                                                onClick={() => selectIdeaFromRail(currentIdeaId)}
                                                className={`w-full text-left px-2 py-2 rounded ${
                                                    currentIdeaId && !listedIds.has(currentIdeaId)
                                                        ? "ring-1 ring-[#00b4d8]/40 bg-[#1a1d21]/60"
                                                        : ""
                                                }`}
                                            >
                                                <div className="text-slate-200 truncate text-xs font-medium header-text">Draft</div>
                                                <div className="text-slate-500 truncate text-[11px]">Not listed until first turn completes</div>
                                            </button>
                                        </div>
                                    ) : null}
                                    {ideasList.map((it) => (
                                        <div
                                            key={it.id}
                                            className={`group flex rounded border border-transparent ${
                                                currentIdeaId === it.id ? "border-[#00b4d8]/40 bg-[#1a1d21]" : "hover:bg-[#1a1d21]/70"
                                            }`}
                                        >
                                            <button
                                                type="button"
                                                onClick={() => selectIdeaFromRail(it.id)}
                                                className="flex-1 min-w-0 text-left px-2 py-2"
                                            >
                                                <div className="text-slate-200 truncate text-xs font-medium header-text">{it.name || it.id}</div>
                                                <div className="text-slate-500 truncate text-[11px]">{it.updated ? relativeTime(it.updated) : "—"}</div>
                                            </button>
                                            {deleteConfirmId === it.id ? (
                                                <div className="flex flex-col gap-1 px-1.5 py-1 border-l border-[#1a1d21] bg-[#141618]/80 shrink-0 min-w-[88px]">
                                                    <span className="text-[10px] text-slate-400 header-text">Delete?</span>
                                                    <div className="flex gap-1 flex-wrap">
                                                        <button
                                                            type="button"
                                                            className="text-[11px] text-red-400 hover:underline"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                executeDelete(it.id);
                                                            }}
                                                        >
                                                            Delete
                                                        </button>
                                                        <button
                                                            type="button"
                                                            className="text-[11px] text-slate-500 hover:text-slate-300"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                setDeleteConfirmId(null);
                                                            }}
                                                        >
                                                            Cancel
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="relative shrink-0">
                                                    <button
                                                        type="button"
                                                        className="px-2 text-slate-500 hover:text-slate-200 hover:bg-[#141618] text-sm opacity-40 group-hover:opacity-100 focus:opacity-100 transition-opacity"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setActiveIdeaMenuId((id) => (id === it.id ? null : it.id));
                                                        }}
                                                        aria-label="Idea actions"
                                                    >
                                                        ⋮
                                                    </button>
                                                    {activeIdeaMenuId === it.id && (
                                                        <div className="absolute right-1 top-7 z-30 min-w-[120px] rounded border border-[#2a2d31] bg-[#141618]">
                                                            <button
                                                                type="button"
                                                                className="w-full text-left px-3 py-2 text-xs text-red-400 hover:bg-[#1a1d21]"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    setDeleteConfirmId(it.id);
                                                                    setActiveIdeaMenuId(null);
                                                                }}
                                                            >
                                                                Delete idea
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {ideasList.length === 0 && !showUnlistedSession ? (
                                        <p className="text-slate-600 text-xs italic px-1 py-2">No ideas yet. Click + New.</p>
                                    ) : null}
                                        </>
                                    )}
                                </div>
                            </>
                        ) : null}
                        <div className="side-divider"></div>
                        <button
                            type="button"
                            onClick={() => setChatsRailCollapsed((c) => !c)}
                            className="side-divider-btn"
                            title={chatsRailCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                            aria-label={chatsRailCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                        >
                            {chatsRailCollapsed ? "›" : "‹"}
                        </button>
                    </div>

                    <div ref={containerRef} className="flex flex-1 min-w-0">
                    <div style={{ width: splitPct + "%" }} className="flex-shrink-0 flex flex-col min-w-0 bg-[#141618] overflow-hidden">
                        <div className="flex-shrink-0 border-b border-[#1a1d21] px-3 py-2 flex items-center justify-between gap-2">
                            <span className="header-text text-xs text-slate-500 truncate">{currentIdeaName}</span>
                            {currentIdeaId && readinessStatus === "updating" && (
                                <span className="text-[10px] shrink-0 text-slate-500 animate-pulse header-text">Assessing…</span>
                            )}
                            {currentIdeaId && readinessStatus === "ready" && readinessData && (
                                <span className={`text-[10px] shrink-0 header-text font-semibold ${readinessData.overall_status === "ready" ? "text-emerald-400" : readinessData.overall_status === "approaching_ready" ? "text-amber-400" : "text-red-400"}`}>
                                    {typeof readinessData.score === "number" ? readinessData.score : "—"}/10{readinessData.conversion_confidence ? ` · ${readinessData.conversion_confidence}` : ""}
                                </span>
                            )}
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-2 min-h-0">
                            {!currentIdeaId ? (
                                <p className="text-slate-600 text-xs italic">Select an idea from the list or click + New to start.</p>
                            ) : userFirstTurnPending && messages.length === 0 ? (
                                <div className="flex flex-col items-center justify-center text-center px-6 py-10 min-h-[180px]">
                                    <p className="text-slate-200 text-sm header-text mb-2">Tell us about your idea</p>
                                    <p className="text-slate-500 text-xs max-w-sm leading-relaxed">
                                        Let's build documentation together. Describe what you're building in the box below and send your first message — the agent will pick up from there.
                                    </p>
                                </div>
                            ) : messages.length === 0 ? (
                                <p className="text-slate-600 text-xs italic">No messages yet — type below to start.</p>
                            ) : null}
                            {messages.map((msg, i) => (
                                <div key={msg.id || i} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                                    {msg.role === "user" ? (
                                        <div className="max-w-[95%] rounded px-3 py-2 text-sm bg-[#00b4d8]/20 text-slate-100">
                                            {msg.content}
                                        </div>
                                    ) : (
                                        <div className="max-w-[95%] w-full flex flex-col gap-1">
                                            {/* Assumption blocks */}
                                            {msg.parsed && msg.parsed.assumptions && msg.parsed.assumptions.map((assumption, ai) => (
                                                <div key={ai} className="flex items-start gap-2 rounded border border-amber-700/50 bg-amber-950/20 px-3 py-2 text-xs text-amber-200">
                                                    <span className="shrink-0 mt-0.5">⚠</span>
                                                    <span className="italic">{assumption}</span>
                                                </div>
                                            ))}
                                            {/* Prose bubble */}
                                            {(msg.content || "").trim().length > 0 && (
                                                <div
                                                    className={`msg-md rounded px-3 py-2 text-sm ${
                                                        msg.error
                                                            ? "bg-red-950/30 border border-red-900/60 text-red-200"
                                                            : msg.pending
                                                              ? "bg-[#1a1d21] text-slate-400 border border-slate-600/50 chat-pending-soft"
                                                              : "bg-[#1a1d21] text-slate-200"
                                                    }`}
                                                    dangerouslySetInnerHTML={{
                                                        __html:
                                                            typeof marked !== "undefined" && marked.parse
                                                                ? marked.parse(msg.content || "", { breaks: true })
                                                                : String(msg.content || "")
                                                                      .replace(/&/g, "&amp;")
                                                                      .replace(/</g, "&lt;"),
                                                    }}
                                                />
                                            )}
                                            {/* Question flow — shown for the last assistant message if questions present and not yet answered */}
                                            {msg.parsed && msg.parsed.questions && msg.parsed.questions.length > 0 && !answeredFlowIds.has(msg.id) && (
                                                <QuestionFlow
                                                    questions={msg.parsed.questions}
                                                    onSubmit={(bundled) => {
                                                        setAnsweredFlowIds((prev) => new Set([...prev, msg.id]));
                                                        submitMessage(bundled);
                                                    }}
                                                />
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))}
                            <div ref={messagesEndRef} />
                        </div>
                        <div className="flex-shrink-0 border-t border-[#1a1d21] p-3 space-y-2 bg-[#141618]">
                            {/* Hidden file inputs */}
                            <input ref={fileRef} type="file" accept=".md" className="hidden" onChange={(e) => handleFileChange(e, currentIdeaId, setUploadError, setUploadSpinner, triggerClarityCheck, setClarityPass, setClarityIssues, setClarityMissing)} />
                            <input ref={attachFileRef} type="file" accept=".md" className="hidden" onChange={(e) => {
                                const f = e.target.files && e.target.files[0];
                                if (!f) return;
                                const reader = new FileReader();
                                reader.onload = (ev) => setStagedAttachment({ filename: f.name, content: ev.target.result });
                                reader.readAsText(f);
                                e.target.value = "";
                            }} />
                            {uploadSpinner && <p className="text-slate-500 text-xs">Synthesizing document…</p>}
                            {uploadError && <p className="text-red-400 text-xs">{uploadError}</p>}
                            {/* Staged attachment pill + annotation pill */}
                            {(stagedAttachment || annotations.filter((a) => !a.submitted).length > 0) && (
                                <div className="flex flex-wrap gap-1.5">
                                    {stagedAttachment && (
                                        <div className="flex items-center gap-1.5 px-2 py-1 rounded bg-[#1a1d21] border border-[#2a2d31] text-xs text-slate-300">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                                            <span className="max-w-[180px] truncate">{stagedAttachment.filename}</span>
                                            <button type="button" onClick={() => setStagedAttachment(null)} className="text-slate-500 hover:text-slate-200 ml-0.5">✕</button>
                                        </div>
                                    )}
                                    {annotations.filter((a) => !a.submitted).length > 0 && (
                                        <div className="flex items-center gap-1.5 px-2 py-1 rounded bg-amber-950/30 border border-amber-700/40 text-xs text-amber-300">
                                            <span>✎</span>
                                            <span>{annotations.filter((a) => !a.submitted).length} section note{annotations.filter((a) => !a.submitted).length !== 1 ? "s" : ""} ready</span>
                                        </div>
                                    )}
                                </div>

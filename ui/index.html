<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDev Pipeline Monitor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #0d0f12; color: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .status-pulse { animation: amber-pulse 2s ease-in-out infinite; }
    @keyframes amber-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .ideas-doc-loading-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: transparent;
      animation: ideas-doc-pulse 1.5s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes ideas-doc-pulse { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.35; } }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #1a1d21; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #3f4451; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Global state helpers ──────────────────────────────────────────────────
    // These are referenced by IdeasScreen via closures in the same script scope

    // ─── App Component ──────────────────────────────────────────────────────────
    function App() {
      const [currentScreen, setCurrentScreen] = useState('ideas');
      const [seedRoadmap, setSeedRoadmap] = useState('');
      const [repoPath, setRepoPath] = useState('');
      const [repoPathLocked, setRepoPathLocked] = useState(false);
      const [roadmapSeed, setRoadmapSeed] = useState('');
      const [roadmapSeedLocked, setRoadmapSeedLocked] = useState(false);
      const [pipelineStatus, setPipelineStatus] = useState(null);
      const [currentAgent, setCurrentAgent] = useState('');
      const [currentPhaseRawId, setCurrentPhaseRawId] = useState('');
      const [currentPhase, setCurrentPhase] = useState(null);
      const [roadmap, setRoadmap] = useState([]);
      const [plannerRetries, setPlannerRetries] = useState(0);
      const [executorRetries, setExecutorRetries] = useState(0);
      const [reviewerRetries, setReviewerRetries] = useState(0);
      const [lastErrorCode, setLastErrorCode] = useState(null);
      const [lastActionTimestamp, setLastActionTimestamp] = useState(null);
      const [events, setEvents] = useState([]);
      const [showEscalationPanel, setShowEscalationPanel] = useState(false);
      const [escalationCommand, setEscalationCommand] = useState('');
      const [escalationResult, setEscalationResult] = useState(null);
      const [isEscalationLoading, setIsEscalationLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('activity');
      const [isResponsiveCollapsed, setIsResponsiveCollapsed] = useState(false);

      useEffect(() => {
        fetch('/api/state')
          .then(r => r.json())
          .then(data => {
            setPipelineStatus(data.pipeline_status);
            setCurrentAgent(data.current_agent || '');
            setCurrentPhaseRawId(data.current_phase_raw_id || '');
            setCurrentPhase(data.current_phase);
            setPlannerRetries(data.planner_retries || 0);
            setExecutorRetries(data.executor_retries || 0);
            setReviewerRetries(data.reviewer_retries || 0);
            setLastErrorCode(data.last_error_code || null);
            setLastActionTimestamp(data.last_action_timestamp || null);
          })
          .catch(() => {});

        fetch('/api/roadmap')
          .then(r => r.json())
          .then(data => { if (Array.isArray(data)) setRoadmap(data); })
          .catch(() => {});

        fetch('/api/events?limit=30')
          .then(r => r.json())
          .then(data => { if (data.events) setEvents(data.events); })
          .catch(() => {});

        const es = new EventSource('/api/events/stream');
        es.onmessage = (e) => {
          try {
            const event = JSON.parse(e.data);
            setEvents(prev => [event, ...prev].slice(0, 50));
          } catch {}
        };
        es.onerror = () => es.close();

        const interval = setInterval(() => {
          fetch('/api/state').then(r => r.json()).then(data => {
            setPipelineStatus(data.pipeline_status);
            setCurrentAgent(data.current_agent || '');
            setCurrentPhaseRawId(data.current_phase_raw_id || '');
            setPlannerRetries(data.planner_retries || 0);
            setExecutorRetries(data.executor_retries || 0);
            setReviewerRetries(data.reviewer_retries || 0);
            setLastErrorCode(data.last_error_code || null);
          }).catch(() => {});
        }, 3000);

        return () => { es.close(); clearInterval(interval); };
      }, []);

      const navigateToPreflight = (roadmapContent) => {
        setSeedRoadmap(roadmapContent || '');
        if (roadmapContent) {
          setRoadmapSeed(roadmapContent);
          setRoadmapSeedLocked(true);
        }
        setCurrentScreen('preflight');
      };

      if (currentScreen === 'ideas') {
        return React.createElement(IdeasScreen, { navigateToPreflight });
      }

      if (currentScreen === 'preflight') {
        return React.createElement(PreflightScreen, {
          seedRoadmap,
          repoPath,
          repoPathLocked,
          roadmapSeed,
          roadmapSeedLocked,
          onRepoPathChange: setRepoPath,
          onRepoPathLockToggle: () => setRepoPathLocked(v => !v),
          onRoadmapSeedChange: setRoadmapSeed,
          onRoadmapSeedLockToggle: () => setRoadmapSeedLocked(v => !v),
          onBack: () => setCurrentScreen('ideas'),
        });
      }

      return React.createElement('div', { className: 'flex flex-col h-screen' },
        React.createElement(Header, { pipelineStatus, currentAgent, currentPhaseRawId, plannerRetries, executorRetries, reviewerRetries }),
        React.createElement('div', { className: 'flex flex-1 overflow-hidden' },
          React.createElement('div', { className: `flex-1 flex flex-col border-r border-[#1a1d21] ${isResponsiveCollapsed ? 'hidden md:flex' : 'flex'}` },
            React.createElement(ActivityFeedTabBar, { activeTab, setActiveTab }),
            activeTab === 'activity'
              ? React.createElement(ActivityFeed, { events })
              : React.createElement(EscalationLogTab, { events }),
            React.createElement(EscalationCommandPanel, { showEscalationPanel, setShowEscalationPanel, escalationCommand, setEscalationCommand, escalationResult, setEscalationResult, isEscalationLoading, setIsEscalationLoading, pipelineStatus })
          ),
          React.createElement('div', { className: 'flex-1 flex flex-col overflow-hidden' },
            React.createElement(CurrentPhasePanel, { currentPhase, currentPhaseRawId, pipelineStatus, lastErrorCode, lastActionTimestamp }),
            React.createElement('div', { className: 'right-panel flex-1 overflow-hidden' },
              React.createElement(RoadmapPanel, { roadmap })
            )
          ),
          React.createElement('button', {
            className: 'md:hidden absolute top-16 right-2 z-10 p-2 bg-[#1e2028] rounded border border-[#1a1d21] text-xs',
            onClick: () => setIsResponsiveCollapsed(c => !c)
          }, isResponsiveCollapsed ? 'Show Activity' : 'Hide Activity')
        )
      );
    }

    const PIPELINE_STATUS_DOT_CLASS = {
      'RUNNING': 'bg-green-500 status-pulse',
      'WAITING_FOR_SENTINEL': 'bg-amber-500 status-pulse',
      'WAITING_FOR_HUMAN': 'bg-orange-500',
      'HALTED_SILENT': 'bg-red-600',
      'BLOCKED': 'bg-red-600',
    };

    function Header({ pipelineStatus, currentAgent, currentPhaseRawId, plannerRetries, executorRetries, reviewerRetries }) {
      const statusColor = pipelineStatus === 'RUNNING' ? 'text-green-400' : pipelineStatus === 'WAITING_FOR_HUMAN' ? 'text-yellow-400' : 'text-slate-400';
      const phaseDotClass = PIPELINE_STATUS_DOT_CLASS[pipelineStatus] || 'bg-slate-600';
      return React.createElement('div', { className: 'flex items-center justify-between px-4 py-2 border-b border-[#1a1d21] bg-[#141618] text-xs' },
        React.createElement('div', { className: 'flex items-center gap-3' },
          React.createElement('span', { className: 'font-bold text-[#3b82f6] text-sm' }, 'AutoDev'),
          React.createElement('span', { className: `flex items-center gap-1.5 ${statusColor}` },
            React.createElement('span', { className: `w-1.5 h-1.5 rounded-full ${phaseDotClass}` }),
            pipelineStatus || 'UNKNOWN'
          ),
          currentAgent ? React.createElement('span', { className: 'text-slate-500' }, `agent: ${currentAgent}`) : null,
          currentPhaseRawId ? React.createElement('span', { className: 'text-[#3b82f6]' }, currentPhaseRawId) : null
        ),
        React.createElement('div', { className: 'flex items-center gap-3 text-slate-500' },
          React.createElement('span', null, `planner_retries: ${plannerRetries}`),
          React.createElement('span', null, `executor_retries: ${executorRetries}`),
          React.createElement('span', null, `reviewer_retries: ${reviewerRetries}`)
        )
      );
    }

    function ActivityFeedTabBar({ activeTab, setActiveTab }) {
      return React.createElement('div', { className: 'flex border-b border-[#1a1d21] text-xs' },
        ['activity', 'log'].map(tab =>
          React.createElement('button', {
            key: tab,
            className: `px-4 py-2 ${activeTab === tab ? 'text-[#3b82f6] border-b-2 border-[#3b82f6]' : 'text-slate-500'}`,
            onClick: () => setActiveTab(tab)
          }, tab.charAt(0).toUpperCase() + tab.slice(1))
        )
      );
    }

    function ActivityFeed({ events }) {
      return React.createElement('div', { className: 'flex-1 overflow-y-auto scrollbar-thin p-4 space-y-2' },
        events.length === 0
          ? React.createElement('p', { className: 'text-slate-600 text-xs' }, 'No events yet.')
          : events.map((ev, i) =>
              React.createElement('div', {
                key: ev.id || i,
                className: `fade-in p-2 rounded bg-[#1e2028] border border-[#1a1d21] ${i === 0 ? 'border-[#3b82f6]/30' : ''}`
              },
                React.createElement('div', { className: 'flex items-center justify-between mb-1' },
                  React.createElement('span', { className: 'text-[#3b82f6] text-xs font-bold' }, ev.event_type || 'event'),
                  React.createElement('span', { className: 'text-slate-600 text-xs' }, ev.ts ? new Date(ev.ts).toLocaleTimeString() : '')
                ),
                ev.agent ? React.createElement('p', { className: 'text-slate-400 text-xs' }, `agent: ${ev.agent}`) : null,
                ev.phase ? React.createElement('p', { className: 'text-slate-400 text-xs' }, `phase: ${ev.phase}`) : null,
                ev.detail ? React.createElement('p', { className: 'text-slate-300 text-xs mt-1' }, ev.detail) : null
              )
            )
      );
    }

    function EscalationLogTab({ events }) {
      const escalations = events.filter(e => e.event_type === 'escalation' || e.event_type === 'blame');
      return React.createElement('div', { className: 'flex-1 overflow-y-auto scrollbar-thin p-4 space-y-2' },
        escalations.length === 0
          ? React.createElement('p', { className: 'text-slate-600 text-xs' }, 'No escalations.')
          : escalations.map((ev, i) =>
              React.createElement('div', { key: ev.id || i, className: 'fade-in p-2 rounded bg-red-900/20 border border-red-800/30' },
                React.createElement('p', { className: 'text-red-400 text-xs font-bold' }, ev.event_type),
                ev.detail ? React.createElement('p', { className: 'text-slate-300 text-xs mt-1' }, ev.detail) : null
              )
            )
      );
    }

    function EscalationCommandPanel({ showEscalationPanel, setShowEscalationPanel, escalationCommand, setEscalationCommand, escalationResult, setEscalationResult, isEscalationLoading, setIsEscalationLoading, pipelineStatus }) {
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!escalationCommand) return;
        setIsEscalationLoading(true);
        setEscalationResult(null);
        try {
          const r = await fetch('/api/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: escalationCommand })
          });
          const data = await r.json();
          setEscalationResult({ status: r.status, body: data });
        } catch (err) {
          setEscalationResult({ status: 0, body: { detail: String(err) } });
        } finally {
          setIsEscalationLoading(false);
        }
      };
      return React.createElement('div', { className: 'border-t border-[#1a1d21]' },
        React.createElement('button', {
          className: 'w-full text-left px-4 py-2 text-xs text-slate-500 hover:text-slate-300 border-t border-[#1a1d21]',
          onClick: () => setShowEscalationPanel(v => !v)
        }, showEscalationPanel ? '▲ Escalation Commands' : '▶ Escalation Commands'),
        showEscalationPanel && React.createElement('form', { onSubmit: handleSubmit, className: 'p-3 space-y-2' },
          React.createElement('div', { className: 'flex flex-wrap gap-1' },
            ['RETRY', 'RESET_EXECUTION', 'RESET_PHASE', 'SKIP', 'PROCEED', 'STOP'].map(cmd =>
              React.createElement('button', {
                key: cmd, type: 'button',
                className: `px-2 py-1 text-xs rounded border ${escalationCommand === cmd ? 'bg-[#3b82f6] border-[#3b82f6]' : 'border-[#1a1d21] text-slate-500 hover:border-slate-600'}`,
                onClick: () => setEscalationCommand(cmd)
              }, cmd)
            )
          ),
          React.createElement('button', {
            type: 'submit',
            disabled: !escalationCommand || isEscalationLoading || pipelineStatus !== 'WAITING_FOR_HUMAN',
            className: 'px-3 py-1.5 text-xs bg-[#3b82f6] hover:bg-[#2563eb] disabled:opacity-40 disabled:cursor-not-allowed rounded'
          }, isEscalationLoading ? '...' : 'Execute'),
          escalationResult && React.createElement('pre', { className: 'text-xs text-slate-400 bg-[#0d0f12] p-2 rounded overflow-x-auto' },
            JSON.stringify(escalationResult.body, null, 2)
          )
        )
      );
    }

    function CurrentPhasePanel({ currentPhase, currentPhaseRawId, pipelineStatus, lastErrorCode, lastActionTimestamp }) {
      const isInProgress = pipelineStatus === 'RUNNING';
      return React.createElement('div', { className: 'p-3 border-b border-[#1a1d21] bg-[#141618]' },
        React.createElement('div', { className: 'flex items-center gap-2 mb-1' },
          isInProgress && React.createElement('span', { className: 'w-2 h-2 rounded-full bg-green-500 status-pulse' }),
          currentPhaseRawId && React.createElement('span', { className: 'text-xs font-bold text-[#3b82f6]' }, currentPhaseRawId),
          currentPhase && React.createElement('span', { className: 'text-xs text-slate-400' }, currentPhase.detail || '')
        ),
        React.createElement('div', { className: 'flex gap-4 text-xs text-slate-500' },
          lastErrorCode ? React.createElement('span', { className: 'text-red-400' }, `error: ${lastErrorCode}`) : null,
          lastActionTimestamp ? React.createElement('span', null, `last: ${new Date(lastActionTimestamp).toLocaleTimeString()}`) : null
        )
      );
    }

    function RoadmapPanel({ roadmap }) {
      const total = roadmap.length;
      const complete = roadmap.filter(p => p.status === 'complete').length;
      const pct = total > 0 ? Math.round((complete / total) * 100) : 0;
      const statusIcons = { complete: '✓', in_progress: '▶', pending: '○', skipped: '⊘', blocked: '⚠' };
      const statusColors = { complete: 'text-slate-500', in_progress: 'text-[#3b82f6] border-l-4 border-[#3b82f6]', pending: 'text-slate-400', skipped: 'text-slate-600', blocked: 'text-red-400 bg-red-900/10' };
      return React.createElement('div', { className: 'flex-1 flex flex-col overflow-hidden p-4' },
        React.createElement('div', { className: 'mb-3' },
          React.createElement('div', { className: 'flex justify-between text-xs text-slate-500 mb-1' },
            React.createElement('span', null, 'Progress'),
            React.createElement('span', null, `${complete} / ${total} complete`)
          ),
          React.createElement('div', { className: 'h-1.5 bg-[#1a1d21] rounded-full overflow-hidden' },
            React.createElement('div', { className: 'h-full bg-[#3b82f6] transition-all', style: { width: `${pct}%` } })
          )
        ),
        React.createElement('div', { className: 'flex-1 overflow-y-auto scrollbar-thin space-y-1' },
          roadmap.map((phase, i) =>
            React.createElement('div', {
              key: phase.id || i,
              className: `p-2 rounded text-xs flex items-start gap-2 ${statusColors[phase.status] || 'text-slate-400'} ${phase.status === 'complete' ? 'opacity-60' : ''} ${phase.status === 'in_progress' ? 'bg-[#1e2028]' : ''}`
            },
              React.createElement('span', { className: 'mt-0.5 flex-shrink-0' }, statusIcons[phase.status] || '○'),
              React.createElement('div', { className: 'flex-1 min-w-0' },
                React.createElement('span', { className: 'font-bold mr-2' }, phase.id),
                React.createElement('span', { className: 'text-slate-400 truncate' }, phase.goal)
              )
            )
          )
        )
      );
    }

    // ─── triggerClarityCheck ────────────────────────────────────────────────────
    function triggerClarityCheck(currentIdeaId) {
      return fetch(`/api/ideas/${currentIdeaId}/clarity-check`, { method: 'POST' })
        .then(r => r.json())
        .then(data => data);
    }

    // ─── handleFileChange ───────────────────────────────────────────────────────
    function handleFileChange(e, deps) {
      const file = e.target.files && e.target.files[0];
      if (e.target) e.target.value = '';
      if (!file || !deps.ideaId) return;
      const lower = file.name.toLowerCase();
      if (!lower.endsWith('.md')) {
        deps.setUploadError('Only .md files are accepted');
        return;
      }
      deps.setUploadError('');
      deps.setUploadSpinner(true);
      const fd = new FormData();
      fd.append('file', file, file.name);
      fetch(`/api/ideas/${deps.ideaId}/upload`, { method: 'POST', body: fd })
        .then(async (r) => {
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            deps.setUploadError(err.detail || 'Upload failed');
            return;
          }
          return r.json();
        })
        .then((data) => {
          if (!data) return;
          deps.setPrdContent(data.prd_content || '');
          return fetch(`/api/ideas/${deps.ideaId}/session`).then((r) => r.json());
        })
        .then((session) => {
          if (session && session.messages) deps.setMessages(session.messages || []);
          if (deps.refreshIdeas) deps.refreshIdeas();
          triggerClarityCheck(deps.ideaId).then((d) => {
            deps.setClarityPass(d.pass);
            deps.setClarityIssues(d.issues || []);
            deps.setClarityMissing(d.missing_sections || []);
          });
        })
        .catch(() => deps.setUploadError('Upload failed'))
        .finally(() => deps.setUploadSpinner(false));
    }

    // ─── IdeasScreen ────────────────────────────────────────────────────────────
    function IdeasScreen({ navigateToPreflight }) {
      void '1';
      const [ideas, setIdeas] = useState([]);
      const [selectedIdeaId, setSelectedIdeaId] = useState(null);
      const [renameDraft, setRenameDraft] = useState('');
      const [renamingId, setRenamingId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [prdContent, setPrdContent] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [inputValue, setInputValue] = useState('');
      const textareaRef = useRef(null);
      const [uploadError, setUploadError] = useState('');
      const [uploadSpinner, setUploadSpinner] = useState(false);
      const [clarityPass, setClarityPass] = useState(null);
      const [clarityIssues, setClarityIssues] = useState([]);
      const [clarityMissing, setClarityMissing] = useState([]);
      const [roadmapContent, setRoadmapContent] = useState('');
      const [isConverting, setIsConverting] = useState(false);
      const [convertError, setConvertError] = useState('');
      const [readiness, setReadiness] = useState(null);
      const [showRoadmap, setShowRoadmap] = useState(false);

      const refreshIdeas = () => {
        fetch('/api/ideas')
          .then((r) => r.json())
          .then((list) => {
            if (Array.isArray(list)) setIdeas(list);
          })
          .catch(() => {});
      };

      useEffect(() => {
        refreshIdeas();
      }, []);

      useEffect(() => {
        if (ideas.length && !selectedIdeaId) {
          setSelectedIdeaId(ideas[0].id);
        }
      }, [ideas, selectedIdeaId]);

      useEffect(() => {
        if (!selectedIdeaId) return;
        fetch(`/api/ideas/${selectedIdeaId}/session`)
          .then((r) => r.json())
          .then((data) => {
            setMessages(data.messages || []);
            setPrdContent(data.prd_content || '');
            setRoadmapContent(data.roadmap_content || '');
            if (data.roadmap_content) setShowRoadmap(true);
          })
          .catch(() => {});
      }, [selectedIdeaId]);

      useEffect(() => {
        if (!selectedIdeaId || !prdContent) return;
        fetch(`/api/ideas/${selectedIdeaId}/readiness`)
          .then((r) => r.json())
          .then((data) => setReadiness(data))
          .catch(() => {});
      }, [selectedIdeaId, prdContent]);

      const resizeTextarea = () => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = 'auto';
        const max = 120;
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      };

      useEffect(() => {
        resizeTextarea();
      }, [inputValue]);

      const handleSendMessage = async () => {
        if (!inputValue.trim() || isLoading || !selectedIdeaId) return;
        const userMsg = inputValue.trim();
        const turn = Math.floor(messages.length / 2) + 1;
        setInputValue('');
        setIsLoading(true);
        setMessages((prev) => [...prev, { role: 'user', content: userMsg, ts: new Date().toISOString() }]);
        try {
          const r = await fetch(`/api/ideas/${selectedIdeaId}/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: userMsg, turn }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.detail || r.status);
          setPrdContent(data.prd_content || '');
          setMessages((prev) => [...prev, { role: 'assistant', content: data.response || '', ts: new Date().toISOString() }]);
          refreshIdeas();
        } catch (e) {
          setMessages((prev) => [
            ...prev,
            { role: 'assistant', content: 'Error: ' + e.message, ts: new Date().toISOString() },
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      };

      const saveRename = async (id) => {
        const name = renameDraft.trim();
        if (!name || !id) {
          setRenamingId(null);
          return;
        }
        await fetch(`/api/ideas/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        }).catch(() => {});
        setRenamingId(null);
        refreshIdeas();
      };

      const handleGenerateRoadmap = async () => {
        if (!prdContent || isConverting || !selectedIdeaId) return;
        setIsConverting(true);
        setConvertError('');
        try {
          const r = await fetch(`/api/ideas/${selectedIdeaId}/convert`, { method: 'POST' });
          if (r.status === 503) {
            setConvertError('Conversion prompt file missing (503)');
            return;
          }
          if (r.status === 408) {
            setConvertError('Conversion timed out (408)');
            return;
          }
          if (!r.ok) {
            setConvertError('Conversion failed: ' + r.status);
            return;
          }
          const data = await r.json();
          setRoadmapContent(data.roadmap_content || '');
          setShowRoadmap(true);
        } catch (e) {
          setConvertError('Conversion error: ' + e.message);
        } finally {
          setIsConverting(false);
        }
      };

      const handleDownloadRoadmap = () => {
        if (!selectedIdeaId) return;
        window.location.href = `/api/ideas/${selectedIdeaId}/download-roadmap`;
      };

      const handleDownloadPrd = () => {
        if (!selectedIdeaId) return;
        window.location.href = `/api/ideas/${selectedIdeaId}/download`;
      };

      const prdSections = [
        '## Problem Statement',
        '## Goals & Success Metrics',
        '## User Stories',
        '## Functional Requirements',
        '## Edge Cases',
        '## Non-Functional Requirements',
        '## Dependencies & Integrations',
        '## Milestones & Timeline',
        '## Risks & Mitigations',
        '## Open Questions',
        '## Glossary & Domain Terms',
        '## Revision History',
      ];

      const getSectionContent = (header) => {
        if (!prdContent) return '';
        const lines = prdContent.split('\n');
        const idx = lines.findIndex((l) => l.trim() === header);
        if (idx === -1) return '';
        const nextIdx = lines.slice(idx + 1).findIndex((l) => l.trim().startsWith('## '));
        const end = nextIdx === -1 ? lines.length : idx + 1 + nextIdx;
        return lines.slice(idx + 1, end).join('\n').trim();
      };

      const prdBlocks = prdContent ? prdContent.split('\n\n') : [];

      const canGenerateRoadmap = readiness && readiness.ready && prdContent;
      const isReady = readiness && readiness.ready;

      return (
        <div className="flex h-full overflow-hidden">
          <div className="w-[38%] flex-shrink-0 flex flex-col bg-[#141618] overflow-hidden border-r border-[#1a1d21]">
            <div className="flex items-center justify-between px-3 py-2 border-b border-[#1a1d21]">
              <span className="text-xs font-bold text-slate-400 uppercase">Ideas</span>
              <button
                type="button"
                onClick={() => {
                  fetch('/api/ideas', { method: 'POST' })
                    .then((r) => r.json())
                    .then((d) => {
                      if (d.id) setSelectedIdeaId(d.id);
                      refreshIdeas();
                    })
                    .catch(() => {});
                }}
                className="px-2 py-1 text-xs rounded bg-[#3b82f6] hover:bg-[#2563eb] text-white"
              >
                New Idea
              </button>
            </div>
            <div className="max-h-36 overflow-y-auto scrollbar-thin shrink-0 divide-y divide-[#1a1d21] border-b border-[#1a1d21]">
              {ideas.map((it) => (
                <div
                  key={it.id}
                  className={`px-3 py-2 cursor-pointer text-sm ${selectedIdeaId === it.id ? 'bg-[#1e2028]' : 'hover:bg-[#1a1d21]'}`}
                  onClick={() => setSelectedIdeaId(it.id)}
                >
                  {renamingId === it.id ? (
                    <input
                      className="w-full bg-[#0d0f12] border border-[#3b82f6] rounded px-2 py-1 text-xs text-slate-200"
                      value={renameDraft}
                      autoFocus
                      onChange={(e) => setRenameDraft(e.target.value)}
                      onBlur={() => saveRename(it.id)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') saveRename(it.id);
                        if (e.key === 'Escape') setRenamingId(null);
                      }}
                    />
                  ) : (
                    <span
                      className="text-slate-200 font-medium"
                      onDoubleClick={(e) => {
                        e.stopPropagation();
                        setRenamingId(it.id);
                        setRenameDraft(it.name || it.id);
                      }}
                    >
                      {it.name || it.id}
                    </span>
                  )}
                </div>
              ))}
            </div>
            <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
              {messages.length === 0 && (
                <p className="text-slate-600 text-sm text-center mt-8">No messages yet. Type below to start.</p>
              )}
              {messages.map((m, i) => (
                <div key={i} className={`fade-in ${m.role === 'user' ? 'text-right' : 'text-left'}`}>
                  <div
                    className={`inline-block max-w-[85%] px-3 py-2 rounded text-sm ${
                      m.role === 'user' ? 'bg-cyan-700 text-white' : 'bg-[#1e2028] text-slate-300'
                    }`}
                  >
                    {m.content.split('\n').map((line, j) => (
                      <p key={j}>{line}</p>
                    ))}
                  </div>
                </div>
              ))}
              {isLoading && (
                <div className="text-left">
                  <div className="inline-block bg-[#1e2028] px-3 py-2 rounded text-sm text-slate-400 status-pulse">Thinking...</div>
                </div>
              )}
            </div>
            <div className="border-t border-[#1a1d21] p-3">
              <div className="flex gap-2 items-end">
                <textarea
                  ref={textareaRef}
                  rows={1}
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder="Type a message..."
                  disabled={!selectedIdeaId}
                  className="flex-1 bg-[#1e2028] border border-[#1a1d21] rounded px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-[#3b82f6] resize-none min-h-[40px] max-h-[120px]"
                />
                <button
                  type="button"
                  onClick={handleSendMessage}
                  disabled={isLoading || !inputValue.trim() || !selectedIdeaId}
                  className="px-3 py-2 bg-[#3b82f6] hover:bg-[#2563eb] disabled:opacity-40 rounded text-sm"
                >
                  Send
                </button>
              </div>
            </div>
          </div>

          <div className="flex-1 flex flex-col bg-[#141618] overflow-hidden relative">
            {isLoading && <div className="ideas-doc-loading-overlay" aria-hidden="true" />}
            <div className="flex items-center justify-between px-4 py-2 border-b border-[#1a1d21] relative z-10">
              <div className="flex items-center gap-3">
                <span className="text-sm font-bold text-slate-300">PRD Document</span>
                {clarityPass === true && (
                  <span className="text-xs px-2 py-0.5 rounded bg-green-900/30 text-green-400 border border-green-800/30">ready to convert</span>
                )}
                {clarityPass === false && (
                  <span className="text-xs px-2 py-0.5 rounded bg-red-900/30 text-red-400 border border-red-800/30">needs revision</span>
                )}
                {isReady && (
                  <span className="text-xs px-2 py-0.5 rounded bg-blue-900/30 text-blue-400 border border-blue-800/30">✓ ready</span>
                )}
              </div>
              <div className="flex items-center gap-2 flex-wrap justify-end">
                {prdContent.trim().length > 0 && (
                  <button
                    type="button"
                    onClick={handleDownloadPrd}
                    className="px-3 py-1.5 text-xs rounded border border-[#1a1d21] text-slate-400 hover:text-slate-200 hover:border-slate-600"
                  >
                    Download PRD
                  </button>
                )}
                <input
                  type="file"
                  accept=".md"
                  onChange={(e) =>
                    handleFileChange(e, {
                      ideaId: selectedIdeaId,
                      setPrdContent,
                      setUploadError,
                      setUploadSpinner,
                      setClarityPass,
                      setClarityIssues,
                      setClarityMissing,
                      setMessages,
                      refreshIdeas,
                    })
                  }
                  className="hidden"
                  id="prd-upload"
                />
                <label
                  htmlFor="prd-upload"
                  className={`px-3 py-1.5 text-xs rounded border border-[#1a1d21] cursor-pointer hover:border-slate-600 ${uploadSpinner ? 'opacity-50' : ''}`}
                >
                  {uploadSpinner ? 'Uploading...' : 'Upload PRD'}
                </label>
                <button
                  type="button"
                  onClick={handleGenerateRoadmap}
                  disabled={!canGenerateRoadmap || isConverting}
                  className={`px-3 py-1.5 text-xs rounded border text-white transition-colors ${
                    canGenerateRoadmap && !isConverting
                      ? 'bg-[#3b82f6] hover:bg-[#2563eb] border-[#3b82f6]'
                      : 'bg-slate-700 border-slate-600 opacity-50 cursor-not-allowed'
                  }`}
                >
                  {isConverting ? 'Converting...' : 'Generate Roadmap'}
                </button>
                {roadmapContent && (
                  <button
                    type="button"
                    onClick={handleDownloadRoadmap}
                    className="px-3 py-1.5 text-xs rounded border border-[#1a1d21] text-slate-400 hover:text-slate-200 hover:border-slate-600"
                  >
                    Download Roadmap
                  </button>
                )}
                {roadmapContent && (
                  <button
                    type="button"
                    onClick={() => navigateToPreflight && navigateToPreflight(roadmapContent)}
                    className="px-3 py-1.5 text-xs rounded bg-green-700 hover:bg-green-600 text-white border border-green-600"
                  >
                    Continue to setup
                  </button>
                )}
              </div>
            </div>

            {uploadError && (
              <div className="px-4 py-2 text-xs text-red-400 bg-red-900/10 border-b border-red-800/20 relative z-10">{uploadError}</div>
            )}
            {convertError && (
              <div className="px-4 py-2 text-xs text-red-400 bg-red-900/10 border-b border-red-800/20 relative z-10">{convertError}</div>
            )}
            {clarityPass === false && clarityMissing.length > 0 && (
              <div className="px-4 py-2 text-xs text-red-400 bg-red-900/10 border-b border-red-800/20 relative z-10">
                Missing sections: {clarityMissing.join(', ')}
              </div>
            )}
            {clarityPass === false && clarityIssues.length > 0 && (
              <div className="px-4 py-2 text-xs text-yellow-400 bg-yellow-900/10 border-b border-yellow-800/20 relative z-10">
                {clarityIssues.map((iss, i) => (
                  <div key={i}>{iss}</div>
                ))}
              </div>
            )}

            <div className="flex-1 overflow-y-auto scrollbar-thin p-6 space-y-4 relative z-0">
              {prdSections.map((section, i) => {
                const content = getSectionContent(section);
                const isEmpty = !content;
                return (
                  <div key={i}>
                    <h2 className="text-sm font-bold text-slate-300 mb-1">{section.replace('## ', '')}</h2>
                    {isEmpty ? (
                      <p className="text-slate-600 italic text-sm">({section.replace('## ', '').toLowerCase()} placeholder)</p>
                    ) : (
                      content.split('\n').map((line, j) => (
                        <p key={j} className="text-sm text-slate-300 leading-relaxed font-semibold">
                          {line}
                        </p>
                      ))
                    )}
                  </div>
                );
              })}
            </div>

            {showRoadmap && roadmapContent && (
              <div className="border-t border-[#1a1d21] max-h-64 overflow-y-auto scrollbar-thin p-4 bg-[#0d0f12]">
                <div className="flex items-center justify-between mb-2">
                  <h3 className="text-sm font-bold text-slate-300">Generated Roadmap</h3>
                  <button type="button" onClick={handleDownloadRoadmap} className="text-xs text-[#3b82f6] hover:text-[#60a5fa]">
                    Download Roadmap
                  </button>
                </div>
                <pre className="text-xs text-slate-400 whitespace-pre-wrap font-mono">{roadmapContent}</pre>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── PreflightScreen ────────────────────────────────────────────────────────
    function PreflightScreen({
      seedRoadmap,
      repoPath,
      repoPathLocked,
      roadmapSeed,
      roadmapSeedLocked,
      onRepoPathChange,
      onRepoPathLockToggle,
      onRoadmapSeedChange,
      onRoadmapSeedLockToggle,
      onBack,
    }) {
      const handleRoadmapFilePick = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => { onRoadmapSeedChange(ev.target.result || ''); };
        reader.readAsText(file);
      };

      const [repoPathError, setRepoPathError] = React.useState('');
      const [validationResult, setValidationResult] = React.useState(null);
      const [isValidating, setIsValidating] = React.useState(false);
      const [preflightChecks, setPreflightChecks] = React.useState(null);
      const [preflightRan, setPreflightRan] = React.useState(false);
      const [isRunningPreflight, setIsRunningPreflight] = React.useState(false);
      const [isLaunching, setIsLaunching] = React.useState(false);
      const [launchError, setLaunchError] = React.useState(null);

      const roadmapPrePopulated = !!(seedRoadmap && seedRoadmap.length > 0);
      const roadmapPreview = roadmapSeed.length > 40
        ? roadmapSeed.substring(0, 40) + '...'
        : roadmapSeed;

      const autoValidateRef = React.useRef(false);
      React.useEffect(() => {
        if (autoValidateRef.current) return;
        if (!(roadmapPrePopulated && roadmapSeedLocked && roadmapSeed.trim())) return;
        autoValidateRef.current = true;
        fetch('/api/setup/validate-roadmap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: roadmapSeed }),
        })
          .then((r) => r.json())
          .then((data) => setValidationResult(data))
          .catch(() => {});
      }, [roadmapPrePopulated, roadmapSeedLocked, roadmapSeed]);

      const roadmapValid =
        roadmapSeedLocked && roadmapSeed.trim().length > 0;
      const noPreflightFail =
        preflightRan &&
        preflightChecks &&
        preflightChecks.length > 0 &&
        !preflightChecks.some((c) => c.status === 'fail');
      const canLaunch =
        repoPathLocked &&
        repoPath.trim().length > 0 &&
        roadmapValid &&
        validationResult &&
        validationResult.valid &&
        noPreflightFail;

      async function confirmRepoPath() {
        setRepoPathError('');
        const res = await fetch('/api/setup/validate-repo-path', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: repoPath }),
        });
        const data = await res.json();
        if (!data.valid) {
          setRepoPathError(data.error || 'Invalid path');
          return;
        }
        if (!repoPathLocked) onRepoPathLockToggle();
      }

      async function confirmRoadmapSeed() {
        if (!roadmapSeed.trim()) return;
        setIsValidating(true);
        setValidationResult(null);
        try {
          const res = await fetch('/api/setup/validate-roadmap', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: roadmapSeed }),
          });
          const data = await res.json();
          setValidationResult(data);
          if (data.valid && !roadmapSeedLocked) onRoadmapSeedLockToggle();
        } finally {
          setIsValidating(false);
        }
      }

      const handleRunPreflight = () => {
        if (!repoPath || !repoPathLocked) return;
        setIsRunningPreflight(true);
        setPreflightChecks(null);
        fetch('/api/setup/preflight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_path: repoPath }),
        })
          .then((r) => r.json())
          .then((data) => {
            setPreflightChecks(data.checks || []);
            setPreflightRan(true);
            setIsRunningPreflight(false);
          })
          .catch(() => setIsRunningPreflight(false));
      };

      const handleLaunch = () => {
        if (!canLaunch) return;
        setIsLaunching(true);
        setLaunchError(null);
        fetch('/api/setup/launch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_path: repoPath, roadmap_seed: roadmapSeed }),
        })
          .then((r) => r.json())
          .then((data) => {
            setIsLaunching(false);
            if (data.ok) {
              onBack();
            } else {
              setLaunchError(data.error || 'Launch failed');
            }
          })
          .catch((err) => {
            setIsLaunching(false);
            setLaunchError(String(err));
          });
      };

      return (
        <div className="flex flex-col h-screen bg-[#141618]">
          <div className="flex items-center gap-4 px-4 py-3 border-b border-[#1a1d21] bg-[#141618]">
            <button type="button" onClick={onBack}
              className="px-3 py-1.5 text-xs rounded border border-[#1a1d21] text-slate-400 hover:text-slate-200 hover:border-slate-600">
              ← Back to Ideas
            </button>
            <span className="text-sm font-bold text-slate-300">Screen 2 — Project Setup</span>
          </div>

          <div className="flex-1 overflow-y-auto scrollbar-thin p-6 space-y-8">

            <div>
              <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Repository Path</label>
              <div className="flex items-center justify-end gap-2 mb-2">
                {repoPathLocked && (
                  <span className="text-green-400 text-sm font-bold" aria-hidden="true">✓</span>
                )}
                <button
                  type="button"
                  onClick={() => (repoPathLocked ? onRepoPathLockToggle() : confirmRepoPath())}
                  className="px-3 py-1 text-xs rounded border border-[#1a1d21] text-slate-300 hover:border-[#00b4d8]"
                >
                  {repoPathLocked ? 'Edit' : 'Confirm'}
                </button>
              </div>
              <input
                type="text"
                readOnly={repoPathLocked}
                value={repoPath}
                onChange={(e) => !repoPathLocked && onRepoPathChange(e.target.value)}
                placeholder="Enter the full path to your project directory (e.g. /home/pi/projects/my-project)"
                className={`w-full px-3 py-2 text-sm rounded border font-mono ${
                  repoPathLocked
                    ? 'bg-[#0d0f12] border-[#1a1d21] text-slate-500 cursor-default'
                    : 'bg-[#1e2028] border-[#1a1d21] text-slate-200 focus:outline-none focus:border-[#00b4d8]'
                }`}
              />
              {repoPathError && <p className="mt-2 text-xs text-red-400">{repoPathError}</p>}
            </div>

            <div>
              <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Roadmap Seed</label>
              <div className="flex items-center justify-end gap-2 mb-2">
                {roadmapSeedLocked && validationResult && validationResult.valid && (
                  <span className="text-green-400 text-sm font-bold" aria-hidden="true">✓</span>
                )}
                <button
                  type="button"
                  onClick={() =>
                    roadmapSeedLocked ? onRoadmapSeedLockToggle() : confirmRoadmapSeed()
                  }
                  disabled={isValidating}
                  className="px-3 py-1 text-xs rounded border border-[#1a1d21] text-slate-300 hover:border-[#00b4d8] disabled:opacity-50"
                >
                  {roadmapSeedLocked ? 'Edit' : isValidating ? '…' : 'Confirm'}
                </button>
              </div>
              {roadmapSeed ? (
                <div>
                  {roadmapPrePopulated && (
                    <span className="text-xs text-green-400 mb-2 block">From Project Ideas</span>
                  )}
                  {!roadmapPrePopulated && !roadmapSeedLocked && (
                    <input type="file" accept=".md" onChange={handleRoadmapFilePick}
                      className="block w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-[#1e2028] file:text-slate-300 hover:file:bg-[#252830] mb-3" />
                  )}
                  <pre className="text-xs text-slate-400 whitespace-pre-wrap font-mono bg-[#1e2028] p-4 rounded border border-[#1a1d21] max-h-96 overflow-y-auto scrollbar-thin">
                    {roadmapSeed}
                  </pre>
                </div>
              ) : (
                <input type="file" accept=".md" onChange={handleRoadmapFilePick}
                  className="block w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-[#1e2028] file:text-slate-300 hover:file:bg-[#252830]" />
              )}

              {validationResult && (
                <div className={`mt-3 p-3 rounded border text-xs ${validationResult.valid ? 'border-green-800 bg-green-950 text-green-300' : 'border-red-800 bg-red-950 text-red-300'}`}>
                  {validationResult.valid ? (
                    <span>✓ Roadmap format is valid</span>
                  ) : (
                    <div>
                      <div className="font-bold mb-2">✗ Validation errors ({validationResult.errors.length}):</div>
                      {validationResult.errors.map((err, i) => (
                        <div key={i} className="mb-1 font-mono">
                          {err.line > 0 && <span className="text-red-400">Line {err.line}: </span>}
                          {err.message}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>

            {repoPathLocked && repoPath && (
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Preflight Check</label>
                  <button type="button" onClick={handleRunPreflight} disabled={isRunningPreflight}
                    className={`px-3 py-1.5 text-xs rounded border transition-colors ${isRunningPreflight ? 'bg-slate-700 border-slate-600 text-slate-500 cursor-not-allowed' : 'bg-[#1a1d21] border-[#1a1d21] text-slate-300 hover:border-[#00b4d8]'}`}>
                    {isRunningPreflight ? 'Running...' : 'Run Preflight'}
                  </button>
                </div>

                {preflightChecks && (
                  <div className="space-y-1">
                    {preflightChecks.map((check, i) => (
                      <div key={i} className={`flex items-start gap-2 text-xs px-3 py-2 rounded border ${
                        check.status === 'pass' ? 'border-green-900 bg-green-950 text-green-300' :
                        check.status === 'fail' ? 'border-red-900 bg-red-950 text-red-300' :
                        'border-yellow-900 bg-yellow-950 text-yellow-300'
                      }`}>
                        <span className="shrink-0">
                          {check.status === 'pass' ? '✓' : check.status === 'fail' ? '✗' : '⚠'}
                        </span>
                        <div>
                          <span className="font-bold">{check.check}:</span>{' '}
                          <span>{check.message}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <div className="pt-4 border-t border-[#1a1d21]">
              <button type="button" onClick={handleLaunch} disabled={!canLaunch || isLaunching}
                className={`w-full py-2.5 text-sm font-bold rounded border transition-colors ${
                  canLaunch && !isLaunching
                    ? 'bg-[#00b4d8] border-[#00b4d8] text-white hover:bg-sky-400'
                    : 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed'
                }`}>
                {isLaunching ? 'Launching...' : canLaunch ? 'Launch Pipeline →' : 'Launch Pipeline'}
              </button>
              {launchError && (
                <div className="mt-3 p-3 rounded border border-red-800 bg-red-950 text-red-300 text-xs font-mono whitespace-pre-wrap">
                  {launchError}
                </div>
              )}
              {!canLaunch && !isLaunching && (
                <p className="mt-2 text-xs text-slate-600 text-center">
                  {!repoPathLocked || !repoPath.trim() ? 'Confirm a valid repository path to continue' :
                   !roadmapSeed.trim() ? 'Add a roadmap seed to continue' :
                   !roadmapSeedLocked ? 'Confirm roadmap seed to continue' :
                   !validationResult || !validationResult.valid ? 'Roadmap must pass validation' :
                   !preflightRan || !preflightChecks || !preflightChecks.length ? 'Run preflight checks to continue' :
                   preflightChecks.some((c) => c.status === 'fail') ? 'Fix preflight failures to continue' :
                   'Ready to launch'}
                </p>
              )}
            </div>

          </div>
        </div>
      );
    }

    // ─── Render ─────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

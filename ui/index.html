        // ─── EscalationCommandPanel ───────────────────────────────────────────────

        // Shared escalation/recovery surface, rendered by BOTH the Pipeline Monitor and the
        // Queue view (P1 Stage G3 consolidation — one component, written once for G1/G2).
        // Control props beyond the escalation data:
        //  • targetProjectPath: when set (Queue, a parked ESCALATION project that is NOT the
        //    active pipeline project), the dispatcher appends target_project_path so the server
        //    HOLDS the command (pending_escalation_command) and it fires when the orchestrator
        //    picks that project back up. null (Monitor) → immediate dispatch on the active project.
        //  • onDispatched: optional callback invoked after a successful POST (Queue → fetchQueue).
        //  • showOrchestratorLifecycle: Monitor-only chrome (Restart Orchestrator button +
        //    orchestrator-down warning). Off in the Queue — deferred dispatch has no live
        //    orchestrator to restart.
        //  • showCommandSentScreen: Monitor shows the "command submitted — waiting" screen;
        //    the Queue relies on onDispatched (queue refresh) instead.
        function EscalationCommandPanel({
            pipeline_status,
            escalation_trigger_reason,
            escalation_headline,
            escalation_message,
            escalation_recommended_action,
            escalation_advisory_status,
            last_action,
            escalation_resets,
            nuclear_resets = 0,
            orchestrator_alive,
            onOrchestratorRestarted,
            onResumeOrchestratorResponse,
            executor_output_exists = true,
            planner_output_exists = true,
            phase_branch_exists = true,
            merge_probe_passed = false,
            targetProjectPath = null,
            onDispatched = null,
            showOrchestratorLifecycle = false,
            showCommandSentScreen = false,
        }) {
            const [commandSent, setCommandSent] = useState(false);
            const [lastSubmittedCommand, setLastSubmittedCommand] = useState(null);
            const [commandError, setCommandError] = useState("");
            const [prevStatus, setPrevStatus] = useState(pipeline_status);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [modalCommand, setModalCommand] = useState(null);
            const [confirmBusy, setConfirmBusy] = useState(false);
            const [restartBusy, setRestartBusy] = useState(false);
            const [restartError, setRestartError] = useState("");
            const [advisoryExpanded, setAdvisoryExpanded] = useState(escalation_resets === 0);

            useEffect(() => {
                if (prevStatus === "WAITING_FOR_HUMAN" && pipeline_status !== "WAITING_FOR_HUMAN") {
                    // Do not clear while the confirm modal is open — the 3s state poll can
                    // briefly show a non-human status and would unmount the modal mid-confirm.
                    if (!showConfirmModal) {
                        setCommandSent(false);
                        setLastSubmittedCommand(null);
                        setCommandError("");
                    }
                }
                setPrevStatus(pipeline_status);
            }, [pipeline_status, prevStatus, showConfirmModal]);

            const humanWait = pipeline_status === "WAITING_FOR_HUMAN";
            const queueHaltedEscalation =
                pipeline_status === "QUEUE_HALTED" &&
                !!(escalation_trigger_reason || escalation_message);
            const canIssueCommands = humanWait || queueHaltedEscalation;
            const orchestratorDownBlocksCommands =
                showOrchestratorLifecycle && canIssueCommands && !orchestrator_alive && !commandSent;
            const keepPanelMounted = canIssueCommands || showConfirmModal || commandSent;
            if (!keepPanelMounted) return null;

            const headerText = commandSent
                ? "Command submitted"
                : !humanWait && showConfirmModal
                    ? "Confirm command (pipeline status changed — server will still validate)"
                    : escalation_headline || "Awaiting human command";
            const commandErrParts = commandError ? splitApiDetail(commandError) : null;

            const handleCommand = (command) => {
                // Every command opens a confirmation modal; which modal renders (StopConfirmModal
                // vs ConfirmationModal) is decided at render time by the pending command, not here.
                setModalCommand(command);
                setShowConfirmModal(true);
            };

            const modalConfirm = async () => {
                if (!modalCommand) return;
                setConfirmBusy(true);
                setCommandError("");
                try {
                    // Unified dispatch: always POST /api/command. When targetProjectPath is set
                    // (Queue, a parked ESCALATION project that is not the active one), the server
                    // HOLDS the command (pending_escalation_command) so it fires when the
                    // orchestrator picks that project back up; otherwise it acts immediately on the
                    // active project. STOP rides this same path — equivalent to /api/stop while
                    // WAITING_FOR_HUMAN (the panel's only render state).
                    const payload = { command: modalCommand };
                    if (targetProjectPath) payload.target_project_path = targetProjectPath;
                    const r = await fetch("/api/command", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Request failed (${r.status})`;
                        setCommandError(msg);
                        setShowConfirmModal(false);
                        setModalCommand(null);
                        return;
                    }
                    setLastSubmittedCommand(modalCommand);
                    if (showCommandSentScreen) setCommandSent(true);
                    setShowConfirmModal(false);
                    setModalCommand(null);
                    if (typeof onDispatched === "function") onDispatched();
                } catch (err) {
                    setCommandError(String(err?.message || err));
                    setShowConfirmModal(false);
                    setModalCommand(null);
                } finally {
                    setConfirmBusy(false);
                }
            };

            const modalDismiss = () => {
                if (confirmBusy) return;
                setShowConfirmModal(false);
                setModalCommand(null);
            };

            // ── Phase 2 visibility constants ──────────────────────────────────────
            const capReached = escalation_resets >= 3;
            const showRerunReviewer = executor_output_exists;
            const showMarkComplete = merge_probe_passed;
            // P1 Stage G2 — the nuclear escape hatch appears ONLY past the recover budget
            // (escalation_resets >= 3) and disappears once its own cap (2) is spent. It is
            // gated independently of the recover group, which is hidden at capReached.
            const showNuclear = capReached && (nuclear_resets || 0) < 2;

            const hiddenRecoverItems = !showRerunReviewer
                ? ["Re-run Reviewer — no executor output to review"]
                : [];
            const hiddenFinalizeItems = !showMarkComplete
                ? ["Mark Complete — phase branch not yet merged into base"]
                : [];

            // advisoryText is only used in the ready state; generating/fallback states
            // render their own distinct UI. Do NOT fall back to escalation_trigger_reason
            // here — that's already in the header and duplicating it is what we're fixing.
            const advisoryText = escalation_message || null;

            // Counter strip
            const counterText = `Escalation loops: ${escalation_resets}/3`;

            // ── Shared action button renderer ─────────────────────────────────────
            // group === 'stop' → red label (visually distinct, same component).
            const renderActionButton = ({ command, label, desc, title: cmdTitle, group }) => {
                const isStop = group === 'stop';
                const isNuclear = group === 'nuclear';  // P1 Stage G2 — destructive emphasis
                return (
                    <button
                        key={command}
                        type="button"
                        className={`flex flex-col items-start text-left px-3 py-2 rounded transition-colors w-full ${isNuclear ? 'bg-red-950/40 border border-red-800/60 hover:bg-red-900/40' : 'bg-[#1a1d21] hover:bg-[#252830]'}`}
                        title={cmdTitle}
                        onClick={() => handleCommand(command)}
                    >
                        <span className={`header-text text-sm font-medium ${(isStop || isNuclear) ? 'text-red-400' : ''}`}>{label}</span>
                        {desc && <span className="text-slate-400 text-xs mt-0.5 leading-snug">{desc}</span>}
                    </button>
                );
            };

            // Buttons are sourced from the shared ESCALATION_CMD_DEFS (single source of truth),
            // filtered to reproduce the exact prior Monitor visibility rules: recover group hidden
            // at cap; Re-run Reviewer hidden without executor output; Mark Complete needs merge
            // AND not-cap (the cap-reached state offers only Abandon Phase / Stop Pipeline).
            const recoverCmds = ESCALATION_CMD_DEFS
                .filter(d => d.group === 'recover')
                .filter(d => {
                    if (capReached) return false;
                    if (d.command === 'RESET_REVIEWER' && !showRerunReviewer) return false;
                    return true;
                });
            const advanceCmds = ESCALATION_CMD_DEFS
                .filter(d => d.group === 'advance')
                .filter(d => !(d.command === 'PROCEED' && (!showMarkComplete || capReached)));
            const stopDef = ESCALATION_CMD_DEFS.find(d => d.group === 'stop');
            const nuclearDef = ESCALATION_CMD_DEFS.find(d => d.group === 'nuclear');  // P1 Stage G2

            const handleRestartOrchestrator = async () => {
                setRestartError("");
                setRestartBusy(true);
                try {
                    const r = await fetch("/api/resume-orchestrator", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    if (typeof onResumeOrchestratorResponse === "function") {
                        onResumeOrchestratorResponse(d, { ok: r.ok, status: r.status });
                    }
                    if (!r.ok) {
                        if (r.status === 503 && d && d.reconciled === true) {
                            setRestartError("");
                        } else {
                            setRestartError(
                                formatResumeOrchestratorError(d, r.status) || `Restart failed (${r.status})`
                            );
                        }
                        return;
                    }
                    if (typeof onOrchestratorRestarted === "function") onOrchestratorRestarted();
                } catch (err) {
                    setRestartError(String(err?.message || err));
                } finally {
                    setRestartBusy(false);
                }
            };

            const restartOrchestratorButton = (
                <button
                    type="button"
                    onClick={() => !restartBusy && handleRestartOrchestrator()}
                    disabled={restartBusy}
                    className="header-text mt-2 w-full px-3 py-2 text-xs rounded bg-cyan-950 hover:bg-cyan-900 text-cyan-200 border border-cyan-800 transition-colors disabled:opacity-50"
                >
                    {restartBusy ? "Restarting…" : "Restart Orchestrator"}
                </button>
            );

            return (
                <div
                    className={`border-2 rounded-lg p-4 mt-4 bg-[#141618]/50 ${
                        capReached ? "border-red-500" : "border-orange-500"
                    }`}
                >

                    {/* ── Orchestrator-down warning ─────────────────────────── */}
                    {orchestratorDownBlocksCommands ? (
                        <div className="mb-3 rounded border border-amber-700/50 bg-amber-950/30 p-2">
                            <p className="text-amber-600 text-xs leading-relaxed">
                                Orchestrator is not running. Use <strong className="font-semibold">Restart Orchestrator</strong> in the banner above; escalation commands stay hidden until the process is running again.
                            </p>
                        </div>
                    ) : null}

                    {/* ── Status-changed warning (modal still open after poll) ── */}
                    {!humanWait && showConfirmModal && !commandSent ? (
                        <p className="text-amber-400/90 text-xs mb-3 leading-relaxed">
                            Status is no longer &quot;waiting for human&quot; on the last poll. You can still confirm — the server accepts the command only if the orchestrator is still in that state.
                        </p>
                    ) : null}

                    {/* ── Command error ─────────────────────────────────────── */}
                    {commandErrParts ? (
                        <div className="mb-2 space-y-1">
                            <p className="text-red-400 text-xs">{commandErrParts.friendly}</p>
                            {commandErrParts.technical ? (
                                <p className="text-slate-500 text-xs font-mono leading-snug">
                                    {commandErrParts.technical}
                                </p>
                            ) : null}
                        </div>
                    ) : null}

                    {commandSent ? (
                        /* ── Command sent confirmation ───────────────────────── */
                        <div className="text-center py-4 space-y-2">
                            <span className="text-amber-400 text-sm block">
                                {lastSubmittedCommand === "STOP"
                                    ? "STOP submitted — pipeline will halt after the current agent finishes."
                                    : `${lastSubmittedCommand} submitted — waiting for orchestrator to apply it.`}
                            </span>
                            {!orchestrator_alive ? (
                                <div className="space-y-1">
                                    <span className="text-amber-600 text-xs block">
                                        Orchestrator is not running — restart it for this command to take effect.
                                    </span>
                                    {restartOrchestratorButton}
                                    {restartError ? (
                                        <p className="header-text text-xs text-red-400">{restartError}</p>
                                    ) : null}
                                </div>
                            ) : null}
                        </div>
                    ) : canIssueCommands && !orchestratorDownBlocksCommands ? (
                        /* ── Grouped command layout ──────────────────────────── */
                        <div className="space-y-3">

                            {/* 1. Collapsible advisory block */}
                            <div className="rounded border border-[#2a3040] bg-[#111418]/60">
                                <button
                                    type="button"
                                    className="w-full flex items-center gap-2 px-3 py-2 text-left"
                                    onClick={() => setAdvisoryExpanded(v => !v)}
                                    aria-expanded={advisoryExpanded}
                                >
                                    <span className={`inline-block w-2 h-2 rounded-full flex-shrink-0 ${capReached ? 'bg-red-500' : 'bg-orange-400'}`}
                                        style={{ animation: 'pulse 2s cubic-bezier(0.4,0,0.6,1) infinite' }}
                                    />
                                    <span className="header-text text-xs text-slate-300 flex-1 leading-snug">
                                        {escalation_advisory_status === "ready" && advisoryText
                                            ? advisoryText
                                            : (escalation_headline || "This phase needs your input")}
                                    </span>
                                    <span className="text-slate-500 text-xs ml-1 flex-shrink-0">
                                        {advisoryExpanded ? '▲' : '▼'}
                                    </span>
                                </button>
                                {advisoryExpanded && (
                                    <div className="px-3 pb-3 space-y-1.5 border-t border-[#2a3040]/60">
                                        <p className="text-slate-500 text-xs pt-2 font-mono">
                                            {counterText}
                                        </p>
                                        {escalation_advisory_status === "generating" ? (
                                            <p className="text-slate-400 text-xs leading-relaxed flex items-center gap-2">
                                                <span className="inline-block w-3 h-3 border-2 border-sky-400 border-t-transparent rounded-full flex-shrink-0"
                                                    style={{ animation: 'spin 1s linear infinite' }} />
                                                <span className="text-sky-400 font-medium">Reviewing escalation...</span>
                                            </p>
                                        ) : escalation_advisory_status === "ready" && advisoryText ? (
                                            <div className="space-y-1.5">
                                                <p className="text-slate-400 text-xs leading-relaxed">
                                                    <span className="text-sky-400 font-medium">Advisory · </span>
                                                    {advisoryText}
                                                </p>
                                                {escalation_recommended_action && (
                                                    <p className="text-slate-400 text-xs leading-relaxed">
                                                        <span className="text-emerald-400 font-medium">Suggested action · </span>
                                                        {escalation_recommended_action}
                                                    </p>
                                                )}
                                            </div>
                                        ) : (
                                            <p className="text-slate-500 text-xs leading-relaxed italic">
                                                {escalation_advisory_status === "fallback"
                                                    ? "Automated review unavailable — the analysis could not be generated. See the pipeline log for full context."
                                                    : "See the pipeline log for details."}
                                            </p>
                                        )}
                                        {/* P1 Stage G1: raw internal reason, demoted out of the headline into the disclosure. */}
                                        {escalation_trigger_reason && (
                                            <p className="text-slate-600 text-[11px] leading-relaxed font-mono pt-1.5 border-t border-[#2a3040]/40">
                                                <span className="text-slate-500">Internal reason · </span>{escalation_trigger_reason}
                                            </p>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* 2. Recover group OR cap-reached notice */}
                            {capReached ? (
                                <p className="text-amber-500 text-xs px-1">
                                    Recover unavailable · reset budget of 3 exhausted. Use Abandon Phase or Stop Pipeline to exit.
                                </p>
                            ) : (
                                <div className="space-y-1.5">
                                    <InfoGroupLabel hiddenItems={hiddenRecoverItems}>Recover</InfoGroupLabel>
                                    {recoverCmds.map(def => renderActionButton(def))}
                                </div>
                            )}

                            {/* 2b. P1 Stage G2 — nuclear escape hatch. Rendered OUTSIDE the
                                capReached ternary above (which hides the recover group): it
                                appears precisely when escalation_resets >= 3 and hides at its
                                own cap (nuclear_resets >= 2). */}
                            {showNuclear && nuclearDef && (
                                <div className="space-y-1.5">
                                    {renderActionButton(nuclearDef)}
                                </div>
                            )}

                            <div className="border-t border-[#2a2d31]" />

                            {/* 3. Advance manually group */}
                            <div className="space-y-1.5">
                                <InfoGroupLabel hiddenItems={hiddenFinalizeItems}>Advance manually</InfoGroupLabel>
                                {advanceCmds.map(def => renderActionButton(def))}
                            </div>

                            <div className="border-t border-[#2a2d31]" />

                            {/* 4. Stop Pipeline — standalone, red label via group==='stop' */}
                            {stopDef && renderActionButton(stopDef)}

                        </div>
                    ) : showConfirmModal ? (
                        <p className="text-slate-500 text-xs">Finish confirmation below, or cancel.</p>
                    ) : null}

                    {showConfirmModal && modalCommand !== "STOP" && modalCommand !== "NUCLEAR_RESET" && (
                        <ConfirmationModal
                            command={modalCommand}
                            onConfirm={modalConfirm}
                            onDismiss={modalDismiss}
                            busy={confirmBusy}
                            escalationResets={escalation_resets}
                        />
                    )}
                    {showConfirmModal && modalCommand === "STOP" && (
                        <StopConfirmModal
                            onConfirm={modalConfirm}
                            onDismiss={modalDismiss}
                            pipelineStatus={pipeline_status}
                        />
                    )}
                    {showConfirmModal && modalCommand === "NUCLEAR_RESET" && (
                        <NuclearResetConfirmModal
                            onConfirm={modalConfirm}
                            onDismiss={modalDismiss}
                            busy={confirmBusy}
                        />
                    )}
                </div>
            );
        }

        // ─── PipelineCompletePanel ────────────────────────────────────────────────

        function PipelineCompletePanel({ roadmap, metricsSummary, completionReport, onGenerateDocs, generateDocsBusy, generateDocsError }) {
            const completeCount = roadmap ? roadmap.filter(p => p.status === 'complete').length : 0;
            const totalCount = roadmap ? roadmap.length : 0;

            const totalCost = metricsSummary && Number(metricsSummary.total_cost) || 0;
            const totalHold = metricsSummary && Number(metricsSummary.total_hold_seconds) || 0;
            const totalActive = metricsSummary && Number(metricsSummary.total_active_seconds) || 0;
            const totalEscalations = metricsSummary && Number(metricsSummary.total_escalations) || 0;
            const phases = (metricsSummary && Array.isArray(metricsSummary.phases)) ? metricsSummary.phases : [];
            const hasCostColumn = phases.some(p => Number(p.cost_total) > 0);

            const outcomeBadge = (phase) => {
                const ex = Number(phase.executor_attempts) || 0;
                const esc = Number(phase.escalations) || 0;
                if (esc > 0 && ex >= 2) return { label: 'escalated + retried', accent: true };
                if (esc > 0) return { label: 'escalated', accent: true };
                if (ex >= 2) return { label: 'retried', accent: false, muted: true };
                return { label: 'clean', accent: false };
            };

            const fmtUSD = (v) => `$${(Number(v) || 0).toFixed(2)}`;

            return (
                <div className="space-y-4">
                    <div className="flex items-center gap-3">
                        <span className="text-2xl text-emerald-400">✓</span>
                        <div>
                            <h3 className="header-text text-base font-semibold text-emerald-400">Pipeline Complete</h3>
                            <p className="text-slate-400 text-xs">{completeCount} of {totalCount} phases completed</p>
                        </div>
                    </div>

                    {metricsSummary && (
                        <>
                            <div className={totalCost > 0 ? "grid grid-cols-2 gap-2 pt-1" : "pt-1"}>
                                <div className="bg-[#1a1d21] rounded p-2">
                                    <div className="text-slate-500 text-xs mb-0.5 header-text uppercase tracking-wide">Total Time</div>
                                    <div className="header-text text-lg font-semibold text-slate-200 font-mono">{formatDuration(metricsSummary.total_duration_seconds)}</div>
                                    {totalHold > 0 && (
                                        <div className="mt-1 space-y-0.5 text-xs">
                                            <div className="flex justify-between text-slate-400"><span>Active</span><span className="font-mono">{formatDuration(totalActive)}</span></div>
                                            <div className="flex justify-between text-slate-400"><span>Hold</span><span className="font-mono">{formatDuration(totalHold)}</span></div>
                                        </div>
                                    )}
                                </div>
                                {totalCost > 0 && (
                                    <div className="bg-[#1a1d21] rounded p-2">
                                        <div className="text-slate-500 text-xs mb-0.5 header-text uppercase tracking-wide">Total Cost</div>
                                        <div className="header-text text-lg font-semibold text-slate-200 font-mono">{fmtUSD(totalCost)}</div>
                                        <div className="mt-1 space-y-0.5 text-xs">
                                            <div className="flex justify-between text-slate-400"><span>Planner</span><span className="font-mono">{fmtUSD(metricsSummary.planner_cost_total)}</span></div>
                                            <div className="flex justify-between text-slate-400"><span>Executor</span><span className="font-mono">{fmtUSD(metricsSummary.executor_cost_total)}</span></div>
                                            <div className="flex justify-between text-slate-400"><span>Reviewer</span><span className="font-mono">{fmtUSD(metricsSummary.reviewer_cost_total)}</span></div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {phases.length > 0 && (
                                <div>
                                    <div className="text-slate-500 text-xs mb-1 header-text uppercase tracking-wide">Per-phase</div>
                                    <div className="border border-[#1a1d21] rounded">
                                        <div className="flex items-center gap-2 px-2 py-1 text-[10px] header-text uppercase tracking-wide text-slate-500 border-b border-[#1a1d21]">
                                            <span className="w-16 flex-shrink-0">Phase</span>
                                            <span className="w-14 flex-shrink-0 text-right">Duration</span>
                                            <span className="w-10 flex-shrink-0 text-right">Execs</span>
                                            {hasCostColumn && <span className="w-14 flex-shrink-0 text-right">Cost</span>}
                                            <span className="ml-auto">Result</span>
                                        </div>
                                        {phases.map((phase, idx) => {
                                            const badge = outcomeBadge(phase);
                                            const badgeClass = badge.accent
                                                ? 'text-red-400'
                                                : (badge.muted ? 'text-slate-500' : 'text-emerald-400');
                                            return (
                                                <div key={idx} className="flex items-center gap-2 px-2 py-1.5 text-xs border-b border-[#1a1d21] last:border-b-0">
                                                    <span className="header-text font-semibold text-slate-300 w-16 flex-shrink-0 font-mono">{phase.phase}</span>
                                                    <span className="text-slate-400 w-14 flex-shrink-0 text-right font-mono">{formatDuration(phase.duration_seconds)}</span>
                                                    <span className="text-slate-400 w-10 flex-shrink-0 text-right font-mono">{phase.executor_attempts}</span>
                                                    {hasCostColumn && (
                                                        <span className="text-slate-400 w-14 flex-shrink-0 text-right font-mono">{Number(phase.cost_total) > 0 ? fmtUSD(phase.cost_total) : '—'}</span>
                                                    )}
                                                    <span className={`ml-auto header-text ${badgeClass}`}>{badge.label}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {totalEscalations > 0 && (
                                <div>
                                    <div className="text-slate-500 text-xs mb-1 header-text uppercase tracking-wide">Escalation</div>
                                    <div className="border border-[#1a1d21] rounded">
                                        {phases.filter(p => Number(p.hold_seconds) > 0).map((phase, idx) => (
                                            <div key={idx} className="flex items-center gap-2 px-2 py-1.5 text-xs border-b border-[#1a1d21] last:border-b-0">
                                                <span className="header-text font-semibold text-slate-300 font-mono">{phase.phase}</span>
                                                <span className="text-slate-500">·</span>
                                                <span className="text-slate-400 font-mono">{formatDuration(phase.hold_seconds)} hold</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </>
                    )}

                    {/* W5-F: completion doc generation — only shown when completionReport.found is false (pipelineStatus === PIPELINE_COMPLETE required via CurrentPhasePanel) */}
                    {(!completionReport || !completionReport.found) && (
                        <div className="mt-4 pt-3 border-t border-[#1a1d21]">
                            <p className="text-slate-400 text-xs mb-2">Want a summary and next steps for this project?</p>
                            {generateDocsError && (
                                <p className="text-red-400 text-xs mb-2">{generateDocsError}</p>
                            )}
                            {/* button only visible when completionReport.found is false */}
                            <button
                                onClick={onGenerateDocs}
                                disabled={generateDocsBusy}
                                className="px-3 py-1.5 text-xs rounded bg-emerald-700 hover:bg-emerald-600 text-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                            >
                                {generateDocsBusy ? 'Generating…' : 'Generate Docs'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // ─── Stopped resume flow (shared: header Resume + StoppedRecoveryPanel) ───

        async function runStoppedResumeFlow(command) {
            const rr = await fetch("/api/resume-ready", { method: "POST" });
            const rd = await rr.json().catch(() => ({}));
            if (!rr.ok) {
                const msg =
                    typeof rd.detail === "string" ? rd.detail : `Resume-ready failed (${rr.status})`;
                return { ok: false, error: msg };
            }
            const cr = await fetch("/api/command", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command }),
            });
            const cd = await cr.json().catch(() => ({}));
            if (!cr.ok) {
                const msg =
                    typeof cd.detail === "string" ? cd.detail : `Command failed (${cr.status})`;
                return { ok: false, error: msg };
            }
            const orch = await fetch("/api/resume-orchestrator", { method: "POST" });
            const od = await orch.json().catch(() => ({}));
            if (!orch.ok) {
                return {
                    ok: false,
                    error: formatResumeOrchestratorError(od, orch.status),
                    resumeOrch: { body: od, fetchOk: orch.ok, status: orch.status },
                };
            }
            return {
                ok: true,
                resumeOrch: { body: od, fetchOk: orch.ok, status: orch.status },
            };
        }

        // ─── StoppedRecoveryPanel ─────────────────────────────────────────────────

        function StoppedRecoveryPanel({
            current_phase_raw_id,
            escalation_resets,
            onResumeSent,
            onResumeOrchestratorResponse,
        }) {
            const [sent, setSent] = useState(false);
            const [flowError, setFlowError] = useState("");
            const isCapReached = (escalation_resets || 0) >= 3;

            const handleResume = async (command) => {
                setFlowError("");
                try {
                    const result = await runStoppedResumeFlow(command);
                    if (result.resumeOrch && typeof onResumeOrchestratorResponse === "function") {
                        onResumeOrchestratorResponse(result.resumeOrch.body, {
                            ok: result.resumeOrch.fetchOk,
                            status: result.resumeOrch.status,
                        });
                    }
                    if (!result.ok) {
                        setFlowError(result.error || "Resume failed");
                        return;
                    }
                    setSent(true);
                    if (typeof onResumeSent === "function") onResumeSent();
                } catch (e) {
                    setFlowError(String(e?.message || e));
                }
            };

            const RESUME_OPTIONS = [
                {
                    command: 'RETRY',
                    label: 'Resume',
                    desc: 'Continue from where it stopped',
                    capped: false,
                    hintTitle: P3_STOPPED_RESUME_TITLE,
                },
                {
                    command: 'RESET_EXECUTION',
                    label: 'Reset Execution',
                    desc: 'Keep the plan, retry execution from scratch',
                    capped: true,
                },
                {
                    command: 'RESET_PHASE',
                    label: 'Reset Phase',
                    desc: 'Start the entire phase over from the beginning',
                    capped: true,
                },
            ];

            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-2">
                        <span className="text-red-400 text-lg">◼</span>
                        <div>
                            <h3 className="header-text text-base font-semibold text-red-400">Pipeline Stopped</h3>
                            {current_phase_raw_id && (
                                <p className="text-slate-400 text-xs">Stopped during phase <span className="font-mono text-slate-300">{current_phase_raw_id}</span></p>
                            )}
                        </div>
                    </div>

                    {sent ? (
                        <div className="text-center py-4">
                            <span className="text-amber-400 text-sm">Command sent — restarting orchestrator...</span>
                        </div>
                    ) : (
                        <div className="space-y-2 pt-1">
                            {RESUME_OPTIONS.map(({ command, label, desc, capped, hintTitle }) => {
                                const disabled = capped && isCapReached;
                                return (
                                    <button
                                        key={command}
                                        onClick={() => !disabled && handleResume(command)}
                                        disabled={disabled}
                                        title={
                                            disabled
                                                ? 'Reset cap reached — use Resume, or fix the repo manually in git. Cap prevents infinite reset loops.'
                                                : hintTitle || undefined
                                        }
                                        className={`w-full text-left px-3 py-2.5 rounded border transition-colors ${
                                            disabled
                                                ? 'border-[#1a1d21] bg-[#0f1012] text-slate-600 cursor-not-allowed'
                                                : command === 'RETRY'
                                                    ? 'border-emerald-800 bg-emerald-950/40 hover:bg-emerald-950/70 text-emerald-300'
                                                    : 'border-[#1a1d21] bg-[#1a1d21]/50 hover:bg-[#252830] text-slate-300'
                                        }`}
                                    >
                                        <div className="header-text text-xs font-semibold mb-0.5">{label}</div>
                                        <div className="text-xs text-slate-500">{desc}</div>
                                    </button>
                                );
                            })}
                            {isCapReached && (
                                <p className="text-xs text-amber-600 pt-1">Reset cap reached (3/3) — only Resume is available.</p>
                            )}
                            {flowError ? (
                                <div className="header-text text-xs text-red-400 mt-1 space-y-1">
                                    <span className="block">{splitApiDetail(flowError).friendly}</span>
                                    {splitApiDetail(flowError).technical ? (
                                        <span className="block text-slate-500 font-mono text-[10px] leading-snug whitespace-pre-wrap">
                                            {splitApiDetail(flowError).technical}
                                        </span>
                                    ) : null}
                                </div>
                            ) : null}
                        </div>
                    )}
                </div>
            );
        }

        // ─── CurrentPhasePanel ────────────────────────────────────────────────────

        function CurrentPhasePanel({
            current_phase_raw_id,
            current_agent,
            roadmap,
            planner_retries,
            executor_retries,
            reviewer_retries,
            last_action_timestamp,
            sentinel_wait_started_at,
            orchestrator_alive,
            pipeline_status,
            metricsSummary,
            escalation_resets,
            last_action,
            waiting_for_human_at,
            onResumeSent,
            onResumeOrchestratorResponse,
            completionReport,
            onGenerateDocs,
            generateDocsBusy,
            generateDocsError,
        }) {
            if (pipeline_status === 'PIPELINE_COMPLETE') {
                return <PipelineCompletePanel
                    roadmap={roadmap}
                    metricsSummary={metricsSummary}
                    completionReport={completionReport}
                    onGenerateDocs={onGenerateDocs}
                    generateDocsBusy={generateDocsBusy}
                    generateDocsError={generateDocsError}
                />;
            }
            if (pipeline_status === 'STOPPED') {
                return (
                    <StoppedRecoveryPanel
                        current_phase_raw_id={current_phase_raw_id}
                        escalation_resets={escalation_resets}
                        onResumeSent={onResumeSent}
                        onResumeOrchestratorResponse={onResumeOrchestratorResponse}
                    />
                );
            }

            const goal = getGoalForPhase(current_phase_raw_id, roadmap);

            if (!current_phase_raw_id) {
                if (pipeline_status === "IDLE" || pipeline_status === "UNKNOWN") {
                    return (
                        <div className="space-y-1" data-testid="current-phase-empty-idle">
                            <div className="text-slate-400">No pipeline running.</div>
                            <p className="text-slate-500 text-sm leading-relaxed">
                                Use <span className="text-slate-400">Project Ideas</span> to draft a PRD, then{" "}
                                <span className="text-slate-400">Setup &amp; Preflight</span> to attach a repo and
                                launch. Open the <span className="text-slate-400">queue</span> when you are ready to
                                run projects.
                            </p>
                        </div>
                    );
                }
                return <div className="text-slate-400 italic">No active phase</div>;
            }

            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-3">
                        <span
                            className="header-text text-sm font-semibold text-slate-300"
                            title={P3_PIPELINE_PHASE_RAW_ID_TITLE}
                        >
                            {current_phase_raw_id}
                        </span>
                        <AgentBadge agent={current_agent} />
                        {escalation_resets > 0 && (
                            <span className="header-text text-xs px-1.5 py-0.5 rounded bg-orange-900/50 text-orange-300 border border-orange-700/40">
                                Reset ×{escalation_resets}
                            </span>
                        )}
                        <ElapsedTimer
                            lastActionTimestamp={last_action_timestamp}
                            sentinelWaitStartedAt={sentinel_wait_started_at}
                            waitingForHumanAt={waiting_for_human_at}
                            orchestratorAlive={orchestrator_alive}
                            pipeline_status={pipeline_status}
                        />
                    </div>
                    {goal && (
                        <p className="text-slate-400 text-sm leading-relaxed">{goal}</p>
                    )}
                    {last_action && (
                        <p className="text-xs italic text-slate-500 truncate" title={last_action}>
                            {last_action.slice(0, 80)}
                        </p>
                    )}
                    <div className="space-y-1">
                        <div className="text-slate-500 text-xs font-medium tracking-wide uppercase mb-0.5" data-testid="agent-attempts-heading">
                            Agent attempts
                        </div>
                        <AgentAttemptRow
                            agentRole="planner"
                            count={planner_retries}
                            label="Planner"
                            currentAgent={current_agent}
                            pipelineStatus={pipeline_status}
                            planner_retries={planner_retries}
                            executor_retries={executor_retries}
                            reviewer_retries={reviewer_retries}
                        />
                        <AgentAttemptRow
                            agentRole="executor"
                            count={executor_retries}
                            label="Executor"
                            currentAgent={current_agent}
                            pipelineStatus={pipeline_status}
                            planner_retries={planner_retries}
                            executor_retries={executor_retries}
                            reviewer_retries={reviewer_retries}
                        />
                        <AgentAttemptRow
                            agentRole="reviewer"
                            count={reviewer_retries}
                            label="Reviewer"
                            currentAgent={current_agent}
                            pipelineStatus={pipeline_status}
                            planner_retries={planner_retries}
                            executor_retries={executor_retries}
                            reviewer_retries={reviewer_retries}
                        />
                    </div>
                </div>
            );
        }

        // Renders completion-report markdown to HTML via the shared `marked` library
        // (already loaded at the top of the file). The code-block renderer is
        // overridden so each fenced block gets a per-block Copy button.
        //
        // The Copy click is handled via event delegation in renderCompletionReport
        // below — the renderer output is inert HTML inserted via
        // dangerouslySetInnerHTML, so React click handlers cannot be attached
        // directly.
        function makeCompletionRenderer() {
            if (typeof marked === "undefined" || !marked.Renderer) return null;
            const renderer = new marked.Renderer();
            // marked v4 signature: code(code, infostring, escaped)
            // marked v5+ token signature: code({ text, lang })
            renderer.code = function(code, infostring) {
                let body, lang;
                if (typeof code === 'object' && code !== null) {
                    body = code.text || '';
                    lang = (code.lang || '').trim();
                } else {
                    body = String(code || '');
                    lang = String(infostring || '').trim();
                }
                const escapedHtml = body
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                return (
                    '<div class="completion-code-wrap relative my-2">' +
                        '<button type="button" data-testid="completion-report-copy-button" ' +
                        'class="completion-copy-btn absolute top-1 right-1 px-2 py-0.5 text-[10px] rounded ' +
                        'bg-[#181a1c] hover:bg-slate-700 text-slate-200 border border-slate-600 z-10" ' +
                        'aria-label="Copy to clipboard">Copy</button>' +
                        '<pre class="pr-14"><code' + (lang ? ' class="language-' + lang + '"' : '') + '>' +
                        escapedHtml +
                        '</code></pre>' +
                    '</div>'
                );
            };
            return renderer;
        }

        function renderCompletionMarkdown(content) {
            if (!content) return '';
            if (typeof marked === "undefined" || !marked.parse) {
                return String(content).replace(/&/g, '&amp;').replace(/</g, '&lt;');
            }
            const renderer = makeCompletionRenderer();
            const opts = { breaks: true };
            if (renderer) opts.renderer = renderer;
            try {
                return marked.parse(content, opts);
            } catch (err) {
                return String(content).replace(/&/g, '&amp;').replace(/</g, '&lt;');
            }
        }

        // ─── RoadmapPanel ─────────────────────────────────────────────────────────
        // Wrapped in React.memo so it only re-renders when roadmap or metricsSummary
        // props actually change — avoids DOM churn caused by parent pState polling.

        const RoadmapPanel = React.memo(function RoadmapPanel({ roadmap, metricsSummary, pipelineStatus, completionReport, runStartedAt }) {
            const [expandedPhaseId, setExpandedPhaseId] = useState(null);
            const lastScrolledMtimeRef = useRef(null);
            const completionContentRef = useRef(null);

            useEffect(() => {
                if (pipelineStatus !== 'PIPELINE_COMPLETE') return;
                if (!completionReport || !completionReport.found) return;
                if (lastScrolledMtimeRef.current === completionReport.mtime) return;
                lastScrolledMtimeRef.current = completionReport.mtime;
                // Defer a frame so the synthetic row has rendered before we scroll.
                requestAnimationFrame(() => {
                    const el = document.querySelector('[data-testid="completion-report-phase-row"]');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }, [pipelineStatus, completionReport && completionReport.found, completionReport && completionReport.mtime]);

            // Event delegation for Copy buttons inside the markdown-rendered code blocks.
            // The buttons are inert HTML (dangerouslySetInnerHTML output), so React's
            // onClick won't fire on them. Instead we listen on the container.
            useEffect(() => {
                const node = completionContentRef.current;
                if (!node) return;
                const onClick = (e) => {
                    const btn = e.target.closest('.completion-copy-btn');
                    if (!btn || !node.contains(btn)) return;
                    e.stopPropagation();
                    const codeEl = btn.parentElement && btn.parentElement.querySelector('pre code');
                    const text = codeEl ? codeEl.textContent : '';
                    try {
                        navigator.clipboard.writeText(text);
                        const original = btn.textContent;
                        btn.textContent = 'Copied';
                        setTimeout(() => { if (btn) btn.textContent = original || 'Copy'; }, 1500);
                    } catch (err) { /* clipboard blocked — no-op */ }
                };
                node.addEventListener('click', onClick);
                return () => node.removeEventListener('click', onClick);
            }, [completionReport && completionReport.mtime]);

            const handlePhaseClick = (phaseId) => {
                setExpandedPhaseId(prev => prev === phaseId ? null : phaseId);
            };

            if (!roadmap || !Array.isArray(roadmap) || roadmap.length === 0) {
                if (pipelineStatus === "IDLE" || pipelineStatus === "UNKNOWN") {
                    return (
                        <div className="space-y-1" data-testid="roadmap-empty-idle">
                            <div className="text-slate-500">No roadmap loaded for this view.</div>
                            <p className="text-slate-500 text-sm leading-relaxed">
                                Use <span className="text-slate-400">Project Ideas</span> and{" "}
                                <span className="text-slate-400">Setup &amp; Preflight</span> with a repo that
                                contains <span className="font-mono text-slate-400">roadmap.md</span>, or wait until a
                                pipeline phase is running to see phases here.
                            </p>
                        </div>
                    );
                }
                return <div className="text-slate-500 italic">No roadmap data available</div>;
            }

            const totalPhases = roadmap.length;
            const completeCount = roadmap.filter(p => p.status === 'complete').length;
            const percentage = totalPhases > 0 ? Math.round((completeCount / totalPhases) * 100) : 0;

            // Build a lookup map from metrics summary phases array
            const metricsMap = {};
            if (metricsSummary && Array.isArray(metricsSummary.phases)) {
                for (const p of metricsSummary.phases) {
                    if (p.phase) metricsMap[p.phase] = p;
                }
            }

            return (
                <div className="space-y-4 overflow-y-auto max-h-full">
                    {/* Progress bar */}
                    <div className="space-y-1">
                        <div className="flex justify-between text-xs text-slate-400">
                            <span>Progress</span>
                            <span>{completeCount} / {totalPhases} complete</span>
                        </div>
                        <div className="w-full bg-[#1a1d21] rounded-full h-2">
                            <div
                                className="bg-cyan-500 h-2 rounded-full transition-all duration-300"
                                style={{ width: `${percentage}%` }}
                            ></div>
                        </div>
                    </div>

                    {metricsSummary && metricsSummary.total_phases > 0 && (
                        <p className="header-text text-xs text-slate-500">
                            Run so far: {metricsSummary.total_phases} phases · {metricsSummary.total_executor_attempts} exec attempts · {formatDuration(metricsSummary.total_duration_seconds)}{metricsSummary.total_cost > 0 ? ` · $${metricsSummary.total_cost.toFixed(2)}` : ''}
                        </p>
                    )}

                    {/* Phase list */}
                    <div className="space-y-2">
                        {roadmap.map((phase, index) => {

                            const isExpanded = expandedPhaseId === phase.id;
                            const phaseMeta = metricsMap[phase.id] || null;

                            return (
                                <div
                                    key={phase.id || index}
                                    role="button"
                                    tabIndex={0}
                                    aria-label={`${phase.id}: ${phase.goal || ''}`}
                                    aria-expanded={isExpanded}
                                    className={`p-3 rounded border border-[#1a1d21] cursor-pointer transition-colors ${getStatusClasses(phase.status)} ${isExpanded ? 'bg-[#1a1d21]' : ''}`}
                                    onClick={() => handlePhaseClick(phase.id)}
                                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') handlePhaseClick(phase.id); }}
                                >
                                    <div className="flex items-start gap-2">
                                        <span className="text-lg flex-shrink-0">{getStatusIcon(phase.status)}</span>
                                        <div className="flex-1 min-w-0">
                                            <div className="header-text text-sm font-semibold text-slate-300 flex items-center gap-2">
                                                {phase.id}
                                                {isExpanded ? (
                                                    <span className="text-blue-400 text-xs">▼</span>
                                                ) : (
                                                    <span className="text-slate-500 text-xs">▶</span>
                                                )}
                                            </div>
                                            {phase.goal && (
                                                <p className={`text-sm text-slate-400 mt-1 ${isExpanded ? '' : 'truncate'}`}>
                                                    {phase.goal}
                                                </p>
                                            )}
                                            {/* Expanded: exit criteria (all phases) */}
                                            {isExpanded && phase.exit_criteria && phase.exit_criteria.length > 0 && (
                                                <div className="mt-3 pt-2 border-t border-[#1a1d21]">
                                                    <div className="text-xs font-semibold text-slate-400 mb-1">Exit Criteria:</div>
                                                    <ul className="text-xs text-slate-400 space-y-1">
                                                        {phase.exit_criteria.map((criteria, idx) => (
                                                            <li key={idx} className="flex items-start gap-1">
                                                                <span className="text-blue-400">•</span>
                                                                <span>{criteria}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                            {/* Expanded: Behavioral Verification (P0 Stage J — null for pre-P0 phases) */}
                                            {isExpanded && phase.behavioral_verification && (
                                                <div className="mt-3 pt-2 border-t border-[#1a1d21]">
                                                    <div className="text-xs font-semibold text-slate-400 mb-1">Behavioral Verification:</div>
                                                    <ul className="text-xs text-slate-400 space-y-1">
                                                        <li className="flex items-start gap-1">
                                                            <span className="text-blue-400">•</span>
                                                            <span><span className="text-slate-500">User-observable: </span>{phase.behavioral_verification.user_observable}</span>
                                                        </li>
                                                        <li className="flex items-start gap-1">
                                                            <span className="text-blue-400">•</span>
                                                            <span><span className="text-slate-500">How we'll check: </span>{phase.behavioral_verification.how_to_check}</span>
                                                        </li>
                                                        <li className="flex items-start gap-1">
                                                            <span className="text-blue-400">•</span>
                                                            <span><span className="text-slate-500">If this fails, you see: </span>{phase.behavioral_verification.failure_language}</span>
                                                        </li>
                                                    </ul>
                                                </div>
                                            )}
                                            {/* Expanded: run metrics for completed phases */}
                                            {isExpanded && phase.status === 'complete' && (
                                                <div className="mt-3 pt-2 border-t border-[#1a1d21]">
                                                    {phaseMeta ? (
                                                        <div>
                                                            <div className="text-xs font-semibold text-slate-400 mb-2">Run Metrics:</div>
                                                            <div className="grid grid-cols-2 gap-x-4 text-xs">
                                                                {/* Left column: Duration, Skill, Cost */}
                                                                <div className="space-y-1">
                                                                    <div>
                                                                        <span className="text-slate-500">Duration: </span>
                                                                        <span className="text-slate-300">{formatDuration(phaseMeta.duration_seconds)}</span>
                                                                    </div>
                                                                    <div>
                                                                        <span className="text-slate-500">Skill: </span>
                                                                        <span className="text-slate-300">{phaseMeta.skill_used || '—'}</span>
                                                                    </div>
                                                                    {phaseMeta.cost_total > 0 && (
                                                                        <div>
                                                                            <span className="text-slate-500">Cost: </span>
                                                                            <span className="text-slate-300 font-mono">${phaseMeta.cost_total.toFixed(2)}</span>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                                {/* Right column: Exec attempts, Reviewer passes, Escalations */}
                                                                <div className="space-y-1">
                                                                    <div>
                                                                        <span className="text-slate-500">Exec attempts: </span>
                                                                        <span className="text-slate-300">{formatExecAttemptsBreakdown(
                                                                            phaseMeta.executor_attempts,
                                                                            phaseMeta.executor_self_failures,
                                                                            phaseMeta.executor_reviewer_rejections
                                                                        )}</span>
                                                                    </div>
                                                                    <div>
                                                                        <span className="text-slate-500">Reviewer passes: </span>
                                                                        <span className="text-slate-300">{phaseMeta.reviewer_passes}</span>
                                                                    </div>
                                                                    <div>
                                                                        <span className="text-slate-500">Escalations: </span>
                                                                        <span className="text-slate-300">{phaseMeta.escalations}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="text-xs text-slate-500 italic">No metrics available</div>
                                                    )}
                                                    {/* Git branch reference */}
                                                    <div className="mt-2 pt-2 border-t border-[#1a1d21]">
                                                        <span className="text-slate-500 text-xs">Branch: </span>
                                                        <code className="font-mono text-xs text-cyan-400">phase/{phase.id}</code>
                                                        <span className="text-slate-600 text-xs ml-2">
                                                            restore via: <code className="font-mono text-slate-600">git checkout phase/{phase.id}</code>
                                                        </span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}

                        {/* W5-D: Synthetic completion-report row — always expanded so drag-
                            selecting CLI commands inside cannot collapse the section mid-copy. */}
                        {pipelineStatus === 'PIPELINE_COMPLETE' && completionReport && completionReport.found && (() => {
                            const isStale = runStartedAt && completionReport.mtime &&
                                completionReport.mtime < (new Date(runStartedAt).getTime() / 1000);
                            return (
                                <div
                                    key="__completion_report__"
                                    aria-label="Completion Report"
                                    data-testid="completion-report-phase-row"
                                    className="p-3 rounded border border-emerald-700/40 bg-emerald-950/20"
                                >
                                    <div className="flex items-start gap-2">
                                        <span className="text-lg flex-shrink-0 text-emerald-600">&#9632;</span>
                                        <div className="flex-1 min-w-0">
                                            <div className="header-text text-sm font-semibold text-emerald-400 flex items-center gap-2">
                                                Completion Report
                                                {isStale && (
                                                    <span className="text-xs text-amber-500 font-normal">(from previous run)</span>
                                                )}
                                            </div>
                                            <p className="text-sm text-slate-400 mt-1">
                                                What was built · how to run it · suggested next steps
                                            </p>
                                            <div
                                                ref={completionContentRef}
                                                className="msg-md mt-3 pt-2 border-t border-emerald-700/30 overflow-y-auto max-h-[75vh] text-sm"
                                                dangerouslySetInnerHTML={{ __html: renderCompletionMarkdown(completionReport.content) }}
                                            />
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                </div>
            );
        });

        // ─── Activity Feed ────────────────────────────────────────────────────────

        function ensureEventId(event) {
            if (event.id) return event;
            const key = (event.ts || '') + '|' + (event.event || event.event_type || '') + '|' + (event.phase || '');
            return { ...event, id: 'fe_' + key };
        }

        /**
         * File-backed /api/events uses structured `detail` (reason, gate_result, metrics, {}).
         * Legacy rows used a string. Never return a plain object — React cannot render it as a child.
         */
        function formatPipelineEventDetail(detail) {
            if (detail == null || detail === "") return "";
            if (typeof detail === "string") return detail;
            if (typeof detail === "object") {
                if (typeof detail.reason === "string") return detail.reason;
                if (typeof detail.gate_result === "string") return detail.gate_result;
                try {
                    const s = JSON.stringify(detail);
                    return s === "{}" ? "" : s;
                } catch (_) {
                    return String(detail);
                }
            }
            return String(detail);
        }

        function EventRow({ event, isExpanded, onToggle, isNew }) {
            if (!event) return null;

            const ts = event.ts || event.timestamp;
            const timeOnly = ts ? ts.slice(11, 16) : '--:--';
            const fullTime = ts || '—';
            const rawType = getEventTypeRaw(event);
            const labelText = rawType ? formatActivityEventTypeLabel(rawType) : 'Unknown';
            const badgeColor = getEventBadgeColor(rawType);
            const detail = event.detail || {};
            const summary = humanizeSummary(event);
            const gateFailFriendlyTitle =
                rawType === "gate_fail" &&
                typeof detail.last_error_code === "string" &&
                detail.last_error_code.trim()
                    ? getLastErrorCodeTitle(detail.last_error_code.trim(), event.agent)
                    : "";

            const isDimmed = rawType === 'gate_pass' || rawType === 'phase_complete' || rawType === 'status_changed';

            const phaseLabel = event.project && event.phase
                ? `${event.project} / ${event.phase}`
                : event.phase || '—';
            const phaseTitle = phaseLabel;

            const rawPairs = typeof detail === 'object' && detail !== null
                ? Object.entries(detail).filter(([, v]) => v != null && v !== '')
                : [];

            return (
                <div
                    className={
                        "event-row p-2 border-b border-[#1a1d21] cursor-pointer rounded" +
                        (isDimmed ? ' opacity-70' : '') +
                        (isNew ? " event-row-fade-in" : "")
                    }
                    onClick={onToggle}
                >
                    <div className="flex items-center gap-3">
                        <span className="font-mono text-xs text-slate-400 w-14 flex-shrink-0">
                            {timeOnly}
                        </span>
                        <span className="text-xs text-slate-300 w-40 flex-shrink-0 truncate" title={phaseTitle}>
                            {phaseLabel}
                        </span>
                        <span className="w-28 flex-shrink-0 flex items-center">
                            <span
                                data-event-type={rawType || 'unknown'}
                                title={getEventDescription(rawType) || labelText}
                                className={`px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap ${badgeColor}`}
                            >
                                {labelText}
                            </span>
                        </span>
                        <span
                            className="text-xs text-slate-300 flex-1"
                            style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}
                            title={gateFailFriendlyTitle || undefined}
                        >

        const COMMAND_LABELS = {
            RETRY: 'Retry current agent',

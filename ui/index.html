        /** Flatten jsdiff diffLines output to per-line {type, text}; then collapse long unchanged runs. */
        function prdFlattenDiffLines(prevText, curText) {
            if (typeof Diff === "undefined" || !Diff.diffLines) return [];
            const parts = Diff.diffLines(prevText || "", curText || "", { newlineIsToken: false });
            const rows = [];
            parts.forEach((part) => {
                let v = part.value;
                if (v.endsWith("\n")) v = v.slice(0, -1);
                const lines = v.length ? v.split("\n") : [];
                lines.forEach((text) => {
                    rows.push({
                        type: part.added ? "add" : part.removed ? "del" : "ctx",
                        text,
                    });
                });
            });
            return rows;
        }

        function prdCollapseDiffContext(rows, contextEachSide) {
            const n = contextEachSide || 2;
            const out = [];
            let i = 0;
            while (i < rows.length) {
                if (rows[i].type === "ctx") {
                    let j = i;
                    while (j < rows.length && rows[j].type === "ctx") j++;
                    const runLen = j - i;
                    if (runLen <= 2 * n + 1) {
                        for (let k = i; k < j; k++) out.push(rows[k]);
                    } else {
                        for (let k = i; k < i + n; k++) out.push(rows[k]);
                        out.push({ type: "fold", count: runLen - 2 * n });
                        for (let k = j - n; k < j; k++) out.push(rows[k]);
                    }
                    i = j;
                } else {
                    out.push(rows[i]);
                    i++;
                }
            }
            return out;
        }

        /** Client fallback if API parsed.questions is empty but raw response still has a QUESTIONS block */
        function parseAgentResponseClient(content) {
            if (!content || typeof content !== "string") {
                return { prose: "", drafting: null, assumptions: [], questions: [] };
            }
            const lines = content.split(/\r?\n/);
            let drafting = null;
            const assumptions = [];
            const questions = [];
            const proseLines = [];
            let startIdx = 0;
            if (lines.length && lines[0].startsWith("DRAFTING:")) {
                drafting = lines[0].slice("DRAFTING:".length).trim();
                startIdx = 1;
            }
            let inQuestions = false;
            let current = null;
            const flushQ = () => {
                if (current) {
                    questions.push(current);
                    current = null;
                }
            };
            let i = startIdx;
            while (i < lines.length) {
                const line = lines[i];
                const stripped = line.trim();
                const qu = stripped.toUpperCase();
                const quCore = qu.replace(/^[#*\s]+|[*:\s]+$/g, "");
                if (quCore === "QUESTIONS") {
                    inQuestions = true;
                    flushQ();
                    i++;
                    continue;
                }
                if (inQuestions) {
                    if (stripped.startsWith("[SINGLE]") || stripped.startsWith("[MULTI]")) {
                        flushQ();
                        const isSingle = stripped.startsWith("[SINGLE]");
                        const rest = stripped.slice(isSingle ? "[SINGLE]".length : "[MULTI]".length).trim();
                        current = { type: isSingle ? "single" : "multi", text: rest, options: [] };
                    } else {
                        const cleanStripped = stripped.replace(/^\*+/, "");
                        if (/^\d+[\.\)]\s+/.test(cleanStripped)) {
                            flushQ();
                            const qtext = cleanStripped.replace(/^\d+[\.\)]\s+/, "").replace(/\*+$/, "").trim();
                            current = { type: "single", text: qtext, options: [] };
                        } else if ((stripped.startsWith("- ") || stripped.startsWith("* ")) && current) {
                            current.options.push(stripped.slice(2).trim());
                        } else if (!stripped) {
                            /* keep */
                        } else if (!current && stripped && !stripped.startsWith("[")) {
                            current = { type: "single", text: stripped, options: [] };
                        } else {
                            flushQ();
                            inQuestions = false;
                            if (line.startsWith("ASSUMPTION:")) assumptions.push(line.slice("ASSUMPTION:".length).trim());
                            else proseLines.push(line);
                        }
                    }
                    i++;
                    continue;
                }
                if (!inQuestions && drafting === null && stripped.startsWith("DRAFTING:")) {
                    drafting = stripped.slice("DRAFTING:".length).trim();
                    break;
                }
                if (line.startsWith("ASSUMPTION:")) {
                    assumptions.push(line.slice("ASSUMPTION:".length).trim());
                    i++;
                    continue;
                }
                proseLines.push(line);
                i++;
            }
            flushQ();
            return { prose: proseLines.join("\n").trim(), drafting, assumptions, questions };
        }

        function AssistantAssumptionsDisclosure({ assumptions }) {
            const [open, setOpen] = React.useState(false);
            const [listId] = React.useState(
                () => "assistant-assumptions-" + Math.random().toString(36).slice(2, 11)
            );
            const n = assumptions.length;
            if (n === 0) return null;
            const label =
                n === 1
                    ? "1 AI assumption made"
                    : `${n} AI assumptions made`;
            return (
                <div>
                    <button
                        type="button"
                        aria-expanded={open}
                        aria-controls={listId}
                        onClick={() => setOpen((v) => !v)}
                        className="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-[#141618]/50 transition-colors"
                    >
                        <span className="text-amber-300/90 text-xs font-medium header-text truncate min-w-0">
                            {label}
                        </span>
                        <span className="ml-auto text-slate-500 text-xs shrink-0" aria-hidden="true">
                            {open ? "▲" : "▼"}
                        </span>
                    </button>
                    {open && (
                        <ul
                            id={listId}
                            className="border-t border-[#2a2d31] bg-[#0d0f11]/90 px-3 py-2 space-y-1.5 text-xs text-slate-400 list-none"
                        >
                            {assumptions.map((text, i) => (
                                <li key={i} className="flex gap-2">
                                    <span className="text-slate-500 shrink-0">•</span>
                                    <span>{text}</span>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        function QuestionFlow({ questions, onSubmit }) {
            const [index, setIndex] = React.useState(0);
            const [selections, setSelections] = React.useState({});
            const [freeTexts, setFreeTexts] = React.useState({});

            const q = questions[index];
            if (!q) return null;

            const sel = selections[index] || [];
            const ft = freeTexts[index] || "";
            const hasAnswer = sel.length > 0 || ft.trim().length > 0;
            const isLast = index === questions.length - 1;

            const toggleOption = (opt) => {
                if (q.type === "single") {
                    setSelections((prev) => ({ ...prev, [index]: [opt] }));
                } else {
                    setSelections((prev) => {
                        const current = prev[index] || [];
                        const next = current.includes(opt)
                            ? current.filter((o) => o !== opt)
                            : [...current, opt];
                        return { ...prev, [index]: next };
                    });
                }
            };

            const advance = () => {
                if (!hasAnswer) return;
                if (isLast) {
                    const parts = questions.map((qItem, i) => {
                        const chosen = selections[i] || [];
                        const free = (freeTexts[i] || "").trim();
                        const answerParts = [...chosen];
                        if (free) answerParts.push(free);
                        return `Q: ${qItem.text}\nA: ${answerParts.join(", ")}`;
                    });
                    onSubmit(`[ANSWERS]\n${parts.join("\n")}\n[/ANSWERS]`);
                } else {
                    setIndex((i) => i + 1);
                }
            };

            return (
                <div className="rounded-xl border border-[#2a2d31] bg-[#1a1d21] p-4 space-y-3 w-full min-w-0">
                    <div className="flex items-start justify-between gap-2">
                        <p className="text-sm text-slate-200 font-medium leading-snug">{q.text}</p>
                        <div className="flex items-center gap-1 shrink-0 mt-0.5">
                            <button type="button" onClick={() => setIndex((i) => i - 1)} disabled={index === 0} className="text-[10px] text-slate-500 hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed px-0.5">&lt;</button>
                            <span className="text-[10px] text-slate-600">{index + 1}/{questions.length}</span>
                            <button type="button" onClick={() => setIndex((i) => i + 1)} disabled={index >= questions.length - 1} className="text-[10px] text-slate-500 hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed px-0.5">&gt;</button>
                        </div>
                    </div>
                    <div className="space-y-1.5">
                        {q.options.map((opt) => {
                            const active = sel.includes(opt);
                            return (
                                <button
                                    key={opt}
                                    type="button"
                                    onClick={() => toggleOption(opt)}
                                    onKeyDown={(e) => { if (e.key === " ") { e.preventDefault(); toggleOption(opt); } }}
                                    className={`w-full text-left text-xs px-3 py-2 rounded-lg border transition-colors ${
                                        active
                                            ? "border-[#00b4d8]/50 bg-[#00b4d8]/10 text-slate-100"
                                            : "border-[#2a2d31] bg-[#141618] text-slate-400 hover:border-slate-500 hover:text-slate-300"
                                    }`}
                                >
                                    {q.type === "single" ? (active ? "● " : "○ ") : (active ? "☑ " : "☐ ")}{opt}
                                </button>
                            );
                        })}
                    </div>
                    <div>
                        <input
                            type="text"
                            value={ft}
                            onChange={(e) => setFreeTexts((prev) => ({ ...prev, [index]: e.target.value }))}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); advance(); } }}
                            placeholder="Or add your own answer…"
                            className="w-full bg-[#141618] border border-[#2a2d31] rounded px-3 py-1.5 text-xs text-slate-300 placeholder-slate-600 focus:outline-none focus:border-slate-500"
                        />
                    </div>
                    <div className="flex justify-end">
                        <button
                            type="button"
                            onClick={advance}
                            disabled={!hasAnswer}
                            className="header-text text-xs px-4 py-1.5 rounded border border-[#00b4d8]/50 bg-[#00b4d8] text-[#0d0f11] font-semibold hover:brightness-110 disabled:bg-[#2a2d31] disabled:text-slate-600 disabled:border-[#2a2d31] disabled:cursor-not-allowed"
                        >
                            {isLast ? "Submit Answers" : "Next →"}
                        </button>
                    </div>
                </div>
            );
        }

        // Module-level so the chosen loading effect survives across pending-bubble
        // mount/unmount cycles (the component remounts for every new "Working on your
        // request…" bubble). `last` makes the effect "sticky" — a fresh bubble re-opens
        // on whatever was last shown. `bag` is a shuffled queue of every pattern index:
        // clicking draws the next one, and the bag only reshuffles once fully drained,
        // so every effect appears exactly once before any repeats.
        let pendingBubblePatternBag = [];
        let pendingBubblePatternLast = null;

        function drawNextPendingBubblePattern(count) {
            if (pendingBubblePatternBag.length === 0) {
                pendingBubblePatternBag = Array.from({ length: count }, (_, i) => i);
                // Fisher-Yates shuffle
                for (let i = pendingBubblePatternBag.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    const tmp = pendingBubblePatternBag[i];
                    pendingBubblePatternBag[i] = pendingBubblePatternBag[j];
                    pendingBubblePatternBag[j] = tmp;
                }
                // Avoid the same effect repeating across a bag boundary.
                if (count > 1 && pendingBubblePatternBag[0] === pendingBubblePatternLast) {
                    const tmp = pendingBubblePatternBag[0];
                    pendingBubblePatternBag[0] = pendingBubblePatternBag[1];
                    pendingBubblePatternBag[1] = tmp;
                }
            }
            pendingBubblePatternLast = pendingBubblePatternBag.shift();
            return pendingBubblePatternLast;
        }

        function PendingBubbleLifeBackdrop() {
            const containerRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                const container = containerRef.current;
                const canvas = canvasRef.current;
                if (!container || !canvas) return undefined;

                const CELL = 4;
                const LIVE_COLOR = "#23262a";
                const DEAD_COLOR = "#1a1d21";
                const FADE_RGBA = "rgba(26, 29, 33, 0.18)";

                let cols = 0, rows = 0, w = 0, h = 0;
                let dpr = window.devicePixelRatio || 1;
                let rafId = 0;

                let patternIdx = 0;
                let patternStart = 0;
                let prevNow = 0;
                let patternState = {};

                function drawCell(ctx, x, y) {
                    if (x < 0 || x >= cols || y < 0 || y >= rows) return;
                    ctx.fillRect(x * CELL, y * CELL, CELL - 0.5, CELL - 0.5);
                }

                function clearCanvas(ctx) {
                    ctx.fillStyle = DEAD_COLOR;
                    ctx.fillRect(0, 0, w, h);
                }

                function fadeCanvas(ctx) {
                    ctx.fillStyle = FADE_RGBA;
                    ctx.fillRect(0, 0, w, h);
                }

                const patterns = [
                    // 0. Sine wave traveling right (abstract)
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const amp = rows * 0.35;
                        const period = Math.max(6, cols * 0.22);
                        for (let x = 0; x < cols; x++) {
                            const y = Math.round(rows / 2 + amp * Math.sin((x / period) * Math.PI * 2 + t * 1.8));
                            drawCell(ctx, x, y);
                            drawCell(ctx, x, y - 1);
                        }
                    },
                    // 1. Pac-chomp (arcade): round 7x7 character with a wedge mouth munches plus-shaped dots
                    (ctx, t, dt) => {
                        if (!patternState.pac) {
                            patternState.pac = { x: -4, dots: [], row: Math.floor(rows / 2) };
                            for (let i = 12; i < cols; i += 6) patternState.pac.dots.push(i);
                        }
                        const p = patternState.pac;
                        p.x += 14 * dt;
                        if (p.x > cols + 4) {
                            p.x = -4;
                            p.dots = [];
                            for (let i = 12; i < cols; i += 6) p.dots.push(i);
                        }
                        const pacCenterX = Math.round(p.x);
                        // Dot is eaten the moment Pac-Man's center column passes its center
                        p.dots = p.dots.filter((dotX) => dotX >= pacCenterX);
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        // Dots: 3x3 plus shape (5 cells) centered on (dotX, p.row)
                        for (const dotX of p.dots) {
                            drawCell(ctx, dotX, p.row - 1);
                            drawCell(ctx, dotX - 1, p.row);
                            drawCell(ctx, dotX, p.row);
                            drawCell(ctx, dotX + 1, p.row);
                            drawCell(ctx, dotX, p.row + 1);
                        }
                        // Pac-Man: 7x7 filled circle (r=3, r²+r threshold for fuller shape) with right-opening wedge mouth
                        const cx = pacCenterX;
                        const cy = p.row;
                        const r = 3;
                        const r2 = r * r + r;
                        const mouthFactor = Math.max(0, Math.sin(t * 9)) * 1.4;
                        for (let dy = -r; dy <= r; dy++) {
                            for (let dx = -r; dx <= r; dx++) {
                                if (dx * dx + dy * dy > r2) continue;
                                if (mouthFactor > 0 && dx > 0 && Math.abs(dy) < dx * mouthFactor) continue;
                                drawCell(ctx, cx + dx, cy + dy);
                            }
                        }
                    },
                    // 2. Plasma flow (abstract)
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const cx = cols / 2, cy = rows / 2;
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < cols; x++) {
                                const v =
                                    Math.sin(x * 0.20 + t * 1.4) +
                                    Math.sin(y * 0.35 + t * 1.1) +
                                    Math.sin((x + y) * 0.12 - t * 0.9) +
                                    Math.sin(Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) * 0.22 + t * 1.6);
                                if (v > 1.4) drawCell(ctx, x, y);
                            }
                        }
                    },
                    // 3. Survival (game): particles hunt smaller ones; biggest wins, then resets
                    (ctx, t, dt) => {
                        const seedSurvival = () => {
                            const count = Math.max(10, Math.min(30, Math.floor((cols * rows) / 80)));
                            const arr = [];
                            for (let i = 0; i < count; i++) {
                                arr.push({
                                    x: 2 + Math.random() * Math.max(1, cols - 4),
                                    y: 2 + Math.random() * Math.max(1, rows - 4),
                                    vx: 0,
                                    vy: 0,
                                    size: 1.0 + Math.random() * 2.8,
                                });
                            }
                            return { particles: arr, settleT: 0 };
                        };
                        if (!patternState.survival) patternState.survival = seedSurvival();
                        const S = patternState.survival;
                        // End condition: ≤1 particle left → brief hold, then reseed
                        if (S.particles.length <= 1) {
                            S.settleT += dt;
                            if (S.settleT > 2.5) {
                                patternState.survival = seedSurvival();
                            }
                        }
                        // Movement: chase nearest smaller; if none, random drift
                        for (const p of S.particles) {
                            let nearest = null;
                            let nearestD = Infinity;
                            for (const q of S.particles) {
                                if (q === p || q.size >= p.size) continue;
                                const dx = q.x - p.x;
                                const dy = q.y - p.y;
                                const d = dx * dx + dy * dy;
                                if (d < nearestD) { nearestD = d; nearest = q; }
                            }
                            if (nearest) {
                                const dx = nearest.x - p.x;
                                const dy = nearest.y - p.y;
                                const d = Math.sqrt(nearestD) || 1;
                                const speed = 5.5;
                                p.vx = (dx / d) * speed;
                                p.vy = (dy / d) * speed;
                            } else {
                                // No prey — wander
                                p.vx += (Math.random() - 0.5) * 1.4;
                                p.vy += (Math.random() - 0.5) * 1.4;
                                p.vx *= 0.94;
                                p.vy *= 0.94;
                            }
                            p.x += p.vx * dt;
                            p.y += p.vy * dt;
                            if (p.x < p.size) { p.x = p.size; p.vx = Math.abs(p.vx); }
                            if (p.x > cols - p.size) { p.x = cols - p.size; p.vx = -Math.abs(p.vx); }
                            if (p.y < p.size) { p.y = p.size; p.vy = Math.abs(p.vy); }
                            if (p.y > rows - p.size) { p.y = rows - p.size; p.vy = -Math.abs(p.vy); }
                        }
                        // Collisions: bigger consumes smaller
                        const dead = new Set();
                        for (let i = 0; i < S.particles.length; i++) {
                            if (dead.has(i)) continue;
                            const a = S.particles[i];
                            for (let j = i + 1; j < S.particles.length; j++) {
                                if (dead.has(j)) continue;
                                const b = S.particles[j];
                                const dx = a.x - b.x;
                                const dy = a.y - b.y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                if (dist < Math.max(a.size, b.size)) {
                                    if (a.size > b.size) {
                                        a.size = Math.sqrt(a.size * a.size + b.size * b.size * 0.6);
                                        dead.add(j);
                                    } else if (b.size > a.size) {
                                        b.size = Math.sqrt(b.size * b.size + a.size * a.size * 0.6);
                                        dead.add(i);
                                        break;
                                    }
                                }
                            }
                        }
                        if (dead.size > 0) {
                            S.particles = S.particles.filter((_, i) => !dead.has(i));
                        }
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        for (const p of S.particles) {
                            const r = p.size;
                            const r2 = r * r;
                            const minX = Math.floor(p.x - r);
                            const maxX = Math.ceil(p.x + r);
                            const minY = Math.floor(p.y - r);
                            const maxY = Math.ceil(p.y + r);
                            for (let yy = minY; yy <= maxY; yy++) {
                                for (let xx = minX; xx <= maxX; xx++) {
                                    const dx = xx + 0.5 - p.x;
                                    const dy = yy + 0.5 - p.y;
                                    if (dx * dx + dy * dy <= r2) drawCell(ctx, xx, yy);
                                }
                            }
                        }
                    },
                    // 4. Matrix rain (abstract)
                    (ctx, t, dt) => {
                        if (!patternState.drops) {
                            patternState.drops = [];
                            for (let i = 0; i < cols; i++) {
                                patternState.drops.push({
                                    y: -Math.random() * rows,
                                    speed: 8 + Math.random() * 18,
                                    active: Math.random() < 0.4,
                                });
                            }
                        }
                        fadeCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        for (let x = 0; x < cols; x++) {
                            const d = patternState.drops[x];
                            if (!d.active) {
                                if (Math.random() < 0.008) {
                                    d.active = true;
                                    d.y = -1;
                                    d.speed = 8 + Math.random() * 18;
                                }
                                continue;
                            }
                            d.y += d.speed * dt;
                            if (d.y >= rows + 1) { d.active = false; continue; }
                            drawCell(ctx, x, Math.floor(d.y));
                        }
                    },
                    // 5. Snake (arcade): AI wanders toward food, grows, resets if stuck
                    (ctx, t, dt) => {
                        const resetSnake = () => {
                            const sx = Math.floor(cols / 2);
                            const sy = Math.floor(rows / 2);
                            const body = [];
                            for (let i = 0; i < 6; i++) body.push({x: sx - i, y: sy});
                            return {
                                body,
                                dir: [1, 0],
                                food: { x: Math.floor(Math.random() * (cols - 1)), y: Math.floor(Math.random() * (rows - 1)) },
                            };
                        };
                        if (!patternState.snake) {
                            patternState.snake = Object.assign({ timer: 0, interval: 0.07 }, resetSnake());
                        }
                        const S = patternState.snake;
                        S.timer += dt;
                        while (S.timer >= S.interval) {
                            S.timer -= S.interval;
                            const head = S.body[0];
                            const distR = ((S.food.x - head.x) + cols) % cols;
                            const distD = ((S.food.y - head.y) + rows) % rows;
                            const candidates = [];
                            if (distR > 0 && distR <= cols - distR) candidates.push([1, 0]);
                            if (distR > 0 && distR > cols - distR) candidates.push([-1, 0]);
                            if (distD > 0 && distD <= rows - distD) candidates.push([0, 1]);
                            if (distD > 0 && distD > rows - distD) candidates.push([0, -1]);
                            const opposite = [-S.dir[0], -S.dir[1]];
                            const safe = candidates.filter(d => !(d[0] === opposite[0] && d[1] === opposite[1])).filter(d => {
                                const nx = (head.x + d[0] + cols) % cols;
                                const ny = (head.y + d[1] + rows) % rows;
                                for (let i = 0; i < S.body.length - 1; i++) {
                                    if (S.body[i].x === nx && S.body[i].y === ny) return false;
                                }
                                return true;
                            });
                            if (safe.length > 0) S.dir = safe[0];
                            const nx = (head.x + S.dir[0] + cols) % cols;
                            const ny = (head.y + S.dir[1] + rows) % rows;
                            let selfHit = false;
                            for (let i = 0; i < S.body.length - 1; i++) {
                                if (S.body[i].x === nx && S.body[i].y === ny) { selfHit = true; break; }
                            }
                            if (selfHit) {
                                Object.assign(S, resetSnake());
                                continue;
                            }
                            S.body.unshift({ x: nx, y: ny });
                            if (nx === S.food.x && ny === S.food.y) {
                                for (let tries = 0; tries < 30; tries++) {
                                    const fx = Math.floor(Math.random() * (cols - 1));
                                    const fy = Math.floor(Math.random() * (rows - 1));
                                    if (!S.body.some(c => c.x === fx && c.y === fy)) {
                                        S.food = { x: fx, y: fy };
                                        break;
                                    }
                                }
                            } else {
                                S.body.pop();
                            }
                        }
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        // Snake body — each segment renders as a 2x2 block so the snake reads as a chunky cable
                        for (const c of S.body) {
                            drawCell(ctx, c.x, c.y);
                            drawCell(ctx, c.x + 1, c.y);
                            drawCell(ctx, c.x, c.y + 1);
                            drawCell(ctx, c.x + 1, c.y + 1);
                        }
                        // Food — 2x2 block to match the snake's scale
                        drawCell(ctx, S.food.x, S.food.y);
                        drawCell(ctx, S.food.x + 1, S.food.y);
                        drawCell(ctx, S.food.x, S.food.y + 1);
                        drawCell(ctx, S.food.x + 1, S.food.y + 1);
                    },
                    // 6. Radial pulse rings (abstract)
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const cx = cols / 2, cy = rows / 2;
                        const maxR = Math.sqrt(cx * cx + cy * cy);
                        const span = maxR + 4;
                        const ring1 = (t * 7) % span;
                        const ring2 = ((t * 7) + span / 2) % span;
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < cols; x++) {
                                const dx = x - cx, dy = y - cy;
                                const d = Math.sqrt(dx * dx + dy * dy);
                                if (Math.abs(d - ring1) < 0.7 || Math.abs(d - ring2) < 0.7) {
                                    drawCell(ctx, x, y);
                                }
                            }
                        }
                    },
                    // 7. Starfield twinkle (abstract): scattered cells fade in/out at independent phases
                    (ctx, t) => {
                        if (!patternState.stars) {
                            patternState.stars = [];
                            const count = Math.max(8, Math.floor(cols * rows * 0.05));
                            for (let i = 0; i < count; i++) {
                                patternState.stars.push({
                                    x: Math.floor(Math.random() * cols),
                                    y: Math.floor(Math.random() * rows),
                                    phase: Math.random() * Math.PI * 2,
                                    speed: 0.6 + Math.random() * 1.8,
                                });
                            }
                        }
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        for (const s of patternState.stars) {
                            const v = Math.sin(t * s.speed + s.phase);
                            if (v > 0.2) drawCell(ctx, s.x, s.y);
                        }
                    },
                    // 8. Spiral arms (abstract)
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const cx = cols / 2, cy = rows / 2;
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < cols; x++) {
                                const dx = x - cx, dy = y - cy;
                                const r = Math.sqrt(dx * dx + dy * dy);
                                const a = Math.atan2(dy, dx);
                                const v = a / (Math.PI * 2) + r * 0.06 - t * 0.35;
                                const f = v - Math.floor(v);
                                if (f < 0.15) drawCell(ctx, x, y);
                            }
                        }
                    },
                    // 9. Pong (arcade): perfect-tracking paddles, 2x2 ball, endless rally
                    (ctx, t, dt) => {
                        if (!patternState.pong) {
                            patternState.pong = {
                                bx: cols / 2,
                                by: rows / 2,
                                vx: 14 + Math.random() * 6,
                                vy: (Math.random() - 0.5) * 14,
                                ly: rows / 2 - 3,
                                ry: rows / 2 - 3,
                                ph: Math.max(5, Math.min(8, Math.floor(rows / 2.5))),
                                ps: 20,
                            };
                        }
                        const S = patternState.pong;
                        S.bx += S.vx * dt;
                        S.by += S.vy * dt;
                        if (S.by <= 0) { S.by = 0; S.vy = Math.abs(S.vy); }
                        if (S.by >= rows - 2) { S.by = rows - 2; S.vy = -Math.abs(S.vy); }
                        if (S.bx <= 2 && S.by + 1 >= S.ly && S.by < S.ly + S.ph) {
                            S.bx = 2;
                            S.vx = Math.abs(S.vx);
                            S.vy = (S.by + 0.5 - (S.ly + S.ph / 2)) * 7;
                        }
                        if (S.bx >= cols - 4 && S.by + 1 >= S.ry && S.by < S.ry + S.ph) {
                            S.bx = cols - 4;
                            S.vx = -Math.abs(S.vx);
                            S.vy = (S.by + 0.5 - (S.ry + S.ph / 2)) * 7;
                        }
                        if (S.bx < -2 || S.bx > cols + 2) {
                            S.bx = cols / 2;
                            S.by = rows / 2;
                            S.vx = (Math.random() < 0.5 ? -1 : 1) * (14 + Math.random() * 6);
                            S.vy = (Math.random() - 0.5) * 14;
                        }
                        const target = S.by + 0.5 - S.ph / 2;
                        const step = S.ps * dt;
                        S.ly = Math.abs(S.ly - target) < step ? target : S.ly + Math.sign(target - S.ly) * step;
                        S.ry = Math.abs(S.ry - target) < step ? target : S.ry + Math.sign(target - S.ry) * step;
                        S.ly = Math.max(0, Math.min(rows - S.ph, S.ly));
                        S.ry = Math.max(0, Math.min(rows - S.ph, S.ry));
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        // Paddles: 2 columns wide
                        for (let i = 0; i < S.ph; i++) {
                            drawCell(ctx, 0, Math.round(S.ly + i));
                            drawCell(ctx, 1, Math.round(S.ly + i));
                            drawCell(ctx, cols - 1, Math.round(S.ry + i));
                            drawCell(ctx, cols - 2, Math.round(S.ry + i));
                        }
                        // Ball: 2x2
                        const bx = Math.round(S.bx);
                        const by = Math.round(S.by);
                        drawCell(ctx, bx, by);
                        drawCell(ctx, bx + 1, by);
                        drawCell(ctx, bx, by + 1);
                        drawCell(ctx, bx + 1, by + 1);
                    },
                    // 10. Crossing waves (abstract): two standing waves — pixels bob in place at each x, no horizontal scroll
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const amp = rows * 0.35;
                        const cy = rows / 2;
                        const k1 = (Math.PI * 2) / Math.max(6, cols * 0.18);
                        const k2 = (Math.PI * 2) / Math.max(6, cols * 0.30);
                        for (let x = 0; x < cols; x++) {
                            const y1 = Math.round(cy + amp * Math.sin(x * k1) * Math.cos(t * 2.0));
                            const y2 = Math.round(cy + amp * Math.sin(x * k2 + 0.7) * Math.cos(t * 1.3 + 0.5));
                            drawCell(ctx, x, y1);
                            drawCell(ctx, x, y2);
                        }
                    },
                    // 11. Space invaders (arcade): 2 rows march; defender at the bottom shoots up
                    (ctx, t, dt) => {
                        const ALIEN_A = [[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[0,2],[2,2],[4,2]];
                        const ALIEN_B = [[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[3,2]];
                        const DEFENDER = [[1,0],[0,1],[1,1],[2,1]];
                        if (!patternState.invaders) {
                            const ALIEN_W = 5, ALIEN_H = 3;
                            const rowsCount = Math.max(1, Math.min(2, Math.floor(rows / 5)));
                            const colsCount = Math.max(2, Math.min(8, Math.floor(cols / (ALIEN_W + 2))));
                            const startX = Math.floor((cols - colsCount * (ALIEN_W + 2)) / 2);
                            const aliens = [];
                            for (let r = 0; r < rowsCount; r++) {
                                for (let c = 0; c < colsCount; c++) {
                                    aliens.push({ x: startX + c * (ALIEN_W + 2), y: 1 + r * (ALIEN_H + 1) });
                                }
                            }
                            patternState.invaders = {
                                aliens,
                                dir: 1,
                                timer: 0,
                                interval: 0.32,
                                frame: 0,
                                alienW: ALIEN_W,
                                alienH: ALIEN_H,
                                defender: { x: cols / 2, fireT: 0 },
                                bullets: [],
                            };
                        }
                        const S = patternState.invaders;
                        S.timer += dt;
                        while (S.timer >= S.interval) {
                            S.timer -= S.interval;
                            S.frame = 1 - S.frame;
                            let atEdge = false;
                            for (const a of S.aliens) {
                                if (S.dir > 0 && a.x + S.alienW >= cols) { atEdge = true; break; }
                                if (S.dir < 0 && a.x <= 0) { atEdge = true; break; }
                            }
                            if (atEdge) {
                                let bottomed = false;
                                for (const a of S.aliens) {
                                    a.y += 1;
                                    if (a.y + S.alienH >= rows - 2) bottomed = true;
                                }
                                S.dir = -S.dir;
                                if (bottomed) {
                                    patternState.invaders = null;
                                    break;
                                }
                            } else {
                                for (const a of S.aliens) a.x += S.dir;
                            }
                        }
                        if (!patternState.invaders) return;
                        // Defender tracks nearest alien horizontally
                        const D = S.defender;
                        if (S.aliens.length > 0) {
                            let target = S.aliens[0];
                            let bestDist = Math.abs(target.x + S.alienW / 2 - D.x);
                            for (const a of S.aliens) {
                                const d = Math.abs(a.x + S.alienW / 2 - D.x);
                                if (d < bestDist) { bestDist = d; target = a; }
                            }
                            const targetX = target.x + S.alienW / 2;
                            const dStep = 12 * dt;
                            const diff = targetX - D.x;
                            D.x = Math.abs(diff) < dStep ? targetX : D.x + Math.sign(diff) * dStep;
                            D.x = Math.max(1, Math.min(cols - 2, D.x));
                        }
                        // Fire bullets
                        D.fireT += dt;
                        if (D.fireT > 0.45 && S.aliens.length > 0) {
                            D.fireT = 0;
                            S.bullets.push({ x: D.x, y: rows - 3, vy: -22 });
                        }
                        for (const b of S.bullets) b.y += b.vy * dt;
                        S.bullets = S.bullets.filter(b => b.y > -1);
                        // Bullet-alien collisions
                        const killed = new Set();
                        S.aliens = S.aliens.filter(a => {
                            for (let i = 0; i < S.bullets.length; i++) {
                                if (killed.has(i)) continue;
                                const b = S.bullets[i];
                                if (b.x >= a.x && b.x < a.x + S.alienW && b.y >= a.y && b.y < a.y + S.alienH) {
                                    killed.add(i);
                                    return false;
                                }
                            }
                            return true;
                        });
                        S.bullets = S.bullets.filter((_, i) => !killed.has(i));
                        if (S.aliens.length === 0) {
                            patternState.invaders = null;
                            return;
                        }
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const sprite = S.frame === 0 ? ALIEN_A : ALIEN_B;
                        for (const a of S.aliens) {
                            for (const [dx, dy] of sprite) drawCell(ctx, a.x + dx, a.y + dy);
                        }
                        // Defender (centered on D.x at the bottom 2 rows)
                        const dxBase = Math.round(D.x);
                        const dyBase = rows - 2;
                        for (const [px, py] of DEFENDER) drawCell(ctx, dxBase + px - 1, dyBase + py);
                        // Bullets
                        for (const b of S.bullets) drawCell(ctx, Math.round(b.x), Math.round(b.y));
                    },
                    // 12. Lissajous trail (abstract)
                    (ctx, t) => {
                        fadeCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const cx = cols / 2, cy = rows / 2;
                        const ax = cols * 0.42, ay = rows * 0.42;
                        const px = Math.round(cx + ax * Math.sin(t * 1.7));
                        const py = Math.round(cy + ay * Math.sin(t * 2.3 + 0.7));
                        drawCell(ctx, px, py);
                        drawCell(ctx, px + 1, py);
                        drawCell(ctx, px, py + 1);
                        drawCell(ctx, px + 1, py + 1);
                    },
                    // 13. Breathing grid of dots (abstract)
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        for (let y = 0; y < rows; y += 2) {
                            for (let x = 0; x < cols; x += 2) {
                                const phase = x * 0.18 + y * 0.30;
                                const v = Math.sin(t * 1.6 + phase);
                                if (v > 0.3) drawCell(ctx, x, y);
                            }
                        }
                    },
                    // 14. Diagonal stripes scroll (abstract)
                    (ctx, t) => {
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        const stride = 8;
                        const offset = (t * 8) % stride;
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < cols; x++) {
                                if (((x + y + offset) % stride) < 2) drawCell(ctx, x, y);
                            }
                        }
                    },
                    // 15. Mega Man takedown (arcade): faster, denser Mets — one touch and he's down, survivors bounce in celebration, then we reset
                    (ctx, t, dt) => {
                        if (!patternState.mega) {
                            patternState.mega = {
                                cx: Math.floor(cols / 2),
                                cy: Math.max(7, rows - 6),
                                facing: 1,
                                chargeAmt: 0,
                                phase: 'pellet',
                                phaseT: 0,
                                mets: [],
                                pellets: [],
                                shotT: 0,
                                spawnT: 0,
                                dead: false,
                                deadT: 0,
                                megaShotPhase: 'idle',
                                megaShotT: 0,
                            };
                        }
                        const M = patternState.mega;
                        if (!M.dead) {
                            M.phaseT += dt;
                            M.shotT += dt;
                            M.spawnT += dt;
                            if (M.megaShotPhase === 'charging' || M.megaShotPhase === 'flashing') {
                                M.megaShotT += dt;
                                if (M.megaShotPhase === 'charging' && M.megaShotT >= 1.2) {
                                    M.megaShotPhase = 'flashing';
                                    M.megaShotT = 0;
                                    // Vaporise every Met on the facing side at the firing moment
                                    M.mets = M.mets.filter(m => Math.sign(m.x + 2 - M.cx) !== M.facing);
                                } else if (M.megaShotPhase === 'flashing' && M.megaShotT >= 0.8) {
                                    M.megaShotPhase = 'done';
                                }
                            }
                            // Twice the spawn pressure, slightly faster march
                            if (M.spawnT > 0.5 + Math.random() * 0.7) {
                                M.spawnT = 0;
                                const fromLeft = Math.random() < 0.5;
                                M.mets.push({
                                    x: fromLeft ? -6 : cols + 1,
                                    y: M.cy,
                                    vx: (fromLeft ? 1 : -1) * (5 + Math.random() * 3),
                                });
                            }
                            // March Mets toward Mega Man
                            for (const m of M.mets) m.x += m.vx * dt;
                            // One Met touching him ends the run
                            let touched = false;
                            for (const m of M.mets) {
                                if (Math.abs(m.x + 2 - M.cx) < 5.5) { touched = true; break; }
                            }
                            if (touched) {
                                M.dead = true;
                                M.deadT = 0;
                                M.pellets = [];
                                // Freeze survivors and give each a random bounce phase
                                for (const m of M.mets) {
                                    m.bouncePhase = Math.random() * Math.PI * 2;
                                    m.vx = 0;
                                }
                            } else {
                                // Face the nearest Met (locked while the super-shot is charging or flashing — no spinning mid-shot)
                                if (M.megaShotPhase === 'idle' || M.megaShotPhase === 'done') {
                                    let nearest = null, nearestD = Infinity;
                                    for (const m of M.mets) {
                                        const d = Math.abs(m.x + 2 - M.cx);
                                        if (d < nearestD) { nearestD = d; nearest = m; }
                                    }
                                    if (nearest) M.facing = nearest.x + 2 > M.cx ? 1 : -1;
                                }
                                // Panic-button super shot — one per life. Triggers when any Met on the facing side enters mid-range (well before he's in trouble). 1.2s build-up, then a 0.8s wall of energy that vaporises that side.
                                if (M.megaShotPhase === 'idle') {
                                    let danger = false;
                                    for (const m of M.mets) {
                                        const dx = m.x + 2 - M.cx;
                                        const ad = Math.abs(dx);
                                        if (ad > 5.5 && ad < 22 && Math.sign(dx) === M.facing) { danger = true; break; }
                                    }
                                    if (danger) {
                                        M.megaShotPhase = 'charging';
                                        M.megaShotT = 0;
                                        // Cancel any in-progress regular charge so the build-up reads clean
                                        M.chargeAmt = 0;
                                        if (M.phase === 'charging') { M.phase = 'pellet'; M.phaseT = 0; }
                                    }
                                }
                                // Phase machine: pellet barrage → charging → big blast → repeat
                                if (M.phase === 'pellet') {
                                    if (M.shotT > 0.875) {
                                        M.shotT = 0;
                                        M.pellets.push({ x: M.cx + M.facing * 7, y: M.cy, vx: M.facing * 38, big: false });
                                    }
                                    if (M.phaseT > 4.5) { M.phase = 'charging'; M.phaseT = 0; }
                                } else if (M.phase === 'charging') {
                                    M.chargeAmt = Math.min(1, M.phaseT / 1.4);
                                    if (M.phaseT > 1.4) {
                                        M.phase = 'blast';
                                        M.phaseT = 0;
                                        M.pellets.push({ x: M.cx + M.facing * 7, y: M.cy, vx: M.facing * 55, big: true, hits: 0 });
                                        M.chargeAmt = 0;
                                    }
                                } else {
                                    if (M.phaseT > 0.6) { M.phase = 'pellet'; M.phaseT = 0; }
                                }
                                // Pellets fly
                                for (const p of M.pellets) p.x += p.vx * dt;
                                M.pellets = M.pellets.filter(p => p.x > -3 && p.x < cols + 3);
                                // Hit detection — small pellet pops on first Met; big blast plows through up to 3 then dies
                                for (const p of M.pellets) {
                                    for (let i = M.mets.length - 1; i >= 0; i--) {
                                        const m = M.mets[i];
                                        if (Math.abs(m.x + 2 - p.x) < 3 && Math.abs(m.y + 2 - p.y) < 3) {
                                            M.mets.splice(i, 1);
                                            if (!p.big) { p.hit = true; break; }
                                            else { p.hits++; if (p.hits >= 3) { p.hit = true; break; } }
                                        }
                                    }
                                }
                                M.pellets = M.pellets.filter(p => !p.hit);
                            }
                        } else {
                            // Celebration window — Mets bounce, then the whole pattern reseeds
                            M.deadT += dt;
                            if (M.deadT > 3.5) { patternState.mega = null; return; }
                        }
                        clearCanvas(ctx);
                        ctx.fillStyle = LIVE_COLOR;
                        // Met sprite (5w × 6h). Each gets a celebration bounce while Mega Man is down.
                        for (const m of M.mets) {
                            const mx = Math.floor(m.x);
                            const bounce = M.dead ? Math.max(0, Math.sin(M.deadT * 8 + (m.bouncePhase || 0))) * 3 : 0;
                            const my = Math.floor(m.y - bounce);
                            drawCell(ctx, mx + 1, my);
                            drawCell(ctx, mx + 2, my);
                            drawCell(ctx, mx + 3, my);
                            for (let d = 0; d <= 4; d++) {
                                drawCell(ctx, mx + d, my + 1);
                                drawCell(ctx, mx + d, my + 2);
                            }
                            drawCell(ctx, mx, my + 3);
                            drawCell(ctx, mx + 1, my + 3);
                            drawCell(ctx, mx + 3, my + 3);
                            drawCell(ctx, mx + 4, my + 3);
                            for (let d = 0; d <= 4; d++) drawCell(ctx, mx + d, my + 4);
                            drawCell(ctx, mx, my + 5);
                            drawCell(ctx, mx + 4, my + 5);
                        }
                        if (M.dead) return;
                        // Pellets / charged Mega Buster blast (only while he's alive)
                        for (const p of M.pellets) {
                            const px = Math.round(p.x), py = Math.round(p.y);
                            if (p.big) {
                                for (let dy = -1; dy <= 1; dy++)
                                    for (let dx = -1; dx <= 1; dx++) drawCell(ctx, px + dx, py + dy);
                                drawCell(ctx, px + 2, py);
                                drawCell(ctx, px - 2, py);
                            } else {
                                drawCell(ctx, px, py);
                                drawCell(ctx, px + (p.vx > 0 ? 1 : -1), py);
                            }
                        }
                        // Mega Man v3 — 13 rows tall, Mega Buster at shoulder height (rows cy-1 and cy) so pellets emerge from his shoulder, not his waist
                        const cx = M.cx, cy = M.cy, f = M.facing;
                        // Helmet peak (rounded top, 3 cells)
                        for (let d = -1; d <= 1; d++) drawCell(ctx, cx + d, cy - 7);
                        // Helmet upper (5 cells)
                        for (let d = -2; d <= 2; d++) drawCell(ctx, cx + d, cy - 6);
                        // Helmet brim — widest part of the head (7 cells)
                        for (let d = -3; d <= 3; d++) drawCell(ctx, cx + d, cy - 5);
                        // Face row: gaps at -1 and +1 read as two eyes flanking a center nose pixel
                        drawCell(ctx, cx - 3, cy - 4);
                        drawCell(ctx, cx - 2, cy - 4);
                        drawCell(ctx, cx, cy - 4);
                        drawCell(ctx, cx + 2, cy - 4);
                        drawCell(ctx, cx + 3, cy - 4);
                        // Jaw / lower helmet edge (7 cells)
                        for (let d = -3; d <= 3; d++) drawCell(ctx, cx + d, cy - 3);
                        // Neck — narrower than head (5 cells)
                        for (let d = -2; d <= 2; d++) drawCell(ctx, cx + d, cy - 2);
                        // Shoulders + Mega Buster row 1 (the arm fires from HERE, not below)
                        for (let d = -2; d <= 2; d++) drawCell(ctx, cx + d, cy - 1);
                        for (let d = 3; d <= 6; d++) drawCell(ctx, cx + f * d, cy - 1);
                        // Chest + Mega Buster row 2 — 2-row cannon for the chunky Mega Buster look
                        for (let d = -2; d <= 2; d++) drawCell(ctx, cx + d, cy);
                        for (let d = 3; d <= 6; d++) drawCell(ctx, cx + f * d, cy);
                        // Lower chest
                        for (let d = -2; d <= 2; d++) drawCell(ctx, cx + d, cy + 1);
                        // Waist with central belt-buckle gap
                        drawCell(ctx, cx - 2, cy + 2);
                        drawCell(ctx, cx - 1, cy + 2);
                        drawCell(ctx, cx + 1, cy + 2);
                        drawCell(ctx, cx + 2, cy + 2);
                        // Thighs (split)
                        drawCell(ctx, cx - 2, cy + 3);
                        drawCell(ctx, cx - 1, cy + 3);
                        drawCell(ctx, cx + 1, cy + 3);
                        drawCell(ctx, cx + 2, cy + 3);
                        // Shins (split)
                        drawCell(ctx, cx - 2, cy + 4);
                        drawCell(ctx, cx - 1, cy + 4);
                        drawCell(ctx, cx + 1, cy + 4);
                        drawCell(ctx, cx + 2, cy + 4);
                        // Boots — 1 cell wider than legs each side
                        drawCell(ctx, cx - 3, cy + 5);
                        drawCell(ctx, cx - 2, cy + 5);
                        drawCell(ctx, cx - 1, cy + 5);
                        drawCell(ctx, cx + 1, cy + 5);
                        drawCell(ctx, cx + 2, cy + 5);
                        drawCell(ctx, cx + 3, cy + 5);
                        // Charge glow — centered on the new shoulder-height cannon (rows cy-1 and cy)
                        if (M.chargeAmt > 0) {
                            const tip = cx + f * 6;
                            if (M.chargeAmt > 0.25) {
                                drawCell(ctx, tip, cy - 2);
                                drawCell(ctx, tip, cy + 1);
                            }
                            if (M.chargeAmt > 0.55) {
                                const next = tip + f;
                                drawCell(ctx, next, cy - 1);
                                drawCell(ctx, next, cy);
                                drawCell(ctx, tip, cy - 3);
                                drawCell(ctx, tip, cy + 2);
                            }
                            if (M.chargeAmt > 0.85) {
                                const next2 = tip + f * 2;
                                drawCell(ctx, next2, cy - 1);
                                drawCell(ctx, next2, cy);
                                drawCell(ctx, tip + f, cy - 2);
                                drawCell(ctx, tip + f, cy + 1);
                            }
                        }
                        // Super-shot build-up: two expanding rings around Mega Man + a late-charge flicker at the cannon
                        if (M.megaShotPhase === 'charging') {
                            const r1 = 3 + (M.megaShotT / 1.2) * 13;
                            for (let dy = -Math.ceil(r1); dy <= Math.ceil(r1); dy++) {
                                for (let dx = -Math.ceil(r1); dx <= Math.ceil(r1); dx++) {
                                    const d = Math.sqrt(dx * dx + dy * dy);
                                    if (Math.abs(d - r1) < 0.8) drawCell(ctx, cx + dx, cy + dy);
                                }
                            }
                            if (M.megaShotT > 0.4) {
                                const r2 = 3 + Math.min(1, (M.megaShotT - 0.4) / 0.8) * 10;
                                for (let dy = -Math.ceil(r2); dy <= Math.ceil(r2); dy++) {
                                    for (let dx = -Math.ceil(r2); dx <= Math.ceil(r2); dx++) {
                                        const d = Math.sqrt(dx * dx + dy * dy);
                                        if (Math.abs(d - r2) < 0.8) drawCell(ctx, cx + dx, cy + dy);
                                    }
                                }
                            }
                            if (M.megaShotT > 1.02 && Math.sin(M.megaShotT * 60) > 0) {
                                const tipCx = cx + f * 6;
                                for (let dy = -3; dy <= 3; dy++) {
                                    for (let dx = -3; dx <= 3; dx++) {
                                        if (dx * dx + dy * dy <= 9) drawCell(ctx, tipCx + dx, cy + 1 + dy);
                                    }
                                }
                            }
                        }
                        // Super-shot beam — tapered wall of energy, widest at the cannon, narrowing toward the bubble edge
                        if (M.megaShotPhase === 'flashing') {
                            const tipX = cx + f * 7;
                            const beamLo = f > 0 ? tipX : 0;
                            const beamHi = f > 0 ? cols : tipX + 1;
                            const beamLen = Math.max(1, beamHi - beamLo);
                            for (let bx = beamLo; bx < beamHi; bx++) {
                                const distFromCannon = f > 0 ? bx - tipX : tipX - bx;
                                const normDist = Math.min(1, Math.max(0, distFromCannon / beamLen));
                                const halfH = Math.floor(7 - normDist * 3);
                                for (let by = cy - halfH; by <= cy + halfH; by++) {
                                    drawCell(ctx, bx, by);
                                }
                            }
                        }
                    },
                ];

                // Sticky: a fresh bubble re-opens on the last-shown effect. Only draw a
                // new one from the shuffle bag the very first time (or if the recorded
                // index is somehow out of range for the current pattern set).
                patternIdx = (pendingBubblePatternLast !== null && pendingBubblePatternLast < patterns.length)
                    ? pendingBubblePatternLast
                    : drawNextPendingBubblePattern(patterns.length);

                function applyPattern() {
                    patternState = {};
                    patternStart = performance.now();
                    prevNow = patternStart;
                    const ctx = canvas.getContext("2d");
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    clearCanvas(ctx);
                }

                // Measure the bubble and (re)size the canvas. Returns true only when the
                // geometry actually changed. The bubble often mounts narrower than its
                // settled width (flex layout has not resolved on the first frame), so the
                // initial measurement can be too small; the ResizeObserver below calls
                // this again once the real width arrives and we resize to fill the bar.
                function geometry() {
                    const rect = container.getBoundingClientRect();
                    const newDpr = window.devicePixelRatio || 1;
                    const newW = Math.max(40, Math.floor(rect.width));
                    const newH = Math.max(16, Math.floor(rect.height));
                    if (newW === w && newH === h && newDpr === dpr && canvas.width > 0) return false;
                    dpr = newDpr;
                    w = newW;
                    h = newH;
                    canvas.style.width = w + "px";
                    canvas.style.height = h + "px";
                    canvas.style.display = "block";
                    canvas.width = Math.floor(w * dpr);
                    canvas.height = Math.floor(h * dpr);
                    cols = Math.max(8, Math.floor(w / CELL));
                    rows = Math.max(4, Math.floor(h / CELL));
                    return true;
                }

                function loop(now) {
                    const ctx = canvas.getContext("2d");
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    const t = (now - patternStart) / 1000;
                    const dt = Math.min(0.1, (now - prevNow) / 1000);
                    prevNow = now;
                    patterns[patternIdx](ctx, t, dt);
                    rafId = requestAnimationFrame(loop);
                }

                function cycle() {
                    patternIdx = drawNextPendingBubblePattern(patterns.length);
                    applyPattern();
                }

                geometry();
                applyPattern();
                rafId = requestAnimationFrame(loop);

                const clickTarget = container.parentElement;
                const onClick = () => cycle();
                if (clickTarget) {
                    clickTarget.style.cursor = "pointer";
                    clickTarget.addEventListener("click", onClick);
                }

                let ro = null;
                if (typeof ResizeObserver !== "undefined") {
                    ro = new ResizeObserver(() => {
                        // Re-seed only when the size genuinely changed — this both fixes the
                        // mount-too-narrow case and absorbs later real resizes without
                        // needlessly restarting the effect on every spurious callback.
                        if (geometry()) applyPattern();
                    });
                    ro.observe(container);
                }

                return () => {
                    if (rafId) cancelAnimationFrame(rafId);
                    if (ro) ro.disconnect();
                    if (clickTarget) {
                        clickTarget.style.cursor = "";
                        clickTarget.removeEventListener("click", onClick);
                    }
                };
            }, []);

            return (
                <div
                    ref={containerRef}
                    className="absolute inset-0 pointer-events-none"
                    aria-hidden="true"
                >
                    <canvas ref={canvasRef} />
                </div>

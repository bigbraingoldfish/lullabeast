                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ section_key: slug }),
                })
                    .then(async (r) => {
                        const data = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const det =
                                typeof data.detail === "string"
                                    ? data.detail
                                    : (data.detail && JSON.stringify(data.detail)) || "";
                            throw new Error(det || `HTTP ${r.status}`);
                        }
                        return data;
                    })
                    .then(() => fetch(`/api/ideas/${currentIdeaId}/session`))
                    .then((r) => r.json())
                    .then((d) => {
                        setPrdContent(d.prd_content || "");
                        setExpandedDiffSlugs((p) => p.filter((x) => x !== slug));
                        if (fromUndo) {
                            setUndoOfferSlugs((p) => p.filter((x) => x !== slug));
                        } else {
                            setUndoOfferSlugs((p) => (p.includes(slug) ? p : [...p, slug]));
                        }
                        fetchPrdSectionDiff(currentIdeaId);
                    })
                    .catch((err) => {
                        setSectionRevertError({ slug, message: err.message || String(err) });
                    });
            };

            const buildOptimisticSentContext = (draftList, att) => {
                const notes = (draftList || []).map((a) => ({
                    id: a.id,
                    section: a.section || "",
                    comment: a.comment || "",
                }));
                const sc = {};
                if (notes.length) sc.notes = notes;
                if (att && att.filename) sc.attachment = { filename: att.filename };
                return Object.keys(sc).length ? sc : null;
            };

            // Shared file-to-attachment processor — used by both the file picker (button)
            // and the drag-and-drop drop handler so the size-limit + image/text branching
            // lives in one place.
            const processAttachmentFile = (f) => {
                if (!f) return;
                const MAX_ATTACH = 5 * 1024 * 1024;
                if (f.size > MAX_ATTACH) {
                    alert("Attachment too large. Maximum size is 5 MB.");
                    return;
                }
                const isImg = /\.(png|jpg|jpeg|gif|webp)$/i.test(f.name) || (f.type && f.type.startsWith("image/"));
                const reader = new FileReader();
                if (isImg) {
                    reader.onload = (ev) => setStagedAttachment({ filename: f.name, content: ev.target.result, is_image: true });
                    reader.readAsDataURL(f);
                } else {
                    reader.onload = (ev) => setStagedAttachment({ filename: f.name, content: ev.target.result, is_image: false });
                    reader.readAsText(f);
                }
            };

            const submitMessage = (overrideText) => {
                const t = (overrideText !== undefined ? overrideText : inputText).trim();
                if (!t || isLoading || !currentIdeaId) return;
                setUserFirstTurnPending(false);
                const baseMsgs = messages.filter((m) => !m._gatewayFailed);
                const turn = baseMsgs.filter((m) => m.role === "user").length + 1;
                const userMsgId = `u-${Date.now()}`;
                const assistantPendingId = `a-${Date.now()}`;
                const nowIso = new Date().toISOString();
                const draftSnap = annotations.filter((a) => !a.submitted);
                const attachmentSnap = stagedAttachment;
                const optimisticSentContext = buildOptimisticSentContext(draftSnap, attachmentSnap);
                const userRow = {
                    id: userMsgId,
                    role: "user",
                    content: t,
                    ts: nowIso,
                    ...(optimisticSentContext ? { sent_context: optimisticSentContext } : {}),
                };
                setHiddenNoteIdsForSend(() => new Set(draftSnap.map((a) => a.id)));
                setMessages([
                    ...baseMsgs,
                    userRow,
                    { id: assistantPendingId, role: "assistant", content: "Working on your request...", ts: nowIso, pending: true },
                ]);
                if (overrideText === undefined) setInputText("");
                setTimeout(() => adjustTa(), 0);
                setStagedAttachment(null);
                setIsLoading(true);
                isLoadingRef.current = true;
                const body = { content: t, turn };
                if (attachmentSnap) body.attachment = attachmentSnap;
                // Bound the held connection: abort after CLIENT_WAIT_MS and hand
                // off to the recovery poll (the server keeps working).
                const _sendController = new AbortController();
                const _abortTimer = setTimeout(() => _sendController.abort(), CLIENT_WAIT_MS);
                fetch(`/api/ideas/${currentIdeaId}/message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                    signal: _sendController.signal,
                })
                    .then((r) => {
                        clearTimeout(_abortTimer);
                        if (!r.ok) {
                            // Carry the status so the catch can route (abort vs
                            // gateway-down vs a definitive timeout). The
                            // reason-specific WORDING is authored by the backend
                            // (_ideas_timeout_message) and persisted to
                            // session.json; the recovery poll renders it from
                            // there — single source, so we do not re-parse the
                            // body here.
                            const e = new Error(String(r.status));
                            e.status = r.status;
                            throw e;
                        }
                        return r.json();
                    })
                    .then((data) => {
                        stopLateHealPoll();
                        let parsed = data.parsed || null;
                        if (data.response) {
                            const clientParsed = parseAgentResponseClient(data.response);
                            if (!parsed) {
                                parsed = clientParsed;
                            } else if ((!parsed.questions || parsed.questions.length === 0) && clientParsed.questions && clientParsed.questions.length > 0) {
                                parsed = { ...parsed, questions: clientParsed.questions };
                            }
                        }
                        const displayContent = (parsed && parsed.prose) ? parsed.prose : (data.response || "No agent output returned for this turn.");
                        if (parsed && parsed.drafting) triggerDraftingIndicator(parsed.drafting);
                        setMessages((prev) =>
                            prev.map((m) =>
                                m.id === assistantPendingId
                                    ? { ...m, pending: false, content: displayContent, ts: new Date().toISOString(), parsed }
                                    : m
                            )
                        );
                        setPrdContent(data.prd_content || "");
                        setIsLoading(false);
                        isLoadingRef.current = false;
                        setReadinessStatus("updating");
                        setReadinessData(null);
                        setReadinessTimedOut(false);
                        startReadinessPoll(currentIdeaId);
                        setHiddenNoteIdsForSend(() => new Set());
                        refreshAnnotations(currentIdeaId);
                        refreshIdeas();
                        fetchPrdSectionDiff(currentIdeaId);
                    })
                    .catch((err) => {
                        clearTimeout(_abortTimer);
                        const isAbort = err && err.name === "AbortError";
                        const status = err?.status ?? parseInt(err?.message, 10);

                        // Abort / network drop / a direct (now-definitive) 408:
                        // the gateway ACCEPTED the turn, so the backend is the
                        // authority on success-vs-timeout. Keep the "Working on
                        // your request…" bubble and poll GET /session until the
                        // backend's verdict lands. Revert the draft ONLY when the
                        // turn resolves to a DEFINITIVE backend error (married to
                        // the error bubble) — never on a frontend timer.
                        if (isAbort || !Number.isFinite(status) || status === 408) {
                            startSessionHealPoll({
                                ideaId: currentIdeaId,
                                resolveWhen: (msgs) => {
                                    const a = [...msgs].reverse().find((m) => m.role === "assistant");
                                    return !!a && !a.pending; // real reply OR the backend's definitive error
                                },
                                maxTicks: 192, // ~16 min @ 5s — out-waits the 900s backstop so we OBSERVE the verdict
                                onResolved: (rawMsgs) => {
                                    // Definitive timeout confirmed when the resolved
                                    // turn is an error (the heal poll already rendered
                                    // the reason-specific message from session.json) —
                                    // hand the draft back for retry. Married to the
                                    // error bubble; never on a successful reply.
                                    const a = [...rawMsgs].reverse().find((m) => m.role === "assistant");
                                    if (a && a.error && overrideText === undefined) {
                                        setInputText(t);
                                        setStagedAttachment(attachmentSnap);
                                    }
                                },
                                onExhausted: () => {
                                    // No verdict ever observed (server unreachable).
                                    // NOT a definitive signal — show "couldn't
                                    // confirm" but do NOT revert the draft (the
                                    // turn may well have succeeded).
                                    setIsLoading(false);
                                    isLoadingRef.current = false;
                                    setMessages((prev) =>
                                        prev.map((m) =>
                                            m.id === assistantPendingId
                                                ? { ...m, pending: false, error: true, content: "Couldn't confirm the reply landed — refresh to check, or retry." }
                                                : m
                                        )
                                    );
                                },
                            });
                            return;
                        }

                        // 502/503 = the webhook POST failed; the agent was NEVER
                        // invoked (the backend rolled back the turn pair). This is
                        // genuinely terminal NOW — show the failure, flag the
                        // ephemeral pair so a resubmit drops it, restore the draft,
                        // and start a short heal poll in case a stale .done lands.
                        let errorMsg = "Message sent but agent response failed. You can retry.";
                        if (status === 502 || status === 503) {
                            errorMsg = "Agent gateway is unreachable. Check that OpenClaw is running.";
                        }
                        setMessages((prev) =>
                            prev.map((m) => {
                                if (m.id === assistantPendingId) {
                                    return {
                                        ...m,
                                        pending: false,
                                        error: true,
                                        content: errorMsg,
                                        ts: new Date().toISOString(),
                                        ...((status === 502 || status === 503) ? { _gatewayFailed: true } : {}),
                                    };
                                }
                                if ((status === 502 || status === 503) && m.id === userMsgId) {
                                    return { ...m, _gatewayFailed: true };
                                }
                                return m;
                            })
                        );
                        setHiddenNoteIdsForSend(() => new Set());
                        setStagedAttachment(attachmentSnap);
                        if ((status === 502 || status === 503) && overrideText === undefined) {
                            setInputText(t);
                        }
                        setIsLoading(false);
                        isLoadingRef.current = false;
                        if (status === 502 || status === 503) {
                            startSessionHealPoll({
                                ideaId: currentIdeaId,
                                resolveWhen: (msgs) => !msgs.some((m) => m.role === "assistant" && m.error),
                                maxTicks: 24,
                            });
                        }
                    });
            };

            const onKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    submitMessage();
                }
            };

            const newIdea = () => {
                fetch("/api/ideas", { method: "POST" })
                    .then((r) => r.json())
                    .then((d) => {
                        setCurrentIdeaId(d.id);
                        sessionStorage.setItem(LAST_IDEA_KEY, d.id);
                        setMessages([]);
                        setHiddenNoteIdsForSend(() => new Set());
                        setPrdContent("");
                        setRoadmapContent("");
                        setVerificationContent("");
                        setInputText("");
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                        setHadReadyReadiness(false);
                        setReadinessTimedOut(false);
                        setActiveIdeaMenuId(null);
                        setShowActionMenu(false);
                        setStagedAttachment(null);
                        setUserFirstTurnPending(true);
                    });
            };

            const selectIdeaFromRail = (id) => {
                if (id !== currentIdeaId) {
                    setUserFirstTurnPending(false);
                }
                setCurrentIdeaId(id);
                sessionStorage.setItem(LAST_IDEA_KEY, id);
                setActiveIdeaMenuId(null);
                setRenamingIdeaId(null);
                setRenameError("");
            };

            const beginRename = (idea) => {
                setDeleteConfirmId(null);
                setActiveIdeaMenuId(null);
                setRenameError("");
                setRenamingIdeaId(idea.id);
                setRenameDraft(idea.name || "");
            };

            const cancelRename = () => {
                setRenamingIdeaId(null);
                setRenameDraft("");
                setRenameError("");
            };

            const submitRename = (id) => {
                fetch(`/api/ideas/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: renameDraft }),
                })
                    .then(async (r) => {
                        const payload = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            throw new Error(payload.detail || "Rename failed");
                        }
                        cancelRename();
                        refreshIdeas();
                    })
                    .catch((e) => {
                        setRenameError(String(e.message || e));
                    });
            };

            const executeDelete = (id) => {
                fetch(`/api/ideas/${id}`, { method: "DELETE" }).then(() => {
                    setDeleteConfirmId(null);
                    refreshIdeas();
                    if (currentIdeaId === id) {
                        if (sessionStorage.getItem(LAST_IDEA_KEY) === id) {
                            sessionStorage.removeItem(LAST_IDEA_KEY);
                        }
                        setMessages([]);
                        setPrdContent("");
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                        setHadReadyReadiness(false);
                        setReadinessTimedOut(false);
                        setCurrentIdeaId(null);
                    }
                });
            };

            const _opEstimate = (opKey) => {
                const m = operationMetrics[opKey];
                if (!m || !m.sample_count) return "first run, no estimate";
                const n = m.sample_count;
                return `~${Math.round(m.avg_seconds)}s based on your last ${n} run${n > 1 ? "s" : ""}`;
            };

            const _needsLowReadinessConvertGuard = () =>
                readinessStatus === "ready" &&
                readinessData != null &&
                typeof readinessData.score === "number" &&
                Number.isFinite(readinessData.score) &&
                readinessData.score < 8;

            const beginConvertAfterGuards = () => {
                if (isLoading || isLoadingRef.current) return;
                if (_needsLowReadinessConvertGuard()) {
                    setShowLowReadinessGenerateConfirm(true);
                    return;
                }
                _runConvert();
            };

            const _runConvert = () => {
                if (isLoading || isLoadingRef.current) return;
                const ideaId = currentIdeaId;
                const seq = ++convertRequestSeqRef.current;
                const startedAt = Date.now();
                setConvertLoading(true);
                setConvertError("");
                stopRoadmapRecoverPoll();
                const MIN_ROADMAP_GENERATING_UI_MS = 1500;
                fetch(`/api/ideas/${ideaId}/convert`, { method: "POST" })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { const e = new Error(t); e.status = r.status; throw e; });
                        return r.json();
                    })
                    .then((d) => {
                        const applySuccess = () => {
                            if (convertRequestSeqRef.current !== seq) return;
                            setRoadmapContent(d.roadmap_content || "");
                            setVerificationContent(d.verification_content || "");
                            setConvertLoading(false);
                            setActiveDocTab("roadmap");
                        };
                        const elapsed = Date.now() - startedAt;
                        const pad = MIN_ROADMAP_GENERATING_UI_MS - elapsed;
                        if (pad <= 0) {
                            applySuccess();
                        } else {
                            window.setTimeout(applySuccess, pad);
                        }
                    })
                    .catch((e) => {
                        if (convertRequestSeqRef.current !== seq) return;
                        const msg = String(e.message || e);
                        setConvertError(msg);
                        setConvertLoading(false);
                        if (
                            e.status === 408 ||
                            msg.includes("Conversion timed out") ||
                            msg.includes("timed out") ||
                            msg.includes("408")
                        ) {
                            startRoadmapRecoverPoll(ideaId);
                        }
                    });
            };

            const doConvert = () => {
                if (!currentIdeaId || !prdContent.trim()) return;
                if (isLoading) return;
                if (roadmapContent) {
                    setShowRegenerateConfirm(true);
                    return;
                }
                beginConvertAfterGuards();
            };

            const ROADMAP_BEHIND_PRD_DISMISS_PREFIX = "autodev:roadmapBehindPrdDismissed:";
            const _roadmapBehindPrdStorageKey = (ideaId) =>
                `${ROADMAP_BEHIND_PRD_DISMISS_PREFIX}${ideaId}`;

            const _continueSetupAfterStalenessOk = (contentOverride) => {
                // Honor contentOverride only when it's a string. The "Continue to
                // Setup" button is wired onClick={continueSetup}, so React passes a
                // SyntheticEvent as the first arg — a `!= null` check would treat that
                // event object as a roadmap override and throw in rm.includes(...).
                const rm = (typeof contentOverride === "string" ? contentOverride : roadmapContent) || "";
                if (rm.includes("Transformation Aborted")) {
                    setFormatInvalidDetail(
                        "The roadmap contains a 'Transformation Aborted' phase and cannot be used for setup. Generate a valid roadmap first.",
                    );
                    setShowFormatInvalidModal(true);
                    return;
                }
                setContinueNavPending(true);
                fetch("/api/setup/validate-roadmap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: rm }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setContinueNavPending(false);
                        if (!r.ok || !d.valid) {
                            const errMsgs = (d.errors || []).map((e) => e.message || String(e)).join("; ");
                            setFormatInvalidDetail(errMsgs || "Roadmap did not pass validation.");
                            setShowFormatInvalidModal(true);
                            return;
                        }
                        if (ctx && ctx.navigateToPreflightWithSeed) {
                            ctx.navigateToPreflightWithSeed(
                                rm,
                                prdContent || "",
                                verificationContent || "",
                                currentIdeaName || "",
                                currentIdeaId || null,
                            );
                        }
                    })
                    .catch(() => {
                        setContinueNavPending(false);
                        setFormatInvalidDetail("Could not validate roadmap.");
                        setShowFormatInvalidModal(true);
                    });
            };

            const continueSetup = (contentOverride) => {
                // Honor contentOverride only when it's a string. The "Continue to
                // Setup" button is wired onClick={continueSetup}, so React passes a
                // SyntheticEvent as the first arg — a `!= null` check would treat that
                // event object as a roadmap override and throw in rm.includes(...).
                const rm = (typeof contentOverride === "string" ? contentOverride : roadmapContent) || "";
                if (rm.includes("Transformation Aborted")) {
                    setFormatInvalidDetail(
                        "The roadmap contains a 'Transformation Aborted' phase and cannot be used for setup. Generate a valid roadmap first.",
                    );
                    setShowFormatInvalidModal(true);
                    return;
                }
                if (!currentIdeaId) {
                    _continueSetupAfterStalenessOk(contentOverride);
                    return;
                }
                setContinueNavPending(true);
                fetch(`/api/ideas/${currentIdeaId}/draft-sync-status`)
                    .then(async (r) => {
                        let d = {};
                        try {
                            d = await r.json();
                        } catch (e) {
                            d = {};
                        }
                        if (!r.ok) {
                            setContinueNavPending(false);
                            _continueSetupAfterStalenessOk(contentOverride);
                            return;
                        }
                        if (
                            d.roadmap_behind_prd === true &&
                            typeof d.prd_draft_mtime === "number" &&
                            typeof d.roadmap_draft_mtime === "number"
                        ) {
                            let dismissed = false;
                            try {
                                const raw = sessionStorage.getItem(_roadmapBehindPrdStorageKey(currentIdeaId));
                                if (raw) {
                                    const o = JSON.parse(raw);
                                    dismissed =
                                        o.prd_mtime === d.prd_draft_mtime &&
                                        o.roadmap_mtime === d.roadmap_draft_mtime;
                                }
                            } catch (e) {
                                dismissed = false;
                            }
                            if (dismissed) {
                                setContinueNavPending(false);
                                _continueSetupAfterStalenessOk(contentOverride);
                                return;
                            }
                            setRoadmapBehindPrdMeta({
                                prd_mtime: d.prd_draft_mtime,
                                roadmap_mtime: d.roadmap_draft_mtime,
                            });
                            setContinueNavPending(false);
                            setShowRoadmapBehindPrdModal(true);
                            return;
                        }
                        setContinueNavPending(false);
                        _continueSetupAfterStalenessOk(contentOverride);
                    })
                    .catch(() => {
                        setContinueNavPending(false);
                        _continueSetupAfterStalenessOk(contentOverride);
                    });
            };

            const doFixRoadmapFormat = () => {
                if (!currentIdeaId) return;
                const ideaId = currentIdeaId;
                setFixFormatLoading(true);
                fetch(`/api/ideas/${ideaId}/fix-roadmap-format`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ roadmap_content: roadmapContent }),
                })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { const e = new Error(t); e.status = r.status; throw e; });
                        return r.json();
                    })
                    .then((d) => {
                        setFixFormatLoading(false);
                        setShowFormatInvalidModal(false);
                        if (d.roadmap_content) {
                            setRoadmapContent(d.roadmap_content);
                            // Pass the fresh content explicitly — setRoadmapContent
                            // has not flushed to state yet this tick.
                            continueSetup(d.roadmap_content);
                        }
                    })
                    .catch((e) => {
                        setFixFormatLoading(false);
                        // 408 = the correction is slow but still running (the agent
                        // is a different, slower model than the chat). Keep the modal
                        // open with a non-blocking notice and pick up the corrected
                        // roadmap when it lands (mirrors convert's recovery), then
                        // continue with the FRESH content. Output is never stranded.
                        if (e && e.status === 408) {
                            setFormatInvalidDetail(
                                "Format correction is taking longer than usual — it's still finishing in the background. We'll continue automatically as soon as it's ready.",
                            );
                            startRoadmapRecoverPoll(ideaId, (rm) => continueSetup(rm));
                        } else {
                            setFormatInvalidDetail(`Fix Format failed: ${e.message || e}`);
                        }
                    });
            };


            const listedIds = new Set((ideasList || []).map((it) => it.id));
            const showUnlistedSession = currentIdeaId && !listedIds.has(currentIdeaId);
            const currentIdeaName =
                (ideasList.find((it) => it.id === currentIdeaId) || {}).name ||
                (currentIdeaId ? currentIdeaId.slice(0, 8) : "Conversation");

            const slugifySectionName = (name) =>
                String(name || "")
                    .toLowerCase()
                    .replace(/&/g, "and")
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "");

            /**
             * Strip a leading ordinal prefix ("1. ", "12.  ", etc.) from a heading title.
             * Handles the common model output style "## 1. Problem Statement" so the inner
             * text is normalised before matching canonical PRD_SECTION_TITLES.
             * Keep in sync with _normalize_prd_section_heading_text in ui/server.py.
             */
            const normalizePrdHeadingText = (inner) =>
                String(inner || "").replace(/^\d+\.\s*/, "").trim();

            const parsePrdSections = (content) => {
                const out = {};
                PRD_SECTION_TITLES.forEach((t) => {
                    out[t] = "";
                });
                if (!content || !content.trim()) return out;
                const lines = String(content).split("\n");
                let current = null;
                for (const line of lines) {
                    const heading = line.match(/^#{1,3}\s+(.+)\s*$/);
                    if (heading) {
                        const normalized = normalizePrdHeadingText(heading[1]);
                        const matched = PRD_SECTION_TITLES.find(
                            (t) => t.toLowerCase() === normalized.toLowerCase()
                        );
                        if (matched) {
                            current = matched;
                            continue;
                        }
                    }
                    const numHeading = line.match(/^\d+\.\s*(.+)\s*$/);
                    if (numHeading) {
                        const rawTitle = numHeading[1].trim();
                        const matched = PRD_SECTION_TITLES.find(
                            (t) => t.toLowerCase() === rawTitle.toLowerCase()
                        );
                        if (matched) {
                            current = matched;
                            continue;
                        }
                    }
                    if (current) {
                        out[current] = out[current] ? `${out[current]}\n${line}` : line;
                    }
                }
                return out;
            };

            const prdSections = parsePrdSections(prdContent || "");

            const hasAnyPrdBody = PRD_SECTION_TITLES.some((t) => (prdSections[t] || "").trim().length > 0);
            const hasRemovedInDiff = PRD_SECTION_TITLES.some((t) => {
                const sl = slugifySectionName(t);
                const e = prdSectionDiff[sl];
                return e && e.status === "removed";
            });

            const ideaScoreTextClass = (s) => {
                if (typeof s !== "number" || !Number.isFinite(s)) return "text-slate-500";
                if (s >= 8) return "text-emerald-400";
                if (s >= 5) return "text-amber-400";
                return "text-red-400";
            };
            const ideaScoreBarClass = (s) => {
                if (typeof s !== "number" || !Number.isFinite(s)) return null;
                if (s >= 8) return "bg-emerald-400";
                if (s >= 5) return "bg-amber-400";
                return "bg-red-400";
            };
            const onIdeaRowMouseEnter = (it, e) => {
                if (hoverDismissTimerRef.current) {
                    clearTimeout(hoverDismissTimerRef.current);
                    hoverDismissTimerRef.current = null;
                }
                hoveredRowElRef.current = e.currentTarget;
                setHoverCardTop(e.currentTarget.getBoundingClientRect().top);
                setHoveredIdeaId(it.id);
                setHoverDelayFired(false);
                if (hoverShowTimerRef.current) clearTimeout(hoverShowTimerRef.current);
                hoverShowTimerRef.current = setTimeout(() => {
                    hoverShowTimerRef.current = null;
                    setHoverDelayFired(true);
                }, 320);

                                                                e.preventDefault();
                                                                submitRename(it.id);

                                                                e.preventDefault();
                                                                cancelRename();

                                                            className="text-[11px] text-[#00b4d8] hover:underline"

                                                            >
                                                                Delete idea

                                        <div style={{display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', height:'100%', gap:'12px'}}>
                                            <button
                                                className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-[#0d0f11] border border-[#00b4d8]/60 font-semibold disabled:opacity-40"
                                                onClick={doConvert}
                                                disabled={convertLoading || roadmapActionsLockedByReply}
                                                title={roadmapActionsLockedByReply && !convertLoading ? ROADMAP_GENERATE_LOCKED_HINT : undefined}
                                            >
                                                {convertLoading ? `Generating... (${_opEstimate("roadmap_generation")})` : "Generate Roadmap"}
                                            </button>
                                            {roadmapActionsLockedByReply && !convertLoading && (
                                                <p className="text-xs text-slate-500 text-center max-w-sm px-2">{ROADMAP_GENERATE_LOCKED_HINT}</p>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="msg-md" dangerouslySetInnerHTML={{__html: marked.parse(roadmapContent)}}/>
                                    )}
                                </div>
                                {roadmapContent && (
                                    <div className="flex-shrink-0 border-t border-[#1a1d21] px-4 py-2 flex justify-end items-center gap-2">
                                        <button
                                            className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:border-slate-500"
                                            onClick={() => navigator.clipboard.writeText(roadmapContent)}
                                        >
                                            Copy
                                        </button>
                                        {currentIdeaId && (
                                            <a
                                                href={`/api/ideas/${currentIdeaId}/download-roadmap`}
                                                download
                                                className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:border-slate-500"
                                            >
                                                Download Roadmap
                                            </a>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                        {activeDocTab === 'verification' && (
                            <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
                                <div style={{flex:1, overflowY:'auto', padding:'24px'}}>
                                    {!verificationContent ? (
                                        <div style={{display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', height:'100%', gap:'12px'}}>
                                            <p className="text-xs text-slate-500 text-center max-w-md px-2">
                                                The verification document is produced alongside the roadmap. Generate the roadmap from the Roadmap tab to see this content. If the document is wrong, edit the PRD and regenerate &mdash; this file is not edited directly.
                                            </p>
                                        </div>
                                    ) : (
                                        <div className="msg-md" dangerouslySetInnerHTML={{__html: marked.parse(verificationContent)}}/>
                                    )}
                                </div>
                                {verificationContent && (
                                    <div className="flex-shrink-0 border-t border-[#1a1d21] px-4 py-2 flex justify-end items-center gap-2">
                                        <button
                                            className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:border-slate-500"
                                            onClick={() => navigator.clipboard.writeText(verificationContent)}
                                        >
                                            Copy
                                        </button>
                                        {currentIdeaId && (
                                            <a
                                                href={`/api/ideas/${currentIdeaId}/download-verification`}
                                                download
                                                className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:border-slate-500"
                                            >
                                                Download Verification
                                            </a>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                        {/* ── Sticky action bar ─────────────────────────────────────────── */}
                        {prdContent.trim().length > 0 && (
                            <div className="flex-shrink-0 border-t border-[#1a1d21] px-4 py-3 bg-[#0d0f11] space-y-2.5">
                                {activeDocTab === "prd" && (
                                    <React.Fragment>
                                {readinessStatus === "updating" && (
                                    <p className="text-xs text-slate-500 animate-pulse">Updating readiness assessment...</p>
                                )}
                                {readinessTimedOut && (
                                    <p className="text-xs text-slate-500">Readiness assessment timed out. It will update after your next message.</p>
                                )}
                                {!readinessTimedOut && readinessStatus === "unavailable" && hadReadyReadiness && (
                                    <p className="text-xs text-slate-500">Readiness data unavailable</p>
                                )}
                                {readinessStatus === "ready" && readinessData && (
                                    <div className="space-y-1.5 text-xs border border-[#1a1d21] rounded p-2 bg-[#141618]">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <span
                                                className={`header-text font-semibold ${
                                                    readinessData.overall_status === "ready"
                                                        ? "text-emerald-400"
                                                        : readinessData.overall_status === "approaching_ready"
                                                          ? "text-amber-400"
                                                          : "text-red-400"
                                                }`}
                                                title={P3_PRD_TITLE_READINESS_SCORE}
                                            >
                                                PRD readiness: {typeof readinessData.score === "number" ? readinessData.score : "—"} / 10
                                            </span>
                                            {readinessData.conversion_confidence && (
                                                <span
                                                    className="text-[10px] px-1.5 py-0.5 rounded border border-slate-600 text-slate-400"
                                                    title={P3_PRD_TITLE_ROADMAP_CONFIDENCE}
                                                >
                                                    Roadmap confidence: {readinessData.conversion_confidence}
                                                </span>
                                            )}
                                            <div className="flex-1"/>
                                            {(Array.isArray(readinessData.blocking_gaps) && readinessData.blocking_gaps.length > 0 || readinessData.recommendation) && (
                                                <button
                                                    type="button"
                                                    title="Show details"
                                                    onClick={() => setReadinessExpanded((v) => !v)}
                                                    className="text-slate-500 hover:text-slate-300 text-[11px] px-1 leading-none"
                                                >{readinessExpanded ? "▲" : "▼"}</button>
                                            )}
                                        </div>
                                        {readinessExpanded && (
                                            <React.Fragment>
                                                {Array.isArray(readinessData.blocking_gaps) && readinessData.blocking_gaps.length > 0 && (
                                                    <div className="rounded border border-amber-700/50 bg-amber-950/30 px-2 py-1.5 text-amber-200">
                                                        <span className="font-semibold header-text">Before converting: </span>
                                                        {readinessData.blocking_gaps.join(" · ")}
                                                    </div>
                                                )}
                                                {readinessData.recommendation && <p className="text-slate-500 italic">{readinessData.recommendation}</p>}
                                            </React.Fragment>
                                        )}
                                    </div>
                                )}
                                {convertError && <div className="text-xs text-red-400">{convertError}</div>}
                                    </React.Fragment>
                                )}
                                {roadmapActionsLockedByReply && !convertLoading && (
                                    <p className="text-xs text-slate-500">{ROADMAP_GENERATE_LOCKED_HINT}</p>
                                )}
                                <div className="flex flex-wrap gap-2 justify-end items-center">
                                    <button
                                        type="button"
                                        disabled={convertLoading || roadmapActionsLockedByReply}
                                        title={
                                            roadmapActionsLockedByReply && !convertLoading
                                                ? ROADMAP_GENERATE_LOCKED_HINT
                                                : readinessData &&
                                                  readinessData.overall_status &&
                                                  readinessData.overall_status !== "ready" &&
                                                  typeof readinessData.score === "number"
                                                    ? `Readiness score is ${readinessData.score}/10 — roadmap quality may be low.`
                                                    : undefined
                                        }
                                        onClick={doConvert}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-[#0d0f11] border border-[#00b4d8]/60 font-semibold disabled:opacity-40"
                                    >
                                        {convertLoading ? `Generating... (${_opEstimate("roadmap_generation")})` : roadmapContent ? "Regenerate Roadmap" : "Generate Roadmap"}
                                    </button>
                                    {roadmapContent && (
                                        <button
                                            type="button"
                                            disabled={continueNavPending}
                                            onClick={continueSetup}
                                            className="header-text text-xs px-2 py-1 rounded bg-[#00b4d8]/20 text-[#00b4d8] border border-[#00b4d8]/40 disabled:opacity-40"
                                        >
                                            {continueNavPending ? "Checking..." : "Continue to Setup →"}
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                    </div>

                    {/* Regenerate roadmap confirmation */}
                    {showRegenerateConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60" onClick={() => setShowRegenerateConfirm(false)}>
                            <div className="bg-[#141618] border border-[#2a2d31] rounded p-6 max-w-sm w-full space-y-4" onClick={(e) => e.stopPropagation()}>
                                <div className="header-text text-sm text-slate-300">Regenerate Roadmap?</div>
                                <div className="text-xs text-slate-400">
                                    This will overwrite the existing roadmap. The roadmap content will be permanently replaced.
                                </div>
                                <div className="flex gap-2 justify-end">
                                    <button
                                        onClick={() => setShowRegenerateConfirm(false)}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-400 border border-[#2a2d31] hover:text-slate-200"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => { setShowRegenerateConfirm(false); beginConvertAfterGuards(); }}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-red-900/40 text-red-300 border border-red-700/40 hover:bg-red-900/70"
                                    >
                                        Regenerate
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PRD newer than roadmap: Continue-to-Setup guard (sessionStorage: autodev:roadmapBehindPrdDismissed) */}
                    {showRoadmapBehindPrdModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center bg-black/60"
                            onClick={() => {
                                setShowRoadmapBehindPrdModal(false);
                                setRoadmapBehindPrdMeta(null);
                            }}
                        >
                            <div
                                className="bg-[#141618] border border-[#2a2d31] rounded p-6 max-w-md w-full space-y-4"
                                data-testid="ideas-roadmap-behind-prd-modal"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="header-text text-sm text-slate-300">Roadmap may be out of date</div>
                                <div className="text-xs text-slate-400 space-y-2">
                                    <p>
                                        The PRD was updated <strong className="text-slate-300">after</strong> the current roadmap was generated. We suggest regenerating the roadmap before proceeding to ensure it&apos;s aligned.
                                    </p>
                                </div>
                                <div className="flex flex-wrap gap-2 justify-end">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setShowRoadmapBehindPrdModal(false);
                                            setRoadmapBehindPrdMeta(null);
                                        }}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-400 border border-[#2a2d31] hover:text-slate-200"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (currentIdeaId) {
                                                try {
                                                    sessionStorage.removeItem(_roadmapBehindPrdStorageKey(currentIdeaId));
                                                } catch (e) {}
                                            }
                                            setShowRoadmapBehindPrdModal(false);
                                            setRoadmapBehindPrdMeta(null);
                                            beginConvertAfterGuards();
                                        }}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-[#0d0f11] border border-[#00b4d8]/60 font-semibold"
                                    >
                                        Regenerate roadmap
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (
                                                currentIdeaId &&
                                                roadmapBehindPrdMeta &&
                                                typeof roadmapBehindPrdMeta.prd_mtime === "number" &&
                                                typeof roadmapBehindPrdMeta.roadmap_mtime === "number"
                                            ) {
                                                try {
                                                    sessionStorage.setItem(
                                                        _roadmapBehindPrdStorageKey(currentIdeaId),
                                                        JSON.stringify({
                                                            prd_mtime: roadmapBehindPrdMeta.prd_mtime,
                                                            roadmap_mtime: roadmapBehindPrdMeta.roadmap_mtime,
                                                        }),
                                                    );
                                                } catch (e) {}
                                            }
                                            setShowRoadmapBehindPrdModal(false);
                                            setRoadmapBehindPrdMeta(null);
                                            _continueSetupAfterStalenessOk();
                                        }}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8]/20 text-[#00b4d8] border border-[#00b4d8]/40"
                                    >
                                        Continue anyway
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Roadmap Format Invalid modal */}
                    {showFormatInvalidModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60" onClick={() => setShowFormatInvalidModal(false)}>
                            <div className="bg-[#141618] border border-[#2a2d31] rounded p-6 max-w-sm w-full space-y-4" onClick={(e) => e.stopPropagation()}>
                                <div className="header-text text-sm text-slate-300">Roadmap Format Invalid</div>
                                <div className="text-xs text-slate-400">{formatInvalidDetail}</div>
                                <div className="flex gap-2 justify-end">
                                    <button
                                        onClick={() => setShowFormatInvalidModal(false)}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-400 border border-[#2a2d31] hover:text-slate-200"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={doFixRoadmapFormat}
                                        disabled={fixFormatLoading}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8]/20 text-[#00b4d8] border border-[#00b4d8]/40 disabled:opacity-40"
                                    >
                                        {fixFormatLoading ? `Fixing... (${_opEstimate("format_correction")})` : "Fix Format"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Low readiness: confirm before POST /convert */}
                    {showLowReadinessGenerateConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60" onClick={() => setShowLowReadinessGenerateConfirm(false)}>
                            <div
                                className="bg-[#141618] border border-[#2a2d31] rounded p-6 max-w-sm w-full space-y-4"
                                data-testid="ideas-low-readiness-generate-confirm"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="header-text text-sm text-slate-300">Generate roadmap anyway?</div>
                                <div className="text-xs text-slate-400 space-y-2">
                                    <p>
                                        {readinessData && typeof readinessData.score === "number"
                                            ? `PRD readiness is ${readinessData.score}/10. Scores of 8 or higher usually produce clearer roadmaps.`
                                            : "PRD readiness is below the recommended level."}
                                    </p>
                                    <p className="text-slate-500">
                                        You can edit the PRD first and let readiness update, or continue now.
                                    </p>
                                </div>
                                <div className="flex gap-2 justify-end">
                                    <button
                                        type="button"
                                        onClick={() => setShowLowReadinessGenerateConfirm(false)}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-400 border border-[#2a2d31] hover:text-slate-200"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setShowLowReadinessGenerateConfirm(false);
                                            _runConvert();
                                        }}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-[#0d0f11] font-semibold"
                                    >
                                        Generate anyway
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {hoverCardPortal}
                </div>
            );
        }

        function PreflightScreen(props) {
            const {
                seedRoadmap,
                repoPath,
                repoPathLocked,
                roadmapSeed,
                onRepoPathChange,
                onRepoPathLockToggle,
                onBack,
                repoPathError,
                onRepoPathConfirm,
                onRunPreflight,
                onConfirmRoadmapArchive,
                preflightRoadmapAmbiguous,
                preflightChecks,
                onLaunch,
                launchError,
                launchDisabled,
                launchLoading,
                onAddToQueue,
                addToQueueBusy,
                addToQueueError,
                hasActiveProject,
                repoPathFsStatus,
                showCreateFolderPrompt,
                createFolderError,
                onCreateRepoDir,
                onCancelCreateFolder,
                preflightLastRun,
                hasFail,
                recentProjects,
                /* P0 Stage J.4 — Step 2 became a read-only summary card of the
                 * linked Project Idea. PRD + verification text and idea
                 * metadata flow from App so the card can render without
                 * needing to refetch. ``onOpenInIdeas(ideaId | null)`` is
                 * the back-link to authoring; null clicks land on the
                 * Ideas screen without pre-selecting an idea. */
                launchPrdContent,
                launchVerificationContent,
                linkedIdeaName,
                linkedIdeaId,
                onOpenInIdeas,
            } = props;

            const repoPathInputFsStatus =
                repoPathLocked || !repoPathFsStatus
                    ? null
                    : repoPathFsStatus === "parent"
                      ? null
                      : repoPathFsStatus === "exists" || repoPathFsStatus === "bad"
                        ? repoPathFsStatus
                        : null;

            const preflightBtnLabel = preflightChecks ? "Re-run Preflight" : "Run Preflight";
            const [completionReviewOptIn, setCompletionReviewOptIn] = useState(null);

            /* Step 2 readiness — the trio of contents carried in from the
             * linked Project Idea. ``hasLinkedIdea`` gates the summary
             * card vs. the empty-state CTA. Phase count is derived
             * client-side by counting roadmap.md-style phase lines (no
             * server round-trip) so the card stays a pure render. */
            const prdReady = Boolean((launchPrdContent || "").trim());
            const roadmapReady = Boolean((roadmapSeed || "").trim());
            const verificationReady = Boolean((launchVerificationContent || "").trim());
            const hasLinkedIdea = prdReady || roadmapReady || verificationReady;
            const linkedRoadmapPhaseCount = roadmapReady
                ? (roadmapSeed.match(/^-\s*\[[ x!\-]\]\s+`[^`]+`/gm) || []).length
                : 0;

            const step3Done = completionReviewOptIn !== null;
            const step4Done = !!preflightChecks && !hasFail && !preflightRoadmapAmbiguous;
            const step4HasError = !!preflightChecks && hasFail;
            const step4HasWarning = !!preflightChecks && !hasFail && !!preflightRoadmapAmbiguous;

            const firstIncompleteStep = !repoPathLocked ? 1
                : !hasLinkedIdea ? 2
                : !step3Done ? 3
                : !step4Done ? 4
                : null;

            return (
                <div className="flex-1 overflow-y-auto bg-[#0d0f12] p-6">
                    <div className="max-w-2xl mx-auto space-y-4">
                        <h2 className="header-text text-lg text-slate-300">Setup &amp; Preflight</h2>
                        <div
                            data-testid="preflight-step-1"
                            className={`rounded border p-3 space-y-2 ${repoPathLocked ? "border-emerald-600/60" : "border-[#2a2d31]"}`}
                        >
                            <div className="flex flex-wrap justify-between items-start gap-2">
                                <div className="min-w-0 flex-1 space-y-1">
                                    <p className="header-text text-xs font-semibold text-slate-400">Step 1 — Repository path</p>
                                    <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">
                                        Confirm the repository path AutoDev will build in.
                                    </p>
                                </div>
                                <div className="flex gap-2 items-center shrink-0 self-start">
                                    {!repoPathLocked ? (
                                        <button type="button" onClick={onRepoPathConfirm} className="header-text text-sm px-3 py-1 rounded bg-[#00b4d8] text-[#0d0f12] font-medium">
                                            Confirm repository
                                        </button>
                                    ) : (
                                        <>
                                            <span className="text-emerald-500">✓</span>
                                            <button type="button" onClick={onRepoPathLockToggle} className="header-text text-xs text-slate-500 hover:text-slate-300">
                                                Edit
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                            <div className="flex gap-2 items-stretch">
                                <div className="flex-1 min-w-0">
                                    <ServerPathInput
                                        id="preflight-repo-path"
                                        value={repoPath}
                                        onChange={onRepoPathChange}
                                        disabled={repoPathLocked}
                                        fsStatus={repoPathInputFsStatus}
                                        recents={recentProjects || []}
                                    />
                                </div>
                                {!repoPathLocked && repoPathFsStatus === "parent" && (
                                    <span
                                        className="flex items-center text-amber-400 shrink-0 text-lg leading-none"
                                        title="Path does not exist yet; parent exists — use Confirm repository to create or pick a path"
                                    >
                                        +
                                    </span>
                                )}
                            </div>
                            {repoPathError && <p className="text-red-400 text-xs">{repoPathError}</p>}
                            {createFolderError && <p className="text-red-400 text-xs">{createFolderError}</p>}
                            {showCreateFolderPrompt && !repoPathLocked && (
                                <div className="rounded border border-[#2a2d31] bg-[#141618] px-3 py-2 text-xs text-slate-300 space-y-2">
                                    <p>This folder doesn&apos;t exist. Create it?</p>
                                    <div className="flex gap-2 flex-wrap">
                                        <button
                                            type="button"
                                            onClick={onCreateRepoDir}
                                            className="header-text text-xs px-2 py-1 rounded bg-[#00b4d8] text-[#0d0f12] font-medium"
                                        >
                                            Create Folder
                                        </button>
                                        <button
                                            type="button"
                                            onClick={onCancelCreateFolder}
                                            className="header-text text-xs px-2 py-1 rounded border border-[#1a1d21] text-slate-400"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div
                            data-testid="preflight-step-2"
                            className={`rounded border p-3 space-y-2 ${hasLinkedIdea ? "border-emerald-600/60" : "border-[#2a2d31]"}`}
                        >
                            <div className="flex flex-wrap justify-between items-start gap-2">
                                <div className="min-w-0 flex-1 space-y-1">
                                    <p className="header-text text-xs font-semibold text-slate-400">Step 2 — Project Idea</p>
                                    <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">
                                        The roadmap and verification doc come from Project Ideas. Authoring lives there; the Setup screen stages.
                                    </p>
                                </div>
                                {hasLinkedIdea ? (
                                    <div className="flex gap-2 items-center shrink-0 self-start">
                                        <span className="text-emerald-500">✓</span>
                                    </div>
                                ) : null}
                            </div>
                            {hasLinkedIdea ? (
                                <div className="rounded border border-[#1a1d21] bg-[#0d0f11] p-4 space-y-3">
                                    <div className="flex items-center justify-between gap-3 flex-wrap">
                                        <div className="flex items-center gap-2 min-w-0">
                                            <p className="text-xs text-[#00b4d8] header-text">From Project Ideas</p>
                                            <span className="text-sm font-semibold text-slate-200 truncate">{linkedIdeaName || "(linked idea)"}</span>
                                            <span className="text-xs px-2 py-0.5 rounded bg-[#1a1d21] text-slate-400">
                                                {linkedRoadmapPhaseCount} phase{linkedRoadmapPhaseCount === 1 ? "" : "s"}
                                            </span>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => onOpenInIdeas && onOpenInIdeas(linkedIdeaId)}
                                            className="text-xs text-[#00b4d8] hover:underline shrink-0"
                                        >
                                            Open in Project Ideas →
                                        </button>
                                    </div>
                                    <div className="flex gap-2 flex-wrap">
                                        <span className={`text-[11px] px-2 py-0.5 rounded border ${prdReady ? "border-emerald-600/60 text-emerald-400" : "border-[#2a2d31] text-slate-500"}`}>
                                            {prdReady ? "PRD ready" : "PRD missing"}
                                        </span>

                        {/* W5-G: Step 3 — Completion Report (required Yes/No selection) */}
                        <div

                                        type="button"

                                                ? 'border-emerald-500 text-emerald-400 bg-emerald-950/30'
                                                : 'border-[#2a2d31] text-slate-400 hover:border-slate-500'

                                </div>
                            </div>
                        </div>

                        <div
                            data-testid="preflight-step-4"
                            className={`rounded border p-3 space-y-2 ${
                                step4HasError ? "border-red-600/60"
                                    : step4HasWarning ? "border-amber-500/60"
                                    : step4Done ? "border-emerald-600/60"

                        >
                            <div className="flex flex-wrap justify-between items-start gap-2">
                                <div className="min-w-0 flex-1 space-y-1">
                                    <p className="header-text text-xs font-semibold text-slate-400">Step 4 — Preflight</p>
                                    <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">

                            {preflightRoadmapAmbiguous && (

                                    <p>

                                        <span className="font-mono text-xs">
                                            {(preflightRoadmapAmbiguous.roadmap_files || []).join(", ")}
                                        </span>
                                        . Keep <span className="font-mono">{preflightRoadmapAmbiguous.recommended_keep}</span>{" "}
                                        and move the rest into <span className="font-mono">autodev_archive/</span>.
                                    </p>
                                    <button
                                        type="button"
                                        onClick={onConfirmRoadmapArchive}
                                        disabled={!repoPathLocked || !hasLinkedIdea}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-amber-900/60 border border-amber-600 text-amber-50 disabled:opacity-40"

                                <ul className="space-y-2 text-sm max-h-[32vh] overflow-y-auto pr-1">

                                            <span className="font-mono text-xs">[{c.status}]</span>

                        </div>
                        <div
                            className={
                                (launchDisabled || completionReviewOptIn === null) && !launchLoading && firstIncompleteStep !== null
                                    ? "flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:justify-between sm:gap-x-4"
                                    : "flex flex-col gap-2"
                            }
                        >
                            {(launchDisabled || completionReviewOptIn === null) && !launchLoading && firstIncompleteStep !== null && (
                                <p
                                    data-testid="preflight-launch-blocking-hint"
                                    className="text-xs text-slate-500 min-w-0 sm:max-w-[55%]"
                                >
                                    {firstIncompleteStep === 1 && "Complete Step 1 — confirm your repository path."}
                                    {firstIncompleteStep === 2 && "Complete Step 2 — link a project idea via Project Ideas."}
                                    {firstIncompleteStep === 3 && "Complete Step 3 — choose your completion report preference."}
                                    {firstIncompleteStep === 4 && (
                                        step4HasError
                                            ? "Step 4 has failures — fix checks and re-run Preflight."
                                            : step4HasWarning
                                                ? "Step 4 — resolve the roadmap ambiguity to continue."
                                                : "Complete Step 4 — run Preflight."
                                    )}
                                </p>
                            )}
                            <div className="flex gap-2 flex-wrap items-center shrink-0 sm:ml-auto">
                            <button type="button" onClick={() => onAddToQueue(completionReviewOptIn === true)} disabled={launchDisabled || completionReviewOptIn === null || addToQueueBusy}
                                className="header-text text-sm px-4 py-2 rounded bg-[#1a1d21] text-[#00b4d8] border border-[#00b4d8]/40 font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:border-[#00b4d8]/70">
                                {addToQueueBusy ? 'Adding…' : 'Add to Queue'}
                            </button>
                            <button
                                type="button"
                                onClick={() => onLaunch(completionReviewOptIn === true)}
                                disabled={launchDisabled || completionReviewOptIn === null || launchLoading}
                                title={P3_PREFLIGHT_TITLE_LAUNCH_NOW}
                                className="header-text text-sm px-4 py-2 rounded bg-[#00b4d8] text-[#0d0f12] font-medium disabled:bg-[#2a2d31] disabled:text-slate-600 disabled:cursor-not-allowed"
                            >

                            <button type="button" onClick={onBack} className="header-text text-sm px-4 py-2 rounded border border-[#1a1d21] text-slate-400">

                        {addToQueueError && <p className="text-red-400 text-sm whitespace-pre-wrap">{addToQueueError}</p>}
                        {hasActiveProject && (
                            <p className="text-amber-400 text-xs mt-1">A project is currently running. Launching now will insert your project at the top of the queue to run next.</p>
                        )}
                        {launchError && <p className="text-red-400 text-sm whitespace-pre-wrap">{launchError}</p>}
                    </div>
                </div>
            );
        }

        function ServerPathInput({ value, onChange, disabled, fsStatus, recents, id, placeholder = "/path/to/your-project/my-app" }) {
            const listId = id ? id + "-recents" : undefined;
            return (
                <div className="relative">
                    <div className="flex gap-2 items-stretch">
                        <input
                            id={id}
                            type="text"
                            list={listId}
                            value={value}
                            onChange={(e) => onChange(e.target.value)}
                            disabled={disabled}
                            readOnly={disabled}
                            placeholder={placeholder}
                            className={
                                "flex-1 min-w-0 rounded border border-[#1a1d21] px-3 py-2 text-sm font-mono " +
                                (disabled ? "bg-[#0d0f12] text-slate-300" : "bg-[#1a1d21] text-slate-200")
                            }
                        />
                        {recents && recents.length > 0 && id ? (
                            <datalist id={listId}>
                                {recents.map((r, i) => (
                                    <option key={i} value={typeof r === "object" && r.path ? r.path : r} />
                                ))}
                            </datalist>
                        ) : null}
                        {!disabled && fsStatus === "exists" && (
                            <span

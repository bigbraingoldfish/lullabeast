        /** Flatten jsdiff diffLines output to per-line {type, text}; then collapse long unchanged runs. */
        function prdFlattenDiffLines(prevText, curText) {
            if (typeof Diff === "undefined" || !Diff.diffLines) return [];
            const parts = Diff.diffLines(prevText || "", curText || "", { newlineIsToken: false });
            const rows = [];
            parts.forEach((part) => {
                let v = part.value;
                if (v.endsWith("\n")) v = v.slice(0, -1);
                const lines = v.length ? v.split("\n") : [];
                lines.forEach((text) => {
                    rows.push({
                        type: part.added ? "add" : part.removed ? "del" : "ctx",
                        text,
                    });
                });
            });
            return rows;
        }

        function prdCollapseDiffContext(rows, contextEachSide) {
            const n = contextEachSide || 2;
            const out = [];
            let i = 0;
            while (i < rows.length) {
                if (rows[i].type === "ctx") {
                    let j = i;
                    while (j < rows.length && rows[j].type === "ctx") j++;
                    const runLen = j - i;
                    if (runLen <= 2 * n + 1) {
                        for (let k = i; k < j; k++) out.push(rows[k]);
                    } else {
                        for (let k = i; k < i + n; k++) out.push(rows[k]);
                        out.push({ type: "fold", count: runLen - 2 * n });
                        for (let k = j - n; k < j; k++) out.push(rows[k]);
                    }
                    i = j;
                } else {
                    out.push(rows[i]);
                    i++;
                }
            }
            return out;
        }

        /** Client fallback if API parsed.questions is empty but raw response still has a QUESTIONS block */
        function parseAgentResponseClient(content) {
            if (!content || typeof content !== "string") {
                return { prose: "", drafting: null, assumptions: [], questions: [] };
            }
            const lines = content.split(/\r?\n/);
            let drafting = null;
            const assumptions = [];
            const questions = [];
            const proseLines = [];
            let startIdx = 0;
            if (lines.length && lines[0].startsWith("DRAFTING:")) {
                drafting = lines[0].slice("DRAFTING:".length).trim();
                startIdx = 1;
            }
            let inQuestions = false;
            let current = null;
            const flushQ = () => {
                if (current) {
                    questions.push(current);
                    current = null;
                }
            };
            let i = startIdx;
            while (i < lines.length) {
                const line = lines[i];
                const stripped = line.trim();
                const qu = stripped.toUpperCase();
                const quCore = qu.replace(/^[#*\s]+|[*:\s]+$/g, "");
                if (quCore === "QUESTIONS") {
                    inQuestions = true;
                    flushQ();
                    i++;
                    continue;
                }
                if (inQuestions) {
                    if (stripped.startsWith("[SINGLE]") || stripped.startsWith("[MULTI]")) {
                        flushQ();
                        const isSingle = stripped.startsWith("[SINGLE]");
                        const rest = stripped.slice(isSingle ? "[SINGLE]".length : "[MULTI]".length).trim();
                        current = { type: isSingle ? "single" : "multi", text: rest, options: [] };
                    } else {
                        const cleanStripped = stripped.replace(/^\*+/, "");
                        if (/^\d+[\.\)]\s+/.test(cleanStripped)) {
                            flushQ();
                            const qtext = cleanStripped.replace(/^\d+[\.\)]\s+/, "").replace(/\*+$/, "").trim();
                            current = { type: "single", text: qtext, options: [] };
                        } else if ((stripped.startsWith("- ") || stripped.startsWith("* ")) && current) {
                            current.options.push(stripped.slice(2).trim());
                        } else if (!stripped) {
                            /* keep */
                        } else if (!current && stripped && !stripped.startsWith("[")) {
                            current = { type: "single", text: stripped, options: [] };
                        } else {
                            flushQ();
                            inQuestions = false;
                            if (line.startsWith("ASSUMPTION:")) assumptions.push(line.slice("ASSUMPTION:".length).trim());
                            else proseLines.push(line);
                        }
                    }
                    i++;
                    continue;
                }
                if (!inQuestions && drafting === null && stripped.startsWith("DRAFTING:")) {
                    drafting = stripped.slice("DRAFTING:".length).trim();
                    break;
                }
                if (line.startsWith("ASSUMPTION:")) {
                    assumptions.push(line.slice("ASSUMPTION:".length).trim());
                    i++;
                    continue;
                }
                proseLines.push(line);
                i++;
            }
            flushQ();
            return { prose: proseLines.join("\n").trim(), drafting, assumptions, questions };
        }

        function QuestionFlow({ questions, onSubmit }) {
            const [index, setIndex] = React.useState(0);
            const [selections, setSelections] = React.useState({});
            const [freeTexts, setFreeTexts] = React.useState({});

            const q = questions[index];
            if (!q) return null;

            const sel = selections[index] || [];
            const ft = freeTexts[index] || "";
            const hasAnswer = sel.length > 0 || ft.trim().length > 0;
            const isLast = index === questions.length - 1;

            const toggleOption = (opt) => {
                if (q.type === "single") {
                    setSelections((prev) => ({ ...prev, [index]: [opt] }));
                } else {
                    setSelections((prev) => {
                        const current = prev[index] || [];
                        const next = current.includes(opt)
                            ? current.filter((o) => o !== opt)
                            : [...current, opt];
                        return { ...prev, [index]: next };
                    });
                }
            };

            const advance = () => {
                if (!hasAnswer) return;
                if (isLast) {
                    const parts = questions.map((qItem, i) => {
                        const chosen = selections[i] || [];
                        const free = (freeTexts[i] || "").trim();
                        const answerParts = [...chosen];
                        if (free) answerParts.push(free);
                        return `Q: ${qItem.text}\nA: ${answerParts.join(", ")}`;
                    });
                    onSubmit(`[ANSWERS]\n${parts.join("\n")}\n[/ANSWERS]`);
                } else {
                    setIndex((i) => i + 1);
                }
            };

            return (
                <div className="mt-3 rounded border border-[#2a2d31] bg-[#0d0f11] p-4 space-y-3">
                    <div className="flex items-start justify-between gap-2">
                        <p className="text-sm text-slate-200 font-medium leading-snug">{q.text}</p>

                            <span className="text-[10px] text-slate-600">{index + 1}/{questions.length}</span>
                            <button type="button" onClick={() => setIndex((i) => i + 1)} disabled={index >= questions.length - 1} className="text-[10px] text-slate-500 hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed px-0.5">&gt;</button>
                        </div>
                    </div>
                    <div className="space-y-1.5">
                        {q.options.map((opt) => {
                            const active = sel.includes(opt);
                            return (
                                <button
                                    key={opt}
                                    type="button"
                                    onClick={() => toggleOption(opt)}
                                    onKeyDown={(e) => { if (e.key === " ") { e.preventDefault(); toggleOption(opt); } }}
                                    className={`w-full text-left text-xs px-3 py-2 rounded border transition-colors ${
                                        active
                                            ? "border-[#00b4d8] bg-[#00b4d8]/20 text-[#7dd3fc]"
                                            : "border-[#2a2d31] bg-[#141618] text-slate-400 hover:border-slate-500 hover:text-slate-300"
                                    }`}
                                >
                                    {q.type === "single" ? (active ? "● " : "○ ") : (active ? "☑ " : "☐ ")}{opt}
                                </button>
                            );
                        })}
                    </div>
                    <div>
                        <input
                            type="text"
                            value={ft}
                            onChange={(e) => setFreeTexts((prev) => ({ ...prev, [index]: e.target.value }))}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); advance(); } }}
                            placeholder="Or add your own answer…"
                            className="w-full bg-[#141618] border border-[#2a2d31] rounded px-3 py-1.5 text-xs text-slate-300 placeholder-slate-600 focus:outline-none focus:border-slate-500"

                if (Number.isNaN(start)) return undefined;
                const tick = () => {

                                        const nextData = d.data || null;
                                        setReadinessStatus(nextStatus);
                                        setReadinessData(nextData);
                                        setReadinessTimedOut(false);
                                        if (nextStatus === "ready" && nextData) setHadReadyReadiness(true);
                                    })
                                    .catch(() => {});
                            }
                        })
                        .catch(() => {});
                }, 3000);
            };

            const refreshIdeas = ({ showLoading = false } = {}) => {
                if (showLoading) setIdeasLoading(true);
                fetch("/api/ideas")
                    .then((r) => r.json())
                    .then((d) => setIdeasList(Array.isArray(d) ? d : []))
                    .catch(() => {})
                    .finally(() => {
                        if (showLoading) setIdeasLoading(false);
                    });
            };

            useEffect(() => {
                refreshIdeas({ showLoading: true });
                fetch("/api/ideas/operation-metrics")
                    .then((r) => r.json())
                    .then((d) => setOperationMetrics(d || {}))
                    .catch(() => {});
            }, []);

            useEffect(() => {
                isLoadingRef.current = isLoading;
            }, [isLoading]);

            const fetchPrdSectionDiff = React.useCallback((ideaId) => {
                if (!ideaId) return;
                if (isLoadingRef.current) return;
                fetch(`/api/ideas/${ideaId}/prd-section-diff`)
                    .then((r) => (r.ok ? r.json() : { sections: {} }))
                    .then((data) => setPrdSectionDiff(data.sections || {}))
                    .catch(() => setPrdSectionDiff({}));
            }, []);

            useEffect(() => {
                if (currentIdeaId === null && ideasList.length > 0) {
                    setCurrentIdeaId(ideasList[0].id);
                }
            }, [ideasList, currentIdeaId]);

            useEffect(() => () => stopReadinessPoll(), []);

            useEffect(() => {
                let rafId = null;
                const onMouseMove = (e) => {
                    if (!dragRef.current.dragging || !containerRef.current) return;
                    if (rafId) return;
                    rafId = requestAnimationFrame(() => {
                        rafId = null;
                        const rect = containerRef.current.getBoundingClientRect();
                        const totalW = rect.width;
                        const minPct = (480 / totalW) * 100;
                        const maxPct = ((totalW - 520) / totalW) * 100;
                        const pct = Math.min(Math.max(((e.clientX - rect.left) / totalW) * 100, minPct), maxPct);
                        setSplitPct(pct);
                    });
                };
                const onMouseUp = () => { dragRef.current.dragging = false; };
                window.addEventListener("mousemove", onMouseMove);
                window.addEventListener("mouseup", onMouseUp);
                return () => {
                    window.removeEventListener("mousemove", onMouseMove);
                    window.removeEventListener("mouseup", onMouseUp);
                    if (rafId) cancelAnimationFrame(rafId);
                };
            }, []);

            const refreshAnnotations = (ideaId) => {
                if (!ideaId) return;
                fetch(`/api/ideas/${ideaId}/annotations`)
                    .then((r) => r.ok ? r.json() : [])
                    .then((data) => setAnnotations(data || []))
                    .catch(() => setAnnotations([]));
            };

            useEffect(() => {
                if (!currentIdeaId) return;
                stopNotificationPoll();
                setReadinessTimedOut(false);
                setHadReadyReadiness(false);
                setAnnotations([]);
                setHiddenNoteIdsForSend(() => new Set());
                setEditingAnnotationSection(null);
                setAnnotationDraft("");
                setOpenAnnotationBubble(null);
                setPrdSectionDiff({});
                setExpandedDiffSlugs([]);
                setUndoOfferSlugs([]);
                setRevertConfirmSlug(null);
                setSectionRevertError(null);
                fetch(`/api/ideas/${currentIdeaId}/session`)
                    .then((r) => r.json())
                    .then((d) => {
                        const rawMsgs = d.messages || [];
                        setMessages(
                            rawMsgs.map((m, idx) => ({
                                ...m,
                                id: m.id || `${m.role}-${idx}-${(m.ts || "").slice(0, 19) || idx}`,
                            }))
                        );
                        setPrdContent(d.prd_content || "");
                        setRoadmapContent(d.roadmap_content || "");
                        setAlignmentReport(d.alignment_report || null);
                        setAdversarialReport(d.adversarial_report || null);
                        if (!isLoadingRef.current) {
                            fetchPrdSectionDiff(currentIdeaId);
                        }
                    })
                    .catch(() => {});
                refreshAnnotations(currentIdeaId);
                fetch(`/api/ideas/${currentIdeaId}/readiness`)
                    .then((r) => r.json())
                    .then((d) => {
                        const nextStatus = d.status || "unavailable";
                        const nextData = d.data || null;
                        setReadinessStatus(nextStatus);
                        setReadinessData(nextData);
                        if (nextStatus === "ready" && nextData) setHadReadyReadiness(true);
                        if (d.status === "updating") startReadinessPoll(currentIdeaId);
                        else stopReadinessPoll();
                    })
                    .catch(() => {
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                    });
            }, [currentIdeaId]);

            const adjustTa = () => {
                const el = taRef.current;
                if (!el) return;
                el.style.height = "auto";
                const lh = 22;
                const maxH = lh * 5;
                el.style.height = Math.min(el.scrollHeight, maxH) + "px";
            };

            const triggerDraftingIndicator = (sectionName) => {
                if (draftingTimerRef.current) clearTimeout(draftingTimerRef.current);
                setDraftingIndicator(sectionName);
                draftingTimerRef.current = setTimeout(() => setDraftingIndicator(null), 3000);
            };

            const postSectionRevert = (slug, fromUndo = false) => {
                if (!currentIdeaId || !slug) return;
                setSectionRevertError(null);
                fetch(`/api/ideas/${currentIdeaId}/prd-section-revert`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ section_key: slug }),
                })
                    .then(async (r) => {
                        const data = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const det =
                                typeof data.detail === "string"
                                    ? data.detail
                                    : (data.detail && JSON.stringify(data.detail)) || "";
                            throw new Error(det || `HTTP ${r.status}`);
                        }
                        return data;
                    })
                    .then(() => fetch(`/api/ideas/${currentIdeaId}/session`))
                    .then((r) => r.json())
                    .then((d) => {
                        setPrdContent(d.prd_content || "");
                        setExpandedDiffSlugs((p) => p.filter((x) => x !== slug));
                        if (fromUndo) {
                            setUndoOfferSlugs((p) => p.filter((x) => x !== slug));
                        } else {
                            setUndoOfferSlugs((p) => (p.includes(slug) ? p : [...p, slug]));
                        }
                        fetchPrdSectionDiff(currentIdeaId);
                    })
                    .catch((err) => {
                        setSectionRevertError({ slug, message: err.message || String(err) });
                    });
            };

            const buildOptimisticSentContext = (draftList, att) => {
                const notes = (draftList || []).map((a) => ({
                    id: a.id,
                    section: a.section || "",
                    comment: a.comment || "",
                }));
                const sc = {};
                if (notes.length) sc.notes = notes;
                if (att && att.filename) sc.attachment = { filename: att.filename };
                return Object.keys(sc).length ? sc : null;
            };

            const submitMessage = (overrideText) => {
                const t = (overrideText !== undefined ? overrideText : inputText).trim();
                if (!t || isLoading || !currentIdeaId) return;
                setUserFirstTurnPending(false);
                const turn = messages.filter((m) => m.role === "user").length + 1;
                const userMsgId = `u-${Date.now()}`;
                const assistantPendingId = `a-${Date.now()}`;
                const nowIso = new Date().toISOString();
                const draftSnap = annotations.filter((a) => !a.submitted);
                const attachmentSnap = stagedAttachment;
                const optimisticSentContext = buildOptimisticSentContext(draftSnap, attachmentSnap);
                const userRow = {
                    id: userMsgId,
                    role: "user",
                    content: t,
                    ts: nowIso,
                    ...(optimisticSentContext ? { sent_context: optimisticSentContext } : {}),
                };
                setHiddenNoteIdsForSend(() => new Set(draftSnap.map((a) => a.id)));
                setMessages((prev) => [
                    ...prev,
                    userRow,
                    { id: assistantPendingId, role: "assistant", content: "Working on your request...", ts: nowIso, pending: true },
                ]);
                if (overrideText === undefined) setInputText("");
                setTimeout(() => adjustTa(), 0);
                setStagedAttachment(null);
                setIsLoading(true);
                isLoadingRef.current = true;
                const body = { content: t, turn };
                if (attachmentSnap) body.attachment = attachmentSnap;
                fetch(`/api/ideas/${currentIdeaId}/message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then((r) => {
                        if (!r.ok) throw new Error(String(r.status));
                        return r.json();
                    })
                    .then((data) => {
                        stopLateHealPoll();
                        let parsed = data.parsed || null;
                        if (data.response) {
                            const clientParsed = parseAgentResponseClient(data.response);
                            if (!parsed) {
                                parsed = clientParsed;
                            } else if ((!parsed.questions || parsed.questions.length === 0) && clientParsed.questions && clientParsed.questions.length > 0) {
                                parsed = { ...parsed, questions: clientParsed.questions };
                            }
                        }
                        const displayContent = (parsed && parsed.prose) ? parsed.prose : (data.response || "No agent output returned for this turn.");
                        if (parsed && parsed.drafting) triggerDraftingIndicator(parsed.drafting);
                        setMessages((prev) =>
                            prev.map((m) =>
                                m.id === assistantPendingId
                                    ? { ...m, pending: false, content: displayContent, ts: new Date().toISOString(), parsed }
                                    : m
                            )
                        );
                        setPrdContent(data.prd_content || "");
                        setIsLoading(false);
                        isLoadingRef.current = false;
                        setReadinessStatus("updating");
                        setReadinessData(null);
                        setReadinessTimedOut(false);
                        startReadinessPoll(currentIdeaId);
                        setHiddenNoteIdsForSend(() => new Set());
                        refreshAnnotations(currentIdeaId);
                        refreshIdeas();
                        fetchPrdSectionDiff(currentIdeaId);
                    })
                    .catch((err) => {
                        const status = parseInt(err?.message, 10);
                        let errorMsg = "Message sent but agent response failed. You can retry.";
                        if (status === 408) {
                            errorMsg = "Agent timed out — the model may be slow. You can retry.";
                        } else if (status === 502 || status === 503) {
                            errorMsg = "Agent gateway is unreachable. Check that OpenClaw is running.";
                        } else if (!Number.isFinite(status)) {
                            errorMsg = "Network error — check your connection and retry.";
                        }
                        setMessages((prev) =>
                            prev.map((m) =>
                                m.id === assistantPendingId
                                    ? {
                                          ...m,
                                          pending: false,
                                          error: true,
                                          content: errorMsg,
                                          ts: new Date().toISOString(),
                                      }
                                    : m
                            )
                        );
                        setHiddenNoteIdsForSend(() => new Set());
                        setStagedAttachment(attachmentSnap);
                        setIsLoading(false);
                        isLoadingRef.current = false;
                        if (status === 408) {
                            stopLateHealPoll();
                            const healIdeaId = currentIdeaId;
                            const maxHealPolls = 24;
                            let healTicks = 0;
                            lateHealPollRef.current = setInterval(() => {
                                healTicks += 1;
                                if (!healIdeaId || healTicks > maxHealPolls) {
                                    stopLateHealPoll();
                                    return;
                                }
                                fetch(`/api/ideas/${healIdeaId}/session`)
                                    .then((r) => r.json())
                                    .then((d) => {
                                        const rawMsgs = d.messages || [];
                                        const anyAsstErr = rawMsgs.some(
                                            (m) => m.role === "assistant" && m.error
                                        );
                                        if (!anyAsstErr) {
                                            stopLateHealPoll();
                                            setStagedAttachment(null);
                                            setHiddenNoteIdsForSend(() => new Set());
                                            setMessages(
                                                rawMsgs.map((m, idx) => ({
                                                    ...m,
                                                    id:
                                                        m.id ||
                                                        `${m.role}-${idx}-${(m.ts || "").slice(0, 19) || idx}`,
                                                }))
                                            );
                                            setPrdContent(d.prd_content || "");
                                            refreshAnnotations(healIdeaId);
                                            fetchPrdSectionDiff(healIdeaId);
                                            setReadinessStatus("updating");
                                            setReadinessData(null);
                                            setReadinessTimedOut(false);
                                            startReadinessPoll(healIdeaId);
                                        }
                                    })
                                    .catch(() => {});
                            }, 5000);
                        }
                    });
            };

            const onKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    submitMessage();
                }
            };

            const newIdea = () => {
                fetch("/api/ideas", { method: "POST" })
                    .then((r) => r.json())
                    .then((d) => {
                        setCurrentIdeaId(d.id);
                        setMessages([]);
                        setHiddenNoteIdsForSend(() => new Set());
                        setPrdContent("");
                        setRoadmapContent("");
                        setInputText("");
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                        setHadReadyReadiness(false);
                        setReadinessTimedOut(false);
                        setChatsRailCollapsed(false);
                        setActiveIdeaMenuId(null);
                        setShowActionMenu(false);
                        setStagedAttachment(null);
                        setUserFirstTurnPending(true);
                    });
            };

            const selectIdeaFromRail = (id) => {
                if (id !== currentIdeaId) {
                    setUserFirstTurnPending(false);
                }
                setCurrentIdeaId(id);
                setActiveIdeaMenuId(null);
                setRenamingIdeaId(null);
                setRenameError("");
            };

            const beginRename = (idea) => {
                setDeleteConfirmId(null);
                setActiveIdeaMenuId(null);
                setRenameError("");
                setRenamingIdeaId(idea.id);
                setRenameDraft(idea.name || "");
            };

            const cancelRename = () => {
                setRenamingIdeaId(null);
                setRenameDraft("");
                setRenameError("");
            };

            const submitRename = (id) => {
                fetch(`/api/ideas/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: renameDraft }),
                })
                    .then(async (r) => {
                        const payload = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            throw new Error(payload.detail || "Rename failed");
                        }
                        cancelRename();
                        refreshIdeas();
                    })
                    .catch((e) => {
                        setRenameError(String(e.message || e));
                    });
            };

            const executeDelete = (id) => {
                fetch(`/api/ideas/${id}`, { method: "DELETE" }).then(() => {
                    setDeleteConfirmId(null);
                    refreshIdeas();
                    if (currentIdeaId === id) {
                        setMessages([]);
                        setPrdContent("");
                        setReadinessStatus("unavailable");
                        setReadinessData(null);
                        setHadReadyReadiness(false);
                        setReadinessTimedOut(false);
                        setCurrentIdeaId(null);
                    }
                });
            };

            const _opEstimate = (opKey) => {
                const m = operationMetrics[opKey];
                if (!m || !m.sample_count) return "first run, no estimate";
                const n = m.sample_count;
                return `~${Math.round(m.avg_seconds)}s based on your last ${n} run${n > 1 ? "s" : ""}`;
            };

            const _needsLowReadinessConvertGuard = () =>
                readinessStatus === "ready" &&
                readinessData != null &&
                typeof readinessData.score === "number" &&
                Number.isFinite(readinessData.score) &&
                readinessData.score < 8;

            const beginConvertAfterGuards = () => {
                if (_needsLowReadinessConvertGuard()) {
                    setShowLowReadinessGenerateConfirm(true);
                    return;
                }
                _runConvert();
            };

            const _runConvert = () => {
                setConvertLoading(true);
                setConvertError("");
                fetch(`/api/ideas/${currentIdeaId}/convert`, { method: "POST" })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { throw new Error(t); });
                        return r.json();
                    })
                    .then((d) => {
                        setRoadmapContent(d.roadmap_content || "");
                        setConvertLoading(false);
                        setActiveDocTab("roadmap");
                        setShowQualityCheckModal(true);
                    })
                    .catch((e) => {
                        setConvertError(String(e.message || e));
                        setConvertLoading(false);
                    });
            };

            const doConvert = () => {
                if (!currentIdeaId || !prdContent.trim()) return;
                if (roadmapContent) {
                    setShowRegenerateConfirm(true);
                    return;
                }
                beginConvertAfterGuards();
            };

            const doAlignmentCheck = () => {
                if (!currentIdeaId) return;
                setShowQualityCheckModal(false);
                setAlignmentLoading(true);
                fetch(`/api/ideas/${currentIdeaId}/alignment-check`, { method: "POST" })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { throw new Error(t); });
                        return r.json();
                    })
                    .then((d) => {
                        setAlignmentLoading(false);
                        if (d.roadmap_updated && d.roadmap_content) {
                            setRoadmapContent(d.roadmap_content);
                        }
                        setAlignmentReport(d.alignment_report || null);
                        setActiveDocTab("alignment");
                        startNotificationPoll(currentIdeaId);
                    })
                    .catch((e) => {
                        setAlignmentLoading(false);
                    });
            };

            const doAdversarialCheck = () => {
                if (!currentIdeaId) return;
                setShowQualityCheckModal(false);
                setAdversarialLoading(true);
                fetch(`/api/ideas/${currentIdeaId}/adversarial-check`, { method: "POST" })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { throw new Error(t); });
                        return r.json();
                    })
                    .then((d) => {
                        setAdversarialLoading(false);
                        setAdversarialReport(d.adversarial_report || null);
                        setActiveDocTab("adversarial");
                        startNotificationPoll(currentIdeaId);
                    })
                    .catch((e) => {
                        setAdversarialLoading(false);
                    });
            };

            const continueSetup = () => {
                const rm = roadmapContent || "";
                if (rm.includes("Transformation Aborted")) {
                    setFormatInvalidDetail("The roadmap contains a 'Transformation Aborted' phase and cannot be used for setup. Generate a valid roadmap first.");
                    setShowFormatInvalidModal(true);
                    return;
                }
                setContinueNavPending(true);
                fetch("/api/setup/validate-roadmap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: rm }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setContinueNavPending(false);
                        if (!r.ok || !d.valid) {
                            const errMsgs = (d.errors || []).map((e) => e.message || String(e)).join("; ");
                            setFormatInvalidDetail(errMsgs || "Roadmap did not pass validation.");
                            setShowFormatInvalidModal(true);
                            return;
                        }
                        if (ctx && ctx.navigateToPreflightWithSeed) {
                            ctx.navigateToPreflightWithSeed(rm, prdContent || "");
                        }
                    })
                    .catch(() => {
                        setContinueNavPending(false);
                        setFormatInvalidDetail("Could not validate roadmap.");
                        setShowFormatInvalidModal(true);
                    });
            };

            const doFixRoadmapFormat = () => {
                if (!currentIdeaId) return;
                setFixFormatLoading(true);
                fetch(`/api/ideas/${currentIdeaId}/fix-roadmap-format`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ roadmap_content: roadmapContent }),
                })
                    .then((r) => {
                        if (!r.ok) return r.text().then((t) => { throw new Error(t); });
                        return r.json();
                    })
                    .then((d) => {
                        setFixFormatLoading(false);
                        setShowFormatInvalidModal(false);
                        if (d.roadmap_content) {
                            setRoadmapContent(d.roadmap_content);
                            continueSetup();
                        }
                    })
                    .catch((e) => {
                        setFixFormatLoading(false);
                        setFormatInvalidDetail(`Fix Format failed: ${e.message || e}`);
                    });
            };


            const listedIds = new Set((ideasList || []).map((it) => it.id));
            const showUnlistedSession = currentIdeaId && !listedIds.has(currentIdeaId);
            const currentIdeaName =
                (ideasList.find((it) => it.id === currentIdeaId) || {}).name ||
                (currentIdeaId ? currentIdeaId.slice(0, 8) : "Conversation");

            const slugifySectionName = (name) =>
                String(name || "")
                    .toLowerCase()
                    .replace(/&/g, "and")
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "");

            const parsePrdSections = (content) => {
                const out = {};
                PRD_SECTION_TITLES.forEach((t) => {
                    out[t] = "";
                });
                if (!content || !content.trim()) return out;
                const lines = String(content).split("\n");
                let current = null;
                for (const line of lines) {
                    const heading = line.match(/^#{1,3}\s+(.+)\s*$/);
                    if (heading) {
                        const matched = PRD_SECTION_TITLES.find(
                            (t) => t.toLowerCase() === heading[1].trim().toLowerCase()
                        );
                        if (matched) {
                            current = matched;
                            continue;
                        }
                    }
                    const numHeading = line.match(/^\d+\.\s*(.+)\s*$/);
                    if (numHeading) {
                        const rawTitle = numHeading[1].trim();
                        const matched = PRD_SECTION_TITLES.find(
                            (t) => t.toLowerCase() === rawTitle.toLowerCase()
                        );
                        if (matched) {
                            current = matched;
                            continue;
                        }
                    }
                    if (current) {
                        out[current] = out[current] ? `${out[current]}\n${line}` : line;
                    }
                }
                return out;
            };

            const prdSections = parsePrdSections(prdContent || "");
            const readinessSectionMap =
                readinessStatus === "ready" && readinessData && readinessData.sections
                    ? readinessData.sections
                    : {};
            const checklistRows = PRD_SECTION_TITLES.map((title) => {
                const info = readinessSectionMap[title] || {};
                const status =
                    info.status === "complete" || info.status === "partial" ? info.status : "empty";
                return {
                    title,
                    status,
                    criticality: info.criticality || "",
                    content: (prdSections[title] || "").trim(),
                };
            });

            const hasAnyPrdBody = PRD_SECTION_TITLES.some((t) => (prdSections[t] || "").trim().length > 0);
            const hasRemovedInDiff = PRD_SECTION_TITLES.some((t) => {
                const sl = slugifySectionName(t);
                const e = prdSectionDiff[sl];
                return e && e.status === "removed";
            });

            return (
                <div className="flex h-full min-w-0">
                    {revertConfirmSlug && (
                        <div
                            className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 px-4"
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="prd-revert-confirm-title"
                            onClick={() => setRevertConfirmSlug(null)}
                        >
                            <div
                                className="max-w-md w-full rounded-lg border border-[#2a2d31] bg-[#141618] p-4"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <p id="prd-revert-confirm-title" className="text-sm text-slate-200 mb-3">
                                    Restore this section to its previous version? The current version will become the new previous.
                                </p>
                                <div className="flex justify-end gap-2">
                                    <button
                                        type="button"
                                        className="text-xs px-3 py-1.5 rounded border border-[#2a2d31] text-slate-400"
                                        onClick={() => setRevertConfirmSlug(null)}
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="button"
                                        className="text-xs px-3 py-1.5 rounded bg-amber-900/40 border border-amber-700/50 text-amber-200"
                                        onClick={() => {
                                            const sk = revertConfirmSlug;
                                            setRevertConfirmSlug(null);
                                            postSectionRevert(sk);
                                        }}
                                    >
                                        Revert
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Vertical chat list — collapses after picking a chat so conversation + PRD get space */}
                    <div
                        className={`${
                            chatsRailCollapsed ? "w-16" : "w-56 sm:w-60"
                        } relative flex-shrink-0 flex flex-col bg-[#0d0f11] border-r border-[#1a1d21] transition-[width] duration-200 ease-out`}
                    >

                                                                        p.includes(slug)

                                                                className="text-[11px] text-[#64748b] hover:text-[#00b4d8] px-1.5 py-0.5 shrink-0 header-text"

                                                            </button>

                                                                type="button"

                                                                    const done = () => { setCopiedSection(title); setTimeout(() => setCopiedSection(null), 2000); };

                                                                        navigator.clipboard.writeText(copySource).then(done).catch(() => {});
                                                                    } else {
                                                                        const ta = document.createElement("textarea");
                                                                        ta.value = copySource; ta.style.position = "fixed"; ta.style.opacity = "0";
                                                                        document.body.appendChild(ta); ta.select();
                                                                        try { document.execCommand("copy"); done(); } catch(e) {}
                                                                        document.body.removeChild(ta);
                                                                    }
                                                                }}
                                                                className="text-[11px] text-[#64748b] hover:text-slate-300 px-1.5 py-0.5 rounded border border-[#2a2d31] hover:border-slate-600 shrink-0 header-text"

                                                                <button
                                                                    type="button"

                                                                    >
                                                                        {isRemovedDiff ? "Restore" : "Revert"}

                                                                    <span />
                                                                )}
                                                            </div>
                                                            <div className="space-y-0.5 font-mono text-xs p-2 max-h-72 overflow-y-auto">
                                                                {prdCollapseDiffContext(
                                                                    prdFlattenDiffLines(diffPrev, diffCur),

                                                        <div
                                                            className={`msg-md text-sm ${isRemovedDiff ? "text-slate-400" : ""}`}
                                                            dangerouslySetInnerHTML={{
                                                                __html:
                                                                    typeof marked !== "undefined" && marked.parse
                                                                        ? marked.parse(sectionMarkdown, { breaks: true })
                                                                        : String(sectionMarkdown)
                                                                              .replace(/&/g, "&amp;")
                                                                              .replace(/</g, "&lt;"),
                                                            }}
                                                        />
                                                    )}
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <div
                                            className="msg-md text-sm"
                                            dangerouslySetInnerHTML={{
                                                __html:
                                                    typeof marked !== "undefined" && marked.parse
                                                        ? marked.parse(prdContent || "", { breaks: true })
                                                        : String(prdContent || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"),
                                            }}
                                        />
                                    )}
                                </div>
                            ) : null}
                        </div>}
                        {activeDocTab === 'prd' && (
                            <div className="flex-shrink-0 border-t border-[#1a1d21] px-4 py-2 flex justify-end gap-2">
                                <button
                                    className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:border-slate-500"

                                )}
                            </div>

                            <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
                                <div style={{flex:1, overflowY:'auto', padding:'24px'}}>
                                    {!roadmapContent ? (
                                        <div style={{display:'flex', justifyContent:'center', alignItems:'center', height:'100%'}}>
                                            <button

                                                disabled={convertLoading}

                                                {convertLoading ? `Generating... (${_opEstimate("roadmap_generation")})` : "Generate Roadmap"}
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="msg-md" dangerouslySetInnerHTML={{__html: marked.parse(roadmapContent)}}/>

                                </div>
                                {roadmapContent && (
                                    <div className="flex-shrink-0 border-t border-[#1a1d21] px-4 py-2 flex justify-between items-center">
                                        <button
                                            className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 border border-[#2a2d31] hover:border-slate-500 disabled:opacity-40"

                                            : "PRD readiness is below the recommended level."}

                                    <p className="text-slate-500">
                                        You can edit the PRD first and let readiness update, or continue now.
                                    </p>

                                <div className="flex gap-2 justify-end">
                                    <button
                                        type="button"
                                        onClick={() => setShowLowReadinessGenerateConfirm(false)}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-[#1a1d21] text-slate-400 border border-[#2a2d31] hover:text-slate-200"
                                    >
                                        Cancel

                                    <button
                                        type="button"
                                        onClick={() => {
                                            setShowLowReadinessGenerateConfirm(false);

                                        Generate anyway

                                    <p>

                                        <span className="text-slate-200 font-semibold">Continue to Setup →</span> in the bar below after you close this.
                                    </p>
                                    <p>

                                        <span className="text-slate-200 font-semibold">Adversarial</span> tabs first.
                                    </p>
                                    {readinessStatus === "ready" &&

                                            </p>

                                <div className="flex justify-end">
                                    <button

        function PreflightScreen(props) {
            const {
                seedRoadmap,
                repoPath,
                repoPathLocked,
                roadmapSeed,
                roadmapSeedLocked,
                onRepoPathChange,
                onRepoPathLockToggle,
                onRoadmapSeedChange,
                onRoadmapSeedLockToggle,
                onBack,
                repoPathError,
                roadmapSeedError,
                onRepoPathConfirm,
                onRoadmapSeedConfirm,
                onFixRoadmapSeedFormat,
                preflightFixFormatLoading,
                onRunPreflight,
                onConfirmRoadmapArchive,
                preflightRoadmapAmbiguous,
                preflightChecks,
                onLaunch,
                launchError,
                launchDisabled,
                launchLoading,
                onAddToQueue,
                addToQueueBusy,
                addToQueueError,
                hasActiveProject,
                repoPathFsStatus,
                showCreateFolderPrompt,
                createFolderError,
                onCreateRepoDir,
                onCancelCreateFolder,
                preflightLastRun,
                hasFail,
                recentProjects,
                repoRoadmapHintMessage,
            } = props;

            const repoPathInputFsStatus =
                repoPathLocked || !repoPathFsStatus
                    ? null
                    : repoPathFsStatus === "parent"
                      ? null
                      : repoPathFsStatus === "exists" || repoPathFsStatus === "bad"
                        ? repoPathFsStatus
                        : null;

            const [roadmapInputMode, setRoadmapInputMode] = useState("paste");
            const [roadmapSeedFileName, setRoadmapSeedFileName] = useState("");
            const roadmapSeedFileRef = useRef(null);

            const preflightBtnLabel = preflightChecks ? "Re-run Preflight" : "Run Preflight";

            const step3Done = !!preflightChecks && !hasFail && !preflightRoadmapAmbiguous;
            const step3HasError = !!preflightChecks && hasFail;
            const step3HasWarning = !!preflightChecks && !hasFail && !!preflightRoadmapAmbiguous;

            const firstIncompleteStep = !repoPathLocked ? 1
                : !roadmapSeedLocked ? 2
                : !step3Done ? 3
                : null;

            return (
                <div className="flex-1 overflow-y-auto bg-[#0d0f12] p-6">
                    <div className="max-w-2xl mx-auto space-y-4">

                        <div
                            data-testid="preflight-step-1"
                            className={`rounded border p-3 space-y-2 ${repoPathLocked ? "border-emerald-600/60" : "border-[#2a2d31]"}`}

                            <div className="flex flex-wrap justify-between items-start gap-2">

                                    <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">
                                        Confirm the repository path AutoDev will build in.
                                    </p>
                                </div>
                                <div className="flex gap-2 items-center shrink-0 self-start">
                                    {!repoPathLocked ? (
                                        <button type="button" onClick={onRepoPathConfirm} className="header-text text-sm px-3 py-1 rounded bg-[#00b4d8] text-[#0d0f12] font-medium">

                                            <span className="text-emerald-500">✓</span>
                                            <button type="button" onClick={onRepoPathLockToggle} className="header-text text-xs text-slate-500 hover:text-slate-300">
                                                Edit
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                            <div className="flex gap-2 items-stretch">
                                <div className="flex-1 min-w-0">
                                    <ServerPathInput
                                        id="preflight-repo-path"
                                        value={repoPath}
                                        onChange={onRepoPathChange}
                                        disabled={repoPathLocked}
                                        fsStatus={repoPathInputFsStatus}
                                        recents={recentProjects || []}
                                    />
                                </div>
                                {!repoPathLocked && repoPathFsStatus === "parent" && (
                                    <span
                                        className="flex items-center text-amber-400 shrink-0 text-lg leading-none"
                                        title="Path does not exist yet; parent exists — use Confirm repository to create or pick a path"
                                    >
                                        +
                                    </span>
                                )}
                            </div>
                            {repoPathError && <p className="text-red-400 text-xs">{repoPathError}</p>}
                            {createFolderError && <p className="text-red-400 text-xs">{createFolderError}</p>}
                            {showCreateFolderPrompt && !repoPathLocked && (
                                <div className="rounded border border-[#2a2d31] bg-[#141618] px-3 py-2 text-xs text-slate-300 space-y-2">
                                    <p>This folder doesn&apos;t exist. Create it?</p>
                                    <div className="flex gap-2 flex-wrap">
                                        <button
                                            type="button"
                                            onClick={onCreateRepoDir}
                                            className="header-text text-xs px-2 py-1 rounded bg-[#00b4d8] text-[#0d0f12] font-medium"

                                            Create Folder

                                        <button
                                            type="button"
                                            onClick={onCancelCreateFolder}
                                            className="header-text text-xs px-2 py-1 rounded border border-[#1a1d21] text-slate-400"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div

                            className={`rounded border p-3 space-y-2 ${roadmapSeedLocked ? "border-emerald-600/60" : "border-[#2a2d31]"}`}
                        >
                            <div className="flex flex-wrap justify-between items-start gap-2">
                                <div className="min-w-0 flex-1 space-y-1">
                                    <p className="header-text text-xs font-semibold text-slate-400">Step 2 — Roadmap</p>
                                    <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">
                                        Format check only - content quality review lives in Project Ideas if needed.
                                    </p>
                                </div>
                                <div className="flex gap-2 items-center shrink-0 self-start">
                                    {!roadmapSeedLocked ? (
                                        <button type="button" onClick={onRoadmapSeedConfirm} className="header-text text-sm px-3 py-1 rounded bg-[#00b4d8] text-[#0d0f12] font-medium">
                                            Validate roadmap
                                        </button>
                                    ) : (
                                        <>
                                            <span className="text-emerald-500">✓</span>
                                            <button type="button" onClick={onRoadmapSeedLockToggle} className="header-text text-xs text-slate-500 hover:text-slate-300">
                                                Edit
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                            {seedRoadmap ? (
                                <p className="text-xs text-[#00b4d8]">From Project Ideas</p>
                            ) : null}
                            {roadmapSeedLocked ? (
                                <textarea
                                    value={roadmapSeed}
                                    onChange={(e) => onRoadmapSeedChange(e.target.value)}
                                    readOnly
                                    disabled
                                    placeholder="Paste roadmap markdown…"
                                    className="w-full min-h-[100px] max-h-[38vh] overflow-y-auto rounded border border-[#1a1d21] px-3 py-2 text-sm bg-[#0d0f12] text-slate-300"
                                />
                            ) : roadmapSeed ? (
                                <textarea
                                    value={roadmapSeed}
                                    onChange={(e) => onRoadmapSeedChange(e.target.value)}
                                    placeholder="Paste roadmap markdown…"
                                    className="w-full min-h-[100px] max-h-[38vh] overflow-y-auto rounded border border-[#1a1d21] px-3 py-2 text-sm bg-[#1a1d21] text-slate-200"
                                />
                            ) : (
                                <div className="space-y-2">
                                    {!seedRoadmap ? (
                                        <div className="flex gap-2 flex-wrap">
                                            <button
                                                type="button"
                                                onClick={() => setRoadmapInputMode("upload")}
                                                className={`header-text text-xs px-3 py-1.5 rounded border ${
                                                    roadmapInputMode === "upload"
                                                        ? "border-[#00b4d8] text-[#00b4d8] bg-[#00b4d8]/10"
                                                        : "border-[#1a1d21] text-slate-400 hover:border-slate-600"
                                                }`}
                                            >
                                                Upload file
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setRoadmapInputMode("paste")}
                                                className={`header-text text-xs px-3 py-1.5 rounded border ${
                                                    roadmapInputMode === "paste"
                                                        ? "border-[#00b4d8] text-[#00b4d8] bg-[#00b4d8]/10"
                                                        : "border-[#1a1d21] text-slate-400 hover:border-slate-600"

                                            >
                                                Paste content

                                        <textarea

                                            onChange={(e) => onRoadmapSeedChange(e.target.value)}
                                            placeholder="Paste roadmap markdown…"
                                            className="w-full min-h-[100px] max-h-[38vh] overflow-y-auto rounded border border-[#1a1d21] px-3 py-2 text-sm bg-[#1a1d21] text-slate-200"
                                        />
                                    ) : (
                                        <div className="space-y-2">
                                            <input
                                                ref={roadmapSeedFileRef}
                                                type="file"
                                                accept=".md"
                                                className="hidden"
                                                onChange={(e) => {
                                                    const file = e.target.files && e.target.files[0];
                                                    if (!file) return;
                                                    setRoadmapSeedFileName(file.name);
                                                    const reader = new FileReader();
                                                    reader.onload = () => onRoadmapSeedChange(String(reader.result || ""));
                                                    reader.readAsText(file);
                                                    e.target.value = "";
                                                }}
                                            />
                                            <button
                                                type="button"
                                                onClick={() => roadmapSeedFileRef.current && roadmapSeedFileRef.current.click()}
                                                className="header-text w-full sm:w-auto text-sm px-4 py-2 rounded bg-[#1a1d21] text-[#00b4d8] border border-[#00b4d8]/40 hover:border-[#00b4d8]/70"
                                            >
                                                Upload .md file
                                            </button>
                                            {roadmapSeedFileName ? (
                                                <p className="text-[11px] text-slate-500 truncate">{roadmapSeedFileName}</p>
                                            ) : null}
                                        </div>
                                    )}
                                </div>

                            {(roadmapSeedError && roadmapSeedError.length > 0 || preflightFixFormatLoading) && (
                                <div className="space-y-2">
                                    {onFixRoadmapSeedFormat && (
                                        <button
                                            type="button"
                                            onClick={onFixRoadmapSeedFormat}
                                            disabled={preflightFixFormatLoading}
                                            className="header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8]/20 text-[#00b4d8] border border-[#00b4d8]/40 disabled:opacity-40"
                                        >
                                            {preflightFixFormatLoading ? "Fixing..." : "Fix Format"}
                                        </button>
                                    )}
                                    {roadmapSeedError && roadmapSeedError.length > 0 && (
                                        <ul className="text-red-400 text-xs space-y-1">
                                            {roadmapSeedError.map((er, i) => (
                                                <li key={i}>Line {er.line}: {er.message}</li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            )}
                            {repoRoadmapHintMessage ? (
                                <p className="text-[11px] text-amber-400 leading-relaxed max-w-prose">
                                    {repoRoadmapHintMessage}
                                </p>
                            ) : null}
                        </div>
                        <div
                            data-testid="preflight-step-3"
                            className={`rounded border p-3 space-y-2 ${
                                step3HasError ? "border-red-600/60"
                                    : step3HasWarning ? "border-amber-500/60"
                                    : step3Done ? "border-emerald-600/60"
                                    : "border-[#2a2d31]"
                            }`}
                        >
                            <div className="flex flex-wrap justify-between items-start gap-2">
                                <div className="min-w-0 flex-1 space-y-1">
                                    <p className="header-text text-xs font-semibold text-slate-400">Step 3 — Preflight</p>
                                    <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">
                                        Checks symlink, .gitignore, workspace files, and roadmap. Launch adds scaffolding and sets the active project.
                                    </p>
                                </div>
                                <div className="flex flex-col gap-0.5 items-end shrink-0 self-start">
                                    <button
                                        type="button"
                                        onClick={onRunPreflight}
                                        disabled={!repoPathLocked || !roadmapSeedLocked}
                                        className={`header-text text-sm px-4 py-2 rounded bg-[#1a1d21] text-slate-200 border border-[#1a1d21] disabled:opacity-40 whitespace-nowrap ${hasFail ? "status-pulse" : ""}`}
                                    >
                                        {preflightBtnLabel}
                                    </button>
                                    {preflightLastRun ? (
                                        <span className="text-[11px] text-slate-600 text-right max-w-[12rem]">
                                            Last run: {relativeTimeShort(preflightLastRun)}
                                        </span>
                                    ) : null}
                                </div>
                            </div>
                            {preflightRoadmapAmbiguous && (
                                <div className="rounded border border-amber-600/80 bg-amber-950/40 px-3 py-3 text-sm text-amber-100 space-y-2">
                                    <p>
                                        Multiple roadmap files found:{" "}
                                        <span className="font-mono text-xs">
                                            {(preflightRoadmapAmbiguous.roadmap_files || []).join(", ")}
                                        </span>
                                        . Keep <span className="font-mono">{preflightRoadmapAmbiguous.recommended_keep}</span>{" "}
                                        and move the rest into <span className="font-mono">autodev_archive/</span>.
                                    </p>
                                    <button
                                        type="button"
                                        onClick={onConfirmRoadmapArchive}
                                        disabled={!repoPathLocked || !roadmapSeedLocked}
                                        className="header-text text-xs px-3 py-1.5 rounded bg-amber-900/60 border border-amber-600 text-amber-50 disabled:opacity-40"
                                    >
                                        Archive extras &amp; continue preflight
                                    </button>
                                </div>
                            )}
                            {preflightChecks && preflightChecks.length > 0 && (
                                <ul className="space-y-2 text-sm max-h-[32vh] overflow-y-auto pr-1">
                                    {preflightChecks.map((c, i) => (
                                        <li key={i} className={`flex gap-2 ${c.status === "fail" ? "text-red-400" : c.status === "warn" ? "text-amber-400" : c.status === "fixed" ? "text-[#00b4d8]" : "text-emerald-400"}`}>
                                            <span className="font-mono text-xs">[{c.status}]</span>
                                            <span>{c.check}: {c.message}</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div
                            className={
                                launchDisabled && !launchLoading && firstIncompleteStep !== null
                                    ? "flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:justify-between sm:gap-x-4"
                                    : "flex flex-col gap-2"
                            }
                        >
                            {launchDisabled && !launchLoading && firstIncompleteStep !== null && (
                                <p
                                    data-testid="preflight-launch-blocking-hint"
                                    className="text-xs text-slate-500 min-w-0 sm:max-w-[55%]"
                                >
                                    {firstIncompleteStep === 1 && "Complete Step 1 — confirm your repository path."}
                                    {firstIncompleteStep === 2 && "Complete Step 2 — validate your roadmap."}
                                    {firstIncompleteStep === 3 && (
                                        step3HasError
                                            ? "Step 3 has failures — fix checks and re-run Preflight."
                                            : step3HasWarning
                                                ? "Step 3 — resolve the roadmap ambiguity to continue."
                                                : "Complete Step 3 — run Preflight."
                                    )}
                                </p>
                            )}
                            <div className="flex gap-2 flex-wrap items-center shrink-0 sm:ml-auto">
                            <button type="button" onClick={onAddToQueue} disabled={launchDisabled || addToQueueBusy}
                                className="header-text text-sm px-4 py-2 rounded bg-[#1a1d21] text-[#00b4d8] border border-[#00b4d8]/40 font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:border-[#00b4d8]/70">
                                {addToQueueBusy ? 'Adding…' : 'Add to Queue'}
                            </button>
                            <button type="button" onClick={onLaunch} disabled={launchDisabled || launchLoading}
                                className="header-text text-sm px-4 py-2 rounded bg-[#00b4d8] text-[#0d0f12] font-medium disabled:bg-[#2a2d31] disabled:text-slate-600 disabled:cursor-not-allowed">
                                {launchLoading ? 'Launching…' : 'Launch Now'}
                            </button>
                            <button type="button" onClick={onBack} className="header-text text-sm px-4 py-2 rounded border border-[#1a1d21] text-slate-400">
                                Back
                            </button>
                            </div>
                        </div>
                        {addToQueueError && <p className="text-red-400 text-sm whitespace-pre-wrap">{addToQueueError}</p>}
                        {hasActiveProject && (
                            <p className="text-amber-400 text-xs mt-1">A project is currently running. Launching now will insert your project at the top of the queue to run next.</p>
                        )}
                        {launchError && <p className="text-red-400 text-sm whitespace-pre-wrap">{launchError}</p>}
                    </div>
                </div>
            );
        }

        function ServerPathInput({ value, onChange, disabled, fsStatus, recents, id }) {
            const listId = id ? id + "-recents" : undefined;
            return (
                <div className="relative">
                    <div className="flex gap-2 items-stretch">
                        <input
                            id={id}
                            type="text"
                            list={listId}
                            value={value}
                            onChange={(e) => onChange(e.target.value)}
                            disabled={disabled}
                            readOnly={disabled}
                            placeholder="/path/to/your-project/my-app"
                            className={
                                "flex-1 min-w-0 rounded border border-[#1a1d21] px-3 py-2 text-sm font-mono " +
                                (disabled ? "bg-[#0d0f12] text-slate-300" : "bg-[#1a1d21] text-slate-200")
                            }
                        />
                        {recents && recents.length > 0 && id ? (
                            <datalist id={listId}>
                                {recents.map((r, i) => (
                                    <option key={i} value={typeof r === "object" && r.path ? r.path : r} />
                                ))}
                            </datalist>
                        ) : null}
                        {!disabled && fsStatus === "exists" && (
                            <span
                                className="flex items-center text-emerald-500 shrink-0"
                                title="Directory exists on the server"
                            >
                                ✓
                            </span>
                        )}
                        {!disabled && fsStatus === "bad" && (
                            <span
                                className="flex items-center text-red-400 shrink-0"
                                title="Path does not exist or is not reachable"
                            >
                                ✗
                            </span>
                        )}
                    </div>
                </div>
            );
        }

        // ─── Add Project Modal ────────────────────────────────────────────────────

        function AddProjectModal({ onClose, onAdded }) {
            const [projectPath, setProjectPath] = useState('');
            const [validating, setValidating] = useState(false);
            const [errors, setErrors] = useState([]);
            const [queueAddPathFsStatus, setQueueAddPathFsStatus] = useState(null);
            const [pathRecents, setPathRecents] = useState([]);
            const queueAddValidateTimerRef = useRef(null);

            useEffect(() => {
                fetch("/api/setup/recent-projects")
                    .then((r) => r.json())
                    .then((d) => setPathRecents(Array.isArray(d.projects) ? d.projects : []))
                    .catch(() => setPathRecents([]));
            }, []);

            const handlePathChange = (value) => {
                setProjectPath(value);
                setErrors([]);
                const trimmed = (value || "").trim();
                if (queueAddValidateTimerRef.current) {
                    clearTimeout(queueAddValidateTimerRef.current);
                }
                if (!trimmed) {
                    setQueueAddPathFsStatus(null);
                    return;
                }

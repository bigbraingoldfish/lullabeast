                fetch("/api/setup/recent-projects")
                    .then((r) => r.json())
                    .then((d) => setSwRecents(Array.isArray(d.projects) ? d.projects : []))
                    .catch(() => setSwRecents([]));
            }, [projectSwitchOpen]);

            function openProjectSwitch() {
                swPendingRef.current = {};
                setSwErr("");
                setSwChecks(null);
                setSwCoherence(null);
                setSwReady(false);
                setSwRoadmapAmbiguous(null);
                setSwDestructiveSelected([]);
                setSwPath(pState.project_path || "");
                setSwFsStatus(null);
                setResumeSymlinkNotice(null);
                setProjectSwitchOpen(true);
            }

            function closeProjectSwitch() {
                setProjectSwitchOpen(false);
                swPendingRef.current = {};
            }

            function postSwitchProject(body) {
                setSwBusy(true);
                setSwErr("");
                fetch("/api/setup/switch-project", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setSwBusy(false);
                        if (r.status === 409) {
                            const msg =
                                typeof d.detail === "string"
                                    ? d.detail
                                    : d.error || "Stop the pipeline before switching project.";
                            setSwErr(msg);
                            return;
                        }
                        if (d.destructive_error) {
                            setSwErr(String(d.destructive_error));
                            return;
                        }
                        if (d.roadmap_ambiguous) {
                            setSwRoadmapAmbiguous(d);
                            setSwCoherence(null);
                            setSwReady(false);
                            setSwChecks(d.checks || null);
                            return;
                        }
                        setSwRoadmapAmbiguous(null);
                        setSwChecks(d.checks || null);
                        setSwCoherence(d.coherence || null);
                        if (d.ok && d.started) {
                            closeProjectSwitch();
                            setResumeSymlinkNotice(null);
                            fetchState();
                            fetchRoadmap();
                            fetchMetricsSummary();
                            return;
                        }
                        if (d.ok && d.ready_to_start) {
                            const n = { ...swPendingRef.current };
                            if (body.confirm_roadmap_archive) {
                                n.confirm_roadmap_archive = true;
                                if (body.keep_filename) n.keep_filename = body.keep_filename;
                            }
                            if (body.confirm_destructive) {
                                n.confirm_destructive = body.confirm_destructive;
                            }
                            swPendingRef.current = n;
                            setSwReady(true);
                            return;
                        }
                        if (!d.ok && d.coherence && d.coherence.ok === false) {
                            setSwReady(false);
                            const opts = [];
                            const seen = new Set();
                            for (const iss of d.coherence.issues || []) {
                                for (const o of iss.destructive_options || []) {
                                    if (!seen.has(o)) {
                                        seen.add(o);
                                        opts.push(o);
                                    }
                                }
                            }
                            if (opts.length === 0) {
                                const iss0 = (d.coherence.issues || [])[0];
                                setSwErr(
                                    iss0
                                        ? `${iss0.kind}: ${iss0.detail}`
                                        : "Coherence check failed (no automatic fix available)."
                                );
                                return;
                            }
                            setSwDestructiveSelected(opts);
                            return;
                        }
                        setSwErr(d.error || "Switch project failed");
                    })
                    .catch((e) => {
                        setSwBusy(false);
                        setSwErr(String(e));
                    });
            }

            function fetchState() {
                fetch('/api/state')
                    .then(res => res.json())
                    .then(data => {
                        setPState(prev => ({ ...prev, ...data }));
                        setPipelineStatus(data.pipeline_status || '');
                    })
                    .catch(() => {});
            }

            function fetchRoadmap() {
                fetch('/api/roadmap')
                    .then(res => res.json())
                    .then(data => {
                        // Only update if data actually changed to avoid unnecessary re-renders
                        setRoadmap(prev => {
                            return JSON.stringify(prev) === JSON.stringify(data) ? prev : data;
                        });
                    })
                    .catch(() => {});
            }

            function fetchMetricsSummary() {
                fetch('/api/metrics-summary')
                    .then(res => res.json())
                    .then(data => { setMetricsSummary(data); })
                    .catch(() => {});
            }

            function fetchCompletionReport() {
                fetch('/api/completion-report')
                    .then(res => res.json())
                    .then(data => { setCompletionReport(data); })
                    .catch(() => {});
            }

            async function handleGenerateDocs() {
                setGenerateDocsBusy(true);
                setGenerateDocsError("");
                const projectBasename = (pState.project_path || '').split('/').filter(Boolean).pop() || 'project';
                try {
                    const r = await fetch(`/api/completion-review/${encodeURIComponent(projectBasename)}`, { method: 'POST' });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        setGenerateDocsError(d.detail || `Generate failed (${r.status})`);
                        setGenerateDocsBusy(false);
                        return;
                    }
                    // Webhook triggered — poll for the report to appear (agent writes it async)
                    let found = false;
                    for (let i = 0; i < 60; i++) {
                        await new Promise(ok => setTimeout(ok, 5000));
                        try {
                            const cr = await fetch('/api/completion-report').then(x => x.json());
                            if (cr && cr.found) {
                                setCompletionReport(cr);
                                found = true;
                                break;
                            }
                        } catch (_) {}
                    }
                    if (!found) {
                        fetchCompletionReport();
                    }
                } catch (e) {
                    setGenerateDocsError(String(e));
                } finally {
                    setGenerateDocsBusy(false);
                }
            }

            const handleStopConfirm = async () => {
                setStopError("");
                setStopHint("");
                setShowStopModal(false);
                try {
                    const r = await fetch("/api/stop", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Stop failed (${r.status})`;
                        setStopError(msg);
                        return;
                    }
                    setStopRequested(true);
                    if (typeof d.hint === "string" && d.hint) setStopHint(d.hint);
                } catch (e) {
                    setStopError(String(e));
                }
            };

            function applyResumeOrchestratorClientResult(d, res) {
                const ok = res && res.ok;
                const status = res && res.status;
                if (ok) {
                    if (d && d.reconciled === true) {
                        setResumeSymlinkNotice(
                            "Resume re-aligned the project symlink to match pipeline state."
                        );
                    } else {
                        setResumeSymlinkNotice(null);
                    }
                    return;
                }
                if (status === 503 && d && d.reconciled === true) {
                    const rawErr = d.error || "Failed to spawn";
                    const spawnLine =
                        mapResumeOrchestratorFriendlyMessage(String(rawErr), 503) || String(rawErr);
                    setResumeSymlinkNotice(
                        `Symlink was re-aligned to match pipeline state; orchestrator did not start (${spawnLine}). Click Restart again.`
                    );
                    return;
                }
                setResumeSymlinkNotice(null);
            }

            const handleHeaderResume = async () => {
                setResumeError("");
                setResumeBusy(true);
                try {
                    const result = await runStoppedResumeFlow("RETRY");
                    if (result.resumeOrch) {
                        applyResumeOrchestratorClientResult(result.resumeOrch.body, {
                            ok: result.resumeOrch.fetchOk,
                            status: result.resumeOrch.status,
                        });
                    }
                    if (!result.ok) {
                        setResumeError(result.error);
                        return;
                    }
                    fetchState();
                } catch (e) {
                    setResumeError(String(e));
                } finally {
                    setResumeBusy(false);
                }
            };

            const handleRestartOrchestrator = async () => {
                setOrchRestartError("");
                setOrchRestartBusy(true);
                try {
                    const r = await fetch("/api/resume-orchestrator", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    applyResumeOrchestratorClientResult(d, { ok: r.ok, status: r.status });
                    if (!r.ok) {
                        if (r.status === 503 && d && d.reconciled === true) {
                            setOrchRestartError("");
                        } else {
                            setOrchRestartError(
                                formatResumeOrchestratorError(d, r.status) || `Restart failed (${r.status})`
                            );
                        }
                        return;
                    }
                    fetchState();
                } catch (e) {
                    setOrchRestartError(String(e));
                } finally {
                    setOrchRestartBusy(false);
                }
            };

            const handleGitRecover = async () => {
                setGitRecoverError("");
                setGitRecoverBusy(true);
                try {
                    const res = await fetch("/api/pipeline/git-recover", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ base_branch: gitRecoverBranch.trim() }),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        const msg = typeof data.detail === "string" ? data.detail : `Recovery failed (${res.status})`;
                        setGitRecoverError(msg);
                        return;
                    }
                    setShowGitRecoverModal(false);
                    fetchState();
                    fetchRoadmap();
                } catch (e) {
                    setGitRecoverError(String(e?.message || e));
                } finally {
                    setGitRecoverBusy(false);
                }
            };

            const status = pState.pipeline_status;
            const alive = pState.orchestrator_alive;
            const showStopButton = ["RUNNING", "WAITING_FOR_SENTINEL", "WAITING_FOR_HUMAN"].includes(
                status
            );
            const showResumeButton = status === "STOPPED";
            const showRestartOrchestratorButton =
                !alive && (status === "RUNNING" || status === "WAITING_FOR_SENTINEL");
            const queueHaltedEscalationForRecovery =
                status === "QUEUE_HALTED" &&
                !!(pState.escalation_trigger_reason || pState.escalation_message);
            const showHeaderOrchestratorRecoveryBanner =
                !alive &&
                (status === "WAITING_FOR_HUMAN" ||
                    status === "STOPPED" ||
                    queueHaltedEscalationForRecovery);

            // Derive header status label, optional native tooltip (title), and class
            let statusLabel = '--';
            let statusTitle = '';
            let statusClass = 'bg-[#1a1d21] text-slate-300';
            if (!alive && (status === 'RUNNING' || status === 'WAITING_FOR_SENTINEL')) {
                statusLabel = 'ORCHESTRATOR DOWN';
                statusClass = 'bg-red-600 text-white';
            } else if (status in STATE_LABELS) {
                statusLabel = STATE_LABELS[status];
                const pillMeta = PIPELINE_LIVE_PILL[status];
                if (pillMeta && pillMeta.title) {
                    statusTitle = pillMeta.title;
                }
                if (status === 'WAITING_FOR_SENTINEL') {
                    statusLabel = formatWaitForSentinelLabel(pState.current_agent);
                }
                statusClass = STATE_CLASSES[status] || 'bg-[#1a1d21] text-slate-300';
            }

            const segments = (pState.project_path || '').split('/').filter(s => s);
            const projectDisplay = segments.slice(-2).join('/') || '--/--';
            const pathBroken = pState.project_dir_ok === false;
            const pathInteractive =
                status === "STOPPED" || status === "UNKNOWN" || pathBroken ||
                status === "PIPELINE_COMPLETE" || status === "HALTED_SILENT" || status === "BLOCKED";
            const repairPathHintText =
                pState.project_dir_message ||
                "Project folder link is broken — click the path to choose your project folder and repair it.";
            const pathCanOfferStop =
                status === "RUNNING" || status === "WAITING_FOR_SENTINEL" || status === "WAITING_FOR_HUMAN";
            const hasGitOperationFailure =
                typeof pState.last_action === "string" && pState.last_action.includes("Git operation failed");

            const swDestructiveOptions = [];
            const swSeen = new Set();
            if (swCoherence && swCoherence.issues) {
                for (const iss of swCoherence.issues) {
                    for (const o of iss.destructive_options || []) {
                        if (!swSeen.has(o)) {
                            swSeen.add(o);
                            swDestructiveOptions.push(o);
                        }
                    }
                }
            }

            return (
                <div
                    className="grid grid-rows-[auto_minmax(0,1fr)_auto] h-full overflow-hidden"
                    style={feedCollapsed ? {} : { gridTemplateRows: `auto 1fr ${feedHeight}px` }}
                >
                    {/* Header bar */}
                    <header className="bg-[#141618] border-b border-[#1a1d21] px-6 py-4 flex-shrink-0">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                {status !== "Loading..." && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (pathInteractive) {
                                                openProjectSwitch();
                                            } else if (pathCanOfferStop) {
                                                setPathStopDone(false);
                                                setPathStopErr("");
                                                setShowPathStopModal(true);
                                            }
                                        }}
                                        className="header-text text-xs text-slate-500 hover:text-[#00b4d8] transition-colors px-1.5 py-0.5 rounded border border-[#2a2d31] hover:border-[#00b4d8]/40"
                                        title="Change project directory"
                                    >
                                        Change
                                    </button>
                                )}
                                <span className="header-text text-sm text-slate-300 font-mono">{projectDisplay}</span>
                            </div>
                            <div className="flex flex-col items-end gap-1">
                                <div className="flex items-center gap-3 flex-wrap justify-end">
                                    {showResumeButton && (
                                        <button
                                            type="button"
                                            onClick={handleHeaderResume}
                                            disabled={resumeBusy}
                                            className="header-text px-3 py-1 text-xs bg-emerald-950 hover:bg-emerald-900 text-emerald-300 rounded border border-emerald-800 transition-colors disabled:opacity-50"
                                        >
                                            {resumeBusy ? "Resuming…" : "Resume"}
                                        </button>
                                    )}
                                    {showStopButton && !stopRequested && (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setStopError("");
                                                setStopHint("");
                                                setShowStopModal(true);
                                            }}
                                            className="header-text px-3 py-1 text-xs bg-[#1a1d21] hover:bg-[#1f2226] text-red-400 rounded border border-red-800 hover:border-red-700 transition-colors"
                                        >
                                            Stop Pipeline
                                        </button>
                                    )}
                                    {showStopButton && stopRequested && (
                                        <button
                                            type="button"
                                            disabled
                                            className="header-text px-3 py-1 text-xs bg-[#1a1d21] text-red-400 rounded border border-red-800 opacity-70 status-pulse cursor-not-allowed"
                                        >
                                            Stopping...
                                        </button>
                                    )}
                                    <span
                                        className={`header-text px-3 py-1 rounded-full text-sm font-medium ${statusClass}`}
                                        title={statusTitle || undefined}
                                    >
                                        {statusLabel}
                                    </span>
                                    {(pState.queue_length > 0) && (
                                        <button
                                            className={`header-text px-2 py-1 rounded text-xs ml-1 ${
                                                pState.queue_halted
                                                    ? 'bg-amber-600/20 text-amber-400 border border-amber-600/40'
                                                    : 'bg-[#1a1d21] text-slate-400 border border-[#2a2d31]'
                                            }`}
                                            onClick={() => setCurrentScreen('queue')}
                                        >
                                            {pState.queue_halted
                                                ? 'Queue: halted'
                                                : `Queue: ${((pState.queue_length || 0) - (pState.completed_count || 0))} waiting`}
                                        </button>
                                    )}
                                </div>
                                {resumeError ? (
                                    <div className="header-text text-xs text-red-400 max-w-md text-right space-y-1">
                                        <span className="block">{splitApiDetail(resumeError).friendly}</span>
                                        {splitApiDetail(resumeError).technical ? (
                                            <span className="block text-slate-500 font-mono text-[10px] leading-snug">
                                                {splitApiDetail(resumeError).technical}
                                            </span>
                                        ) : null}
                                    </div>
                                ) : null}
                                {stopError ? (
                                    <div className="header-text text-xs text-red-400 max-w-md text-right space-y-1">
                                        <span className="block">{splitApiDetail(stopError).friendly}</span>
                                        {splitApiDetail(stopError).technical ? (
                                            <span className="block text-slate-500 font-mono text-[10px] leading-snug">
                                                {splitApiDetail(stopError).technical}
                                            </span>
                                        ) : null}
                                    </div>
                                ) : null}
                                {stopHint ? (
                                    <span className="header-text text-xs text-amber-500 max-w-md text-right">
                                        {stopHint}
                                    </span>
                                ) : null}
                            </div>
                        </div>
                        {pathBroken || resumeSymlinkNotice ? (
                            <div className="border-t border-amber-800/50 bg-amber-950/20 px-6 py-2 space-y-2">
                                {pathBroken ? (
                                    <p className="header-text text-xs text-amber-200/90">{repairPathHintText}</p>
                                ) : null}
                                {resumeSymlinkNotice ? (
                                    <p className="header-text text-xs text-amber-200/90">{resumeSymlinkNotice}</p>
                                ) : null}
                            </div>
                        ) : null}
                        {hasGitOperationFailure ? (
                            <div className="border-t border-amber-800/50 bg-amber-950/20 px-6 py-2 flex items-center justify-between gap-3">
                                <p className="header-text text-xs text-amber-200/90">
                                    Git checkout failed. Open Recover to return the repo to the prefilled branch from
                                    this project (change it only if that branch is wrong).
                                </p>
                                <button
                                    type="button"
                                    title="Stashes local changes (including untracked files), checks out the branch you confirm below, then updates pipeline status. Does not run git reset."
                                    onClick={() => {
                                        setGitRecoverError("");
                                        const s = pState.git_recover_suggested_branch;
                                        const picked =
                                            s != null && String(s).trim() !== "" ? String(s).trim() : "main";
                                        setGitRecoverBranch(picked);
                                        setShowGitRecoverModal(true);
                                    }}
                                    className="header-text text-xs px-2.5 py-1 rounded border border-amber-700/70 text-amber-200 hover:text-white hover:border-amber-500 transition-colors"
                                >
                                    Recover Git
                                </button>
                            </div>
                        ) : null}
                        {showHeaderOrchestratorRecoveryBanner ? (
                            <div
                                className="mt-3 border border-amber-800/50 bg-amber-950/25 rounded-md px-5 sm:px-6 py-2.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
                                data-testid="pipeline-orchestrator-recovery-banner"
                            >
                                <p className="header-text text-xs text-amber-100/95 leading-snug flex-1 min-w-0 pr-1 sm:pr-2">
                                    The orchestrator process is not running. Restart it to apply escalation commands, resume polling, or continue from a stopped pipeline.
                                </p>
                                <div className="flex flex-col items-stretch sm:items-end sm:self-center gap-1 shrink-0 sm:min-w-[11rem]">
                                    <button
                                        type="button"
                                        onClick={handleRestartOrchestrator}
                                        disabled={orchRestartBusy}
                                        className="header-text px-2.5 py-1 text-xs rounded bg-cyan-950 hover:bg-cyan-900 text-cyan-200 border border-cyan-800 transition-colors disabled:opacity-50 whitespace-nowrap self-center sm:self-end"
                                    >
                                        {orchRestartBusy ? "Restarting…" : "Restart Orchestrator"}
                                    </button>
                                    {orchRestartError ? (
                                        <div className="header-text text-xs text-red-400 max-w-md text-right space-y-1">
                                            <span className="block">{splitApiDetail(orchRestartError).friendly}</span>
                                            {splitApiDetail(orchRestartError).technical ? (
                                                <span className="block text-slate-500 font-mono text-[10px] leading-snug">
                                                    {splitApiDetail(orchRestartError).technical}
                                                </span>
                                            ) : null}
                                        </div>
                                    ) : null}
                                </div>
                            </div>
                        ) : null}
                    </header>

                    {/* Middle section: two-panel grid (Phase 2a: 32/68 split) */}
                    <main className="grid grid-cols-1 md:grid-cols-[32%_68%] gap-4 p-4 overflow-hidden min-h-0">
                        {/* Left: Current Phase */}
                        <div className="bg-[#141618] rounded-lg border border-[#1a1d21] p-4 overflow-auto">
                            <h2 className="header-text text-lg font-semibold text-slate-300 mb-4">Current Phase</h2>
                            <CurrentPhasePanel
                                current_phase_raw_id={pState.current_phase_raw_id}
                                current_agent={pState.current_agent}
                                roadmap={roadmap}
                                planner_retries={pState.planner_retries}
                                executor_retries={pState.executor_retries}
                                reviewer_retries={pState.reviewer_retries}
                                last_action_timestamp={pState.last_action_timestamp}
                                sentinel_wait_started_at={pState.sentinel_wait_started_at}
                                orchestrator_alive={alive}
                                pipeline_status={status}
                                metricsSummary={metricsSummary}
                                escalation_resets={pState.escalation_resets || 0}
                                last_action={pState.last_action}
                                waiting_for_human_at={pState.waiting_for_human_at}
                                onResumeSent={fetchState}
                                onResumeOrchestratorResponse={applyResumeOrchestratorClientResult}
                                completionReport={completionReport}
                                onGenerateDocs={handleGenerateDocs}
                                generateDocsBusy={generateDocsBusy}
                                generateDocsError={generateDocsError}
                            />
                            {showRestartOrchestratorButton && (
                                <div
                                    className="border-2 border-orange-500 rounded-lg p-4 mt-4 bg-[#141618]/50"
                                    data-testid="pipeline-orchestrator-down-panel"
                                >
                                    <h3 className="header-text text-sm font-semibold text-orange-400 mb-1">
                                        Orchestrator stopped
                                    </h3>
                                    <p className="text-slate-300 text-xs mb-3 leading-relaxed">
                                        The orchestrator process exited while pipeline state still shows an in-flight run.
                                        Restart it to resume sentinel polling and agent work.
                                    </p>
                                    {Array.isArray(pState.orchestrator_spawn_log_tail) &&
                                    pState.orchestrator_spawn_log_tail.length > 0 ? (
                                        <pre
                                            className="text-xs text-slate-400 bg-black/30 border border-slate-700/50 rounded p-2 mb-3 overflow-auto max-h-24 font-mono whitespace-pre-wrap break-all"
                                            data-testid="pipeline-orchestrator-spawn-log-tail"
                                        >
                                            {pState.orchestrator_spawn_log_tail.join("\n")}
                                        </pre>
                                    ) : null}
                                    <button
                                        type="button"
                                        onClick={handleRestartOrchestrator}
                                        disabled={orchRestartBusy}
                                        className="header-text w-full px-3 py-2 text-xs rounded bg-cyan-950 hover:bg-cyan-900 text-cyan-200 border border-cyan-800 transition-colors disabled:opacity-50"
                                    >
                                        {orchRestartBusy ? "Restarting…" : "Restart Orchestrator"}
                                    </button>
                                    {orchRestartError ? (
                                        <div className="header-text text-xs text-red-400 mt-2 space-y-1">
                                            <span className="block">{splitApiDetail(orchRestartError).friendly}</span>
                                            {splitApiDetail(orchRestartError).technical ? (
                                                <span className="block text-slate-500 font-mono text-[10px] leading-snug">
                                                    {splitApiDetail(orchRestartError).technical}
                                                </span>
                                            ) : null}
                                        </div>
                                    ) : null}
                                </div>
                            )}
                            <EscalationCommandPanel
                                pipeline_status={status}
                                escalation_trigger_reason={pState.escalation_trigger_reason}
                                escalation_headline={pState.escalation_headline}
                                escalation_message={pState.escalation_message}
                                escalation_recommended_action={pState.escalation_recommended_action}
                                escalation_advisory_status={pState.escalation_advisory_status}
                                last_action={pState.last_action}
                                escalation_resets={pState.escalation_resets || 0}
                                nuclear_resets={pState.nuclear_resets || 0}
                                orchestrator_alive={alive}
                                onOrchestratorRestarted={fetchState}
                                onResumeOrchestratorResponse={applyResumeOrchestratorClientResult}
                                executor_output_exists={pState.executor_output_exists ?? true}
                                planner_output_exists={pState.planner_output_exists ?? true}
                                phase_branch_exists={pState.phase_branch_exists ?? true}
                                merge_probe_passed={pState.merge_probe_passed ?? false}
                                showOrchestratorLifecycle={true}
                                showCommandSentScreen={true}
                            />
                        </div>

                        {/* Right: Roadmap */}
                        <div className="right-panel bg-[#141618] rounded-lg border border-[#1a1d21] p-4 overflow-auto">
                            <h2 className="header-text text-lg font-semibold text-slate-300 mb-4">Roadmap</h2>
                            <RoadmapPanel
                                roadmap={roadmap}
                                metricsSummary={metricsSummary}
                                pipelineStatus={status}
                                completionReport={completionReport}
                                runStartedAt={pState.run_started_at || null}
                            />
                        </div>
                    </main>

                    {/* Activity Feed */}
                    <div className={`bg-[#141618] border-t border-[#1a1d21] px-4 pt-3 pb-2 flex flex-col ${feedCollapsed ? '' : 'min-h-0 overflow-hidden'}`}>
                        {/* Resize handle — drag up to expand feed, down to shrink */}
                        <div
                            data-testid="feed-resize-handle"
                            className="h-1 w-full cursor-row-resize bg-transparent hover:bg-blue-600/30 flex-shrink-0 -mt-3 mb-2"
                            onMouseDown={handleResizeMouseDown}
                        />
                        <div
                            className="flex items-center gap-2 cursor-pointer select-none mb-2 flex-shrink-0"
                            onClick={() => setFeedCollapsed(prev => !prev)}
                        >
                            <span className="text-slate-500 text-xs">{feedCollapsed ? '▸' : '▾'}</span>
                            <h2 className="header-text text-sm font-semibold text-slate-400">Activity Feed</h2>
                        </div>
                        {!feedCollapsed && (
                            <div className="flex-1 min-h-0 flex flex-col">
                                <ActivityFeedPanel roadmap={roadmap} />
                            </div>
                        )}
                    </div>

                    {/* Stop confirmation modal */}
                    {showStopModal && (
                        <StopConfirmModal
                            pipelineStatus={status}
                            onConfirm={handleStopConfirm}
                            onDismiss={() => setShowStopModal(false)}
                        />
                    )}

                    {showPathStopModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true">
                            <div className="bg-[#141618] border border-[#1a1d21] rounded-lg max-w-sm w-full p-5 space-y-3">
                                <h2 className="header-text text-base text-slate-200">Change project directory</h2>
                                {pathStopDone ? (
                                    <p className="text-sm text-slate-300">
                                        Stop confirmed — the pipeline will halt after the current agent completes. You can then change the project directory.
                                    </p>
                                ) : (
                                    <>
                                        <p className="text-sm text-slate-400">
                                            The pipeline must be stopped before changing the project directory.

        // ─── Root App with routing ────────────────────────────────────────────────

        function FirstRunScreen({ missingItems, onCheckAgain, onContinue, loading }) {
            const allClear = missingItems.length === 0;
            const itemLabels = {
                openclaw_root: "OpenClaw root directory (~/.openclaw) not found",
                openclaw_json: "openclaw.json missing from OpenClaw root",
                roadmap_converter_agent: "roadmap-converter agent not registered in openclaw.json",
                conversion_prompt: "PRD-to-roadmap conversion prompt file missing",
                exec_approvals_stale_paths: "Gate script paths in exec-approvals.json are stale — re-approve via OpenClaw UI",
            };
            const labelFor = (item) => {
                if (item.startsWith("workspace-")) {
                    return `Agent workspace missing: ${item}`;
                }
                if (item.startsWith("openclaw_agent_")) {
                    const slug = item.slice("openclaw_agent_".length).replace(/_/g, "-");
                    return `Agent "${slug}" not listed in openclaw.json (run install.sh step 8)`;
                }
                return itemLabels[item] || item;
            };
            return (
                <div className="flex h-screen items-center justify-center bg-[#0d0f12]">
                    <div className="max-w-xl w-full mx-4 space-y-6">
                        <div>
                            <h1 className="text-2xl font-semibold text-white header-text mb-1">
                                Welcome to AutoDev
                            </h1>
                            <p className="text-slate-400 text-sm">
                                Run the installer to configure your environment before using the pipeline.
                            </p>
                        </div>
                        <div className="bg-[#141618] border border-slate-700 rounded-lg p-4">
                            <p className="text-xs text-slate-500 uppercase tracking-wider mb-2">Run in your terminal</p>
                            <pre className="text-accent font-mono text-sm select-all">./install.sh</pre>
                        </div>
                        <div className="bg-[#141618] border border-slate-700 rounded-lg p-4 space-y-2">
                            <p className="text-xs text-slate-500 uppercase tracking-wider mb-3">Setup checklist</p>
                            {allClear ? (
                                <div className="flex items-center gap-2 text-green-400 text-sm">
                                    <span>✓</span>
                                    <span>All checks passed — ready to start</span>
                                </div>
                            ) : (
                                <ul className="space-y-1.5">
                                    {missingItems.map((item) => (
                                        <li key={item} className="flex items-start gap-2 text-amber-400 text-sm">
                                            <span className="mt-0.5 flex-shrink-0">⚠</span>
                                            <span>{labelFor(item)}</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div className="flex gap-3">
                            <button
                                onClick={onCheckAgain}
                                disabled={loading}
                                className="px-4 py-2 text-sm rounded border border-slate-600 text-slate-300 hover:border-slate-500 hover:text-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                            >
                                {loading ? "Checking…" : "Check again"}
                            </button>
                            <button
                                onClick={onContinue}
                                disabled={!allClear}
                                className="px-4 py-2 text-sm rounded bg-accent text-white hover:bg-blue-400 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                            >
                                Continue to AutoDev →

                        </div>
                    </div>
                </div>
            );

        const SETUP_DISMISSED_KEY = "autodev_first_run_dismissed";

        function App() {
            // If the user has already dismissed setup (or installer ran), skip straight to app.
            // This prevents the welcome screen from re-appearing on every refresh.
            const _alreadyDismissed = localStorage.getItem(SETUP_DISMISSED_KEY) === "true";

            const [setupComplete, setSetupComplete] = useState(_alreadyDismissed ? true : null);
            const [setupMissing, setSetupMissing] = useState([]);
            const [setupChecking, setSetupChecking] = useState(false);

            // Persist dismissal so it survives refresh
            const _markDismissed = () => localStorage.setItem(SETUP_DISMISSED_KEY, "true");

            const checkSetupStatus = () => {
                setSetupChecking(true);
                fetch("/api/setup/status")
                    .then((r) => r.json())
                    .then((d) => {
                        setSetupMissing(d.missing_items || []);
                        setSetupChecking(false);
                        if (d.setup_complete) { _markDismissed(); setSetupComplete(true); }
                    })
                    .catch(() => setSetupChecking(false));
            };

            useEffect(() => {
                if (_alreadyDismissed) return;  // already dismissed — skip the fetch
                fetch("/api/state")
                    .then((r) => r.json())
                    .then((d) => {
                        if (d.setup_complete === true) _markDismissed();
                        setSetupComplete(d.setup_complete === true);
                    })
                    .catch(() => setSetupComplete(true));  // fail open: don't block on API error
            }, []);

            useEffect(() => {
                if (setupComplete === false) checkSetupStatus();
            }, [setupComplete]);

            const [currentScreen, setCurrentScreen] = useState("pipeline");
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const currentScreenRef = useRef(currentScreen);
            const coldBootstrapScreenAppliedRef = useRef(false);
            useEffect(() => {
                currentScreenRef.current = currentScreen;
            }, [currentScreen]);

            useEffect(() => {
                if (setupComplete !== true) return;
                if (coldBootstrapScreenAppliedRef.current) return;
                let cancelled = false;
                Promise.all([
                    fetch("/api/state").then((r) => r.json()),
                    fetch("/api/queue")
                        .then((r) => r.json())
                        .catch(() => ({ queue: [] })),
                ])
                    .then(([st, qu]) => {
                        if (cancelled) return;
                        if (coldBootstrapScreenAppliedRef.current) return;
                        if (currentScreenRef.current !== "pipeline") return;
                        const queue = qu.queue || [];
                        const ps = st.pipeline_status || "";
                        if (!shouldOpenIdeasOnColdBootstrap(ps, queue)) return;
                        setCurrentScreen("ideas");
                        coldBootstrapScreenAppliedRef.current = true;
                    })
                    .catch(() => {});
                return () => {
                    cancelled = true;
                };
            }, [setupComplete]);

            const [, setUnsavedQueueOrderState] = useState(false);
            /** Synced on every setter call so safeNavigate can read latest without waiting for re-render. */
            const unsavedQueueOrderRef = useRef(false);
            const setUnsavedQueueOrder = useCallback((value) => {
                const next = !!value;
                unsavedQueueOrderRef.current = next;
                setUnsavedQueueOrderState(next);
            }, []);
            const [pipelineStatus, setPipelineStatus] = useState('');
            const [seedRoadmap, setSeedRoadmap] = useState("");
            const [repoPath, setRepoPath] = useState("");
            const [repoPathLocked, setRepoPathLocked] = useState(false);
            const [roadmapSeed, setRoadmapSeed] = useState("");
            /** PRD text from Project Ideas, passed to preflight + launch when non-empty. */
            const [launchPrdContent, setLaunchPrdContent] = useState("");
            /** verification.md text from Project Ideas, passed to preflight + launch when non-empty (Stage C). */
            const [launchVerificationContent, setLaunchVerificationContent] = useState("");
            /** P0 Stage J.4 — idea metadata carried in from navigateToPreflightWithSeed.
             * Drives the Step-2 summary-card heading and the Open-in-Project-Ideas link.
             * Cleared by handleNavigate('preflight') so a fresh Setup entry shows the
             * empty-state CTA. */
            const [launchIdeaName, setLaunchIdeaName] = useState("");
            const [launchIdeaId, setLaunchIdeaId] = useState(null);
            const [repoPathError, setRepoPathError] = useState("");
            const [preflightChecks, setPreflightChecks] = useState(null);
            /** When set, preflight found multiple *oadmap*.md — launch blocked until user confirms archive. */
            const [preflightRoadmapAmbiguous, setPreflightRoadmapAmbiguous] = useState(null);
            const [preflightLastRun, setPreflightLastRun] = useState(null);
            const [launchError, setLaunchError] = useState("");
            const [launchLoading, setLaunchLoading] = useState(false);
            const [addToQueueBusy, setAddToQueueBusy] = useState(false);
            const [addToQueueError, setAddToQueueError] = useState("");
            const [preflightQueueActive, setPreflightQueueActive] = useState(false);
            /** null | "exists" | "parent" | "bad" — from filesystem check on server (debounced). */
            const [repoPathFsStatus, setRepoPathFsStatus] = useState(null);
            const [showCreateFolderPrompt, setShowCreateFolderPrompt] = useState(false);
            const [createFolderError, setCreateFolderError] = useState("");
            const repoPathValidateTimerRef = useRef(null);
            const [recentProjects, setRecentProjects] = useState([]);
            const onOpenInIdeas = useCallback((ideaId) => {
                if (ideaId) {
                    try {
                        sessionStorage.setItem("autodev:lastIdeaId", ideaId);
                    } catch (_e) { /* sessionStorage unavailable — IdeasScreen falls back to its own selection */ }
                }
                setCurrentScreen("ideas");
            }, [setCurrentScreen]);

            useEffect(() => {
                if (currentScreen !== "preflight") return;
                fetch("/api/setup/recent-projects")
                    .then((r) => r.json())
                    .then((d) => setRecentProjects(Array.isArray(d.projects) ? d.projects : []))
                    .catch(() => setRecentProjects([]));
            }, [currentScreen]);

            /* P0 Stage J.4 — extended to also carry the linked Idea's
             * name + id so the Setup-screen Step 2 summary card can
             * render the heading + the Open-in-Project-Ideas back-link.
             * Older callers passing only the trio still work; the extra
             * args default to empty/null and the card falls back to a
             * generic label. */
            const navigateToPreflightWithSeed = (content, prdText, verificationText, ideaName, ideaId) => {
                const text = content || "";
                setSeedRoadmap(text);
                setRoadmapSeed(text);
                setLaunchPrdContent(typeof prdText === "string" ? prdText : "");
                setLaunchVerificationContent(typeof verificationText === "string" ? verificationText : "");
                setLaunchIdeaName(typeof ideaName === "string" ? ideaName : "");
                setLaunchIdeaId(typeof ideaId === "string" && ideaId ? ideaId : null);
                setCurrentScreen("preflight");
            };

            const handleNavigate = (screen) => {
                if (screen === "preflight") {
                    setSeedRoadmap("");
                    setRoadmapSeed("");
                    setLaunchPrdContent("");
                    setLaunchVerificationContent("");
                    setLaunchIdeaName("");
                    setLaunchIdeaId(null);
                    setRepoPathError("");
                    setPreflightChecks(null);
                    setPreflightRoadmapAmbiguous(null);
                    setPreflightLastRun(null);
                    setLaunchError("");
                    setRepoPathFsStatus(null);
                    setShowCreateFolderPrompt(false);
                    setCreateFolderError("");
                }
                setCurrentScreen(screen);
            };

            const safeNavigate = (screen) => {
                if (currentScreen === "queue" && unsavedQueueOrderRef.current && screen !== "queue") {
                    if (!window.confirm("You have unsaved queue order changes. Leave without saving?")) {
                        return;
                    }
                    setUnsavedQueueOrder(false);
                }
                handleNavigate(screen);
            };

            const handleRepoPathChange = (value) => {
                setRepoPath(value);
                setRepoPathError("");
                setShowCreateFolderPrompt(false);
                setCreateFolderError("");
                const trimmed = (value || "").trim();
                if (repoPathValidateTimerRef.current) {
                    clearTimeout(repoPathValidateTimerRef.current);
                }
                if (!trimmed) {
                    setRepoPathFsStatus(null);
                    return;
                }
                setRepoPathFsStatus(null);
                repoPathValidateTimerRef.current = setTimeout(() => {
                    fetch("/api/setup/validate-repo-path", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ path: trimmed }),
                    })
                        .then((r) => r.json())
                        .then((d) => {
                            if (!d.valid) {
                                setRepoPathFsStatus("bad");
                                return;
                            }
                            return fetch("/api/setup/check-repo-path", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ path: trimmed }),
                            }).then(async (r2) => {
                                const j = await r2.json().catch(() => ({}));
                                if (!r2.ok) {
                                    setRepoPathFsStatus("bad");
                                    return;
                                }
                                if (j.exists) setRepoPathFsStatus("exists");
                                else if (j.parent_exists) setRepoPathFsStatus("parent");
                                else setRepoPathFsStatus("bad");
                            });
                        })
                        .catch(() => setRepoPathFsStatus("bad"));
                }, 500);
            };

            const onRepoPathConfirm = () => {
                setRepoPathError("");
                setCreateFolderError("");
                setShowCreateFolderPrompt(false);
                const path = (repoPath || "").trim();
                fetch("/api/setup/validate-repo-path", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const detail = d.detail;
                            const msg = Array.isArray(detail)
                                ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                : detail || d.message || `Request failed (${r.status})`;
                            setRepoPathError(String(msg));
                            return null;
                        }
                        if (!d.valid) {
                            setRepoPathError(d.error || "Path validation failed");
                            return null;
                        }
                        return fetch("/api/setup/check-repo-path", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ path }),
                        }).then(async (r2) => {
                            const check = await r2.json().catch(() => ({}));
                            if (!r2.ok) {
                                const detail = check.detail;
                                const msg = Array.isArray(detail)
                                    ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                    : detail || check.message || `Request failed (${r2.status})`;
                                setRepoPathError(String(msg));
                                return null;
                            }
                            return check;
                        });
                    })
                    .then((check) => {
                        if (!check) return;
                        if (check.exists) {
                            setRepoPathLocked(true);
                            setRepoPath(path);
                            /* P0 Stage J.4 — the on-disk auto-load (formerly
                             * fetching /api/setup/repo-roadmap-hint to
                             * prepopulate the Step 2 textarea) was removed.
                             * The Setup screen no longer ingests free-text
                             * roadmap content; the only path for Step 2
                             * to populate is navigateToPreflightWithSeed
                             * from Project Ideas. */
                        } else if (check.parent_exists) {
                            setShowCreateFolderPrompt(true);
                        } else {
                            setRepoPathError(
                                "Path does not exist and the parent directory is not reachable. " +
                                    "Use an absolute path starting with / (e.g. /path/to/your-project/my-app). " +
                                    "If the path is correct, the server must be able to access it (home dirs are often mode 700 — run the UI server as the same user)."
                            );
                        }
                    })
                    .catch((e) => setRepoPathError(String(e.message || "Request failed")));
            };

            const onCreateRepoDir = () => {
                const path = (repoPath || "").trim();
                setCreateFolderError("");
                fetch("/api/setup/create-repo-dir", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path }),
                })
                    .then((r) => r.json())
                    .then((d) => {
                        if (d.ok) {
                            setRepoPathLocked(true);
                            setRepoPath(path);
                            setShowCreateFolderPrompt(false);
                        } else {
                            setCreateFolderError(d.error || "Failed to create directory");
                        }
                    })
                    .catch((e) => setCreateFolderError(String(e)));
            };

            const onCancelCreateFolder = () => {
                setShowCreateFolderPrompt(false);
            };

            const onRunPreflight = (confirmRoadmapArchive) => {
                const archiveMeta = confirmRoadmapArchive ? preflightRoadmapAmbiguous : null;
                if (!confirmRoadmapArchive) {
                    setPreflightRoadmapAmbiguous(null);
                }
                setPreflightChecks(null);
                const body = { repo_path: (repoPath || "").trim() };
                if ((roadmapSeed || "").trim()) {
                    body.roadmap_seed = roadmapSeed;
                }
                if ((launchPrdContent || "").trim()) {
                    body.prd_content = launchPrdContent;
                }
                if ((launchVerificationContent || "").trim()) {
                    body.verification_content = launchVerificationContent;
                }
                if (confirmRoadmapArchive && archiveMeta) {
                    body.confirm_roadmap_archive = true;
                    body.keep_filename = archiveMeta.recommended_keep;
                }
                fetch("/api/setup/preflight", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setPreflightLastRun(new Date());
                        if (!r.ok) {
                            const detail = d.detail;
                            const msg = Array.isArray(detail)
                                ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                : detail || d.message || `Request failed (${r.status})`;
                            setPreflightChecks([
                                { check: "preflight", status: "fail", message: String(msg) },
                            ]);
                            return;
                        }
                        if (d.roadmap_ambiguous) {
                            setPreflightRoadmapAmbiguous({
                                roadmap_files: d.roadmap_files || [],
                                recommended_keep: d.recommended_keep || "roadmap.md",
                            });
                        } else {
                            setPreflightRoadmapAmbiguous(null);
                        }
                        setPreflightChecks(d.checks || []);
                    })
                    .catch(() => {
                        setPreflightLastRun(new Date());
                        setPreflightChecks([
                            { check: "preflight", status: "fail", message: "Request failed" },
                        ]);
                    });
            };

            const hasFail = preflightChecks && preflightChecks.some((c) => c.status === "fail");
            const launchDisabled =
                !repoPathLocked ||
                !(roadmapSeed && roadmapSeed.trim()) ||
                !preflightChecks ||
                hasFail ||
                !!preflightRoadmapAmbiguous ||
                launchLoading;

            // Check for active queue entry when preflight screen is open
            useEffect(() => {
                if (currentScreen !== 'preflight') return;
                fetch('/api/queue')
                    .then(r => r.json())
                    .then(d => setPreflightQueueActive(queueEntriesHaveBusyLivePipeline(d.queue)))
                    .catch(() => {});
            }, [currentScreen]);

            const onLaunch = async (completionReview = false) => {
                setLaunchError("");
                setLaunchLoading(true);
                try {
                    // Check if there is an active queue entry
                    const qr = await fetch('/api/queue').then(r => r.json()).catch(() => ({queue: []}));
                    const qActive = (qr.queue || []).find(e => e.state === 'ACTIVE');
                    setPreflightQueueActive(queueEntriesHaveBusyLivePipeline(qr.queue));

                    if (qActive) {
                        // Insert at top of queue — add then move to position 1
                        const addR = await fetch('/api/queue/add', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({project_path: repoPath, completion_review: completionReview}),
                        });
                        const addD = await addR.json().catch(() => ({}));
                        if (!addR.ok) {
                            setLaunchError(
                                addD.validation_errors ? addD.validation_errors.map(e => e.message || e.check).join('; ')
                                : addD.detail || 'Failed to add to queue'
                            );
                            return;
                        }
                        // Move to position 1 so it runs next
                        await fetch(`/api/queue/${addD.id}/position`, {
                            method: 'PATCH',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({position: 1}),
                        }).catch(() => {});
                        setCurrentScreen('queue');
                        return;
                    }

                    const launchBody = { repo_path: repoPath, roadmap_seed: roadmapSeed };
                    if ((launchPrdContent || "").trim()) {
                        launchBody.prd_content = launchPrdContent;
                    }
                    if ((launchVerificationContent || "").trim()) {
                        launchBody.verification_content = launchVerificationContent;
                    }
                    launchBody.completion_review = completionReview;
                    const r = await fetch("/api/setup/launch", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(launchBody),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (r.status === 409 && d.code === "orchestrator_running") {
                        setLaunchError(d.error || "An orchestrator is already running. Stop it or wait before launching.");
                        return;
                    }
                    if (d.ok) setCurrentScreen("pipeline");
                    else setLaunchError(d.error || "Launch failed");
                } catch (e) {
                    setLaunchError(String(e));
                } finally {
                    setLaunchLoading(false);
                }
            };

            const onAddToQueue = async (completionReview = false) => {
                setAddToQueueError('');
                setAddToQueueBusy(true);
                try {
                    const r = await fetch('/api/queue/add', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({project_path: repoPath, completion_review: completionReview}),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        setAddToQueueError(
                            d.validation_errors ? d.validation_errors.map(e => e.message || e.check).join('; ')
                            : d.detail || 'Failed to add to queue'
                        );
                        return;
                    }
                    // Auto-trigger if queue is in auto mode and this is the only ready entry
                    const qr = await fetch('/api/queue').then(r => r.json()).catch(() => ({}));
                    const entries = qr.queue || [];
                    const isAuto = qr.queue_mode === 'auto';
                    const hasActive = entries.some(e => e.state === 'ACTIVE');
                    const readyCount = entries.filter(e => ['READY','SKIPPED_PENDING'].includes(e.state)).length;
                    if (isAuto && !hasActive && readyCount === 1) {
                        await fetch('/api/queue/trigger-next', {method: 'POST'}).catch(() => {});
                    }
                    setCurrentScreen('queue');
                } finally {
                    setAddToQueueBusy(false);
                }
            };

            const appCtxValue = {
                navigateToPreflightWithSeed,
                setSeedRoadmap,
                setCurrentScreen,
                currentScreen,
                safeNavigate,
                setUnsavedQueueOrder,
                pipelineStatus,
                setPipelineStatus,
                sidebarCollapsed,
                setSidebarCollapsed,
            };

            if (setupComplete === null) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#0d0f12]">
                        <span className="text-slate-500 text-sm font-mono">Loading…</span>
                    </div>
                );
            }
            if (setupComplete === false) {
                return (
                    <FirstRunScreen
                        missingItems={setupMissing}
                        loading={setupChecking}
                        onCheckAgain={checkSetupStatus}
                        onContinue={() => { _markDismissed(); setSetupComplete(true); }}
                    />
                );
            }

            return (
                <AppCtx.Provider value={appCtxValue}>
                    <div className="flex h-screen overflow-hidden bg-[#0d0f12]">
                        {currentScreen !== "ideas" && (
                        <Sidebar
                            currentScreen={currentScreen}
                            onNavigate={safeNavigate}
                            sidebarCollapsed={sidebarCollapsed}
                            setSidebarCollapsed={setSidebarCollapsed}
                        />
                        )}
                        <div className="flex-1 flex flex-col overflow-hidden">
                            {currentScreen === "pipeline" && <PipelineScreen />}
                            {currentScreen === "queue" && <QueueScreen />}
                            {currentScreen === "preflight" && (
                                <PreflightScreen
                                    seedRoadmap={seedRoadmap}
                                    repoPath={repoPath}
                                    repoPathLocked={repoPathLocked}
                                    roadmapSeed={roadmapSeed}
                                    launchPrdContent={launchPrdContent}
                                    launchVerificationContent={launchVerificationContent}
                                    linkedIdeaName={launchIdeaName}
                                    linkedIdeaId={launchIdeaId}
                                    onOpenInIdeas={onOpenInIdeas}
                                    onRepoPathChange={handleRepoPathChange}
                                    onRepoPathLockToggle={() => {
                                        setRepoPathLocked(false);
                                        setRepoPathFsStatus(null);
                                    }}
                                    onBack={() => setCurrentScreen("ideas")}
                                    repoPathError={repoPathError}
                                    onRepoPathConfirm={onRepoPathConfirm}
                                    onRunPreflight={() => onRunPreflight(false)}
                                    onConfirmRoadmapArchive={() => onRunPreflight(true)}
                                    preflightRoadmapAmbiguous={preflightRoadmapAmbiguous}
                                    preflightChecks={preflightChecks}
                                    onLaunch={onLaunch}
                                    launchError={launchError}
                                    launchDisabled={launchDisabled}
                                    launchLoading={launchLoading}
                                    onAddToQueue={onAddToQueue}
                                    addToQueueBusy={addToQueueBusy}
                                    addToQueueError={addToQueueError}
                                    hasActiveProject={preflightQueueActive}
                                    recentProjects={recentProjects}
                                    repoPathFsStatus={repoPathFsStatus}
                                    showCreateFolderPrompt={showCreateFolderPrompt}
                                    createFolderError={createFolderError}
                                    onCreateRepoDir={onCreateRepoDir}
                                    onCancelCreateFolder={onCancelCreateFolder}
                                    preflightLastRun={preflightLastRun}
                                    hasFail={hasFail}
                                />
                            )}
                            {currentScreen === "ideas" && <IdeasScreen />}
                        </div>
                    </div>
                </AppCtx.Provider>
            );
        }

        ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);
    </script>
</body>
</html>

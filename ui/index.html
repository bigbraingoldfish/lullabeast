                                            <button
                                                type="button"
                                                onClick={() => setRoadmapInputMode("paste")}
                                                className={`header-text text-xs px-3 py-1.5 rounded border ${
                                                    roadmapInputMode === "paste"
                                                        ? "border-[#00b4d8] text-[#00b4d8] bg-[#00b4d8]/10"
                                                        : "border-[#1a1d21] text-slate-400 hover:border-slate-600"
                                                }`}
                                            >
                                                Paste content
                                            </button>
                                        </div>
                                    ) : null}
                                    {seedRoadmap || roadmapInputMode === "paste" ? (
                                        <textarea
                                            value={roadmapSeed}
                                            onChange={(e) => onRoadmapSeedChange(e.target.value)}
                                            placeholder="Paste roadmap markdown…"
                                            className="w-full min-h-[120px] rounded border border-[#1a1d21] px-3 py-2 text-sm bg-[#1a1d21] text-slate-200"
                                        />
                                    ) : (
                                        <div className="space-y-2">
                                            <input
                                                ref={roadmapSeedFileRef}
                                                type="file"
                                                accept=".md"
                                                className="hidden"
                                                onChange={(e) => {
                                                    const file = e.target.files && e.target.files[0];
                                                    if (!file) return;
                                                    setRoadmapSeedFileName(file.name);
                                                    const reader = new FileReader();
                                                    reader.onload = () => onRoadmapSeedChange(String(reader.result || ""));
                                                    reader.readAsText(file);
                                                    e.target.value = "";
                                                }}
                                            />
                                            <button
                                                type="button"
                                                onClick={() => roadmapSeedFileRef.current && roadmapSeedFileRef.current.click()}
                                                className="header-text w-full sm:w-auto text-sm px-4 py-2 rounded bg-[#1a1d21] text-[#00b4d8] border border-[#00b4d8]/40 hover:border-[#00b4d8]/70"
                                            >
                                                Upload .md file
                                            </button>
                                            {roadmapSeedFileName ? (
                                                <p className="text-[11px] text-slate-500 truncate">{roadmapSeedFileName}</p>
                                            ) : null}
                                        </div>
                                    )}
                                </div>
                            )}
                            {roadmapSeedError && roadmapSeedError.length > 0 && (
                                <ul className="text-red-400 text-xs space-y-1">
                                    {roadmapSeedError.map((er, i) => (
                                        <li key={i}>Line {er.line}: {er.message}</li>
                                    ))}
                                </ul>
                            )}
                            <div className="flex gap-2 items-center">
                                {!roadmapSeedLocked ? (
                                    <button type="button" onClick={onRoadmapSeedConfirm} className="header-text text-sm px-3 py-1 rounded bg-[#00b4d8] text-[#0d0f12] font-medium">
                                        Confirm
                                    </button>
                                ) : (
                                    <>
                                        <span className="text-emerald-500">✓</span>
                                        <button type="button" onClick={onRoadmapSeedLockToggle} className="header-text text-xs text-slate-500 hover:text-slate-300">
                                            Edit
                                        </button>
                                    </>
                                )}
                            </div>
                            <p className="text-[11px] text-slate-500 leading-relaxed max-w-prose">
                                Locking checks roadmap format only, not content quality. Run Preflight may write{" "}
                                <span className="font-mono text-slate-400">roadmap.md</span> and{" "}
                                <span className="font-mono text-slate-400">prd.md</span> (from Project Ideas) into the repository path and initialize git there. Launch adds pipeline scaffolding and sets the active project symlink.
                            </p>
                        </div>
                        {preflightRoadmapAmbiguous && (
                            <div className="rounded border border-amber-600/80 bg-amber-950/40 px-3 py-3 text-sm text-amber-100 space-y-2">
                                <p>
                                    Multiple roadmap files found:{" "}
                                    <span className="font-mono text-xs">
                                        {(preflightRoadmapAmbiguous.roadmap_files || []).join(", ")}
                                    </span>
                                    . Keep <span className="font-mono">{preflightRoadmapAmbiguous.recommended_keep}</span>{" "}
                                    and move the rest into <span className="font-mono">autodev_archive/</span>.
                                </p>
                                <button
                                    type="button"
                                    onClick={onConfirmRoadmapArchive}
                                    disabled={!repoPathLocked || !roadmapSeedLocked}
                                    className="header-text text-xs px-3 py-1.5 rounded bg-amber-900/60 border border-amber-600 text-amber-50 disabled:opacity-40"
                                >
                                    Archive extras &amp; continue preflight
                                </button>
                            </div>
                        )}
                        <div className="flex gap-3 flex-wrap items-start">
                            <div className="flex flex-col gap-1">
                                <button
                                    type="button"
                                    onClick={onRunPreflight}
                                    disabled={!repoPathLocked || !roadmapSeedLocked}
                                    className={`header-text text-sm px-4 py-2 rounded bg-[#1a1d21] text-slate-200 border border-[#1a1d21] disabled:opacity-40 ${hasFail ? "status-pulse" : ""}`}
                                >
                                    {preflightBtnLabel}
                                </button>
                                {preflightLastRun ? (
                                    <span className="text-[11px] text-slate-600 pl-0.5">
                                        Last run: {relativeTimeShort(preflightLastRun)}
                                    </span>
                                ) : null}
                            </div>
                            <button type="button" onClick={onLaunch} disabled={launchDisabled} className="header-text text-sm px-4 py-2 rounded bg-[#00b4d8] text-[#0d0f12] font-medium disabled:bg-[#2a2d31] disabled:text-slate-600 disabled:cursor-not-allowed">
                                Launch
                            </button>
                            <button type="button" onClick={onBack} className="header-text text-sm px-4 py-2 rounded border border-[#1a1d21] text-slate-400">
                                Back
                            </button>
                        </div>
                        {launchError && <p className="text-red-400 text-sm whitespace-pre-wrap">{launchError}</p>}
                        {preflightChecks && preflightChecks.length > 0 && (
                            <ul className="space-y-2 text-sm">
                                {preflightChecks.map((c, i) => (
                                    <li key={i} className={`flex gap-2 ${c.status === "fail" ? "text-red-400" : c.status === "warn" ? "text-amber-400" : c.status === "fixed" ? "text-[#00b4d8]" : "text-emerald-400"}`}>
                                        <span className="font-mono text-xs">[{c.status}]</span>
                                        <span>{c.check}: {c.message}</span>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>
                </div>
            );
        }

        function PipelineScreen() {
            const [pState, setPState] = useState({
                pipeline_status: 'Loading...',
                orchestrator_alive: true,
                current_agent: null,
                project_path: null,
                current_phase_raw_id: '',
                planner_retries: null,
                executor_retries: null,
                reviewer_retries: null,
                last_error_code: null,
                last_action_timestamp: null,
                skill_injected: null,
                skill_agent: null,
                escalation_trigger_reason: null,
                last_action: null,
                escalation_resets: 0,
                project_dir_ok: true,
                project_dir_message: null,
            });
            const [roadmap, setRoadmap] = useState(null);
            const [metricsSummary, setMetricsSummary] = useState(null);
            const [lastUpdate, setLastUpdate] = useState(null);
            const [showStopModal, setShowStopModal] = useState(false);
            const [stopRequested, setStopRequested] = useState(false);
            const [stopError, setStopError] = useState("");
            const [stopHint, setStopHint] = useState("");
            const [resumeBusy, setResumeBusy] = useState(false);
            const [resumeError, setResumeError] = useState("");
            const [projectSwitchOpen, setProjectSwitchOpen] = useState(false);
            const [swPath, setSwPath] = useState("");
            const [swRecents, setSwRecents] = useState([]);
            const [swBusy, setSwBusy] = useState(false);
            const [swErr, setSwErr] = useState("");
            const [swChecks, setSwChecks] = useState(null);
            const [swCoherence, setSwCoherence] = useState(null);
            const [swReady, setSwReady] = useState(false);
            const [swRoadmapAmbiguous, setSwRoadmapAmbiguous] = useState(null);
            const [swDestructiveSelected, setSwDestructiveSelected] = useState([]);
            const swPendingRef = useRef({});

            useEffect(() => {
                fetchState();
                fetchRoadmap();
                fetchMetricsSummary();
                const stateInterval = setInterval(fetchState, 3000);
                const roadmapInterval = setInterval(fetchRoadmap, 3000);
                return () => {
                    clearInterval(stateInterval);
                    clearInterval(roadmapInterval);
                };
            }, []);

            // Clear stop-requested indicator once pipeline leaves stoppable state
            useEffect(() => {
                const stoppable = ["RUNNING", "WAITING_FOR_SENTINEL", "WAITING_FOR_HUMAN"];
                if (!stoppable.includes(pState.pipeline_status)) {
                    setStopRequested(false);
                }
            }, [pState.pipeline_status]);

            useEffect(() => {
                if (!projectSwitchOpen) return;
                fetch("/api/setup/recent-projects")
                    .then((r) => r.json())
                    .then((d) => setSwRecents(Array.isArray(d.projects) ? d.projects : []))
                    .catch(() => setSwRecents([]));
            }, [projectSwitchOpen]);

            function openProjectSwitch() {
                swPendingRef.current = {};
                setSwErr("");
                setSwChecks(null);
                setSwCoherence(null);
                setSwReady(false);
                setSwRoadmapAmbiguous(null);
                setSwDestructiveSelected([]);
                setSwPath(pState.project_path || "");
                setProjectSwitchOpen(true);
            }

            function closeProjectSwitch() {
                setProjectSwitchOpen(false);
                swPendingRef.current = {};
            }

            function postSwitchProject(body) {
                setSwBusy(true);
                setSwErr("");
                fetch("/api/setup/switch-project", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setSwBusy(false);
                        if (r.status === 409) {
                            const msg =
                                typeof d.detail === "string"
                                    ? d.detail
                                    : d.error || "Stop the pipeline before switching project.";
                            setSwErr(msg);
                            return;
                        }
                        if (d.destructive_error) {
                            setSwErr(String(d.destructive_error));
                            return;
                        }
                        if (d.roadmap_ambiguous) {
                            setSwRoadmapAmbiguous(d);
                            setSwCoherence(null);
                            setSwReady(false);
                            setSwChecks(d.checks || null);
                            return;
                        }
                        setSwRoadmapAmbiguous(null);
                        setSwChecks(d.checks || null);
                        setSwCoherence(d.coherence || null);
                        if (d.ok && d.started) {
                            closeProjectSwitch();
                            fetchState();
                            fetchRoadmap();
                            fetchMetricsSummary();
                            return;
                        }
                        if (d.ok && d.ready_to_start) {
                            const n = { ...swPendingRef.current };
                            if (body.confirm_roadmap_archive) {
                                n.confirm_roadmap_archive = true;
                                if (body.keep_filename) n.keep_filename = body.keep_filename;
                            }
                            if (body.confirm_destructive) {
                                n.confirm_destructive = body.confirm_destructive;
                            }
                            swPendingRef.current = n;
                            setSwReady(true);
                            return;
                        }
                        if (!d.ok && d.coherence && d.coherence.ok === false) {
                            setSwReady(false);
                            const opts = [];
                            const seen = new Set();
                            for (const iss of d.coherence.issues || []) {
                                for (const o of iss.destructive_options || []) {
                                    if (!seen.has(o)) {
                                        seen.add(o);
                                        opts.push(o);
                                    }
                                }
                            }
                            if (opts.length === 0) {
                                const iss0 = (d.coherence.issues || [])[0];
                                setSwErr(
                                    iss0
                                        ? `${iss0.kind}: ${iss0.detail}`
                                        : "Coherence check failed (no automatic fix available)."
                                );
                                return;
                            }
                            setSwDestructiveSelected(opts);
                            return;
                        }
                        setSwErr(d.error || "Switch project failed");
                    })
                    .catch((e) => {
                        setSwBusy(false);
                        setSwErr(String(e));
                    });
            }

            function fetchState() {
                fetch('/api/state')
                    .then(res => res.json())
                    .then(data => {
                        setPState(prev => ({ ...prev, ...data }));
                        setLastUpdate(new Date().toLocaleTimeString());
                    })
                    .catch(() => {});
            }

            function fetchRoadmap() {
                fetch('/api/roadmap')
                    .then(res => res.json())
                    .then(data => {
                        // Only update if data actually changed to avoid unnecessary re-renders
                        setRoadmap(prev => {
                            return JSON.stringify(prev) === JSON.stringify(data) ? prev : data;
                        });
                    })
                    .catch(() => {});
            }

            function fetchMetricsSummary() {
                fetch('/api/metrics-summary')
                    .then(res => res.json())
                    .then(data => { setMetricsSummary(data); })
                    .catch(() => {});
            }

            const handleStopConfirm = async () => {
                setStopError("");
                setStopHint("");
                setShowStopModal(false);
                try {
                    const r = await fetch("/api/stop", { method: "POST" });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        const msg =
                            typeof d.detail === "string"
                                ? d.detail
                                : d.message || `Stop failed (${r.status})`;
                        setStopError(msg);
                        return;
                    }
                    setStopRequested(true);
                    if (typeof d.hint === "string" && d.hint) setStopHint(d.hint);
                } catch (e) {
                    setStopError(String(e));
                }
            };

            const handleHeaderResume = async () => {
                setResumeError("");
                setResumeBusy(true);
                try {
                    const result = await runStoppedResumeFlow("RETRY");
                    if (!result.ok) {
                        setResumeError(result.error);
                        return;
                    }
                    fetchState();
                } catch (e) {
                    setResumeError(String(e));
                } finally {
                    setResumeBusy(false);
                }
            };

            const handleRefresh = () => {
                fetchState();
                fetchRoadmap();
                fetchMetricsSummary();
            };

            const status = pState.pipeline_status;
            const alive = pState.orchestrator_alive;
            const showStopButton = ["RUNNING", "WAITING_FOR_SENTINEL", "WAITING_FOR_HUMAN"].includes(
                status
            );
            const showResumeButton = status === "STOPPED";

            // Derive header status label and class
            let statusLabel = '--';
            let statusClass = 'bg-[#1a1d21] text-slate-300';
            if (!alive && (status === 'RUNNING' || status === 'WAITING_FOR_SENTINEL')) {
                statusLabel = 'ORCHESTRATOR DOWN';
                statusClass = 'bg-red-600 text-white';
            } else if (status in STATE_LABELS) {
                statusLabel = STATE_LABELS[status];
                if (status === 'WAITING_FOR_SENTINEL' && pState.current_agent) {
                    statusLabel = `WAITING — ${pState.current_agent}`;
                }
                statusClass = STATE_CLASSES[status] || 'bg-[#1a1d21] text-slate-300';
            }

            const segments = (pState.project_path || '').split('/').filter(s => s);
            const projectDisplay = segments.slice(-2).join('/') || '--/--';
            const pathBroken = pState.project_dir_ok === false;
            const pathInteractive =
                status === "STOPPED" || status === "UNKNOWN" || pathBroken;
            const repairPathHintText =
                pState.project_dir_message ||
                "Project folder link is broken — click the path to choose your project folder and repair it.";
            const showMustStopForPath =
                !pathInteractive && (status === "RUNNING" || status === "WAITING_FOR_SENTINEL");
            const showWaitingHumanPathHint =
                !pathInteractive && status === "WAITING_FOR_HUMAN";
            const showGenericPathBlock =
                !pathInteractive &&
                !showMustStopForPath &&
                !showWaitingHumanPathHint &&
                status !== "Loading...";

            const swDestructiveOptions = [];
            const swSeen = new Set();
            if (swCoherence && swCoherence.issues) {
                for (const iss of swCoherence.issues) {
                    for (const o of iss.destructive_options || []) {
                        if (!swSeen.has(o)) {
                            swSeen.add(o);
                            swDestructiveOptions.push(o);
                        }
                    }
                }
            }

            return (
                <div className="grid grid-rows-[auto_1fr_auto_auto] h-full overflow-hidden">
                    {/* Header bar */}
                    <header className="bg-[#141618] border-b border-[#1a1d21] px-6 py-4">
                        <div className="flex items-center justify-between">
                            <div className="flex flex-col items-start gap-1 gap-x-6 sm:flex-row sm:items-center">
                                {pathInteractive ? (
                                    <button
                                        type="button"
                                        onClick={openProjectSwitch}
                                        className="header-text text-sm text-[#00b4d8] font-mono hover:underline text-left focus:outline-none focus:ring-2 focus:ring-[#00b4d8]/50 rounded"
                                    >
                                        {projectDisplay}
                                    </button>
                                ) : (
                                    <span className="header-text text-sm text-slate-500 font-mono">{projectDisplay}</span>
                                )}
                                {showMustStopForPath ? (
                                    <span className="header-text text-xs text-slate-500 max-w-md">
                                        Stop the pipeline before you can change the project directory.
                                    </span>
                                ) : null}
                                {showWaitingHumanPathHint ? (
                                    <span className="header-text text-xs text-slate-500 max-w-md">
                                        Resolve or stop the human prompt before changing project directory.
                                    </span>
                                ) : null}
                                {showGenericPathBlock ? (
                                    <span className="header-text text-xs text-slate-500 max-w-md">
                                        The pipeline must be stopped before you can change the project directory.
                                    </span>
                                ) : null}
                            </div>
                            <div className="flex flex-col items-end gap-1">
                                <div className="flex items-center gap-3 flex-wrap justify-end">
                                    {showResumeButton && (
                                        <button
                                            type="button"
                                            onClick={handleHeaderResume}
                                            disabled={resumeBusy}
                                            className="header-text px-3 py-1 text-xs bg-emerald-950 hover:bg-emerald-900 text-emerald-300 rounded border border-emerald-800 transition-colors disabled:opacity-50"
                                        >
                                            {resumeBusy ? "Resuming…" : "Resume"}
                                        </button>
                                    )}
                                    {showStopButton && !stopRequested && (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setStopError("");
                                                setStopHint("");
                                                setShowStopModal(true);
                                            }}
                                            className="header-text px-3 py-1 text-xs bg-red-950 hover:bg-red-900 text-red-400 rounded border border-red-800 transition-colors"
                                        >
                                            Stop Pipeline
                                        </button>
                                    )}
                                    {showStopButton && stopRequested && (
                                        <button
                                            type="button"
                                            disabled
                                            className="header-text px-3 py-1 text-xs bg-red-950 text-red-400 rounded border border-red-800 opacity-70 status-pulse cursor-not-allowed"
                                        >
                                            Stopping...
                                        </button>
                                    )}
                                    <span
                                        className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${alive ? "bg-green-500" : "bg-red-600"}`}
                                    ></span>
                                    <span
                                        className={`header-text px-3 py-1 rounded-full text-sm font-medium ${statusClass}`}
                                    >
                                        {statusLabel}
                                    </span>
                                </div>
                                {resumeError ? (
                                    <span className="header-text text-xs text-red-400 max-w-md text-right">
                                        {resumeError}
                                    </span>
                                ) : null}
                                {stopError ? (
                                    <div className="header-text text-xs text-red-400 max-w-md text-right space-y-1">
                                        <span className="block">{splitApiDetail(stopError).friendly}</span>
                                        {splitApiDetail(stopError).technical ? (
                                            <span className="block text-slate-500 font-mono text-[10px] leading-snug">
                                                {splitApiDetail(stopError).technical}
                                            </span>
                                        ) : null}
                                    </div>
                                ) : null}
                                {stopHint ? (
                                    <span className="header-text text-xs text-amber-500 max-w-md text-right">
                                        {stopHint}
                                    </span>
                                ) : null}
                            </div>
                        </div>
                        {pathBroken ? (
                            <div className="border-t border-amber-800/50 bg-amber-950/20 px-6 py-2">
                                <p className="header-text text-xs text-amber-200/90">{repairPathHintText}</p>
                            </div>
                        ) : null}
                    </header>

                    {/* Middle section: two-panel grid (Phase 2a: 32/68 split) */}
                    <main className="grid grid-cols-1 md:grid-cols-[32%_68%] gap-4 p-4 overflow-hidden">
                        {/* Left: Current Phase */}
                        <div className="bg-[#141618] rounded-lg border border-[#1a1d21] p-4 overflow-auto">
                            <h2 className="header-text text-lg font-semibold text-slate-300 mb-4">Current Phase</h2>
                            <CurrentPhasePanel
                                current_phase_raw_id={pState.current_phase_raw_id}
                                current_agent={pState.current_agent}
                                roadmap={roadmap}
                                planner_retries={pState.planner_retries}
                                executor_retries={pState.executor_retries}
                                reviewer_retries={pState.reviewer_retries}
                                last_error_code={pState.last_error_code}
                                last_action_timestamp={pState.last_action_timestamp}
                                skill_injected={pState.skill_injected}
                                skill_agent={pState.skill_agent}
                                pipeline_status={status}
                                metricsSummary={metricsSummary}
                                escalation_resets={pState.escalation_resets || 0}
                            />
                            <EscalationCommandPanel
                                pipeline_status={status}
                                escalation_trigger_reason={pState.escalation_trigger_reason}
                                escalation_message={pState.escalation_message}
                                last_action={pState.last_action}
                                escalation_resets={pState.escalation_resets || 0}
                                orchestrator_alive={alive}
                            />
                        </div>

                        {/* Right: Roadmap */}
                        <div className="right-panel bg-[#141618] rounded-lg border border-[#1a1d21] p-4 overflow-auto">
                            <h2 className="header-text text-lg font-semibold text-slate-300 mb-4">Roadmap</h2>
                            <RoadmapPanel roadmap={roadmap} metricsSummary={metricsSummary} />
                        </div>
                    </main>

                    {/* Activity Feed */}
                    <div className="bg-[#141618] border-t border-[#1a1d21] px-4 pt-3 pb-2 overflow-hidden">
                        <h2 className="header-text text-sm font-semibold text-slate-400 mb-2">Activity Feed</h2>
                        <ActivityFeedPanel />
                    </div>

                    {/* Footer */}
                    <footer className="bg-[#141618] border-t border-[#1a1d21] px-6 py-3">
                        <div className="flex items-center justify-between">
                            <span className="header-text text-sm text-slate-500">Pipeline Executor v1.0</span>
                            <div className="flex gap-4 items-center">
                                <button
                                    onClick={handleRefresh}
                                    className="header-text px-3 py-1 text-sm bg-[#1a1d21] hover:bg-[#252830] rounded transition-colors"
                                >
                                    Refresh
                                </button>
                                <span className="header-text text-sm text-slate-500">
                                    Last update: {lastUpdate || '--'}
                                </span>
                            </div>
                        </div>
                    </footer>

                    {/* Stop confirmation modal */}
                    {showStopModal && (
                        <StopConfirmModal
                            pipelineStatus={status}
                            onConfirm={handleStopConfirm}
                            onDismiss={() => setShowStopModal(false)}
                        />
                    )}

                    {projectSwitchOpen && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4"
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="switch-project-title"
                        >
                            <div className="bg-[#141618] border border-[#1a1d21] rounded-lg max-w-lg w-full max-h-[90vh] overflow-y-auto p-5">
                                <h2 id="switch-project-title" className="header-text text-lg text-slate-200 mb-3">
                                    Switch project
                                </h2>
                                <p className="text-xs text-slate-500 mb-3">
                                    Run preflight checks and coherence validation, then start the pipeline for this directory.
                                </p>
                                <label className="text-xs text-slate-500 header-text block mb-1">Absolute project path</label>
                                <input
                                    type="text"
                                    value={swPath}
                                    onChange={(e) => setSwPath(e.target.value)}
                                    className="w-full rounded border border-[#1a1d21] px-3 py-2 text-sm bg-[#1a1d21] text-slate-200 mb-2 font-mono"
                                />
                                {swRecents.length > 0 ? (
                                    <div className="mb-3">
                                        <label className="text-xs text-slate-500 header-text">Recent</label>
                                        <select
                                            className="mt-1 w-full rounded border border-[#1a1d21] px-2 py-1.5 text-xs bg-[#0d0f12] text-slate-300"
                                            value=""
                                            onChange={(e) => {
                                                if (e.target.value) setSwPath(e.target.value);
                                            }}
                                        >
                                            <option value="">Select a recent project…</option>
                                            {swRecents.map((p, i) => (
                                                <option key={i} value={p.path || ""}>
                                                    {p.path || ""}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                ) : null}
                                {swErr ? <p className="text-red-400 text-sm mb-2 whitespace-pre-wrap">{swErr}</p> : null}
                                {swRoadmapAmbiguous ? (
                                    <div className="rounded border border-amber-700/60 bg-amber-950/30 p-3 mb-3 text-sm text-amber-100">
                                        <p className="mb-2">
                                            Multiple roadmaps: {(swRoadmapAmbiguous.roadmap_files || []).join(", ")}. Keep{" "}
                                            <span className="font-mono">{swRoadmapAmbiguous.recommended_keep}</span> and
                                            archive the rest under <span className="font-mono">autodev_archive/</span>.
                                        </p>
                                        <button
                                            type="button"
                                            disabled={swBusy}
                                            onClick={() => {
                                                const keep = swRoadmapAmbiguous.recommended_keep;
                                                const merged = {
                                                    ...swPendingRef.current,
                                                    confirm_roadmap_archive: true,
                                                    keep_filename: keep,
                                                };
                                                swPendingRef.current = merged;
                                                postSwitchProject({
                                                    repo_path: (swPath || "").trim(),
                                                    start_orchestrator: false,
                                                    ...merged,
                                                });
                                            }}
                                            className="header-text text-xs px-3 py-1.5 rounded bg-amber-900/60 border border-amber-600 text-amber-50 disabled:opacity-40"
                                        >
                                            Archive extras &amp; continue
                                        </button>
                                    </div>
                                ) : null}
                                {swCoherence && swCoherence.ok === false && swDestructiveOptions.length > 0 ? (
                                    <div className="rounded border border-[#2a2d31] p-3 mb-3 text-sm text-slate-300">
                                        <p className="mb-2 text-slate-400">Coherence issues — allow deleting whitelisted files to continue:</p>
                                        <ul className="mb-2 space-y-1">
                                            {(swCoherence.issues || []).map((iss, idx) => (
                                                <li key={idx} className="text-xs">
                                                    <span className="font-mono text-amber-400">{iss.kind}</span>: {iss.detail}
                                                </li>
                                            ))}
                                        </ul>
                                        {swDestructiveOptions.map((name) => (
                                            <label key={name} className="flex items-center gap-2 text-xs mb-1 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={swDestructiveSelected.includes(name)}
                                                    onChange={(e) => {
                                                        if (e.target.checked) {
                                                            setSwDestructiveSelected((s) =>
                                                                s.includes(name) ? s : [...s, name]
                                                            );
                                                        } else {
                                                            setSwDestructiveSelected((s) => s.filter((x) => x !== name));
                                                        }
                                                    }}
                                                />
                                                <span className="font-mono">{name}</span>
                                            </label>
                                        ))}
                                        <button
                                            type="button"
                                            disabled={swBusy || swDestructiveSelected.length === 0}
                                            onClick={() => {
                                                const merged = {
                                                    ...swPendingRef.current,
                                                    confirm_destructive: swDestructiveSelected,
                                                };
                                                swPendingRef.current = merged;
                                                postSwitchProject({
                                                    repo_path: (swPath || "").trim(),
                                                    start_orchestrator: false,
                                                    ...merged,
                                                });
                                            }}
                                            className="mt-2 header-text text-xs px-3 py-1.5 rounded bg-[#00b4d8] text-[#0d0f12] disabled:opacity-40"
                                        >
                                            Apply selected fixes &amp; re-validate
                                        </button>
                                    </div>
                                ) : null}
                                {swChecks && swChecks.length > 0 && !swRoadmapAmbiguous ? (
                                    <ul className="space-y-1 text-xs mb-3 max-h-40 overflow-y-auto border border-[#1a1d21] rounded p-2">
                                        {swChecks.map((c, i) => (
                                            <li
                                                key={i}
                                                className={
                                                    c.status === "fail"
                                                        ? "text-red-400"
                                                        : c.status === "warn"
                                                          ? "text-amber-400"
                                                          : c.status === "fixed"
                                                            ? "text-[#00b4d8]"
                                                            : "text-emerald-400"
                                                }
                                            >
                                                [{c.status}] {c.check}: {c.message}
                                            </li>
                                        ))}
                                    </ul>
                                ) : null}
                                <div className="flex flex-wrap gap-2 justify-end">
                                    <button
                                        type="button"
                                        onClick={closeProjectSwitch}
                                        className="header-text text-sm px-3 py-1.5 rounded border border-[#1a1d21] text-slate-400"
                                    >
                                        Close
                                    </button>
                                    {!swReady ? (
                                        <button
                                            type="button"
                                            disabled={swBusy || !(swPath || "").trim()}
                                            onClick={() =>
                                                postSwitchProject({
                                                    repo_path: (swPath || "").trim(),
                                                    start_orchestrator: false,
                                                    ...swPendingRef.current,
                                                })
                                            }
                                            className="header-text text-sm px-3 py-1.5 rounded bg-[#1a1d21] text-slate-200 disabled:opacity-40"
                                        >
                                            {swBusy ? "Working…" : "Switch & run checks"}
                                        </button>
                                    ) : (
                                        <button
                                            type="button"
                                            disabled={swBusy}
                                            onClick={() =>
                                                postSwitchProject({
                                                    repo_path: (swPath || "").trim(),
                                                    start_orchestrator: true,
                                                    ...swPendingRef.current,
                                                })
                                            }
                                            className="header-text text-sm px-3 py-1.5 rounded bg-[#00b4d8] text-[#0d0f12] disabled:opacity-40"
                                        >
                                            {swBusy ? "Starting…" : "Start pipeline"}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ─── Root App with routing ────────────────────────────────────────────────

        function App() {
            const [currentScreen, setCurrentScreen] = useState("pipeline");
            const [seedRoadmap, setSeedRoadmap] = useState("");
            const [repoPath, setRepoPath] = useState("");
            const [repoPathLocked, setRepoPathLocked] = useState(false);
            const [roadmapSeed, setRoadmapSeed] = useState("");
            const [roadmapSeedLocked, setRoadmapSeedLocked] = useState(false);
            /** PRD text from Project Ideas, passed to preflight + launch when non-empty. */
            const [launchPrdContent, setLaunchPrdContent] = useState("");
            const [repoPathError, setRepoPathError] = useState("");
            const [roadmapSeedError, setRoadmapSeedError] = useState([]);
            const [preflightChecks, setPreflightChecks] = useState(null);
            /** When set, preflight found multiple *oadmap*.md — launch blocked until user confirms archive. */
            const [preflightRoadmapAmbiguous, setPreflightRoadmapAmbiguous] = useState(null);
            const [preflightLastRun, setPreflightLastRun] = useState(null);
            const [launchError, setLaunchError] = useState("");
            const [launchLoading, setLaunchLoading] = useState(false);
            /** null | "exists" | "parent" | "bad" — from filesystem check on server (debounced). */
            const [repoPathFsStatus, setRepoPathFsStatus] = useState(null);
            const [showCreateFolderPrompt, setShowCreateFolderPrompt] = useState(false);
            const [createFolderError, setCreateFolderError] = useState("");
            const repoPathValidateTimerRef = useRef(null);

            const navigateToPreflightWithSeed = (content, prdText) => {
                const text = content || "";
                setSeedRoadmap(text);
                setRoadmapSeed(text);
                setRoadmapSeedLocked(!!text.trim());
                setLaunchPrdContent(typeof prdText === "string" ? prdText : "");
                setCurrentScreen("preflight");
            };

            const handleNavigate = (screen) => {
                if (screen === "preflight") {
                    setSeedRoadmap("");
                    setRoadmapSeed("");
                    setRoadmapSeedLocked(false);
                    setLaunchPrdContent("");
                    setRepoPathError("");
                    setRoadmapSeedError([]);
                    setPreflightChecks(null);
                    setPreflightRoadmapAmbiguous(null);
                    setPreflightLastRun(null);
                    setLaunchError("");
                    setRepoPathFsStatus(null);
                    setShowCreateFolderPrompt(false);
                    setCreateFolderError("");
                }
                setCurrentScreen(screen);
            };

            const handleRepoPathChange = (value) => {
                setRepoPath(value);
                setRepoPathError("");
                setShowCreateFolderPrompt(false);
                setCreateFolderError("");
                const trimmed = (value || "").trim();
                if (repoPathValidateTimerRef.current) {
                    clearTimeout(repoPathValidateTimerRef.current);
                }
                if (!trimmed) {
                    setRepoPathFsStatus(null);
                    return;
                }
                setRepoPathFsStatus(null);
                repoPathValidateTimerRef.current = setTimeout(() => {
                    fetch("/api/setup/validate-repo-path", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ path: trimmed }),
                    })
                        .then((r) => r.json())
                        .then((d) => {
                            if (!d.valid) {
                                setRepoPathFsStatus("bad");
                                return;
                            }
                            return fetch("/api/setup/check-repo-path", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ path: trimmed }),
                            }).then(async (r2) => {
                                const j = await r2.json().catch(() => ({}));
                                if (!r2.ok) {
                                    setRepoPathFsStatus("bad");
                                    return;
                                }
                                if (j.exists) setRepoPathFsStatus("exists");
                                else if (j.parent_exists) setRepoPathFsStatus("parent");
                                else setRepoPathFsStatus("bad");
                            });
                        })
                        .catch(() => setRepoPathFsStatus("bad"));
                }, 500);
            };

            const onRepoPathConfirm = () => {
                setRepoPathError("");
                setCreateFolderError("");
                setShowCreateFolderPrompt(false);
                const path = (repoPath || "").trim();
                fetch("/api/setup/validate-repo-path", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const detail = d.detail;
                            const msg = Array.isArray(detail)
                                ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                : detail || d.message || `Request failed (${r.status})`;
                            setRepoPathError(String(msg));
                            return null;
                        }
                        if (!d.valid) {
                            setRepoPathError(d.error || "Path validation failed");
                            return null;
                        }
                        return fetch("/api/setup/check-repo-path", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ path }),
                        }).then(async (r2) => {
                            const check = await r2.json().catch(() => ({}));
                            if (!r2.ok) {
                                const detail = check.detail;
                                const msg = Array.isArray(detail)
                                    ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                    : detail || check.message || `Request failed (${r2.status})`;
                                setRepoPathError(String(msg));
                                return null;
                            }
                            return check;
                        });
                    })
                    .then((check) => {
                        if (!check) return;
                        if (check.exists) {
                            setRepoPathLocked(true);
                            setRepoPath(path);
                        } else if (check.parent_exists) {
                            setShowCreateFolderPrompt(true);
                        } else {
                            setRepoPathError(
                                "Path does not exist and the parent directory is not reachable. " +
                                    "Use an absolute path starting with / (e.g. /home/pi/projects/my-app). " +
                                    "If the path is correct, the server must be able to access it (home dirs are often mode 700 — run the UI server as the same user)."
                            );
                        }
                    })
                    .catch((e) => setRepoPathError(String(e.message || "Request failed")));
            };

            const onCreateRepoDir = () => {
                const path = (repoPath || "").trim();
                setCreateFolderError("");
                fetch("/api/setup/create-repo-dir", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path }),
                })
                    .then((r) => r.json())
                    .then((d) => {
                        if (d.ok) {
                            setRepoPathLocked(true);
                            setRepoPath(path);
                            setShowCreateFolderPrompt(false);
                        } else {
                            setCreateFolderError(d.error || "Failed to create directory");
                        }
                    })
                    .catch((e) => setCreateFolderError(String(e)));
            };

            const onCancelCreateFolder = () => {
                setShowCreateFolderPrompt(false);
            };

            const onRoadmapSeedConfirm = () => {
                setRoadmapSeedError([]);
                fetch("/api/setup/validate-roadmap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: roadmapSeed }),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) {
                            const detail = d.detail;
                            const msg = Array.isArray(detail)
                                ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                : detail || d.message || `Request failed (${r.status})`;
                            setRoadmapSeedError([{ line: 0, message: String(msg) }]);
                            return;
                        }
                        if (d.valid) setRoadmapSeedLocked(true);
                        else setRoadmapSeedError(d.errors || []);
                    })
                    .catch(() => setRoadmapSeedError([{ line: 0, message: "Request failed" }]));
            };

            const onRunPreflight = (confirmRoadmapArchive) => {
                const archiveMeta = confirmRoadmapArchive ? preflightRoadmapAmbiguous : null;
                if (!confirmRoadmapArchive) {
                    setPreflightRoadmapAmbiguous(null);
                }
                setPreflightChecks(null);
                const body = { repo_path: (repoPath || "").trim() };
                if (roadmapSeedLocked && (roadmapSeed || "").trim()) {
                    body.roadmap_seed = roadmapSeed;
                }
                if ((launchPrdContent || "").trim()) {
                    body.prd_content = launchPrdContent;
                }
                if (confirmRoadmapArchive && archiveMeta) {
                    body.confirm_roadmap_archive = true;
                    body.keep_filename = archiveMeta.recommended_keep;
                }
                fetch("/api/setup/preflight", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setPreflightLastRun(new Date());
                        if (!r.ok) {
                            const detail = d.detail;
                            const msg = Array.isArray(detail)
                                ? detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
                                : detail || d.message || `Request failed (${r.status})`;
                            setPreflightChecks([
                                { check: "preflight", status: "fail", message: String(msg) },
                            ]);
                            return;
                        }
                        if (d.roadmap_ambiguous) {
                            setPreflightRoadmapAmbiguous({
                                roadmap_files: d.roadmap_files || [],
                                recommended_keep: d.recommended_keep || "roadmap.md",
                            });
                        } else {
                            setPreflightRoadmapAmbiguous(null);
                        }
                        setPreflightChecks(d.checks || []);
                    })
                    .catch(() => {
                        setPreflightLastRun(new Date());
                        setPreflightChecks([
                            { check: "preflight", status: "fail", message: "Request failed" },
                        ]);
                    });
            };

            const hasFail = preflightChecks && preflightChecks.some((c) => c.status === "fail");
            const launchDisabled =
                !repoPathLocked ||
                !roadmapSeedLocked ||
                !preflightChecks ||
                hasFail ||
                !!preflightRoadmapAmbiguous ||
                launchLoading;

            const onLaunch = () => {
                setLaunchError("");
                setLaunchLoading(true);
                const launchBody = { repo_path: repoPath, roadmap_seed: roadmapSeed };
                if ((launchPrdContent || "").trim()) {
                    launchBody.prd_content = launchPrdContent;
                }
                fetch("/api/setup/launch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(launchBody),
                })
                    .then(async (r) => {
                        const d = await r.json().catch(() => ({}));
                        setLaunchLoading(false);
                        if (r.status === 409 && d.code === "orchestrator_running") {
                            setLaunchError(d.error || "An orchestrator is already running. Stop it or wait before launching.");
                            return;
                        }
                        if (d.ok) setCurrentScreen("pipeline");
                        else setLaunchError(d.error || "Launch failed");
                    })
                    .catch((e) => {
                        setLaunchLoading(false);
                        setLaunchError(String(e));
                    });
            };

            const appCtxValue = {
                navigateToPreflightWithSeed,
                setSeedRoadmap,
                setRoadmapSeedLocked,
                setCurrentScreen,
            };

            return (
                <AppCtx.Provider value={appCtxValue}>
                    <div className="flex h-screen overflow-hidden bg-[#0d0f12]">
                        <Sidebar currentScreen={currentScreen} onNavigate={handleNavigate} />
                        <div className="flex-1 flex flex-col overflow-hidden">
                            {currentScreen === "pipeline" && <PipelineScreen />}
                            {currentScreen === "preflight" && (
                                <PreflightScreen
                                    seedRoadmap={seedRoadmap}
                                    repoPath={repoPath}
                                    repoPathLocked={repoPathLocked}
                                    roadmapSeed={roadmapSeed}
                                    roadmapSeedLocked={roadmapSeedLocked}
                                    onRepoPathChange={handleRepoPathChange}
                                    onRepoPathLockToggle={() => {
                                        setRepoPathLocked(false);
                                        setRepoPathFsStatus(null);
                                    }}
                                    onRoadmapSeedChange={setRoadmapSeed}
                                    onRoadmapSeedLockToggle={() => setRoadmapSeedLocked(false)}
                                    onBack={() => setCurrentScreen("ideas")}
                                    repoPathError={repoPathError}
                                    roadmapSeedError={roadmapSeedError}
                                    onRepoPathConfirm={onRepoPathConfirm}
                                    onRoadmapSeedConfirm={onRoadmapSeedConfirm}
                                    onRunPreflight={() => onRunPreflight(false)}
                                    onConfirmRoadmapArchive={() => onRunPreflight(true)}
                                    preflightRoadmapAmbiguous={preflightRoadmapAmbiguous}
                                    preflightChecks={preflightChecks}
                                    onLaunch={onLaunch}
                                    launchError={launchError}
                                    launchDisabled={launchDisabled}
                                    repoPathFsStatus={repoPathFsStatus}
                                    showCreateFolderPrompt={showCreateFolderPrompt}
                                    createFolderError={createFolderError}
                                    onCreateRepoDir={onCreateRepoDir}
                                    onCancelCreateFolder={onCancelCreateFolder}
                                    preflightLastRun={preflightLastRun}
                                    hasFail={hasFail}
                                />
                            )}
                            {currentScreen === "ideas" && <IdeasScreen />}
                        </div>
                    </div>
                </AppCtx.Provider>
            );
        }

        ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);
    </script>
</body>
</html>

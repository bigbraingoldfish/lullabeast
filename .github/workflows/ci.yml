# CI — clean-install gate + full test suite + advisory lint.
#
# 1. install (matrix): every runtime/dev pin must install from scratch on all
#    supported Python versions. This catches the PyYAML==6.0 failure class
#    automatically: a pin old enough to lack wheels for a newer CPython falls back
#    to an sdist build, which then breaks (PyYAML 6.0's build fails under Cython 3
#    with the 'cython_sources' AttributeError on Python >= 3.12).
#    requirements-dev.txt -> requirements.txt -> ui/requirements.txt, so the
#    two-step install exercises all three files; the import smoke validates the
#    canonical launch path (`python -m ui.server`).
# 2. test (same job): run the full pytest suite (autodev/tests + tests).
#    AUTODEV_REPO_PATH is required by the suite (see CLAUDE.md "How to Run Tests").
#    The Playwright browser tests skip cleanly when Chromium isn't installed, so no
#    `playwright install` step is needed and CI stays fast.
# 3. lint: `ruff check`, ADVISORY for now (continue-on-error). The existing baseline
#    is ~410 findings (mostly F401 unused-import); cleaning it and promoting this job
#    to blocking is LAUNCH-8/9 follow-up. Config + rationale in ruff.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: install + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clean install — runtime pins
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean install — dev/test pins
        run: pip install -r requirements-dev.txt

      - name: Import smoke test
        run: |
          python -c "import ui.server, yaml; print('ui.server import OK')"
          python -m pytest --version

      - name: Run test suite
        env:
          AUTODEV_REPO_PATH: ${{ github.workspace }}
        run: python -m pytest autodev/tests tests -q

  lint:
    name: ruff (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.17

      # Advisory until the ~410-finding baseline is cleaned (LAUNCH-8/9), then drop
      # continue-on-error to make lint blocking. Config + rationale in ruff.toml.
      - name: ruff check (advisory)
        continue-on-error: true
        run: ruff check .
